\n\n<p>Make a plan:<\/p>\n<p>In this phase, make a plan to get your project from start to finish:<\/p>\n<ul>\n<li>Create a detailed project plan. What are the major milestones? What tasks or deliverables make up each milestone?<\/li>\n<li>Build out the schedule so you can properly manage the resources, budget, materials, and timeline. Here, you will create an itemized budget.<\/li>\n<\/ul>\n<p>Execute the project<\/p>\n<p>In this phase, put all of your hard work from the first two phases into action:<\/p>\n<ul>\n<li>Monitor your project team as they complete project tasks.<\/li>\n<li>Break down any barriers that would slow or stop the team from completing tasks.<\/li>\n<li>Help keep the team aware of schedule and deliverable expectations.<\/li>\n<li>Address weaknesses in your process or examine places where your team may need additional training to meet the project´s goals.<\/li>\n<li>Adapt to changes in the project as they arise<\/li>\n<\/ul>\n<p>Close the project<\/p>\n<p>In this phase, close out the project:<\/p>\n<ul>\n<li>\nIdentify that your team has completed all of the requested outcomes.\n<\/li>\n<li>\nRelease your team so they can support other projects within the company \n<\/li>\n<li>\nTake time with your team to celebrate your successes.\n<\/li>\n<li>\nPass off all remaining deliverables and get stakeholders approval\n<\/li>\n<li>\nDocument the lessons you and your team learned during the project\n<\/li>\n<li>\nReflect on ways to improve in the future\n<\/li>\n<\/ul>\n\n<p>Key takeaway<\/p>\n<p>Each phase of the project life cycle has its own significance and reason for existing. By following the project life cycle, you are ensuring that you are:<\/p>\n<ul>\n<li>Capturing the expectations of your customer<\/li>\n<li>Setting your project up for success with a plan<\/li>\n<li>Executing project tasks and addressing any issues that arise<\/li>\n<li>Closing out your project to capture any lessons learned<\/li>\n<\/ul>\n<p>Project management methodology<\/p>\n<p>A set of guiding principles and processes for owning a project through its life cycle<\/p>\n<p>Two of the most popular methodolgies are waterfall and agile<\/p>\n<p>Waterfall:<\/p>\n<ul>\n<li>The project managers role, the pm serves as an active leader by prioritizing tasks to team members<\/li>\n<li>The scope, the project deliverables and plans are well stablished and documented in the early stages of initiating and planning, changes go throughout a formal change request process<\/li>\n<li>The schedule follows a mostly linear path through the initiating, planning, executing and closing phases of the project<\/li>\n<li>The costs are kept under control by careful estimation up front and close monitoring throughout the life cycle of the project<\/li>\n<li>The quality, the pm makes plans and clearly defines criteria to measure quality at the beginning of the project<\/li>\n<li>Communication, Project manager continually communicates progress toward milestones and other key indicators to stakeholders, ensuring that the project is on track to meet the customers expectations<\/li>\n<li>Stakeholders, pm continually manages and monitors stakeholders engagement to ensure the project is on track<\/li>\n<\/ul>\n<p>Agile:<\/p>\n<ul>\n<li>Project managers role, Scrum masters acts primarily as a facilitator, removing any barriers the team faces, team shares more responsibility in managing their own work<\/li>\n<li>Scope, planning happens in shorter iterations and focuses on delivering value quickly, subsequent iterations are adjusted in response to feedback or unforseen issues<\/li>\n<li>Schedule, time is organized into phases called Sprints. Each sprint has a defined duration, with a set list of deliberables planned at the start of the sprint<\/li>\n<li>Cost, costs and schedule could change with each iteration<\/li>\n<li>Quality, team solicits ongoing stakeholder input and user feedback by testing products in the field and regularly implementing improvements<\/li>\n<li>Communication, team is customer-focused with consisten communication between users and the project team<\/li>\n<li>stakeholders, Team frequently provides deliverables to stakeholders throughout the project, progress toward milestones is dependent upon stakeholder feedback<\/li>\n<\/ul>\n<p>Lean Six Sigma:<\/p>\n<p>Is another methodology we can work with, is a combination of two parent methodologies LEAN and SIX SIGMA<\/p>\n<p>Are common in projects that have goals to save money, improve quality and move through processes quickly<\/p>\n<p>Promotes possitive work environment<\/p>\n<p>The idea is when the team feels valued, motivation and productivity increases<\/p>\n<p>There are 5 phases (DMAIC):<\/p>\n<ul>\n<li>Define<\/li>\n<li>Measure<\/li>\n<li>Analyze<\/li>\n<li>Improve<\/li>\n<li>Control<\/li>\n<\/ul>\n<p>The goal of each step is to ensure the best possible result for your project<\/p>\n<p>It can be used to solve any bussines problem<\/p>\n<p>The first phase is to define the project goal and what will it take to meet it<\/p>\n<p>Next is time to Measure, DMAIC focusses in data<\/p>\n<p>\nDefining\n\nTells you what to measure\n\n\n\n<\/p>\n\n<p>\nMeasuring\n\nTells you what to analyze\n\n\n\n<\/p>\n\n<p>\nAnalyzing \n\nTells you what to improve\n\n\n\n<\/p>\n\n<p>\nImproving\n\nTells you what to control\n\n\n\n<\/p>\n\n<p>The LEAN methodology is often referred to LEAN Manufacturing, because is originated in the manufacturing world.<\/p>\n<p>The main principal in the Lean Methodology is removal of waste in within an operation<\/p>\n<p>Recognizes 8 types of waste within an operation:<\/p>\n<ul>\n<li>\ndefects\n<\/li>\n<li>\nexcess processing \n<\/li>\n<li>\noverproduction\n<\/li>\n<li>\nwaiting\n<\/li>\n<li>\ninventory\n<\/li>\n<li>\ntransportation\n<\/li>\n<li>\nmotion\n<\/li>\n<li>\nnon-utilized talent\n<\/li>\n<\/ul>\n\n<p>this type of waste are often attributed to issues like:<\/p>\n<ul>\n<li>Lack of proper documentation<\/li>\n<li>Lack of process standards<\/li>\n<li>Not understanding the customers needs<\/li>\n<li>Lack of effective communication<\/li>\n<li>Lack of process control<\/li>\n<li>Inefficient process design<\/li>\n<li>Failures of management<\/li>\n<\/ul>\n<p>You implement Lean when you want to use limited resources, reduce waste, and streamline processes to gain maximum benefits<\/p>\n<p>The pillards of the Lean 5s quality tools, implementing the 5s means cleaning up, organizing the workplace to achieve the smallest amount of wasted time and material<\/p>\n<p>Includes this steps:<\/p>\n<ul>\n<li>Sort: remove all items not needed for current production operations and leaves only the bare essentials<\/li>\n<li>Set in order: Arrange needed items so that they are easy to use. Label items so that anyone can finde them or put them away<\/li>\n<li>Shine: Keep everything in the correct place. Clean your workspace every day<\/li>\n<li>Standarize: Perform the process in the same way every time<\/li>\n<li>Sustain: Make a habit of maintaining correct procedures and instill this discipline in your team<\/li>\n<\/ul>\n<p>The Kanban Board is a visualization tool that enables you to optimize the flow of your teams work. A visual display to identify what needs to be done and when. Uses cards that are move from left to right to show progress<\/p>\n<p class=\"imgph\">Screenshot in Notion: Screenshot 2025-10-22 at 8.54.47 PM.png<\/p>\n\n<p>\nThe Six Sigma is a methodology used to reduced variations by ensuring that quality processes are followed every time. \n<\/p>\n\n<p>The seven key principles of six sigma are:<\/p>\n<ul>\n<li>\nAlways focus on the customer\n<\/li>\n<li>\nIdentify and understand how the work gets done \n<\/li>\n<li>\nMake your processes flow smoothly\n<\/li>\n<li>\nReduce waste and concentrate on value\n<\/li>\n<li>\nStop defects by removing variation\n<\/li>\n<li>\nInvolve and collaborate with your team\n<\/li>\n<li>\nApproach improvement activity in a sistematic way\n<\/li>\n<\/ul>\n\n<p>\nuse this methodology to find aspects of the product or the process that are measurable like time, cost or quantity. Then inspect that measurable item and reject any products that do not meet the Six Sigma Standards \n<\/p>\n\n<p>Popular project management approaches:<\/p>\n<ul>\n<li>\nWaterfall: is a traditional methodology in which tasks and phases are completed in a linear, sequential manner, and each stage of the project must be completed before the next begins. The project manager is responsible for prioritizing and assigning tasks to team members. In Waterfall, the criteria used to measure quality is clearly defined at the beginning of the project.\n<\/li>\n<li>\nAgile: involves short phases of collaborative, iterative work with frequent testing and regularly-implemented improvements. Some phases and tasks happen at the same time as others. In Agile projects, teams share responsibility for managing their own work. Scrum and Kanban are examples of Agile frameworks, which are specific development approaches based on the Agile philosophy.\n<\/li>\n<li>\nScrum: is an Agile framework that focuses on developing, delivering, and sustaining complex projects and products through collaboration, accountability, and an iterative process. Work is completed by small, cross-functional teams led by a Scrum Master and is divided into short Sprints with a set list of deliverables.\n<\/li>\n<li>\nKanban: is a tool used in both Agile and Lean approaches that provides visual feedback about the status of the work in progress through the use of Kanban boards or charts. With Kanban, project managers use sticky notes or note cards on a physical or digital Kanban board to represent the team’s tasks with categories like “To do,” “In progress,” and “Done.”\n<\/li>\n<li>\nLean: uses the 5S quality tool to eliminate eight areas of waste, save money, improve quality, and streamline processes. Lean’s principles state that you can do more with less by addressing dysfunctions that create waste. Lean implements a Kanban scheduling system to manage production.\n<\/li>\n<li>\nSix Sigma: involves reducing variations by ensuring that quality processes are followed every time. The Six Sigma method follows a process-improvement approach called DMAIC, which stands for define, measure, analyze, improve, and control.\n<\/li>\n<li>\nLean Six Sigma: is a combination of Lean and Six Sigma approaches. It is often used in projects that aim to save money, improve quality, and move through processes quickly. Lean Six Sigma is also ideal for solving complex or high-risk problems. The 5S organization framework, the DMAIC process, and the use of Kanban boards are all components of this approach. \n<\/li>\n<\/ul>\n\n<h3 id=\"n0_10\">Organizational strucure<\/h3>\n<p>The way a company or organization is arranged or structure<\/p>\n<p>This structure tells you how the tasks are divided and coordinated and how all the different members of the organization relate to one another<\/p>\n<p>Gives you a sense of who reports to who<\/p>\n<p>Can serve as a map to help you determine where you fit in, who you should communicate with, and how frequently to communicate with them.<\/p>\n<p>\n\"org chart,\" which is short for \"organizational chart.\" \n<\/p>\n\n<p>There are a few different types of organizational structures<\/p>\n<ul>\n<li>The Classic grouping: includes what are usually called \"functional\" or \"top-down\" structures. The Classic grouping follows a typical chain of command where the Chief Executive Officer, also known as CEO, and other executives are at the top, followed by directors or managers, then their direct reports and so on. Each of these directors or managers typically oversee teams within their function of the organization<\/li>\n<li>The Matrix structure: As a grid, you still have people above you but also have people in adjacent departments who expect to hear updates on your work progress<\/li>\n<\/ul>\n<p>So to recap, the Classic structure follows a traditional, top-down system of reporting, and the Matrix structure has direct higher-ups to report to and stakeholders from other departments or programs. Knowing which kind of organizational structure you're working in plays a major role in how you prepare for and carry out your project or even in an interview.<\/p>\n<h3 id=\"n0_11\">Classic organizational structures<\/h3>\n<p>Is a top-down hierarchy system, where a Chief Executive Officer (CEO) has direct authority over several department managers. The department manager has direct authority over several other sections of employees. This system requires communication both up and down the ladder. In a Classic structure, authority comes from the top and filters to the bottom<\/p>\n<p>Frequent reportiung of project status updates may be required to pass up through management levels to keep higher leader informed<\/p>\n<p>Are also referred to as <b>functional<\/b> <b>organizations<\/b> because the organization is divided into departments based on function. Each department is led by a <b>functional manager<\/b><\/p>\n<p>Employees usually have a specialty within the organization and may not work within other areas during normal everyday operations<\/p>\n<p class=\"imgph\">Screenshot in Notion: Screenshot 2025-10-23 at 11.53.10 PM.png<\/p>\n\n<h3 id=\"n0_12\">Matrix organization structures<\/h3>\n<p>The <b>Matrix<\/b> structure differs from the Classic structure in that the employees have two or more managers.<\/p>\n<p>Still have people above you, but you also have people in adjacent departments with whom you will need to communicate on your work progress<\/p>\n<p class=\"imgph\">Screenshot in Notion: Screenshot 2025-10-23 at 11.56.43 PM.png<\/p>\n\n<p>In both Classic and Matrix organizations, project managers must clearly define roles and responsibilities in order to work effectively. However, within most Matrix organizations, some project managers or department leads may have the same level of authority as the functional managers and operate more directly.<\/p>\n<p>One way organizational structure can impact the way you manage a project is by the amount of authority given to the project manager.<\/p>\n<p>\nAuthority has to do with your ability to make decisions for the project that impact the organization, your level of authority and responsibility will vary from project to project. \n<\/p>\n\n<p>Another way organizational structures can impact project management is through resource availability.<\/p>\n<p>Managing a project is a lot easier when you know how to access the people, equipment, and budget that you need.<\/p>\n<h3 id=\"n0_13\">The role of a Project Management Office<\/h3>\n<p><b>What is a PMO?<\/b><\/p>\n<p>A Project Management Office, or PMO, is a group within an organization that defines, sets, and helps maintain project management standards and processes throughout that organization. Acts as a coordinated center for all of the organization’s projects, helping them run more smoothly and efficiently.<\/p>\n<p><b>What are the functions of a PMO?<\/b><\/p>\n<p>PMOs offer guidance and support to their organization’s project managers. They share best practices, project statuses, and direction for all of the organization’s projects while often taking on strategic projects themselves.<\/p>\n<p>Main functions of a PMO:<\/p>\n<ul>\n<li>\nStrategic planning and governance: This is the most important function of a PMO. This involves defining project criteria, selecting projects according to the organization’s business goals, and then providing a business case for those projects to management. \n<\/li>\n<li>\nBest practices: help implement best practices and processes within their organization. They also share lessons learned from previous successful projects. They help ensure consistency among their organization’s projects by providing guidance about processes, tools, and metrics.\n<\/li>\n<li>\nCommon project culture: help set common project culture practices by training employees about optimal approaches and best practices. This helps keep project management practices consistent and efficient across the entire organization.\n<\/li>\n<li>\nResource management: responsible for managing and allocating resources—such as people and equipment—across projects throughout the organization based on budget, priorities, schedules, and more. They also help define the roles and responsibilities needed on any given project. PMOs provide training, mentoring, and coaching to all employees, but project managers in particular. \n<\/li>\n<li>\nCreation of project documentation, archives, and tools: invest in and provide templates, tools, and software to help manage projects. They also play an important role in maintaining their organization’s project history. Once a project closes, they archive all of the documents created during the project for future reference and to capture lessons learned.\n<\/li>\n<\/ul>\n\n<p>\nThe key purposes of a PMO include: strategic planning and governance, implementing project management best practices, establishing common project culture, resource management, and creating project documentation, archives, and tools. PMOs support their organizations in managing large numbers of projects and help keep all employees working in the same direction towards the organization’s goals. \n<\/p>\n\n<h3 id=\"n0_14\">Organizational Culture<\/h3>\n<p>An organization's culture provides context and acts as a guide for what their people value, how they operate on a daily basis, how they relate to one another, and how they can be expected to perform.<\/p>\n<p>Organizational culture is in part the values employees share, as well as the organization's values, mission, history, and so on.<\/p>\n<p>\nCan be thought of as the company's personality. Understanding an organization's culture will help you navigate your team more effectively toward achieving the project's goal. \n<\/p>\n\n<p>It also impacts the way you plan your project. You'll need to be familiar with an organization's culture, so that you can minimize conflict and complete the project with as much support and harmony as possible.<\/p>\n<p>\nIdeally, you'll want to have a good sense of an organization's culture before you start the first phase of your project. \n<\/p>\n\n<p>\nIf you are interviewing for a project management position, asking about the culture is a great way to get more information about the company. It also shows the interviewer that you're knowledgeable about the impact culture can have on a project. \n<\/p>\n\n<p>\nconsider the following questions. \n<\/p>\n\n<ul>\n<li>\nHow do people prefer to communicate? \n<\/li>\n<li>\nHow are decisions made, majority vote or top down approvals? \n<\/li>\n<li>\nWhat kinds of rituals are in place when someone new comes to the office? \n<\/li>\n<li>\nHow are projects typically run? \n<\/li>\n<\/ul>\n\n<p>it's important to understand your impact. Be aware of your role as a change agent.<\/p>\n<p>A change agent is someone who helps the organization transform by focusing on improving organizational effectiveness and development. You and your project will most likely affect the organization in some way.<\/p>\n<p>\nUnderstanding the company’s culture can help you navigate your team through a project. \n<\/p>\n\n<p>\"Culture eats strategy for breakfast.”<\/p>\n<p>The importance of organizational culture:<\/p>\n<ul>\n<li>\nidentity: An organization’s culture defines its identity. Its identity essentially describes the way the company conducts  business, both internally and externally. You can almost think of an organization’s culture as its personality. The mission and value statements will help you understand why the company exists and will give you insight into what the company believes in and how it will behave. \n<\/li>\n<li>\nPeople: People who feel valued, engaged, and challenged are more likely to give their best and want to drive for success. \n<\/li>\n<li>\nProcesses: Organizational culture can have direct impacts on a company's processes, and ultimately, its productivity. From its employees to how its employees do their job.\n<\/li>\n<\/ul>\n\n<p>Some aspects of an organization’s culture that are directly related to how you will manage projects are communication, decision-making, rituals, previous management styles, and values.<\/p>\n<p>You might want to ask questions about:<\/p>\n<p>Atmosphere<\/p>\n<ul>\n<li>What is the company’s dress code?<\/li>\n<li>How do people typically share credit at this company?<\/li>\n<li>Is risk-taking encouraged, and what happens when people fail?<\/li>\n<li>How do managers support and motivate their team?<\/li>\n<li>How do people in this role interact with customers and users?<\/li>\n<li>When and how do team members give feedback to one another?<\/li>\n<li>What are some workplace traditions?<\/li>\n<li>What are some of the ways the company celebrates success?<\/li>\n<\/ul>\n<p>Policies:<\/p>\n<ul>\n<li>What are the policies around sick days and vacation?<\/li>\n<li>Does the company allow for employee flexibility (e.g., working from home, flexible working hours)?<\/li>\n<li>What policies are in place that support employees sharing their identity in the workplace?<\/li>\n<\/ul>\n<p>Processes:<\/p>\n<ul>\n<li>What is the company’s onboarding process?<\/li>\n<li>How do employees measure the impact of their work?<\/li>\n<\/ul>\n<p>\nValues: \n<\/p>\n\n<ul>\n<li>What are the company’s mission and value statements?<\/li>\n<li>How might the person in this role contribute to the organization’s mission?<\/li>\n<li>How does the organization support professional development and career growth<\/li>\n<\/ul>\n<h3 id=\"n0_15\">Change Management<\/h3>\n<p>The process of delivering your completed project and getting people to adopt it is called change management.<\/p>\n<p>\nUnderstanding change management can ensure that a project is completed successfully and that the organization accepts and adopts the recommendations from the project. \n<\/p>\n\n<p>You can help the success of the project by understanding your role in the process and how your organization may react to that change.<\/p>\n<p>\nChange management in project management is centered around three core concepts and best practices. \n<\/p>\n\n<p>\nThe first core concept is creating a sense of ownership and urgency around the project. \n<\/p>\n\n<p>\nOwnership means getting others to feel they are empowered to take responsibility for the successful completion of their tasks. \n<\/p>\n\n<p>\nUrgency means getting them to understand that the project is important and to identify what actions need to be taken to move the project along. \n<\/p>\n\n<p>When team members feel a sense of ownership and urgency around a project, it increases interest, motivation, and engagement with the project outcome<\/p>\n<p>\nFigure out the right combination of skills and personalities when selecting the people who will work on your team. \n<\/p>\n\n<p>\nOne effective way of motivating your team is to communicate clearly your vision and approach for the project. \n<\/p>\n\n<p>\nEffective communication. Having effective communication with your team means being transparent and up front with your plans and ideas and making information available. \n<\/p>\n\n<p>\nMake sure your team, along with the rest of the organization, is kept up-to-date on your progress. \n<\/p>\n\n<p>Change management is the process of delivering your completed project and getting other people in the organization to adopt it. Your project’s success depends on the adoption and acceptance of your project<\/p>\n<p>\nBoth change management and project management aim to increase the likelihood of project success. They also incorporate tools and processes to accomplish that goal. The most effective way to achieve a project goal is to integrate project management and change management, and it is your responsibility as a project manager to do so. \n<\/p>\n\n<ul>\n<li>How will the organization react to change?<\/li>\n<li>Which influencers can affect change?<\/li>\n<li>What are the best means of communication?<\/li>\n<li>What change management practices will lead to the successful implementation of my project?<\/li>\n<\/ul>\n<p>Best practices for approaching change management on your projects:<\/p>\n<ul>\n<li>\nBe proactive: can help keep any potentially impacted stakeholders aware of the upcoming changes.\n<\/li>\n<li>\nCommunicate about upcoming changes: Communication should occur regularly among impacted stakeholders, the change management team, and the project team. Check in and communicate throughout the project about how the changes will provide a better experience for end users of the project deliverables. \n<\/li>\n<li>\nFollow a consistent process: Following a clear change management process helps maintain consistency each time there is a change. The change management process should be established and documented early on in your project to guide how the project will handle change\n<\/li>\n<li>\nPractice empathy: Changes are inevitable, but we are often resistant to them. By being empathetic to the challenges and anxiety change can bring, you can support the process in subtle ways. \n<\/li>\n<li>\nUse tools:  \n\n- <b>Feedback mechanisms<\/b>, such as surveys, can capture input from stakeholders.\n- [<b><u>Flowcharts<\/u><\/b>](https://www.lucidchart.com/pages/what-is-a-flowchart-tutorial) can visualize the project's development process.\n- [<b><u>Culture mapping<\/u><\/b>](https://www.strategyzer.com/blog/posts/2015/10/13/the-culture-map-a-systematic-intentional-tool-for-designing-great-company-culture)<b> <\/b>can illustrate the company's culture and how the company's values, norms, and employees behavior may be affected by the change.\n<\/li>\n<\/ul>\n\n<p>\n\n<p class=\"imgph\">Screenshot in Notion: Screenshot 2025-10-24 at 1.37.39 AM.png<\/p>\n\n<\/p>\n\n<p class=\"imgph\">Screenshot in Notion: Screenshot 2025-10-24 at 1.38.27 AM.png<\/p>\n\n<h3 id=\"n0_16\">Corporate and project governance<\/h3>\n<p><b>Governance<\/b> in business is the management framework within which decisions are made and accountability and responsibility are determined. Is understanding who is in charge.<\/p>\n<h3 id=\"n0_17\">Corporate governance<\/h3>\n<p>\nSet of standards and practices that direct and control its actions. Is the framework by which an organization achieves its goals and objectives. Is also a way to balance the requirements of the various corporate entities, such as stakeholders, management, and customers. \n<\/p>\n\n<p>\nEffective governance in change management provides clearly defined roles and responsibilities during change. This enables the people within the organization to have a precise understanding of who makes decisions and of the relationship between those managing and participating in the change management process. \n<\/p>\n\n<h3 id=\"n0_18\">Project governance<\/h3>\n<p>is the framework for how project decisions are made. Helps keep projects running smoothly, on time, and within budget.<\/p>\n<p>\nIt tells you what activities an organization does and who is responsible for those activities. Project governance covers policies, regulations, functions, processes, procedures, and responsibilities. \n<\/p>\n\n<p>\nYou should think about an organization’s culture and structure when you are interviewing for a new role and as you begin a new role or project. You should consider an organization’s governance processes and practices in the same way. This will help you understand how decisions are made, who is responsible for what, and what are the potential issues and areas of concern. \n<\/p>\n\n<p>Glosary: <a href=\"https://docs.google.com/document/d/100bNgK8Ly_30OjVzjRPkxBNle-zF92YtclgXCg_doGU/template/preview\">https://docs.google.com/document/d/100bNgK8Ly_30OjVzjRPkxBNle-zF92YtclgXCg_doGU/template/preview<\/a><\/p>\n<h3 id=\"n0_19\">Initiation Phase<\/h3>\n<p>The key components that make up initiation, and how these pieces lead to the planning phase of a project, that you need to consider in order for your project to be successful.<\/p>\n<ul>\n<li>\nGoals: the goal is what you've been asked to do and what you're trying to achieve. \n<\/li>\n<li>\nScope: This is the process to define the work that needs to happen to complete the project.\n<\/li>\n<li>\nDeliverables: They're the products and services that you will create for your customer, client or project sponsor. Deliverables can be anything from product features and functionalities to documentation, processes and more, anything that enables the goal of your project to be achieved. \n<\/li>\n<li>\nSuccess Criteria: Are the standards by which you measure how successful a project was in reaching its goals.\n<\/li>\n<li>\nStakeholders: They're the people who both have an interest in and are affected by the completion and success of a project. \n<\/li>\n<li>\nResources: Generally refer to the budget, people, materials, and other items that you will have at your disposal.\n<\/li>\n<\/ul>\n\n<p>\nOnce you've established your goals, scope, deliverables, success criteria, stakeholders, and resources, it's time to create a project charter. A project charter is a document that contains all the details of the project. Project charters clearly define the project and its goals and outline what is needed to accomplish them. A project charter allows you to get organized, set up a framework for what needs to be done and communicate those details to others. \n<\/p>\n\n<p>You gather information about your goals, scope, deliverables, success criteria, stakeholders, and resources, and you document that information in the project charter.<\/p>\n<h3 id=\"n0_20\">Cost-benefit analysis<\/h3>\n<p>Is the process of adding up the expected value of a project—the benefits—and comparing them to the dollar costs.<\/p>\n<p>Can minimize risks and maximize gains for projects and organizations.<\/p>\n<p>\nUses objective data, it can help reduce biases and keep stakeholder self-interest from influencing decisions. \n<\/p>\n\n<p>To determine the benefits of a project, you might ask:<\/p>\n<ul>\n<li>What value will this project create?<\/li>\n<li>How much money could this project save our organization?<\/li>\n<li>How much money will it bring in from existing customers?<\/li>\n<li>How much time will it save?<\/li>\n<li>How will it improve the customer experience?<\/li>\n<\/ul>\n<p>To determine the costs of a project, consider questions such as:<\/p>\n<ul>\n<li>How much time will people have to spend on this project?<\/li>\n<li>What are the one-time costs?<\/li>\n<li>Are there any ongoing costs?<\/li>\n<li>What about long-term costs?<\/li>\n<\/ul>\n<p>Also consider questions about <b>intangible benefits<\/b>. These are gains that are not quantifiable, such as:<\/p>\n<ul>\n<li><b>Customer satisfaction<\/b>. Will the project increase customer retention, causing them to spend more on the company’s products or services?<\/li>\n<li><b>Employee satisfaction<\/b>. Is the project likely to improve employee morale, reducing turnover?<\/li>\n<li><b>Employee productivity<\/b>. Will the project reduce employee’s overtime hours, saving the company money?<\/li>\n<li><b>Brand perception<\/b>. Is the project likely to improve the company’s brand perception and recognition, attracting more customers or providing a competitive advantage?<\/li>\n<\/ul>\n<p>The process of calculating costs and benefits is also called calculating <b>return on investment<\/b>, or <b>ROI<\/b>.<\/p>\n<p class=\"imgph\">Screenshot in Notion: Screenshot 2025-10-24 at 3.31.44 AM.png<\/p>\n\n<p>In this formula, <b>G<\/b> represents the financial gains you expect from the project, and <b>C<\/b> represents the upfront and ongoing costs of your investment in the project.<\/p>\n<p>example, imagine your project costs \\$6,000 up front plus \\$25 per month for 12 months. Twenty-five dollars for 12 months equals \\$300 per year, meaning your total cost is \\$6,300. You estimate that the project will bring in \\$10,000 in revenue over the course of that year. That leaves you with:<\/p>\n<ul>\n<li>G = \\$10,000<\/li>\n<li>C = \\$6,300<\/li>\n<\/ul>\n<p>Now, using the formula above, you plug in the amounts as follows:<\/p>\n<ul>\n<li>(\\$10,000 - \\$6,300) ÷ \\$6,300 = ROI<\/li>\n<\/ul>\n<p>Then you proceed with the calculation:<\/p>\n<ul>\n<li>First, inside the parentheses: 10,000 - 6,300 = \\$3,700<\/li>\n<li>Next, \\$3,700 ÷ \\$6,300 = 0.5873<\/li>\n<li>Finally, 0.5873 x 100 = 58.7%<\/li>\n<\/ul>\n<p>Given a strong ROI tends to be anything above 10%, you find 58.7% to be a strong ROI, so you decide to pursue the project.<\/p>\n<p>You need to define exactly what your goals and deliverables are, so that you'll be able to tell your team members what to do. You need a clear picture of what you're trying to accomplish, how you're going to accomplish it, and how you know when it has been accomplished.<\/p>\n<p>The project goal is the desired outcome of the project. It's what you've been asked to do and what you're trying to achieve.<\/p>\n<p>\nthe biggest differences between what makes a good goal and a not-so-good goal is how well it's defined. \n<\/p>\n\n<p>\n take time to review your goals and make sure they're well-defined. To do this, you might need to get more information from your stakeholders. Talk to them about their vision for the project. \n<\/p>\n\n<p>\nProject deliverables are the products or services that are created for the customer, client, or project sponsor. a deliverable is what gets produced or presented at the end of a task, event, or process. \n<\/p>\n\n<p>When a goal is reached, you can visibly see the results documented in the chart, graph, or presentation.<\/p>\n<p>Deliverables help us quantify and realize the impact of the project. Just like needing well-defined goals, you need well-defined deliverables for pretty much the same reasons. an easy method for doing just that: setting SMART goals.<\/p>\n<p>SMART:<\/p>\n<ul>\n<li>S: Specific<\/li>\n<li>M: Measurable<\/li>\n<li>A: Attainable<\/li>\n<li>R: Relevant<\/li>\n<li>T: Time bound<\/li>\n<\/ul>\n<p>\nSpecific goals should answer at least two of the questions: \n<\/p>\n\n<ul>\n<li>\nWhat do I want to accomplish? \n<\/li>\n<li>\nWhy is this a goal? \n<\/li>\n<li>\nDoes it have a specific reason, purpose, or benefit? \n<\/li>\n<li>\nWho is involved? \n<\/li>\n<li>\nWho is the recipient?\n<\/li>\n<\/ul>\n\n<p>\nwe want to set goals that are measurable, meaning we can determine that they were objectively met. \n<\/p>\n\n<p>\nMeasuring is not only a way for people to track progress, but also a tool to help people stay motivated. \n<\/p>\n\n<p>\nYou can tell the goal is measurable by asking how much, how many, and how will I know when it's accomplished? \n<\/p>\n\n<p>how can you know if a goal is attainable, if it's unfamiliar? A clue to helping you figure out if your goal is attainable, is to ask: how can it be accomplished? Break down the goal into smaller parts and see if it makes sense.<\/p>\n<p>\nit's Relevant mean that it makes sense to try and reach this goal? Think about how the goal lines up with other goals, priorities and values. Ask whether the goal seems worthwhile. Does the effort involved balance out the benefits? Does it match your organizations' other needs and priorities? Everyone, from the client, the project team, and the people who will ultimately use the product, need to feel like the goal is worth supporting. \n<\/p>\n\n<p>Time-bound means your goal has a deadline<\/p>\n<p>Deadlines give you a way to track your progress, otherwise, you may never reach your goal or never even get started. Time and metrics often go hand in hand, because time can also be used as a metric.<\/p>\n<p>Making your goal time-bound gives you a way to break down how much needs to be accomplished over time.<\/p>\n<p>Define and create measurable project goals and deliverables. Focus on SMART goals.<\/p>\n<p>\n<b>Specific, Measurable, Attainable, Relevant, <\/b>and<b> Time-bound (SMART)<\/b> goals are very helpful for ensuring project success. SMART goals help you see the full scope of a goal, determine its feasibility, and clearly define project success in concrete terms. \n<\/p>\n\n<p class=\"imgph\">Screenshot in Notion: Screenshot 2025-10-24 at 4.43.02 PM.png<\/p>\n\n<ul>\n<li><b>Specific:<\/b> The objective has no ambiguity for the project team to misinterpret.<\/li>\n<li><b>Measurable: <\/b>Metrics help the project team determine when the objective is met.<\/li>\n<li><b>Attainable:<\/b> The project team agrees the objective is realistic.<\/li>\n<li><b>Relevant:<\/b> The goal fits the organization’s strategic plan and supports the project charter.<\/li>\n<li><b>Time-bound:<\/b> The project team documents a date to achieve the goal.<\/li>\n<\/ul>\n<p>Having measurable goals allows you to assess the success of your project based on quantifiable or tangible<b> <\/b>metrics, such as dollar amounts, number of outputs, quantities, etc. Measurable goals are important because they leave little room for confusion around expectations from stakeholders.<\/p>\n<p>explain what makes them SMART by answering the following questions:<\/p>\n<ol>\n<li>What makes the goal <b>specific<\/b>? Does it provide enough detail to avoid ambiguity?<\/li>\n<li>What makes the goal <b>measurable<\/b>? Does it include metrics to gauge success?<\/li>\n<li>What makes the goal <b>attainable<\/b>? Is it realistic given available time and resources?<\/li>\n<li>What makes the goal <b>relevant<\/b>? Does it support project or business objectives?<\/li>\n<li>What makes the goal <b>time-bound<\/b>?Does it include a timeline or deadline?<\/li>\n<\/ol>\n<p>Example:<\/p>\n<p>Goal : “Office Green wants to raise the customer retention rate.”<br />SMART Goal : “Office Green wants to increase its <b>customer retention rate<\/b> from 80% to <b>88%<\/b>, measured by annual contract renewal metrics, by the <b>end of the fourth quarter (Q4)<\/b>.\"”<\/p>\n<ul>\n<li>\nWhat makes this goal specific? Does it provide enough detail to avoid<br />ambiguity?\n<\/li>\n<li>\nResponse: This goal is <b>specific<\/b> because it clearly identifies <b>what<\/b> will be achieved (an increase in the customer retention rate) and <b>by how much<\/b> (from 80% to 88%). <br />\n<\/li>\n<li>\nWhat makes this goal measurable? Does it include metrics to gauge success?\n<\/li>\n<li>\nResponse: it includes quantifiable metrics to gauge success. The key metric is the <b>customer retention rate<\/b>, with a clear benchmark (80%) and a defined target <b>(88%)<\/b>. \n<\/li>\n<\/ul>\n\n<ul>\n<li>What makes this goal attainable? Is it realistic given available time and<br />resources?<\/li>\n<li>Response: Since past customer departures were often due to a lack of extensive services, the new service directly addresses this gap.<br /><\/li>\n<li>What makes this goal relevant? Does it support project or business objectives?<\/li>\n<li>Response: It directly supports a core <b>business objective<\/b> set by the CEO: increasing the retention rate by at least 10%. Increasing customer retention is crucial for long-term profitability and success, making the project's efforts to improve services (like Plant Pals) directly <b>relevant<\/b> to achieving this top-level company goal.<br /><\/li>\n<li>What makes this goal time-bound? Does it include a timeline or deadline?<\/li>\n<li>Response: It provides a clear deadline: the <b>end of the fourth quarter (Q4)<\/b>.<\/li>\n<\/ul>\n<h3 id=\"n0_21\">OKRs<\/h3>\n<p>Objectives and Key results, or OKRs.<\/p>\n<p>They not only state clearly what the goal is, they provide specific details that allow you to measure the success of the goal. One way to think about OKRs is that they separate the different components of SMART goals and clarify them even further, rather than grouping everything into one statement.<\/p>\n<p>\nThe O stands for objective, and defines what needs to be achieved. It describes the desired result or outcome, such as an increase in customer retention, or an improvement on the employee onboarding process. KR stands for key results. These are the measurable outcomes that define when the objective has been met. \n<\/p>\n\n<p>If we actually accomplish all of our key results, we may have made our OKRs a bit too easy<\/p>\n<p>Objectives define what needs to be achieved and describe a desired outcome.<br />Key results define how you'll know whether or not you've met your objective<\/p>\n<p>\nOrganizations often set OKRs at different levels, such as the company level, department or team level, and project level. \n<\/p>\n\n<ul>\n<li>\nCompany-level OKRs are commonly shared across an organization so that everyone is clear on the company's goals. They are usually updated on an annual basis to help drive the organization in the direction it wants to go. These high-level OKRs support the mission of the organization. \n<\/li>\n<li>\nTeam or department-level OKRs, support the company's broader OKRs and help drive team performance. Departments may develop OKRs that are more specific to their job function as well. \n<\/li>\n<li>\nProject-level OKRs are set during the initiation phase to help define measurable project goals. They're tracked throughout the planning and execution stages to measure project success. Project-level OKRs need to align with and support both company and department-level OKRs.\n<\/li>\n<\/ul>\n\n<p>OKR stands for objectives and key results. They combine a goal and a metric to determine a measurable outcome<\/p>\n<p class=\"imgph\">Screenshot in Notion: Screenshot 2025-10-26 at 12.03.57 AM.png<\/p>\n\n<p>Set your objectives:<\/p>\n<p>Project objectives should be aspirational, aligned with organizational goals, action-oriented, concrete, and significant. Consider the vision you and your stakeholders have for your project and determine what you want the project team to accomplish in 3–6 months.<\/p>\n<p>Examples:<\/p>\n<ul>\n<li>Build the most secure data security software<\/li>\n<li>Continuously improve web analytics and conversions<\/li>\n<li>Provide a top-performing service<\/li>\n<li>Make a universally-available app<\/li>\n<li>Increase market reach<\/li>\n<li>Achieve top sales among competitors in the region<\/li>\n<\/ul>\n<p>Strong <b>objectives<\/b> meet the following criteria. They are:<\/p>\n<ul>\n<li>Aspirational<\/li>\n<li>Aligned with organizational goals<\/li>\n<li>Action-oriented<\/li>\n<li>Concrete<\/li>\n<li>Significant<\/li>\n<\/ul>\n<p>To help shape each objective, ask yourself and your team:<\/p>\n<ul>\n<li>Does the objective help in achieving the project’s overall goals?<\/li>\n<li>Does the objective align with company and departmental OKRs?<\/li>\n<li>Is the objective inspiring and motivational?<\/li>\n<li>Will achieving the objective make a significant impact?<\/li>\n<\/ul>\n<p>Develop Key results:<\/p>\n<p>dd 2–3 key results for each objective. Key results should be time-bound. They can be used to indicate the amount of progress to achieve within a shorter period or to define whether you’ve met your objective at the end of the project. They should also challenge you and your team to stretch yourselves to achieve more.<\/p>\n<p>Examples:<\/p>\n<ul>\n<li>X% new signups within first quarter post launch<\/li>\n<li>Increase advertiser spend by X% within the first two quarters of the year<\/li>\n<li>New feature adoption is at least X% by the end of the year<\/li>\n<li>Maximum 2 critical bugs are reported monthly by customers per Sprint<\/li>\n<li>Maintain newsletter unsubscribe rate at X% this calendar year<\/li>\n<\/ul>\n<p>Strong <b>key results<\/b> meet the following criteria:<\/p>\n<ul>\n<li>Results-oriented—<b>not<\/b> a task<\/li>\n<li>Measurable and verifiable<\/li>\n<li>Specific and time-bound<\/li>\n<li>Aggressive yet realistic<\/li>\n<\/ul>\n<p>To help shape your key results, ask yourself and your team the following:<\/p>\n<ul>\n<li>What does success mean?<\/li>\n<li>What metrics would prove that we’ve successfully achieved the objective?<\/li>\n<\/ul>\n<p>Some best practices to keep in mind when writing OKRs:<\/p>\n<ul>\n<li>Think of your objectives as being motivational and inspiring and your key results as being tactical and specific. The objective describes what you want to do and the key results describe how you’ll know you did it.<\/li>\n<li>As a general rule, try to develop around 2–-3 key results for each objective.<\/li>\n<li>Be sure to document your OKRs and link to them in your project plan.<\/li>\n<\/ul>\n<h3 id=\"n0_22\">Project Scope<\/h3>\n<p>an agreed upon understanding as to what is included or excluded from a project.<\/p>\n<p>helps ensure that your project is clearly defined and mapped out. That means knowing exactly who the project will be delivered to and who will be using the end result of the project. You also need a firm understanding of the project's complexity.<\/p>\n<p>\nHere are a few more helpful questions to add to the list. \n<\/p>\n\n<ul>\n<li>\n Where did the project come from?\n<\/li>\n<li>\n Why is it needed?\n<\/li>\n<li>\n What is the project expected to achieve?\n<\/li>\n<li>\n What does the project sponsor have in mind? \n<\/li>\n<li>\n Who approves the final results?\n<\/li>\n<\/ul>\n\n<p>Once you understand your project scope, you want to document all the details so that anyone can refer back to it throughout the life cycle of the project.<\/p>\n<p>\nA clearly defined scope describes all the details of a project and regulates what can be added or removed as it progresses. While it's ultimately the project manager's responsibility to monitor the project and make sure all the work and resources fall within its scope, team members and stakeholders can be encouraged to do their part by focusing on the task that are the most important to reaching the project's goal. \n<\/p>\n\n<p>\nThe scope provides the boundaries for your project. You define the scope to help identify necessary resources, resource costs, and a schedule for the project. \n<\/p>\n\n<p>\nTaking the time to ask questions and ensure that you understand the scope of the project will help reduce expenses, rework, frustration, and confusion. Make sure you understand the <i>who<\/i>,<i> what<\/i>, <i>when<\/i>, <i>where<\/i>, <i>why<\/i>, and <i>how<\/i> as it applies to the scope. If you are missing any of that information, focus your questions on those elements. The initiation phase of the project sets the foundation for the project, so ensuring that you understand the scope and expectations during this stage is essential. \n<\/p>\n\n<p>\nTasks that are included in the project and contribute to the project's overall goal are considered to be in-scope. \n<\/p>\n\n<p>Tasks that aren't included are called out-of-scope.<\/p>\n<p>Changes, growth, and uncontrolled factors that affect a project scope at any point after the project begins are referred to as \"scope creep.\" Scope creep is a common problem, and it's not always easy to control.<\/p>\n<p>To help you combat scope creep, it's good to know that there are two major sources from which it comes: external and internal. External sources of scope creep are easier to recognize.<\/p>\n<p>\nthe customer might request changes, or the business environment around you might shift, or the underlying technology you're using might change. \n<\/p>\n\n<p>\nWhile you can't control everything that happens, there are some useful tips to keep in mind. \n<\/p>\n\n<p>make sure the stakeholders have visibility into the project. You want them to know the details of what's going to be produced, what resources are required, how much it will cost, and how much time it'll take.<\/p>\n<p>Be sure to set ground rules and expectations for stakeholder involvement once the project gets started.<\/p>\n<p>Come to an agreement on each of your roles and responsibilities during execution and status reviews.<\/p>\n<p>Agree on who can make formal change requests and how those requests will be evaluated, accepted, and performed.<\/p>\n<h3 id=\"n0_23\">Scope management best practices<\/h3>\n<p><b>Scope creep <\/b>is when a project’s work starts to grow beyond what was originally agreed upon during the initiation phase. Scope creep can put stress on you, your team, and your organization, and it can put your project at risk. The effects of scope creep can hinder every aspect of the project, from the schedule to the budget to the resources, and ultimately, its overall success.<\/p>\n<p>\nSome best practices for scope management and controlling scope creep: \n<\/p>\n\n<ul>\n<li>\n<b>Define your project’s requirements. <\/b>Communicate with your stakeholders or customers to find out exactly what they want from the project and document those requirements during the initiation phase. \n<\/li>\n<li>\n<b>Set a clear project schedule. <\/b>Time and task management are essential for sticking to your project’s scope. Your schedule should outline all of your project’s requirements and the tasks that are necessary to achieve them.\n<\/li>\n<li>\n<b>Determine what is out of scope. <\/b>Make sure your stakeholders, customers, and project team understand when proposed changes are out of scope. Come to a clear agreement about the potential impacts to the project and document your agreement.\n<\/li>\n<li>\n<b>Provide<\/b> <b>alternatives. <\/b>Suggest alternative solutions to your customer or stakeholder. You can also help them consider how their proposed changes might create additional risks. Perform a cost-benefit analysis, if necessary.\n<\/li>\n<li>\n<b>Set up a change control process. <\/b>During the course of your project, some changes are inevitable. Determine the process for how each change will be defined, reviewed, and approved (or rejected) before you add it to your project plan. Make sure your project team is aware of this process.\n<\/li>\n<li>\n<b>Learn how to say no. <\/b>Sometimes you will have to say no to proposed changes. Saying no to a key stakeholder or customer can be uncomfortable, but it can be necessary to protect your project’s scope and its overall quality. If you are asked to take on additional tasks, explain how they will interfere with the budget, timeline, and/or resources defined in your initial project requirements. \n<\/li>\n<li>\nC<b>ollect<\/b> <b>costs for out-of-scope work. <\/b>If out-of-scope work is required, be sure to<b> <\/b>document all costs incurred. That includes costs for work indirectly impacted by the increased scope. Be sure to indicate what the charges are for. \n<\/li>\n<\/ul>\n\n<h3 id=\"n0_24\">Managing Project Scope<\/h3>\n<p>\nWhile your project will have its own specific goals, the overall goal for you as the project manager is to deliver the project according to the scope agreements. delivering the project within the given deadline and the approved budget. \n<\/p>\n\n<p>\nIn order to decide if a scope change is acceptable and what impact it will have, project managers usually refer to the triple constraint model. \n<\/p>\n\n<p>\nThe triple constraint model is the combination of the three most significant restrictions of any project: scope, time, and cost. \n<\/p>\n\n<p>Time refers to the project schedule and deadlines.<\/p>\n<p>\nCost includes the budget, and it also covers resources and the people who will work on the project. \n<\/p>\n\n<p>\nyou can't change one without having an impact on the others. \n<\/p>\n\n<h3 id=\"n0_25\">Launching and landing a project<\/h3>\n<p>\nkey element is knowing when your project is delivered and you can call it a success. \n<\/p>\n\n<p>Delivering the final result of your project to the client or user is what's called a project launch.<\/p>\n<p>The real deciding factor of project success is when you put the final outcome to the test.<\/p>\n<p>Landing is when you actually measure the success of your project using the success criteria established at the outset of the project.<\/p>\n<p>\nLaunches are only a means to an end, and looking beyond the launch is important to ensure the launch achieves your overall goals. \n<\/p>\n\n<p>The success criteria includes all the specific details of your goals and deliverables, and it can be a guide so you know whether you've accomplished what you set out to do. Success criteria will set standards for how your project will be judged.<\/p>\n<p>\nA project “launching” means you have delivered the final<b> <\/b>results of the project to the client or user. You can’t solely base project success on when the client accepts the project, though. Your work on a project won’t be complete until you “land”<b> <\/b>it by thoroughly measuring the results. This is when the <b>success criteria <\/b>and the metrics you defined initially when setting SMART goals will come in handy.  \n<\/p>\n\n<h3 id=\"n0_26\">Defining Success Criteria<\/h3>\n<p>At the beginning of the project, you defined goals and deliverables that are measurable—meaning that you can determine if they were met.<\/p>\n<p>\nyou need to define success criteria that can also be measured so you'll know whether they were met. The success criteria will tell you whether or not the project as a whole was successful. \n<\/p>\n\n<p>\nThey are the specific details of your goals and deliverables that tell you whether you've accomplished what you set out to do. They are the standards by which the project will be judged once it's been delivered to stakeholders and customers. \n<\/p>\n\n<p>also clarifies for your team what they're trying to accomplish beyond just launching something to users.<\/p>\n<p>go through your project goals and deliverables, review the scope, and identify the measurable aspects of your project. These are going to be any of the metrics used in the goals and deliverables, along with your budget and schedule details.<\/p>\n<p>\nAdoption refers to how the customer uses and adopts a product or service without any issues. Engagement refers to how often or meaningful customer interaction and participation is over time. \n<\/p>\n\n<p>\nAdoption metrics might include launching a new product to a group of users and having a high amount of them use or adopt it. Engagement metrics might include increasing the daily usage of a design feature or increasing orders and customer interactions. \n<\/p>\n\n<p>\nIt's a good idea that, along with each success criteria on your list, to also include the methods for how success will be measured, how often it's measured, and who's responsible for measuring it. \n<\/p>\n\n<p>\ndefining your success criteria should create greater alignment within the team and give everybody better visibility into how to achieve success. Clarity around success metrics also helps teams prioritize which efforts are most impactful to their users. \n<\/p>\n\n<h3 id=\"n0_27\">Success Criteria<\/h3>\n<p>We can also determine the success of a project by the quality of the product, the ability to fulfill the needs of your customers, and the need to meet the expectations of your stakeholders.<\/p>\n<h3 id=\"n0_28\">Product Quality<\/h3>\n<p>\nThe product, or final result, of a project has its own set of attributes that define success. The product attributes that are necessary for the product’s success include completeness in features, quality of features, unit cost, usability, etc. \n<\/p>\n\n<p>To measure the success of a product, consider including these metrics on your checklist:<\/p>\n<ul>\n<li>Track if you implemented the product’s priority requirements<\/li>\n<li>Track and assess the product’s number of technical issues or defects<\/li>\n<li>Measure the percentage of features you delivered or released at the end of the project<\/li>\n<\/ul>\n<p>you can measure the fulfillment of strategic goals via user or customer metrics. Metrics to consider include:<\/p>\n<ul>\n<li>Evaluating user engagement with the product<\/li>\n<li>Measuring stakeholder and customer satisfaction via surveys<\/li>\n<li>Tracking user adoption of the product by using sales data<\/li>\n<\/ul>\n<p><b>Share your OKRs with your team. <\/b>Once you’ve created OKRs for your project, it’s important to communicate them to your team so that everyone knows how to focus and align their efforts.<\/p>\n<p><b>Assign owners. <\/b>Assign an owner to every key result so that everybody knows who’s responsible for what. This helps add clarity and increases accountability.<\/p>\n<h3 id=\"n0_29\">Working effectively with stakeholders<\/h3>\n<p>Stakeholders:<\/p>\n<p>\npeople who are interested in and affected by the project's completion and success. \n<\/p>\n\n<p>Each person involved has a set role and set responsibilities to help bring the project to a landing. Those roles include project sponsors, customers, team members, and of course, you, the project manager.<\/p>\n<p>Accessibility:<\/p>\n<p>removing any barriers that might prevent persons with disabilities from being able to access technology, information, or experiences, and leveling in the playing field so everyone has an equal chance of enjoying life and being successful.<\/p>\n<p>\nAs a project manager, you are responsible for making sure a group of people can come together to achieve a common goal using shared tools and systems. In order to be successful, you need to make sure the infrastructure and culture you set up works for everyone. \n<\/p>\n\n<p>When choosing a team, consider:<\/p>\n<ul>\n<li>Required roles<\/li>\n<li>Team size<\/li>\n<li>Necessary skills<\/li>\n<li>Availability<\/li>\n<li>Motivation<\/li>\n<\/ul>\n<p>key questions:<\/p>\n<ul>\n<li>\nHow many people do I need on my team each step of the way? \n<\/li>\n<li>\nWhich team members do I need and when?\n<\/li>\n<li>\nAre those experts already busy on other projects? \n<\/li>\n<li>\nWho makes the final decisions on project resources?\n<\/li>\n<\/ul>\n\n<p>The right skills and abilities to fill the role:<\/p>\n<ul>\n<li>\nTechnical skills are the skills specific to the task that needs to be performed.\n<\/li>\n<li>\npatience and conflict mediation, can help team members. they can minimize team-related issues.\n<\/li>\n<li>\nProblem-solving skills<b> <\/b>are a must for all team members, especially when it comes to large, complex projects\n<\/li>\n<li>\nStrong leadership skills help team members navigate organizational boundaries and effectively communicate with stakeholders to generate buy-in. \n<\/li>\n<\/ul>\n\n<p>\nteam size, skills, availability, and motivation are the building blocks to creating your very own dream team. Always keep in mind that a project manager does not just select dream teams, they create dream teams through collaboration under great leadership. This is the leadership that you will provide as a project manager. \n<\/p>\n\n<p>Some roles aren't fixed. Sometimes team members need to adapt and take on more than one role at a time.<\/p>\n<p>\nWhether they're fixed or not, we always have these project roles. Project sponsors, team members, customers or users, stakeholders, and of course, the project manager. \n<\/p>\n\n<p>PROJECT SPONSOR:<\/p>\n<p>\nThe person who is accountable for the project and who ensures the project delivers the agreed upon value to the business. \n<\/p>\n\n<p>Sometimes they fund the project. The sponsor will probably communicate directly with managers and key stakeholders<\/p>\n<p>Initiates the project and is responsible for presenting a business case for its existence, signing the project charter, and releasing resources to the project manager.<\/p>\n<p>TEAM MEMBERS:<\/p>\n<p>Are the heart of the operation. They're the people doing the day to day work and making the project happen.<\/p>\n<p>CUSTOMERS:<\/p>\n<p>\nThe people who will get some sort of value from a successfully landed project. \n<\/p>\n\n<p>users are the people that ultimately use the product that your project will produce.<\/p>\n<p>\na software company has created a type of software that allows teams to communicate with each other in an instant message application. The software is purchased by corporation ABC; they are the customer. But the users are everyone within corporation ABC that will be using the instant message application every day. \n<\/p>\n\n<p>STAKEHOLDERS:<\/p>\n<p>Anyone involved in the project; those who have a vested interest in the project's success. Primary stakeholders are people who expect to benefit directly from the project's completion, while secondary stakeholders play an intermediary role and are indirectly impacted by the project.<\/p>\n<p>Primary and secondary stakeholders help project managers define project goals and outcomes.<\/p>\n<p>Often divided into two groups: <b>primary stakeholders,<\/b> also known as key stakeholders, and<b> secondary stakeholders.<\/b><\/p>\n<p>A primary stakeholder is directly affected by the outcome of the project, while a secondary stakeholder is indirectly affected by the outcome of the project.<\/p>\n<p>Primary stakeholders usually include team members, senior leaders, and customers.<\/p>\n<p>PROJECT MANAGER:<\/p>\n<p>\nthe person who plans, organizes and oversees the whole project. \n<\/p>\n\n<p>\nIs responsible for the overall success of the team, and ultimately, the project as a whole. A project manager understands that paying close attention to team dynamics is essential to successfully completing a project, and they use team-building techniques, motivation, influencing, decision-making, and coaching skills, to keep their teams strong. \n<\/p>\n\n<p>\nIntegrate all project work by developing the project management plan, directing the work, documenting reports, controlling change, and monitoring quality. \n<\/p>\n\n<p>Are responsible for balancing the scope, schedule, and cost of a project by managing engagement with stakeholders. When managing engagement with stakeholders, project managers rely on strong communication skills, political and cultural awareness, negotiation, trust-building, and conflict management skills.<\/p>\n<p>Really the challenge is understanding the dynamics of the people that you work with. I like to say that the key about program management is people and contexts. You have to understand the people that you're working with, you have to understand the context, and only then can you apply the skills that you learned<\/p>\n<p>The most important part about program management is understanding the personalities of the people you work with so that you can tailor your approach to make sure that you're working effectively with them.<\/p>\n<h3 id=\"n0_30\">Stakeholders Analysis<\/h3>\n<p>\nThis is a visual representation of all the stakeholders. It helps you avoid surprises, build necessary partnerships, and ensure you're involving the right people at the right time. When done well, your stakeholder analysis helps you see all the opportunities for success and the potential risks, it illustrates which stakeholders are taking on which responsibilities, and it can help you include the right people in important conversations, which is key to getting the support you need throughout the project. \n<\/p>\n\n<ul>\n<li>make a list of all the stakeholders that the project impacts.<\/li>\n<li>determine the level of interest and influence for each stakeholder<\/li>\n<li>Assess their ability to participate, and find ways to involve them<\/li>\n<\/ul>\n<p>Influence measures how much power a stakeholder has and how much the stakeholder's actions affect the project outcome.<\/p>\n<p>Interest is how much are the needs of the stakeholder affected by the project operations and outcomes<\/p>\n<p>\nThe power grid is a super useful two-by-two grid used for conducting a stakeholder analysis. We use the power grid to assign each stakeholder's level of importance to the project, measuring their interest and influence. \n<\/p>\n\n<p>The position of the stakeholder on the grid usually determines their active role in the project. The higher the interest and influence, the more important the stakeholder is to the project's success.<\/p>\n<p>There are four different techniques you can use for managing stakeholders:<\/p>\n<p>\n1-  The first group of stakeholders are the key players, or key stakeholders: these people in the top right corner of the grid. To best manage key stakeholders, you'll want to closely partner with them to reach the desired outcomes. \n<\/p>\n\n<p>2- Stakeholders with higher influence but lower interest: In the top left corner of the grid. To manage these stakeholders, you'll want to consult with them and meet their needs. Their opinions and input are important to the project. The Director of Product has high influence, but may not be vested into day-to-day activities, and therefore will have a lower interest.<\/p>\n<p>\n3- Stakeholders with lower influence but high interest: In the right bottom corner of the grid. For these stakeholders, you'll want to show consideration for them by keeping them up-to-date on the project. It's unlikely they'll need a say in what's going on, but keeping them informed is important. \n<\/p>\n\n<p>\n4- stakeholders with low influence and low interest: In the bottom left corner. They're the least important of the stakeholders, but this doesn't mean that they don't matter. It might just be that for this particular project, they aren't as integral. So for this project, you mainly want to monitor them, keeping them in the know. \n<\/p>\n\n<p class=\"imgph\">Screenshot in Notion: Screenshot 2025-10-28 at 1.24.19 AM.png<\/p>\n\n<p>\nCreating a grid like this is an effective way to track who should be communicated with and when. \n<\/p>\n\n<p class=\"imgph\">Screenshot in Notion: Screenshot 2025-10-28 at 1.25.19 AM.png<\/p>\n\n<p>\n key steps in the stakeholder analysis:\n<\/p>\n\n<p>\n<br />1. Make a list of all the stakeholders the project impacts. When generating this list, ask yourself: Who is invested in the project? Who is impacted by this project? Who contributes to this project? \n<\/p>\n\n<p>\n<br />2. Determine the level of interest and influence for each stakeholder—this step helps you determine who your key stakeholders are. The higher the level of interest and influence, the more important it will be to prioritize their needs throughout the project. \n<\/p>\n\n<p>\n<br />3. Assess stakeholders’ ability to participate and then find ways to involve them. Various types of projects will yield various types of stakeholders—some will be <b>active stakeholders<\/b> with more opinions and touchpoints and others will be <b>passive stakeholders, <\/b>preferring only high-level updates and not involved in the day-to-day. That said, just because a stakeholder does not participate as often as others does not mean they are not important. There are lots of factors that will play a role in determining a stakeholder’s ability to participate in a project, like physical distance from the project and their existing workload. \n<\/p>\n\n<p>\nA <b>power grid<\/b> shows stakeholder interest <i>in<\/i> the project versus their influence <i>over<\/i> the project. This four-quadrant tool helps project managers evaluate how to manage their stakeholders. It is used to determine the appropriate level of engagement required by the project team needed to gain the stakeholders’ trust and buy-in. The upper half of the grid represents higher influence, and the lower half of the grid represents lower influence. Meanwhile, the left half of the grid represents lower interest, and the right half of the grid represents higher interest. \n<\/p>\n\n<p><b>Quadrant 1: High Influence, High Interest (Upper Right)<\/b><\/p>\n<p>Stakeholders in this quadrant have a significant influence on the project and are highly interested in its outcome. They can greatly impact project decisions and success. Examples might include project sponsors, key executives, or regulatory authorities. Responses for this quadrant include:<\/p>\n<ol>\n<li><b>Engagement and Involvement:<\/b>\n   - Keep these stakeholders well-informed and engaged throughout the project lifecycle.\n   - Involve them in decision-making processes, seeking their input and feedback.\n   - Address their concerns promptly and effectively.<\/li>\n<li><b>Regular Communication:<\/b>\n   - Schedule regular meetings or updates to keep them informed about project progress and any issues.\n   - Tailor communication to their preferences and needs to ensure they remain supportive and engaged.<\/li>\n<\/ol>\n<p><b>Quadrant 2: High Influence, Low Interest (Upper Left)<\/b><\/p>\n<p>Stakeholders in this quadrant have high influence but may not be deeply interested in the day-to-day project details. They might include senior managers who need to be informed but may not be actively engaged. Responses for this quadrant include:<\/p>\n<ol>\n<li><b>Executive Summaries:<\/b>\n   - Provide high-level summaries of project progress and key decisions for their review.\n   - Focus on the impact of the project on organizational goals and objectives.<\/li>\n<li><b>Periodic Updates:<\/b>\n   - Provide periodic briefings or updates to ensure they are informed of major milestones and critical project changes.<\/li>\n<\/ol>\n<p><b>Quadrant 3: Low Influence, High Interest (Bottom Right)<\/b><\/p>\n<p>Stakeholders in this quadrant have a high interest in the project but relatively low influence on its outcome. They are typically looking for updates and information about the project. Responses for this quadrant include:<\/p>\n<ol>\n<li><b>Regular Updates:<\/b>\n   - Communicate project progress, risks, and updates to keep them engaged and informed.\n   - Address their queries and concerns promptly to maintain their interest.<\/li>\n<li><b>Stakeholder Feedback:<\/b>\n   - Seek their feedback on project plans, progress, and outcomes to ensure their perspective is considered.<\/li>\n<\/ol>\n<p><b>Quadrant 4: Low Influence, Low Interest (Bottom Left)<\/b><\/p>\n<p>Stakeholders in this quadrant have low influence on the project and limited interest in its details. They might include lower-level employees or departments not directly impacted by the project. Responses for this quadrant include:<\/p>\n<ol>\n<li><b>General Communication:<\/b>\n   - Share general updates about the project's overall progress without overwhelming them with details.\n   - Address any specific questions they may have, but avoid unnecessary inundation with project-related information.<\/li>\n<li><b>Minimal Engagement:<\/b>\n   - Maintain a basic level of communication and engagement to keep them aware of the project without distracting them from their regular responsibilities.<\/li>\n<\/ol>\n<p>Tips for gaining key stakeholder buy-in include:<\/p>\n<ul>\n<li>Clearly mapping the work of the project to the goals of the stakeholder.<\/li>\n<li>Describing how the project aligns with the goals of the stakeholder's department or team.<\/li>\n<li>Listening to feedback from the stakeholder and finding ways to incorporate their feedback into the project's charter where appropriate.<\/li>\n<\/ul>\n<h3 id=\"n0_31\">RACI Chart<\/h3>\n<p>\nHelps to define roles and responsibilities for individuals or teams to ensure work gets done efficiently. It creates clear roles and gives direction for each team member. \n<\/p>\n\n<p>Can be an extremely effective way to define project roles, give direction to each team member and stakeholder, and ensure work gets done efficiently. Having a RACI chart available throughout the duration of your project as a quick visual can be invaluable.<\/p>\n<p>Creates clear roles and gives direction to each team member and stakeholder<\/p>\n<p>There are four types of participation included in a RACI chart. These are: responsible, accountable, consulted, and informed.<\/p>\n<ul>\n<li>\nResponsible: refers to those doing the work to complete the task. \n<\/li>\n<li>\nAccountable: refers to those making sure the work gets done. Having one person accountable clearly defines ownership.\n<\/li>\n<li>\nConsulted includes those giving feedback, like subject matter experts or decision-makers.\n<\/li>\n<li>\nInformed: includes those just needing to know the final decisions or that a task is complete.\n\n\n<p class=\"imgph\">Screenshot in Notion: Screenshot 2025-10-28 at 2.00.12 AM.png<\/p>\n\n<\/li>\n<\/ul>\n\n<p>Responsible<\/p>\n<p>Individuals who are assigned the “responsible” role for a task are the ones who are actually doing the work to complete the task. Every task needs at least one responsible party. It’s a best practice to try to limit the number of team members assigned to a task’s  responsible role, but in some cases, you may have more than one.<\/p>\n<ul>\n<li>What department does the work fall under?<\/li>\n<li>Who will perform the work?<\/li>\n<\/ul>\n<p>Accountable<\/p>\n<p>The “accountable”<b> <\/b>person is<b> <\/b>responsible for making sure the task gets done. It is important to have only one individual accountable for each task. This helps clarify ownership of the task. The accountable person ultimately has the authority to approve the deliverable of the responsible party.<\/p>\n<ul>\n<li>Who will delegate the task to be completed?<\/li>\n<li>Who will review the work to determine if the task is complete?<\/li>\n<\/ul>\n<p>Consulted<\/p>\n<p>Team members or stakeholders who are placed in the “consulted” role have useful information to help complete the task. There is no maximum or minimum number of people who can be assigned a “consulted” role, but it’s important that each person has a reason for being there.<\/p>\n<ul>\n<li>Who will the task impact?<\/li>\n<li>Who will have input or feedback for the responsible person to help the work be completed?<\/li>\n<li>Who are the subject matter experts (SMEs) for the task?<\/li>\n<\/ul>\n<p>Informed<\/p>\n<p>Individuals who are identified as needing to be “informed” need to know the<b> <\/b>final decisions that were made and<b> <\/b>when a<b> <\/b>task is completed. It is common to have many people assigned to this category and for some team members to be informed on most tasks. Team members or stakeholders here will not be asked for feedback, so it is key to make sure people who are in this group only require status updates and do not need to provide any direct feedback for the completion of the effort.<\/p>\n<ul>\n<li>Who cares about this task’s completion?<\/li>\n<li>Who will be affected by the outcome?<\/li>\n<\/ul>\n<h3 id=\"n0_32\">Why projects fail: Initiation missteps<\/h3>\n<p>there are factors that can lead to failure that are more in your control, such as being unable to complete the project deliverables within the agreed upon time or being unable to fulfill the stakeholder’s vision for the project.<\/p>\n<p>Unclear expectations:<\/p>\n<p>The questions you need to answer at the start of the initiation phase of the project, including:<\/p>\n<ul>\n<li>What is the end goal?<\/li>\n<li>What are the expected deliverables and schedule?<\/li>\n<li>What is the budget?<\/li>\n<li>Who are the stakeholders?<\/li>\n<\/ul>\n<p>Not taking the time at the beginning of a project to ask essential questions, document decisions, and understand the true scope of the project may lead to failure<\/p>\n<p>Unrealistic expectations:<\/p>\n<p>It’s important to understand the requirements of a project before agreeing to any deadlines. As a best practice, don't commit to firm dates when initiating the project to avoid setting unrealistic expectations. You will have more information and will be able to better manage expectations in the planning phase.<\/p>\n<p>Miscommunication:<\/p>\n<p>Clear communication is key. If information is not communicated in a timely manner, does not include pertinent information (risks, decisions made, scope changes, etc.), or is not sent to the correct stakeholders, then you may be setting yourself up for failure. Conducting a stakeholder analysis and then utilizing a RACI chart to understand which stakeholders should be kept informed or consulted is a great start to creating an effective communication strategy.<\/p>\n<p>Lack of resources:<\/p>\n<p>Include your team members, budget, and materials. Unfortunately, without proper planning, your resources can quickly be over-tasked or depleted. Sometimes project managers don’t account for the fact that team members are juggling multiple tasks and may not be able to devote the time necessary to complete all of their assigned tasks correctly and on time. Or, project managers may not realize that a specific skill set is required to complete certain tasks. Ensuring that the right team members are available at the right time is crucial.<\/p>\n<p>Scope creep:<\/p>\n<p>\nThe scope provides an overarching framework of what is and is not included in the project’s work and deliverables. Defining the scope in the initiation phase helps identify the resources needed, the cost associated with those resources, and the schedule required to complete the work. Sometimes projects fail because the scope of the project grows and impacts to the scope are not captured. \n<\/p>\n\n<h3 id=\"n0_33\">Resources<\/h3>\n<p>\n Project resources usually include budget, people, and materials. You'll use tools to manage all those resources. As you think about the goals and the scope of the project, you figure out the different resources you'll need to meet those goals.\n<\/p>\n\n<p>\nPlanning your resources early is a great way to set your team up for success. \n<\/p>\n\n<p>Budget:<\/p>\n<p>is an estimate of the amount of money a project will cost to complete.<\/p>\n<p>\nare there any taxes on products that you need to account for? What about extra fees? All this information will help you create a budget, which you can use to source and compare proposals from vendors, figure out upcoming costs, and track all the money moving in and out of your project. \n<\/p>\n\n<p>\nYou'll often include the budget in the project charter, and the stakeholders review it for approval. \n<\/p>\n\n<p>Common aspects of your project budget will include:<\/p>\n<ul>\n<li>Team: the cost of the people performing the work<\/li>\n<li>Services: any outside vendors helping your project<\/li>\n<li>Materials: any tangible items purchased to complete the project<\/li>\n<\/ul>\n<p>People:<\/p>\n<p>You will need to rely on a strong team of people with a variety of skill sets and specialties to get the job done.<\/p>\n<p>Materials:<\/p>\n<p>These are items you need to help get the project done. For example, project materials might include the lumber needed to complete a construction project<\/p>\n<p>Tools:<\/p>\n<p>\n are aids that make it easier for a project manager or team to manage resources and organize work. They help you do things like track tasks, manage budgets, and collaborate with teammates.\n<\/p>\n\n<h3 id=\"n0_34\">Documentation<\/h3>\n<p>Clear and consistent documentation can ensure transparency and clear communication. Documentation helps set the stage for the project. It communicates the answers to key questions. For example, what problem are you trying to solve? What are the project goals?<br />What are the scope and deliverables, and who are the project's stakeholders? Lastly, what resources does the team need to complete their work?<\/p>\n<h3 id=\"n0_35\">Project Proposal<\/h3>\n<p>\nIs a form of documentation that comes at the very beginning of the project. This document's purpose is to persuade stakeholders that a project should begin. And typically, a senior organizational leader creates the proposal. \n<\/p>\n\n<p>\nmay be a formal document, a presentation, or even a simple email to get others on board with the idea. \n<\/p>\n\n<h3 id=\"n0_36\">Project Charter<\/h3>\n<p>\na formal document that clearly defines the project and outlines the necessary details to reach its goals. A project charter helps you get organized, set up a framework for what needs to be done, and communicate those details to others. \n<\/p>\n\n<p>\nclearly defines the project and outlines the necessary details for the project to reach its goals. A well-documented project charter can be a project manager’s secret weapon to success. \n<\/p>\n\n<p>\nThe charter is the formal
