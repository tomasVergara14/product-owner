  document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected',x.dataset.tab==cur.tab));
  ttsBar();
}

function home(){
  cur={tab:'mod'};
  v.innerHTML=`<div class="intro"><div class="box"><h2>How to use this guide</h2><ul><li>Each module has cards to read and a 5 or 6 question quiz. You pass with 80% or more.</li><li>Modules tagged <b>For the exam</b> are what you need for the certification. Modules tagged <b>For interviews</b> prepare you for the job.</li><li>The <b>Scrum Guide</b> tab has the full official guide, in English and Spanish.</li><li>The <b>My notes</b> tab has your full Google Project Management notes from Notion.</li><li>Press <b>Listen</b> at the bottom of the cards, the Scrum Guide or your notes to hear them read aloud. Turn on <b>Keep going</b> to listen like an audiobook.</li></ul></div><div class="box"><h2>The real exam</h2><ul><li>80 questions in 60 minutes, in English.</li><li>Passing score: 85%.</li><li>200 US dollars per attempt; the certification does not expire.</li></ul></div></div>
  ${PARTS.map((p,pi)=>`<section class="part"><h2>Part ${pi+1}: ${p.t}</h2><p>${p.d}</p><div class="grid">${p.m.map(id=>{const m=MD[id],b=best(id),n=ORD.indexOf(id)+1;const s=b==null?'Not started':(b>=80?'Passed, best score '+b+'%':'Best score '+b+'%, review it');return `<button class="mod" data-act="open" data-id="${id}"><span class="n"><span>Module ${n}, ${m.cards.length} cards</span><span class="tag ${m.tag}">${TAG[m.tag]}</span></span><h3>${m.t}</h3><p>${m.d}</p><div class="mbar"><i style="width:${b||0}%"></i></div><span class="mstate ${b>=80?'done':''}">${s}</span></button>`}).join('')}</div></section>`).join('')}`;
  header();
}

function study(id,c){
  cur={tab:'mod',mode:'study',id,c};
  const m=MD[id],k=m.cards[c],last=c==m.cards.length-1;
  v.innerHTML=`<div class="deck"><div class="crumb"><h2>${m.t}</h2><div class="seg">${m.g?`<button class="btn sm" data-act="readg" data-id="${id}">Read in the guide</button>`:''}<button class="btn sm" data-act="home">Modules</button></div></div>
  <div class="stack"><article class="card"><span class="k"><span>Card ${c+1} of ${m.cards.length}</span><span class="tag ${m.tag}">${TAG[m.tag]}</span></span><h3>${k.h}</h3><div class="body">${k.b}</div><div class="key"><b>${KEY[m.tag]}</b>${k.k}</div></article></div>
  <div class="dots">${m.cards.map((_,j)=>`<span class="${j<=c?'on':''}"></span>`).join('')}</div>
  <div class="nav"><button class="btn" data-act="prev" ${c==0?'disabled':''}>Previous</button>${last?`<button class="btn pri" data-act="quiz">Take the quiz</button>`:`<button class="btn pri" data-act="next">Next</button>`}</div></div>`;
  header();
}

function quiz(list,ctx){
  cur={tab:ctx.exam?'exam':'mod',mode:'quiz',list,ctx,n:0,right:0,miss:[],ans:false};
  ask();
}
function ask(){
  const s=cur,q=s.list[s.n];
  v.innerHTML=`<div class="deck"><div class="crumb"><h2>${s.ctx.title}</h2><button class="btn sm" data-act="${s.ctx.exam?'examhome':'home'}">Exit</button></div>
  <div class="stack"><article class="card"><span class="k"><span>Question ${s.n+1} of ${s.list.length}</span></span><p class="q">${q.q}</p><div class="opts">${q.o.map((o,j)=>`<button class="opt" data-act="pick" data-j="${j}">${o.t}</button>`).join('')}</div><div id="why"></div></article></div>
  <div class="dots">${s.list.map((_,j)=>`<span class="${j<s.n?'on':''}"></span>`).join('')}</div>
  <div class="nav"><span></span><button class="btn pri" data-act="nextq" id="nq" disabled>${s.n==s.list.length-1?'See result':'Next'}</button></div></div>`;
  header();
}
function pick(j){
  const s=cur;if(s.ans)return;s.ans=true;
  const q=s.list[s.n],ok=q.o[j].ok;
  if(ok)s.right++;else s.miss.push(q);
  v.querySelectorAll('.opt').forEach((b,x)=>{b.disabled=true;if(q.o[x].ok)b.classList.add('ok');else if(x==j)b.classList.add('bad')});
  v.querySelector('#why').innerHTML=`<div class="why"><b>${ok?'Correct.':'Not quite.'}</b>${q.w}</div>`;
  const nq=v.querySelector('#nq');nq.disabled=false;nq.focus();
}
function result(){
  const s=cur,pct=Math.round(s.right/s.list.length*100),goal=s.ctx.exam?85:80,ok=pct>=goal;
  if(s.ctx.exam){st.ex=Math.max(st.ex||0,pct)}else{st['m_'+s.ctx.id]=Math.max(best(s.ctx.id)||0,pct)}
  save();
  const right=s.miss.map(q=>q.o.find(o=>o.ok).t);
  v.innerHTML=`<div class="deck"><div class="crumb"><h2>${s.ctx.title}</h2></div>
  <div class="card"><span class="k"><span>Result</span></span><div class="score ${ok?'pass':'fail'}">${pct}%</div><p>${s.right} of ${s.list.length} correct. ${ok?(s.ctx.exam?'You are above the 85% the real exam requires.':'Module passed.'):(s.ctx.exam?'The exam requires 85%. Review the modules where you missed questions.':'You need 80% to pass. Reread the cards and retake the quiz.')}</p>
  ${s.miss.length?`<h3 style="font-size:22px;margin-top:8px">To review</h3>`+s.miss.map((q,x)=>`<div class="miss"><p><b>${q.q}</b></p><p>Correct answer: ${right[x]}</p><p class="s">${q.w}</p></div>`).join(''):''}
  </div>
  <div class="nav" style="margin-top:16px">${s.ctx.exam?`<button class="btn" data-act="examhome">Back</button><button class="btn pri" data-act="exam">Another mock exam</button>`:`<button class="btn" data-act="open" data-id="${s.ctx.id}">Reread cards</button><button class="btn" data-act="quiz">Retake quiz</button>${nextBtn(s.ctx.id)}`}</div></div>`;
  if(!s.ctx.exam)cur={tab:'mod',mode:'res',id:s.ctx.id};
  header();
}
function nextBtn(id){
  const i=ORD.indexOf(id),n=ORD[i+1];
  return n?`<button class="btn pri" data-act="open" data-id="${n}">Next module</button>`:`<button class="btn pri" data-act="home">Back to modules</button>`;
}

function guide(anchor){
  cur={tab:'guia'};
  const lang=st.glang||'en',G=GUIDE[lang];
  let html='',list=null;
  const close=()=>{if(list){html+=`</${list}>`;list=null}};
  G.forEach((b,i)=>{
    if(b.t=='li'||b.t=='ol'){const tg=b.t=='li'?'ul':'ol';if(list!=tg){close();html+=`<${tg}>`;list=tg}html+=`<li>${b.x}</li>`;return}
    close();
    html+=b.t=='p'?`<p>${b.x}</p>`:`<${b.t} id="g${i}">${b.x}</${b.t}>`;
  });
  close();
  const toc=G.map((b,i)=>b.t=='h2'?`<button data-act="gto" data-i="${i}">${b.x}</button>`:'').join('');
  v.innerHTML=`<div class="gbar"><h2 style="font-size:clamp(26px,3.4vw,34px)">${lang=='es'?'La Guía de Scrum (Spanish)':'The Scrum Guide'}</h2><div class="seg" role="group" aria-label="Language"><button class="btn sm ${lang=='en'?'on':''}" data-act="lang" data-l="en">English</button><button class="btn sm ${lang=='es'?'on':''}" data-act="lang" data-l="es">Español</button></div></div>
  <p class="attr">November 2020 version, by Ken Schwaber and Jeff Sutherland, offered under the Creative Commons Attribution Share-Alike 4.0 license. ${lang=='es'?'Spanish translation by Marcelo López, Marcelo García, Jorge Abad, Fabian Schwartz and Lucho Salazar.':'Original English text.'} Source: <a href="https://scrumguides.org" target="_blank" rel="noopener">scrumguides.org</a>.</p>
  <nav class="toc" aria-label="Sections">${toc}</nav>
  <article class="book">${html}</article>`;
  header();
  if(anchor){
    const t=anchor[lang];
    const i=t?G.findIndex(b=>b.t[0]=='h'&&b.x==t):-1;
    if(i>=0){const el=document.getElementById('g'+i);el.scrollIntoView();el.classList.add('flash')}
    else top();
  }else top();
}

function notes(i){
  cur={tab:'notes',ni:i};
  const s=NOTES[i],groups=[...new Set(NOTES.map(n=>n.g))];
  v.innerHTML=`<div class="gbar"><h2 style="font-size:clamp(26px,3.4vw,34px)">My notes</h2><span class="attr" style="margin:0">Google Project Management course, from your Notion page</span></div>
  <div class="nbar">${groups.map(g=>`<div class="ngroup"><span>${g}</span>${NOTES.map((n,k)=>n.g==g?`<button class="${k==i?'on':''}" data-act="note" data-i="${k}">${n.t}</button>`:'').join('')}</div>`).join('')}</div>
  <article class="book"><h2>${s.t}</h2>
  ${s.w?`<p class="warn"><b>Heads up:</b> these notes follow the 2017 Scrum Guide. For the exam, check the module "Traps: your notes vs. the 2020 guide" and the Scrum Guide tab.</p>`:''}
  ${s.s.length>3?`<details class="sub"><summary>In this section (${s.s.length} topics)</summary><ol>${s.s.map(([id,t])=>`<li><a href="#${id}" data-act="nsub" data-h="${id}">${t}</a></li>`).join('')}</ol></details>`:''}
  ${s.h}</article>
  <div class="nav" style="margin-top:16px;max-width:820px;margin-inline:auto"><button class="btn" data-act="note" data-i="${i-1}" ${i==0?'disabled':''}>Previous section</button><button class="btn pri" data-act="note" data-i="${i+1}" ${i==NOTES.length-1?'disabled':''}>Next section</button></div>`;
  header();top();
}

function plan(){
  cur={tab:'plan'};
  v.innerHTML=`<div class="box" style="margin-bottom:8px"><h2>4-week plan</h2><p>Three weeks to pass the certification and a fourth to prepare for interviews. One hour a day is enough. Rule for buying the exam: score 95% or more on the Product Owner Open three times in a row.</p></div>
  <div class="week"><div class="w">1</div><div><h3>Build the foundation</h3><ul><li>Read the Scrum Guide end to end in the "Scrum Guide" tab (about 40 minutes). If something is unclear, check the Spanish version with the language switch.</li><li>Part 1: Agile and the Agile Manifesto, and Lean, Kanban and other frameworks. They are quick and give context.</li><li>Part 2: Scrum fundamentals, The Scrum Team and The Product Owner.</li><li>At the end of the week, take the Product Owner Open once, just to see where you stand.</li></ul></div></div>
  <div class="week"><div class="w">2</div><div><h3>Finish the exam material</h3><ul><li>Part 2: The Scrum events, Artifacts and commitments, and Traps: your notes vs. the 2020 guide.</li><li>Part 3: Value and evidence, which is also on the exam.</li><li>Read the Scrum Guide a second time, paying attention to exact wording.</li><li>Product Owner Open every other day, plus Mikhail Lapshin's quizzes. Write down every mistake and find the answer in the guide.</li></ul></div></div>
  <div class="week"><div class="w">3</div><div><h3>Simulate and take the exam</h3><ul><li>The mock exam in this guide until you pass 85% comfortably.</li><li>Product Owner Open every day until you score 95% or more three times in a row.</li><li>Buy the attempt and take it at a quiet time: you have 45 seconds per question. Flag the doubtful ones and come back at the end.</li></ul></div></div>
  <div class="week"><div class="w">4</div><div><h3>Prepare for interviews</h3><ul><li>Part 3: The backlog in practice, Agile estimation, Vision, strategy and roadmap, and Product metrics.</li><li>Part 4: Stakeholders and influence, Risks and dependencies, and Teams, coaching and scaling.</li><li>For each module, write down a real example from Módulo Sanitario or the club. Those examples are your interview answers.</li></ul></div></div>
  <div class="box" style="margin-top:16px"><h2>What stays outside the app</h2><p>All the study content is here, including your full Notion notes in the "My notes" tab. The only things you do elsewhere are practicing with the official simulators and buying the exam:</p><ul><li><a href="https://www.scrum.org/open-assessments/product-owner-open" target="_blank" rel="noopener">Product Owner Open</a>, the free official practice test.</li><li><a href="https://mlapshin.com" target="_blank" rel="noopener">Mikhail Lapshin's quizzes</a>, free.</li><li><a href="https://www.scrum.org/assessments/professional-scrum-product-owner-i-certification" target="_blank" rel="noopener">Certification page</a>, to buy the attempt.</li><li><a href="https://www.scrum.org/resources/evidence-based-management-guide" target="_blank" rel="noopener">Evidence-Based Management Guide</a>, optional: the key ideas are summarized in the Value and evidence module.</li></ul></div>
  <p class="note">The cards are an original summary based on the 2020 Scrum Guide, the Evidence-Based Management Guide and your Google Project Management course notes. If anything differs, the 2020 Scrum Guide wins.</p>`;
  header();
}

function examHome(){
  cur={tab:'exam'};
  const n=EXAM.reduce((a,id)=>a+MD[id].qz.length,0);
  v.innerHTML=`<div class="deck"><div class="card"><span class="k"><span>Mock exam</span></span><h3>20 mixed questions from the exam modules</h3><p>Questions are drawn at random from a bank of ${n}, across the ${EXAM.length} modules tagged "For the exam". As in the real exam, the target is 85% or more.</p>${st.ex!=null?`<p>Your best score: <b>${st.ex}%</b></p>`:''}<div class="key"><b>Tip</b>Take it once you have passed the ${EXAM.length} exam modules. Then move on to the Product Owner Open, which is closer to the real exam.</div></div>
  <div class="nav" style="margin-top:16px"><span></span><button class="btn pri" data-act="exam">Start mock exam</button></div></div>`;
  header();
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act],[data-tab]');if(!b)return;
  ttsStop();TTS.q=[];
  if(b.dataset.tab){const t=b.dataset.tab;t=='mod'?home():t=='guia'?guide():t=='notes'?notes(0):t=='plan'?plan():examHome();top();return}
  const a=b.dataset.act;
  if(a=='home'){home();top()}
  else if(a=='examhome'){examHome();top()}
  else if(a=='open'){study(b.dataset.id,0);top()}
  else if(a=='next'){study(cur.id,cur.c+1);top()}
  else if(a=='prev'){study(cur.id,cur.c-1);top()}
  else if(a=='quiz'){const id=cur.id;quiz(MD[id].qz.map(prep),{id,title:'Quiz: '+MD[id].t});top()}
  else if(a=='pick')pick(+b.dataset.j);
  else if(a=='nextq'){cur.n++;cur.ans=false;cur.n<cur.list.length?ask():result();top()}
  else if(a=='exam'){const all=EXAM.flatMap(id=>MD[id].qz);quiz(shuf(all).slice(0,20).map(prep),{exam:true,title:'Mock exam'});top()}
  else if(a=='readg')guide(MD[b.dataset.id].g);
  else if(a=='lang'){st.glang=b.dataset.l;save();guide()}
  else if(a=='note'){notes(+b.dataset.i)}
  else if(a=='nsub'){e.preventDefault();const el=document.getElementById(b.dataset.h);if(el)el.scrollIntoView({behavior:'smooth'})}
  else if(a=='gto'){const el=document.getElementById('g'+b.dataset.i);if(el){el.scrollIntoView({behavior:'smooth'});}}
});
document.addEventListener('keydown',e=>{
  if(cur.mode!='study'||e.target.closest('#tts'))return;
  if(e.key=='ArrowRight'||e.key=='ArrowLeft'){ttsStop();TTS.q=[]}
  if(e.key=='ArrowRight'&&cur.c<MD[cur.id].cards.length-1)study(cur.id,cur.c+1);
  if(e.key=='ArrowLeft'&&cur.c>0)study(cur.id,cur.c-1);
});
home();
}
</script>
</body>
</html>
