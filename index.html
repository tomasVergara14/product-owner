way that the project’s goals, values, benefits, and details are captured. You can think of the charter as the compass for your project since<b> <\/b>you will use it throughout the life cycle of the project. \n<\/p>\n\n<p>A project proposal is created earlier in the project life cycle than the project charter.<br />The proposal kicks off the initiation phase by influencing and persuading the company to move forward with the project. The project charter serves a similar purpose and often comes at the end of the initiation phase.<\/p>\n<p>Its goal is to more clearly define the key details of the project. Another difference between these two documents is that a charter will often serve as a point of reference throughout the life of a project. The proposal is only used at the earlier stages.<\/p>\n<p>\nThe project charter makes clear that the benefits of the project outweigh the costs. \n<\/p>\n\n<p>\nWhat value will this project create? And how much money could this project save my organization? How much time will people have to spend on this project? \n<\/p>\n\n<p>\ncreating a project charter is a best practice for ensuring that everyone agrees on how to move forward before entering the planning phase. is a living document. This means that it can evolve as the project progresses. \n<\/p>\n\n<p>Project charters will vary but usually include some combination of the following key information:<\/p>\n<ul>\n<li>introduction/project summary<\/li>\n<li>goals/objectives<\/li>\n<li>business case/benefits and costs<\/li>\n<li>project team<\/li>\n<li>scope<\/li>\n<li>success criteria<\/li>\n<li>major requirements or key deliverables<\/li>\n<li>budget<\/li>\n<li>schedule/timeline or milestones<\/li>\n<li>constraints and assumptions<\/li>\n<li>risks<\/li>\n<li>OKRs<\/li>\n<li>approvals<\/li>\n<\/ul>\n<p>\n\n<p class=\"imgph\">Screenshot in Notion: Screenshot 2025-10-30 at 2.24.53 AM.png<\/p>\n\n<\/p>\n\n<p>\n Project charters are key for securing approval from stakeholders and moving forward. \n<\/p>\n\n<p>Template:<\/p>\n<ul>\n<li>\nAt the top of your charter, you'll want to add in the name of your project\n<\/li>\n<li>\nAdd in a brief summary\n<\/li>\n<li>\nProject goals. Remember that goals should be smart.\n<\/li>\n<li>\nA deliverable is a tangible outcome from a project.\n<\/li>\n<li>\nAdd in the business case, which captures the reasoning for initiating this project. The business case is supported by the cost benefit analysis. The key takeaway here is that benefits should always outweigh the cost. \n<\/li>\n<li>\nproject scope as well as what's considered out of scope for this project. scope is an agreed upon understanding of what is included or excluded from a project.\n<\/li>\n<\/ul>\n\n<h3 id=\"n0_37\">Tools for effective project management<\/h3>\n<p>tools are some of the most helpful resources you have at your disposal. They're essential for tracking progress<\/p>\n<p>\ntools are aids that make it easier for a project manager or team to manage resources and organize work. They're useful because they can help you track detailed information about all kinds of tasks, and they make it easy to communicate with lots of different people. \n<\/p>\n\n<p>information sharing goes both ways. That means team members can also easily update you on their progress without the need for extra meetings or phone calls.<\/p>\n<p>When you choose the right tool for a project, you make it easy for teammates to let you know if a task is on schedule or if it's delayed, which lets you quickly see how any changes might affect the rest of the project.<\/p>\n<p>\n Project management tools increase visibility and transparency for everyone, including stakeholders.\n<\/p>\n\n<p>You can use a variety of tools to accomplish many different things, like tracking progress on tasks, deliverables, and milestones.<\/p>\n<p>\n Tools can also help you:\n<\/p>\n\n<ul>\n<li>\n manage a budget\n<\/li>\n<li>\n build helpful charts and diagrams \n<\/li>\n<li>\nmanage contracts and licenses \n<\/li>\n<li>\nkeep stakeholders informed. \n<\/li>\n<\/ul>\n\n<p>important considerations and keys to successfully introducing new tools:<\/p>\n<p><br /><b>• Discuss the tool early and often, if possible. <\/b>The team should not feel blindsided by a new change. Make sure they know the change is coming as early as possible. This will help them prepare for an introduction or migration to the new tool.<\/p>\n<p><br />• Ask for feedback from key stakeholders<b>. <\/b>You could get great feedback on features that you may have overlooked by asking for their expertise. You can solicit this feedback by requesting their input about functionality or have them list features in order of priority. The key is to create an opportunity for stakeholders to provide their feedback and allow you to incorporate their feedback into next steps.<\/p>\n<p><br />• Involve the key stakeholders in demonstrations as you get closer to making the final decision on the project tracking tool<b>. <\/b>You will be able to leverage key stakeholders' acceptance by letting them test the product or sign up for a trial run. It is also important to make sure that the tool is actually going to meet the mark and provide a meaningful change for the project. You may want to pull in key users from your team to test and familiarize themselves with the tool prior to rolling it out. This will allow the team to get on board with your plans or discuss their concerns beforehand. This will also highlight in-house experts for future training, assistance, and implementation.<\/p>\n<p><br />•<b> Ensure the tool is fully functional <\/b><b><u>before<\/u><\/b><b> the team is introduced to it.<\/b> Whenever possible, hold off from introducing the tool if it still has any issues. Make sure the tool is accessible for all users. Keep in mind, your team members may resist a tool that doesn’t live up to how it is supposed to function. This will impact implementation and acceptance fairly significantly, so put your best tool forward!<\/p>\n<p><br />• Set up training for the tool as needed before you ask the team to actually use it<b>. <\/b>Everyone has different levels of comfort with different tools. It is your job as the project manager to ensure that each team members’ needs are addressed. Setting up training also helps create positive first impressions, which will lead to higher productivity and quicker, more successful implementation and acceptance.<\/p>\n<h3 id=\"n0_38\">Types of project management tools<\/h3>\n<p>One common tool type is <b><u>scheduling and work management software<\/u><\/b>.<\/p>\n<p>Certain tools may work better for your project depending on the project methodology you're running or the number of tasks and people involved.<\/p>\n<p>to use scheduling and work management software It can also help you visualize your team's progress. if you're using work management software to assign and track tasks, you're more likely to notice if your team completes 50 tasks one week and just three tasks the following week.<\/p>\n<p>\n tools for <b><u>productivity<\/u><\/b>. This includes word processing tools, like Microsoft Word or Google Docs. You can use these to create shared documents with the team,. You can also use these tools to build documents like meeting agendas and status updates.\n<\/p>\n\n<p>Spreadsheets are another useful productivity tool. They're versatile, and you can use them to make documents, like RACI charts and project plans, as well as other helpful charts<\/p>\n<p>\n<b><u> collaboration<\/u><\/b> tools email and chat. Tools like this can help you quickly and efficiently check in with each other on questions, comments, and other topics related to the project. Productivity tools like documents and spreadsheets, and collaboration tools like email and chat, are all pretty simple, which means they're great for smaller projects with fewer tasks and teammates to keep track of. \n<\/p>\n\n<p>\ntypes of tools available to you: \n<\/p>\n\n<ul>\n<li>\nincluding scheduling and work management software \n<\/li>\n<li>\nproductivity tools \n<\/li>\n<li>\ncollaboration tools.\n<\/li>\n<\/ul>\n\n<h3 id=\"n0_39\">Common project management tools<\/h3>\n<p>There are many different types of work management software that automatically make project planning and tracking a lot easier and that are much more efficient than manual project tracking.<\/p>\n<p>\n Asana is a work management platform that helps teams plan and coordinate their work from daily tasks to strategic initiatives. Asana provides a living system and a source of truth where everyone's work lives. With Asana, everyone can see, discuss, and manage team priorities, giving teams clarity on who is doing what by when. \n<\/p>\n\n<p>t's great for building project plans, assigning tasks, automating workflows, tracking progress, and communicating with stakeholders.<\/p>\n<p>\nSpreadsheets are extremely versatile, and you can use them for a wide range of tasks, from creating timelines and billing charts to managing budgets and tracking tasks. You can add and view project information in a variety of formats, depending on what you need in the moment. \n<\/p>\n\n<p>\nyou can easily transform, visualize, and manipulate information. \n<\/p>\n\n<p>\nBeing able to recommend the right tool for the job can be a great way to add value to your team at the beginning of a project. Keep in mind, however, that software options are constantly changing. From the addition of new features to the launch of new tools, there's no way for you to know every software available, and no company would expect that of you. \n<\/p>\n\n<p>Google Sheets makes it easy to collaborate and share information. This is useful for remote workgroups or working with teams that have different schedules.<\/p>\n<p>You can select from the following permissions:<\/p>\n<ul>\n<li>editing: which allows others to make direct edits and changes to the file;<\/li>\n<li>commenting: which allows others to add comments and make suggestions; or<\/li>\n<li>view only: which allows others to view the file but not edit, comment, or suggest. This is a good choice if you don’t want any changes to be made to the file.<\/li>\n<\/ul>\n<p>Creating the same types of spreadsheets over and over can be time-consuming. You can save time by using templates such as those available from the <a href=\"https://docs.google.com/spreadsheets/u/0/?ftv=1&amp;folder=0AKrj08N1UHZqUk9PVA&amp;tgif=c\"><u>Google Sheets template gallery<\/u><\/a><\/p>\n<p>\n Choose from a variety of pre-made spreadsheets for budgets, schedules, and trackers\n<\/p>\n\n<p>The more common templates are described and linked below:<\/p>\n<p><a href=\"https://docs.google.com/spreadsheets/d/1Us-j-BAG3kiIJENBt3SqRXkJQL_TZh-yejJyZzq9L60/template/preview#gid=1709744959\"><b><u>Project Timeline<\/u><\/b><\/a><\/p>\n<p>\nA project timeline template is useful if you want to track an entire project from conception to close. This example includes a visual timeline that lays out the life cycle of a project and the major activities that need to happen during each phase. \n<\/p>\n\n<p><a href=\"https://docs.google.com/spreadsheets/d/12AK5slxygSxj8nmjS39SCnEFkCy8WZDbgN0vSQh2xwg/template/preview?resourcekey=0-__sqaWcGZavYWgXz-WD4jQ#gid=1161341563\"><b><u>Project Tracking<\/u><\/b><\/a><\/p>\n<p>A project tracking template is useful for tracking your project’s budget, deliverables, and other data. This example includes columns for tracking costs and time, as well as a column with dropdown lists for tracking tasks’ priority levels. Other features include formulas for calculating hours, costs, and percentage of deliverables completed, which allow you to track your spending and progress on a project.<\/p>\n<p><a href=\"https://docs.google.com/spreadsheets/d/1Yc1KA_7DMwBqyt2Zcx68HAV3oEp1FnUt-undm0XHgqM/template/preview?resourcekey=0-y-3VgQEbmAVaiEGfeyeJ-g#gid=1115838130\"><b><u>Gantt Chart<\/u><\/b><\/a><\/p>\n<p>A Gantt chart combines many of the aspects of other types of project management spreadsheets into one. It organizes tasks by day and is useful for showing the relationships between the many moving parts of a project. It’s also helpful for managing a project with multiple collaborators. Gantt charts often include conditional formatting that makes cells change color based on how far along the project is so you can immediately determine how much progress you have made on a particular task.<\/p>\n<p>\n[<b><u>Event Marketing Timeline<\/u><\/b>](https://docs.google.com/spreadsheets/d/10GindXMsW6z0pFvd5Ymjz_PS0dXJ5eCkl3KDKEPO9qY/template/preview#gid=541890420): \n<\/p>\n\n<p>A timeline template is useful for creating a schedule, tracking events, and visualizing the tasks and milestones involved in a project. You might use this template to manage a project that involves a lot of marketing or public-facing tasks. You can track social media posts, market research, and coordinate content across multiple platforms.<\/p>\n<h3 id=\"n0_40\">The benefits of project planning<\/h3>\n<p>First, the project manager gets assigned<\/p>\n<p>Then, the goals of the project have to be approved, as well as the scope of the project and its deliverables<\/p>\n<p>\nA number of people will need to be assigned to the project, and you'll have a good sense of their individual roles and responsibilities. \n<\/p>\n\n<p>stakeholder sign off on your project charter.<\/p>\n<p>Planning is a significant part of ensuring a project's success<\/p>\n<p>\nplanning your project, you and other members of the team will determine the processes and workflows needed to meet your goals and put together ideas about how to make the project a success. \n<\/p>\n\n<p>\nEvery project is different, so new and different approaches may be just the thing you need. \n<\/p>\n\n<p> <\/p>\n\n<ul>\n<li>\nplanning helps you map out the full project. \n<\/li>\n<li>\nIt helps you understand the work needed to achieve your goals. \n<\/li>\n<li>\nPlanning also helps coordinate efforts and timelines with other teams, contractors, and vendors. \n<\/li>\n<li>\nIt gives you time to identify and prepare for risks that could impact your project. \n<\/li>\n<li>\nthe planning phase can help you get \"buy-in\" from key members of the project team.\n<\/li>\n<\/ul>\n\n<h3 id=\"n0_41\">Launching the planning phase<\/h3>\n<p>\nthe planning phase is the second phase of a project's life cycle, it's likely that the plan will change as the project evolves. \n<\/p>\n\n<p>\nThe planning phase may differ from project to project, but generally three big things are worked out during this stage: the schedule, the budget, and the risk management plan. \n<\/p>\n\n<p>\nThe schedule is basically a timeline of the project. It includes the start date, the end date, and the dates for things that will happen in between. You will use time estimation techniques to determine these dates. \n<\/p>\n\n<p>The budget will account for the total cost to complete the project. The total cost needs to be broken down to determine how much has to be spent on different elements of the project.<\/p>\n<p>\nRisk management, which means searching for possible problems and planning ahead to mitigate these risks. Let's face it, risk is inevitable in every project. What's not inevitable is how the risk impacts your project. \n<\/p>\n\n<p>\nGood project planning means searching for places where trouble might occur. \n<\/p>\n\n<p>\nWhere might the schedule get off track?<br />Where might the budget exceed your estimates? \n<\/p>\n\n<p>You'll work with your team to consider answers to these questions and prepare a risk management plan based on whatever you discover.<\/p>\n<h3 id=\"n0_42\">Facilitating a project kick-off meeting<\/h3>\n<p>\nA project kickoff meeting is the first meeting in which a project team comes together to ground everyone in a shared vision, gain a shared understanding of the project's goals and scope, and to understand each person's individual roles within the team. \n<\/p>\n\n<p>\nSo who's invited to the kickoff meeting? \n<\/p>\n\n<p>\nThe team members identified in a RACI chart, created during the initiation phase. As a reminder, a RACI chart helps to define roles and responsibilities for individuals or teams to ensure that the work gets done efficiently. \n<\/p>\n\n<p>\nDuring the kickoff meeting, team members will learn more about how they'll contribute to the project and how they'll gain a deeper understanding of how the team will work together to reach the project's goals. \n<\/p>\n\n<p>Invite your stakeholders and your sponsor to the meeting, so that they have a chance to understand the high-level plan for the project, can share their perspective, and you can ensure that everyone is on the same page.<\/p>\n<p>why do I need a kickoff meeting?<\/p>\n<p>\nwhen you're kicking off a project, especially larger projects with multiple people involved, it's important to get together to establish a shared vision, align on the scope, and build team rapport. This is also an opportunity for teammates to ask questions and offer insights, and it's a great time for you to set expectations with the team about how each person will individually contribute to the project. \n<\/p>\n\n<p>\nNow, let's discuss how to plan and run a kickoff meeting. \n<\/p>\n\n<ul>\n<li>\nMost meetings start with brief introductions. You can allocate about 10 minutes for everyone in the group to introduce themselves and their roles, and if time allows, share a fun fact to help build team rapport.\n<\/li>\n<li>\nSpend about five minutes giving an overview of the background of the project. This covers details like how the project came to be and why the project matters. You'll also use this time to set a shared vision. \n<\/li>\n<li>\nSpend about five minutes sharing the goals and the scope, which refers to the boundaries around a project. That includes making it clear what work is considered in-scope, and what work is considered out-of-scope. This is also a good place to share the target launch date and highlight any important milestones the team needs to be aware of. \n<\/li>\n<li>\nDiscuss everyone's roles. It's a good idea to spend about five minutes making sure that everyone is clear on what work they'll be responsible for throughout the duration of the project.\n<\/li>\n<li>\nAddress collaboration, which is how the team will work together on the project. This is a great time to go over tools that will serve as a communal source of information for the team, like a project plan created in a spreadsheet or work management software tool like Asana. \n<\/li>\n<li>\nYou should spend about 10 minutes on how the team will communicate with one another, like through daily email updates, a team chat room, and weekly team check-in meetings. \n<\/li>\n<li>\nSpend about 10 minutes setting expectations with your teammates for what's coming up. You'll also use this time to make clear to each teammate what actions they will need to take next.\n<\/li>\n<li>\n15 minutes for questions from the group. This is your team's chance to gain clarity on any of the topics you've discussed so far. It's also your chance to hear from the team and ensure that the project is benefiting from diversity of thoughts, experiences, and ideas. I might invite teammates to input their questions or feedback in a shared document. This practice can help create space for collaboration.<br />\n<\/li>\n<\/ul>\n\n<p>I also like to poll my teammates for confidence on the topics discussed that day. I ask what their confidence level is on a scale of one to five: one being \"I'm not confident at all,\" and five being \"I'm extremely confident.\" If they're not confident, I ask them what I can do to help change that. This practice can give the team a stronger sense of support, because they know I'm there to help them through roadblocks.<\/p>\n<p>If you try this practice in your meetings, be sure to deliver on any promises you make there. Your reputation as a project manager to get things done and remove roadblocks is critical to building and maintaining relationships.<\/p>\n<p>\nThe kickoff meeting will cover introductions, project background, goals and scope, roles, collaboration, and what comes next, and the meeting will leave time for questions from the group at the end. \n<\/p>\n\n<p>\nOnce you've finalized the meeting agenda, document this information into a meeting agenda template, and send it to attendees a day or two ahead of the meeting. \n<\/p>\n\n<p>As the project manager, you'll be leading the majority of this meeting, and when you're presenting, it's difficult to take notes and present at the same time. So, at the start of the meeting, ask a teammate to take notes on key points you discussed throughout the session and to record each teammate's action items.<\/p>\n<p>\nAfter the meeting, don't forget to send a follow-up email to the group, summarizing key points and outcomes from the meeting, as well as any action items to the attendees. In your follow-up email, be sure to also invite attendees to reach out if they have any additional questions. \n<\/p>\n\n<p>\n A kick-off meeting is the first meeting among the project team, stakeholders, and the project sponsor at the start of a new project or new project phase\n<\/p>\n\n<p>The purpose of a kick-off meeting is to ground everyone in a shared vision, ensure they understand the project’s goals and scope, and make sure that they are all on the same page about their roles and responsibilities on the project.<\/p>\n<p>The kick-off meeting is critical to a project’s overall success. It gets the team together to align on goals and visions for the project and sets the project up for success.<\/p>\n<h3 id=\"n0_43\">Kick off best practices<\/h3>\n<ul>\n<li>\n<b>Set the right time: <\/b>Choose a meeting time that works for everyone. Be mindful of time zone differences.\n<\/li>\n<li>\n<b>Set the right length:<\/b> Choose an appropriate meeting length—no more than one hour. You don’t want to waste people’s time, but you also don’t want to run out of time. Kick-off meetings work best when you first share key information and then spend any additional time on questions and team building.\n<\/li>\n<li>\n<b>Invite the right people: <\/b>Be strategic about including the appropriate people. The goal is to invite attendees who play a role in the development and execution of the project, such as all team members, stakeholders, and the project sponsor. You don’t want to leave anyone out, but you also don’t want to invite people who shouldn’t be there.\n<\/li>\n<li>\n<b>Designate a notetaker. <\/b>The discussion that takes place during the meeting is important. It is critical that you document any feedback, changes, or questions asked by attendees. If you are leading the meeting, designate someone else to take notes before the meeting starts. You can also use tools like Chorus Notetaker, Google Keep, Google Docs, or Microsoft OneNote.  \n<\/li>\n<li>\n<b>Set the agenda. <\/b>To recap what we discussed in the video, a kick-off meeting agenda should generally include: introductions, the project background and purpose, project goals and scope, roles and responsibilities, the collaboration process and project tools, what comes next (expectations and action items), and time for questions and discussion.\n<\/li>\n<li>\n<b>Share the agenda<\/b>. Prior to the meeting, share the agenda with attendees via email and identify speakers for each topic. By sending the agenda in advance, everyone will have an idea of what to expect, time to prepare for anything they may need to present or discuss, and time to generate questions or ideas.\n<\/li>\n<li>\n<b>Stick to the agenda<\/b>. During meetings, discussions can sometimes go off topic or take longer than expected. As a project manager, it is your job to keep the meeting on track by redirecting discussions to the items on the agenda. \n<\/li>\n<li>\n<b>Follow up after the meeting<\/b>. After the meeting, make sure to send out a meeting summary featuring the meeting notes and any action items. \n<\/li>\n<\/ul>\n\n<h3 id=\"n0_44\">Understanding tasks and milestones<\/h3>\n<p>\n A project milestone is an important point within the project schedule that indicates progress and usually signifies the completion of a deliverable or phase of the project. These are significant checkpoints in your project, and keeping track of them helps ensure that your project is on schedule to meet its goals.\n<\/p>\n\n<p>\nA project task is an activity that needs to be accomplished within a set period of time. The work of a project is broken down into many different tasks. \n<\/p>\n\n<p>\nIn order to reach a milestone, you and your team must complete multiple tasks. \n<\/p>\n\n<p>\nmilestones are important points within the project schedule, and project tasks are activities that need to be accomplished within a set period of time to help reach those milestones. \n<\/p>\n\n<h3 id=\"n0_45\">The importance of setting milestones<\/h3>\n<p>\nsetting milestones gives you a clear understanding of the amount of work your project will require. The act of setting milestones forces you to break your project down into more manageable chunks. \n<\/p>\n\n<p>The further you go, the better you'll be able to see how much work will be needed to meet the project goals.<\/p>\n<p>If you break that deliverable down into milestones and those milestones into tasks, you will have a better sense of the true amount of work that needs to be done. This will help you better manage the project workload.<\/p>\n<p>They can help keep your project on track.<\/p>\n<p>\nWhen you set a milestone, you assign clear deadlines for when certain project deliverables need to be completed. \n<\/p>\n\n<p>they help you uncover areas where you might need to adjust scope, timelines, or resources to meet your goals.<\/p>\n<p>Reaching milestones can seriously motivate your team and illustrate real progress to your stakeholders.<\/p>\n<p>\nMilestones also serve as a great check-in point to highlight your progress to stakeholders. \n<\/p>\n\n<p>milestones must be completed on time and in sequential order because, usually, reaching the next milestone is dependent on completing a previous milestone.<\/p>\n<p>\nIf the team misses the mark to complete a deliverable tied to a specific milestone, it could set back your project schedule, meaning your team might need to work overtime or add additional resources to catch up. \n<\/p>\n\n<h3 id=\"n0_46\">How to set milestones<\/h3>\n<p>The first step to setting a milestone is to evaluate your project as a whole. It helps to refer back to your project charter to remind yourself of the project goal.<\/p>\n<p>\nThen, make a list of what your team needs to do to achieve that goal. \n<\/p>\n\n<p>\nThe big items that indicate progress are your milestones. These are the key points within the project schedule that signify the completion of a project deliverable or a phase in the project. \n<\/p>\n\n<p>Smaller items, like any item that a stakeholder wouldn't need to review, for example, are tasks. You'll plan for these once you've separated them out from the milestones.<\/p>\n<p>Once you've determined your milestones, the next step is to assign each one a deadline.<\/p>\n<p>\nTo get a good sense of timing, you can connect with teammates to discuss the tasks required to reach each milestone and get their estimates for how long these tasks will take. With those estimates in mind, you can make an informed decision about reasonable deadlines for each milestone. \n<\/p>\n\n<p>\nWhen you set deadlines for milestones, you will also want to consider the needs of your stakeholders. Ask yourself when they'll expect to see a certain project deliverable, and consider the answer when choosing a deadline. \n<\/p>\n\n<h3 id=\"n0_47\">Setting milestones: Best practices<\/h3>\n<ul>\n<li><b>project task<\/b> is an activity that needs to be accomplished within a set period of time and is assigned to one or more individuals for completion. The work of a project is broken down into many different project tasks.<\/li>\n<li><b>project<\/b> <b>milestone <\/b>is an important point within the project schedule that usually signifies the completion of a major deliverable. Milestones are significant checkpoints in your project, and keeping track of them helps ensure that your project is on schedule to meet its goals.<\/li>\n<\/ul>\n<h3 id=\"n0_48\">Set tasks to identify milestones<\/h3>\n<p><br />1. <b>Top-down scheduling:<\/b> The project manager lays out the higher-level milestones, then works to break down the effort into project tasks. The project manager works with their team to ensure that all tasks are captured.<\/p>\n<p>2.<b> Bottom-up scheduling:<\/b> The project manager looks at all of the individual tasks that need to be completed and then rolls those tasks into manageable chunks that lead to a milestone.<\/p>\n<h3 id=\"n0_49\">Milestone-setting pitfalls<\/h3>\n<ul>\n<li>\n<b>Don’t set too many milestones:<\/b> When there are too many milestones, their importance is downplayed. And, if milestones are too small or too specific, you may end up with too many, making the project look much bigger than it really is to your team and stakeholders.\n<\/li>\n<li>\n<b>Don’t mistake tasks for milestones: <\/b>Remember that milestones should represent moments in time, and in order to map out how you will get to those moments, you need to assign smaller tasks to each milestone.\n<\/li>\n<li>\n<b>Don’t list your milestones and tasks separately. <\/b>Make sure that tasks and milestones can be visualized together in one place, such as a project plan. This will help ensure that you are hitting your deadlines and milestones. \n<\/li>\n<\/ul>\n\n<h3 id=\"n0_50\">Work breakdown structure (WBS)<\/h3>\n<p>is a tool that sorts the milestones and tasks of a project in a hierarchy, in the order they need to be completed. This is a helpful tool because it helps break down the sometimes intimidating challenges of a project into more manageable chunks.<\/p>\n<p>A way to design a work breakdown structure is to create a tree diagram of project tasks.<\/p>\n<p>At the top of the diagram is the name of the project. The second level of our diagram breaks the project down into three milestones. At the third level of the chart, we can see each of those milestones gets further broken down into a series of project tasks<\/p>\n<p>First, you should have a set of discrete project tasks that ladder up to each of your milestones. You and your teammates will know exactly what needs to happen to reach your first milestone and the milestones after that<\/p>\n<p>\nSecond, you're now in a good position to assign those tasks to members of the project team. Each person should have a clear understanding of the tasks they own and the order in which they need to complete them. Let's break down how to assign tasks. Tasks are typically assigned according to a person's role in the project. \n<\/p>\n\n<p>\nTo assign tasks between two or more team members with the same roles, you might take into consideration each person's familiarity with the tasks at hand. \n<\/p>\n\n<p>\nyou should also consider each teammate's workload. Think about how much time they're meant to be spending on the project compared to work outside the project that they may also be responsible for. It's important to keep everyone's workloads balanced. \n<\/p>\n\n<p>As the project manager, you will ensure that your teammates are clear on their assigned tasks.<\/p>\n<p>There's so many benefits to assigning tasks, but the biggest one is that it frees you up to focus on managing a project.<br />This way, you can feel confident in the knowledge that your teammates are responsible for specific work.<\/p>\n<p>\nAnother benefit of assigning tasks is that it creates a sense of personal responsibility for members of the team. Creating a sense of ownership for members of the team is important because it makes them feel more invested in the project. It also gives them space for personal growth. \n<\/p>\n\n<p>\nA WBS is a deliverable-oriented breakdown of a project into smaller components. It’s a tool that sorts the milestones and tasks of a project into a hierarchy, in the order they need to be completed. \n<\/p>\n\n<p>\nGives you a visual representation of a project and the tasks required to deliver each milestone. It makes it easier to understand all of the essential project tasks, such as estimating costs, developing a schedule, assigning roles and responsibilities, and tracking progress. \n<\/p>\n\n<h3 id=\"n0_51\">Steps to build a WBS<\/h3>\n<ul>\n<li>Start with the high-level, overarching project picture. Brainstorm with your team to list the major deliverables and milestones.<\/li>\n<li>Identify the tasks that need to be performed in order to meet those milestones.<\/li>\n<li>Examine those tasks and break them down further into sub-tasks.<\/li>\n<\/ul>\n<h3 id=\"n0_52\">Components of a project plan<\/h3>\n<p>At the center of the project is the project schedule.<\/p>\n<p>The project schedule can help you estimate the amount of time it'll take to complete the project, and it can provide the team with a way to track the project's progress against your goals.<\/p>\n<p>The majority of plans includes:<\/p>\n<ul>\n<li>Tasks<\/li>\n<li>Milestones<\/li>\n<li>People<\/li>\n<li>Docuentation<\/li>\n<li>Time<\/li>\n<\/ul>\n<p>Tasks are activities that need to be accomplished within a set period of time. They're assigned to different members of the team according to their roles and skills.<\/p>\n<p>\nMilestones are important points within the schedule that indicate progress. They usually signify the completion of a deliverable or phase of the project. \n<\/p>\n\n<p>\nA project plan will also include the people working on your team and their roles. It's important that each team member understands their role and the tasks they're responsible for completing. Ensuring that everyone is clear on their assigned tasks frees you up to focus on managing the project and creates a sense of personal responsibility for members of the team. \n<\/p>\n\n<p>\nDocumentation like your RACI chart, which helps to define roles and responsibilities for individuals on your team. You can also link to your charter, which clearly defines the project and outlines the details needed to reach your goals. Relevant documentation can also include documents like your budget and risk management plan. \n<\/p>\n\n<p>\nTime, a project plan should include the estimated time that will be spent on the project. This forms the basis of the schedule, which is the anchor of your project plan. The estimated time includes dates on which tasks should be started and completed and the dates when you hope to reach various milestones. It also includes the start and end dates of the project, which are important in determining which resources you'll need and when you'll need them. \n<\/p>\n\n<h3 id=\"n0_53\">How project plan components are connected<\/h3>\n<p>\nthe center of the project plan is the project schedule, which helps you estimate the amount of time it will take to complete the project and provides the team with a way to track the project’s progress against your goals. \n<\/p>\n\n<p>You should also include:<\/p>\n<ul>\n<li>Scope and goals<\/li>\n<li>Work Breakdown Structure (WBS)<\/li>\n<li>Budget<\/li>\n<li>Management plan<\/li>\n<\/ul>\n<h3 id=\"n0_54\">Project scope and goals<\/h3>\n<p>\n the project scope and goals will be captured initially in your <b>project charter<\/b>, the document that clearly defines the key details of your project.\n<\/p>\n\n<p>\ncan help remind your team of the objectives they are trying to accomplish and if anything is asked of them that goes beyond what was initially agreed upon in order to achieve those objectives. \n<\/p>\n\n<h3 id=\"n0_55\">Work Breakdown Structure (WBS)<\/h3>\n<p>is a tool that sorts the milestones and tasks of a project in a hierarchy, in the order they need to be completed.<\/p>\n<p>the tasks should be visible in one place with clear descriptions, owners, and due dates. This will allow you and your team to understand who is responsible for which tasks and when each task is supposed to be completed.<\/p>\n<p>Your project plan should also contain detailed milestones and statuses related to these tasks, which will help you and your team members visualize project progress.<\/p>\n<h3 id=\"n0_56\">Budget<\/h3>\n<p>\nwill need to be managed and monitored. The project budget is often linked to the project plan because it is heavily dependent on key elements of the project. \n<\/p>\n\n<h3 id=\"n0_57\">Management plans<\/h3>\n<p>management plan, risk management plan, and communication plan—are all integral to keeping a project organized and on track and should be linked in your project plan<\/p>\n<p><b>key components that should be included in a communication plan for a project, and why are they important?<\/b><\/p>\n<p>Think about aspects like the frequency of communication, the channels used, the stakeholders involved, and the types of information that need to be shared.<\/p>\n<h3 id=\"n0_58\">Making realistic time estimates<\/h3>\n<p>Time estimation is a prediction of the total amount of time required to complete a task. Effort estimation is a prediction of the amount and difficulty of active work required to complete a task.<\/p>\n<p>\nEffort estimation differs from time estimation in that effort quantifies the amount of time it will take a person to complete work on a task. \n<\/p>\n\n<p>time refers to the overall duration of the task from start to finish. That includes inactive time.<\/p>\n<p>\nHere's an example. The effort estimation for painting a wall might be 30 minutes, but time estimation might be 24 hours. That's because in addition to the 30 minutes of active painting time, there are also 23 and a half hours of inactive drying time. \n<\/p>\n\n<p>An unrealistic effort estimate can negatively impact a project schedule. happens when you underestimate the amount of time it will take to complete a task.<\/p>\n<p>too much optimism can lead you to overlook potential risks that could set your plans behind schedule.<\/p>\n<p>\nhow do you try to avoid making unrealistic effort estimates? You can do this by communicating with teammates assigned to each task. Your teammates will have the most realistic understanding of the amount of work required to complete a task and should be able to provide you with the best estimate. \n<\/p>\n\n<p>it's important to really consider certain sub-tasks required to complete work in your planning. Sub-tasks refer to smaller tasks that are required to complete a larger task.<\/p>\n<p>\nA <i><b>buffer<\/b><\/i> is extra time added to the end of a task or a project to account for unexpected slowdowns or delays in work progress. Buffers are important because they can provide some leeway, just in case your time and effort estimates turn out to fall a bit short. \n<\/p>\n\n<p>There are two types of buffers you can use when planning your schedule: task buffers and project buffers.<\/p>\n<p>\ntask buffers, which refer to extra time tacked on to a specific task. Task buffers should be used primarily for tasks that are out of the project team's control. should be used more sparingly for tasks within the project team's control. \n<\/p>\n\n<p>Adding a buffer to every task could lengthen your project schedule unnecessarily<\/p>\n<p>Project buffers differ from task buffers in that they provide extra time to the overall project schedule. Rather than adding a buffer to every task, you can add extra time as a buffer towards the end of your project schedule. Then you can use that extra time, two to three days, for example, as needed throughout the project.<\/p>\n<h3 id=\"n0_59\">The planning fallacy and optimism bias<\/h3>\n<p>The planning fallacy describes our tendency to underestimate the amount of time it will take to complete a task, as well as the costs and risks associated with that task, due to <b>optimism bias<\/b>. Optimism bias is when a person believes that they are less likely to experience a negative event.<\/p>\n<h3 id=\"n0_60\">Capacity<\/h3>\n<p>refers to the amount of work that the people or resources assigned to the project can reasonably complete in a set period of time. A person can only do so much, and it's important to keep in mind each person's capacity when assigning work.<\/p>\n<h3 id=\"n0_61\">Capacity planning<\/h3>\n<p>\nrefers to the act of allocating people and resources to project tasks, and determining whether or not you have the necessary resources required to complete the work on time. During this process, you might find that you need more resources to speed up the project timeline, like a second web developer or a third writer. \n<\/p>\n\n<h3 id=\"n0_62\">Critical Path<\/h3>\n<p>\n refers to the list of project milestones that you must reach in order to meet the project goal on schedule, as well as the mandatory tasks that contribute to the completion of each milestone. Anything else is considered off the critical path. \n<\/p>\n\n<p>Includes the bare minimum number of tasks and milestones you need to reach your project goal.<\/p>\n<p>You'd start by listing all the tasks required to complete the project and the milestones they feed into.<\/p>\n<p>you determine which tasks on the list absolutely can't begin until another task is complete. This is called a dependency<\/p>\n<p>you'll work with your team to make time estimates for each task, and map each task from start to finish.<\/p>\n<p>\nFirst you need to be able to identify which task can happen in parallel, which means they can happen at the same time as other tasks. \n<\/p>\n\n<p>You will also need to identify which tasks can happen sequentially, meaning they must happen in a specific order.<\/p>\n<p>\ntask can happen in parallel, it helps you create efficiencies within your project schedule, by demonstrating where you can complete multiple tasks at the same time. \n<\/p>\n\n<p>\nsequential tasks helps you identify the tasks that you need to prioritize early on in the project.  \n<\/p>\n\n<p>\ndetermine which project tasks have a fixed start date. A fixed start date refers to the date on which you must start work on your task in order to achieve your goal. Identifying whether or not your tasks have a fixed start date can help with capacity planning because it helps ensure that you'll have the right number of people available to complete tasks on time. \n<\/p>\n\n<p>\nAn earliest start date refers to the earliest date in which you can begin working on a task. Identifying an earliest start date can set accurate expectations for when vendors and team members will be up and running on the project. This can help you plan your work and prioritize your work accordingly. \n<\/p>\n\n<p>\nFloat refers to the amount of time you can wait to begin a task before it impacts the project schedule and threatens the project outcome. tasks on the critical path should have zero float, meaning there is no room for delays. And tasks that do have float are not a part of the critical path. \n<\/p>\n\n<h3 id=\"n0_63\">How to create a critical path<\/h3>\n<ol>\n<li>\n<p>Capture al tasks: make sure that you aren’t missing a key piece of work that is required to complete your projectocus on the essential, “need to do” tasks, rather than the “nice to do” tasks that aren’t essential for the completion of the project.<\/p>\n<\/li>\n<li>\n<p>Set dependencies:  figure out which tasks must be completed before other tasks can start.<br />• Which task needs to take place before this task?<br />• Which task can be finished at the same time as this task?<br />• Which task needs to happen right after this task?<\/p>\n<\/li>\n<\/ol>\n<ol start=\"3\">\n<li>\nCreate a network diagram: sequence tasks in the order in which they need to be completed, based on their dependencies. These diagrams help visualize: \n\n- the path of the work from the start of the project to the end of the project\n- Which tasks can be performed in parallel and in sequence\n- Which non-essential tasks are NOT on the critical path\n<\/li>\n<\/ol>\n\n<ol start=\"4\">\n<li>\nMake time estimates: Time estimates can be reviewed and updated throughout the project, as necessary. \n<\/li>\n<\/ol>\n\n<ol start=\"5\">\n<li>\nFind the critical path: \n<\/li>\n<\/ol>\n\n<ul>\n<li>The <b>forward pass <\/b>refers to when you start at the beginning of your project task list and add up the duration of the tasks on the critical path to the end of your project. When using this approach, start with the first task you have identified that needs to be completed before anything else can start.<\/li>\n<li>The<b> backward pass <\/b>is the opposite—start with the final task or milestone and move backwards through your schedule to determine the shortest path to completion. When there is a hard deadline, working backwards can help you determine which tasks are actually critical. You may be able to cut some tasks—or complete them later—in order to meet your deadline.<\/li>\n<\/ul>\n<h3 id=\"n0_64\">Soft skills<\/h3>\n<p>are personal characteristics that help people work effectively with others. These include crucial communication and interpersonal skills. Soft skills can be important when trying to understand what might be blocking someone's ability to do their best work.<\/p>\n<ul>\n<li>Asking the right questions<\/li>\n<li>Negotiating effectively<\/li>\n<li>Practicing empathy<\/li>\n<\/ul>\n<p>\nAn open-ended question is a question that cannot be answered with a yes or a no. The answer provides the relevant details of what you need to know. \n<\/p>\n\n<p>\nEmpathy refers to a person's ability to relate to the thoughts and feelings of others. Practicing empathy at work can be a very effective way to build trust with your team. Your teammates are humans, and each person can only do so much. When you're discussing estimates with the team, you might practice empathy by asking each person about their workload, including work outside of your project and the overall work-life balance. \n<\/p>\n\n<h3 id=\"n0_65\">Developing a project schedule<\/h3>\n<p>\nA good project plan has a clear schedule containing all the tasks of a project, their owners, and when they need to be completed. \n<\/p>\n\n<p>There are many helpful tools that you can use to create a project schedule<\/p>\n<p>A Gantt chart is a horizontal bar chart that maps out a project schedule.<\/p>\n<p>it's a highly visual representation of a projects tasks with clear breakdowns of who's responsible for the work and when those tasks are due<\/p>\n<p>Creating a Gantt chart in a spreadsheet is pretty simple. You can organize your left columns by items like task title, task owner, start date, due date, duration, and percent of task complete. This is a great place to list the tasks and milestones previously identified in a work breakdown structure.<\/p>\n<p>Keeping every document for the project in one spreadsheet saves time, helps everyone stay organized, and reduces the burden of having to search through emails for information.<\/p>\n<h3 id=\"n0_66\">Project plan best practices<\/h3>\n<ul>\n<li>\n<u>Careful review of project deliverables, milestones, and tasks:<\/u> You'll need to break down every deliverable into milestones and tasks to ensure that you and your team have a clear picture of what needs to be done to meet your project's goals. Your plan revolves around completing each and every tiny task, so you should take your time to get this piece right. \n<\/li>\n<li>\n<u>Giving yourself time to plan:<\/u> It's a time-intensive process, especially for larger projects with multiple deliverables. Planning gives you and your team some time to think realistically about what your team can and cannot accomplish within a certain time frame. Using the strategies that we've shared earlier, like effort estimation and capacity planning, can help you and your team get a realistic sense of how long the project will take and when you'll be able to hit your milestones. \n<\/li>\n<li>\n<u>Recognizing and planning for the inevitable (things will go wrong):<\/u> You can't plan for every problem, but the team can identify the risks that will most likely occur and create plans to prevent or mitigate those risks.  \n<\/li>\n<li>\nStaying curious: It's extremely unlikely that you're an expert on every task of the project. That's why it's so important to sit down with your teammates during a planning phase and ask lots and lots of questions. As we mentioned earlier, asking your teammates questions about their work can give you deeper insights into their tasks for the project.   It's also important to understand the expectations, priorities, risk assessments, and communication styles of your stakeholders and vendors. For example, you might ask stakeholders how to best keep them in the loop on the project's plans, and you might ask your vendors about their availability to complete work for the project.\n<\/li>\n<li>\n<u>Championing your plan:<\/u> Tell your team why it benefits them to stay on top of the plan. By doing so, you may influence your teammates to stay on track and update the plan regularly. \n<\/li>\n<\/ul>\n\n<h3 id=\"n0_67\">Tools and templates<\/h3>\n<p>\nRegardless of what tool you use, be sure to include this key information: \n<\/p>\n\n<ul>\n<li><b>Task ID numbers<\/b> or <b>task names<\/b>: You might end up with dozens, hundreds, or even thousands of tasks in a project. Assigning a task ID or name makes it easy to find and reference a task when communicating with team members and stakeholders.<\/li>\n<li><b>Task durations: <\/b>A task duration is the amount of time you estimate that task should take. Adding task durations to your project plan helps you organize and prioritize the tasks in the project to help ensure you hit your goal on time.<\/li>\n<li><b>Start and finish dates: <\/b>Including start and finish dates for each task helps you track whether you are progressing on time or not.<\/li>\n<li><b>Who is responsible for what: <\/b>Including each team member’s role and responsibilities helps promote clarity and efficiency. As a best practice, assign an owner to each task, as well.<\/li>\n<\/ul>\n<h3 id=\"n0_68\">Using a spreadsheet to build a project plan<\/h3>\n<p class=\"imgph\">Screenshot in Notion: Screenshot 2025-11-04 at 2.19.10 PM.png<\/p>\n\n<p>Word: <a href=\"https://www.smartsheet.com/top-excel-project-plan-templates\">https://www.smartsheet.com/top-excel-project-plan-templates<\/a><\/p>\n<p>\nGoogle Sheets: [https://www.smartsheet.com/free-google-docs-templates-google-timeline-templates](https://www.smartsheet.com/free-google-docs-templates-google-timeline-templates) \n<\/p>\n\n<p>Plan timeline: <a href=\"https://docs.google.com/spreadsheets/d/1TauRTFipsWDWGqaw6tmqJeknKhVI5IjR5jJvBfVzfGw/template/preview\">docs.google.com<\/a><\/p>\n<p>Microsoft Gantt: <a href=\"https://create.microsoft.com/en-us/template/simple-gantt-chart-4bf6b793-490f-4623-84ca-c9c6251a91fc\">Microsoft Create<\/a><\/p>\n<h3 id=\"n0_69\">Kanban Boards<\/h3>\n<p>\nAre a visual tool used to manage tasks and workflows. Kanban boards can be created on whiteboards, magnetic boards, poster boards, computer programs, and more. Tasks associated with the project are written on cards. These cards are placed in columns, which represent the progress made. \n<\/p>\n\n<p>They are typically most suitable for project teams working in an <b>Agile <\/b>project management approach.<\/p>\n<p>\nAgile project management is an iterative approach to managing projects that focuses on continuous releases and incorporates customer feedback with every iteration. \n<\/p>\n\n<p>are used to:<\/p>\n<ul>\n<li>Give a quick visual understanding of work details and provide critical task information.<\/li>\n<li>Facilitate handoffs between stakeholders, such as between development and testing resources or between team members who work on related tasks.<\/li>\n<li>Help with capturing metrics and improving workflows.<\/li>\n<\/ul>\n<p>Before creating a board, it is best practice to gather the necessary information and lay out key elements, such as tasks, status, dates, and durations.<\/p>\n<p>Each colored rectangle is associated with a task. The tasks are represented horizontally across the effort timeline. Each column represents where the task is in relation to its completion. So as a task is started, it will move from<i> to do<\/i>, to <i>in progress<\/i>. When the project is almost ready to be released or complete, it will move to <i>testing<\/i>, and when it is tested and approved, it will move to <i>done<\/i>.<\/p>\n<p class=\"imgph\">Screenshot in Notion: Screenshot 2025-11-04 at 2.27.19 PM.png<\/p>\n\n<p>The cards you use will vary but most cards will contain:<\/p>\n<p><b><u>Front:<\/u><\/b><\/p>\n<ul>\n<li><b>Title and unique identifier:<\/b> Make sure you have a quick reference for tasks and ID numbers.<\/li>\n<li><b>Description of work:<\/b> Briefly describe the task to be accomplished. Remember that this is intended to be captured on something no larger than an index card.<\/li>\n<li><b>Estimation of effort:<\/b> Estimate the amount of work it will take to complete the task. For example, you can write “small,” “medium,” or “large” to indicate the level of effort you think that task will involve.<\/li>\n<li><b>Who is assigned to the task:<\/b> Indicate who is responsible for completing the task; ideally, one person per card.<\/li>\n<\/ul>\n<p><b><u>Back:<\/u><\/b><\/p>\n<ul>\n<li><b>Start date:<\/b> Include the start date of the task for use in metrics, tracking, and ensuring that your time estimate is accurate.<\/li>\n<li><b>Blocked days:<\/b> Indicate which days your task may be halted. A task can become blocked if it <u>can’t continue to be worked on<\/u>. For example, if you were supposed to receive a deliverable and it hasn’t been delivered yet, then your day may be blocked for this particular task.<\/li>\n<li><b>Finish date:<\/b> As with any plan, it is important to track when the task is supposed to be finished. This allows you to ensure that your project is still on track to reach the end goal.<\/li>\n<\/ul>\n<h3 id=\"n0_70\">The importance of budget setting<\/h3>\n<p>\nA project budget is the estimated monetary resources needed to achieve the project's goals and objectives. \n<\/p>\n\n<p>You need to consider all of the potential and projected costs needed to complete the project. You break the budget down by milestones<\/p>\n<p>This ensures that you calculate the correct expenses for a particular period of time.<\/p>\n<p>This is considered a forecast. A forecast for your project budget is a cost estimate or a prediction over a period of time.<\/p>\n<p>In project management, a budget is considered a deliverable. It is a success metric. The project budget is a tool to communicate exactly what is needed and when it is needed with stakeholders. The budget will have a direct effect on the company's financial viability.<\/p>\n<p>\nThe budgeting process usually happens in conjunction with the scheduling process because the steps of the scheduling process are highly dependent on the costs. The project manager will collaborate with people on the project to create their estimations. \n<\/p>\n\n<p>Most projects are created to improve workforce productivity, increase revenue, or attempt to save costs within an organization. Budgeting is one of the most important aspects of project management, and when you start, to stay on budget is one of the trickiest tasks<\/p>\n<h3 id=\"n0_71\">Key components of a project budget<\/h3>\n<p>Project managers must account for understanding stakeholder needs, budgeting for surplus expenses, maintaining adaptability, and reviewing and reforecasting throughout the entire project<\/p>\n<p>it's important to know exactly what stakeholders expect from this project in order to deliver. As a company, the ultimate goal is typically to make a profit and to save money and time<\/p>\n<p>As your project continues along, you'll have to review your budget and sometimes reforecast, which means creating a separate revised budget based on how your project is tracking.<\/p>\n<p>\nKeeping on top of the budget will help you stay organized, and reforecasting is a way to recalibrate the budget, if necessary. \n<\/p>\n\n<p>There are several factors to consider when creating a budget, including:<\/p>\n<ul>\n<li>\nResource cost rates: The cost of a resource. Som examples: Labor, tools, equipment, materials, and software. how much will each of these resources cost the company? \n<\/li>\n<li>\nReserve analysis : It will help you account for any buffer funds you may need. A reserve analysis is a method to check for remaining project resources. \n<\/li>\n<li>\nContingency budget: Is money that is included to cover potentially unforeseen events that aren't accounted for in a cost estimate. The purpose is to compensate for the uncertainty that occurs in cost and time estimates, as well as unpredictable risk exposure.\n<\/li>\n<li>\nCost of quality: all of the costs that are incurred to prevent issues with products, processes, or tasks. The cost of quality includes prevention costs, appraisal costs, internal failure costs, and external failure costs. \n<\/li>\n<\/ul>\n\n<p>Your budget will most likely change, starting with an initial estimate is one way to ensure that you're at least on track and it's okay if your budget does change, that's why we review and reforecast.<\/p>\n<h3 id=\"n0_72\">Project budgeting 101<\/h3>\n<p>A <b>project budget <\/b>is the estimated monetary resources needed to achieve a project's goals and objectives.<\/p>\n<p>Budgets are typically created in the <b>initiation <\/b>and<b> planning phases<\/b> of your project<\/p>\n<p>\nYour budget is more than just how much it will cost to complete the project—it is a helpful tool to reference when communicating with stakeholders and can double as a tracker for your project’s progress. Budgets also help control<b> <\/b>your costs and act as the baseline<b> <\/b>for the financial portion of the project. \n<\/p>\n\n<p>\n when creating your project budget:\n<\/p>\n\n<ul>\n<li><b>Reference historical data: <\/b>Your project may be similar to a previous project your organization has worked on. It is important to review how that project’s budget was handled, find out what went well, and learn from any previous mistakes.<\/li>\n<li><b>Utilize your team, mentors, or manager:<\/b> Get into the habit of asking for your team to double check your work to give you additional sets of eyes on your documents.<\/li>\n<li><b>Time-phase<\/b> <b>your budget<\/b>: Time-phased budgeting allows you to allocate costs for project tasks over the projected timeline in which those expenses are planned to take place. By looking at your tasks against a timeline, you can track and compare planned versus actual costs over time and manage changes to your budget as necessary.<\/li>\n<li><b>Check, check, and double check:<\/b> Make sure that your budget is accurate and error-free. Your budget will likely require approval from another department, such as finance or senior management, so do your best to ensure that it is as straightforward to understand as possible and that all of your calculations are correct.<\/li>\n<\/ul>\n<h3 id=\"n0_73\">Categorize differrent types of costs<\/h3>\n<p><b><u>Direct Costs:<\/u><\/b><\/p>\n<p>These are costs for items that are necessary in order to complete your project. These costs can include:<\/p>\n<ul>\n<li>Wages and salaries of employees and contractors<\/li>\n<li>Materials costs<\/li>\n<li>Equipment rental costs<\/li>\n<li>Software licenses<\/li>\n<li>Project-related travel and transportation costs<\/li>\n<li>Staff training<\/li>\n<\/ul>\n<p><b><u>Indirect Costs:<\/u><\/b><\/p>\n<p>These are costs for items which do not directly lead to the completion of your project but are still essential for the project team to do their work. They are also referred to as <b>overhead costs<\/b>. These costs can include:<\/p>\n<ul>\n<li>Administrative costs<\/li>\n<li>Utilities<\/li>\n<li>Insurance<\/li>\n<li>General office equipment<\/li>\n<li>Security<\/li>\n<\/ul>\n<h3 id=\"n0_74\">Develop a baseline budget<\/h3>\n<p>is an estimate of project costs that you start with at the beginning of your project.<\/p>\n<p>you should “re-baseline” your budget if you make significant changes. Re-baselining refers to when you update or modify a project's baseline as a result of any approved change to the schedule, cost, or deliverable content.<\/p>\n<h3 id=\"n0_75\">Perform a reserve analysis<\/h3>\n<p>will help you account for any buffer funds you may need.<\/p>\n<p>review all potential risks to your project and determine if you need to add buffer funds, also referred to as a contingency budget. These funds are necessary because new costs that you did not expect are likely to happen throughout the project<\/p>\n<p>\naccount for cost of quality in your overall project budget. The cost of quality refers to all of the costs that are incurred to deliver a quality product or service, which can extend beyond material resources. This includes addressing issues with products, processes, or tasks, along with internal and external failure costs. \n<\/p>\n\n<h3 id=\"n0_76\">Creating a project budget<\/h3>\n<p>Project budgets helped to control costs throughout the duration of the project. They help project managers establish the main objectives of their project and keep them within a reasonable framework to ensure that the project makes financial sense for the company.<\/p>\n<p>techniques like researching historical data, leveraging experts, the bottom-up approach, confirming accuracy, and setting your baseline.<\/p>\n<ul>\n<li>\nHistorical data: review past projects that are similar to yours to get an idea of what your project could entail. Find out what past project managers did right and wrong\n<\/li>\n<li>\nLeverage experts: gathering their insights to do something more effectively. Reaching out to colleagues who worked on a similar project in the past will be a great resource for you as an entry-level project manager. \n<\/li>\n<li>\nBottom-up: thinking about all the parts of a project from the beginning to the end, including making a list of every material, resource, contract worker, or anything that comes with an associated cost, and adding all of that together. You should also ask the vendors you are thinking of working with for quotes, so you can get a rough estimate of how much their work will cost. \n<\/li>\n<li>\nConfirming accuracy: double-check everything to confirm accuracy.\n<\/li>\n<li>\nSet the baseline: is the dollar amount that you'll use to measure against, to find out if you're on track or not, and to measure the success of your project.\n<\/li>\n<\/ul>\n\n<p>So:<\/p>\n<ul>\n<li>Break project into tasks<\/li>\n<li>Estimate cost of each item<\/li>\n<li>Add estimates together<\/li>\n<li>Add contingency and tax<\/li>\n<li>Seek approval from key stakeholders<\/li>\n<\/ul>\n<p>\"Miscellaneous\" is a term that we use to represent additional items that are not included in any of the other areas. Usually, they are minor items or items where there are only one or two of them, and that they are not a major budget line.<\/p>\n<h3 id=\"n0_77\">Maintaining a project budget<\/h3>\n<p>milestones are a great opportunity to re-review the budget, to identify if anything needs to be reset or revisited throughout the project<\/p>\n<ul>\n<li>Fixed contracts are usually paid for when certain milestones are reached<\/li>\n<li>time and materials' contracts are usually paid for monthly based on the hours worked and other fees associated with the work, like travel and meals.<\/li>\n<\/ul>\n<p>Cost control is a practice where a project manager identifies factors that might impact their budget and then creates effective actions to minimize variances.<\/p>\n<p>In order to control costs:<\/p>\n<ul>\n<li>\nEstablish a sign-off plan and inform the appropriate stakeholders of any changes that occur\n<\/li>\n<li>\nManage changes as they're made.\n<\/li>\n<li>\nAccept that budget misses will happen. \n<\/li>\n<li>\nAdequately account for, adapt, and manage your budget with that risk in mind.\n<\/li>\n<\/ul>\n\n<h3 id=\"n0_78\"><b>Budget pre-allocation<\/b><\/h3>\n<p>your budget is already set <u>before<\/u> you even start the project, it is important to work with your customer to set expectations on scope and deliverables within the allocated budget. carefully track all expenses in your budget. Regularly match these expenses against your pre-allocated budget to ensure you have sufficient funds for the remainder of your project.<\/p>\n<p>\n<b>Fixed contracts<\/b> are usually paid for when certain milestones are reached. \n<\/p>\n\n<p>\n<b>Time and materials contracts <\/b>are usually paid for monthly, based on the hours worked and other fees associated with the work, such as travel and meal expenses. \n<\/p>\n\n<h3 id=\"n0_79\"><b>Total cost of ownership (TCO)<\/b><\/h3>\n<p>\n takes into account multiple elements that contribute to the cost of an item. It factors in the expenses associated with a product or service over its lifetime, rather than just upfront costs. \n<\/p>\n\n<h3 id=\"n0_80\"><b>Scope creep<\/b><\/h3>\n<p>\nis when changes, growth, and other factors affect the project’s scope at any point <u>after<\/u> the project begins. Scope creep causes additional work that wasn’t planned for, so scope creep can also impact your budget. \n<\/p>\n\n<p>factors that can lead to scope creep:<\/p>\n<ul>\n<li>A vague Statement of Work (SoW)<\/li>\n<li>Conversations and agreements about the project that aren’t officially documented<\/li>\n<li>Unattainable timeframes and deadlines<\/li>\n<li>Last-minute asks from priority stakeholders<\/li>\n<\/ul>\n<h3 id=\"n0_81\">Budgeting terms<\/h3>\n<ul>\n<li><b><u>Cash flow<\/u><\/b><u>:<\/u> the inflow and outflow of cash on your project. you need <b>funding<\/b> (cash into your project) to keep your project running. Monitoring cash flow allows you to have a reference point for your project’s health. Planning and tracking the cash flow for your project is a key component of budget management.<\/li>\n<li><b><u>CAPEX and OPEX:<\/u><\/b><b> <\/b>Organizations have a number of different types of expenses, Two of the most common are <b>CAPEX (capital expenses)<\/b> and <b>OPEX (operating expenses)<\/b>.<\/li>\n<li>CAPEX (capital expenses) are an organization's major, long-term, upfront expenses, such as buildings, equipment, and vehicles. They are generally for assets that the company will own and keep. The company incurs these expenses because they believe they will create a benefit for the company in the future.<\/li>\n<li>OPEX (operating expenses) are the short-term expenses that are required for the day-to-day tasks involved in running the company, such as wages, rent, and utilities. They are often recurring.<\/li>\n<li><b><u>Contingency reserves<\/u><\/b><b>: <\/b>Are funds added to the estimated project cost to cover identified risks. These are also referred to as <b>buffers<\/b>.<\/li>\n<li><b><u>Management reserves<\/u><\/b><b>: <\/b>contingency reserves are used to cover the costs of <u>identified<\/u> risks, <b>management reserves<\/b> are used to cover the costs of <u>unidentified<\/u> risks.<\/li>\n<\/ul>\n<h3 id=\"n0_82\">Procurement<\/h3>\n<p>Obtaining all of the materials, services, and supplies required to complete the project.<\/p>\n<h3 id=\"n0_83\">Vendors<\/h3>\n<p>\nIndividuals or businesses who provide essential goods and services. \n<\/p>\n\n<p>Vendor management covers the activities included in researching and sourcing vendors.  is often a matter of sourcing for a specific service or talent and then managing that relationship. Sourcing talent includes researching and obtaining estimated costs from different partner companies you may use on a project. You'll typically use vendors when they provide specialized skills that aren't available within your company<\/p>\n<p>\n Vendor management entails:\n<\/p>\n\n<ul>\n<li>\nsourcing vendors \n<\/li>\n<li>\nGetting quotes for their work \n<\/li>\n<li>\nDeciphering which vendors will best fulfill your needs \n<\/li>\n<li>\nNegotiating their contracts \n<\/li>\n<li>\nSetting deadlines for them \n<\/li>\n<li>\nEvaluating performance  \n<\/li>\n<li>\nEnsuring payments are made\n<\/li>\n<\/ul>\n\n<h3 id=\"n0_84\">The procurement process<\/h3>\n<p>\nfive steps that make up the procurement process. \n<\/p>\n\n<ul>\n<li>\n<b><u>Initiating<\/u><\/b>: which is the planning process of defining what help you may need outside of your current resources to hit the project goals.\n<\/li>\n<li>\n<b><u>Selecting:<\/u><\/b> which entails deciding what supplies you need and which vendors you'll go through. \n<\/li>\n<li>\n<b><u>Contract writing:<\/u><\/b> which is where the contracts are developed, reviewed, and signed.\n<\/li>\n<li>\n<b><u>Control:<\/u><\/b> which is when you make payments, set up logistics and requirements to maintain quality, and ensure the service agreement is being met\n<\/li>\n<li>\n<b><u>Completing:<\/u><\/b> which is where you measure the success of the procurement.\n<\/li>\n<\/ul>\n\n<p>Agile procurement management is:<\/p>\n<ul>\n<li>\n more collaborative, with both the project team and the end supplier than traditional approaches. \n<\/li>\n<li>\nThere is a heavy emphasis on the relationship between these parties. \n<\/li>\n<li>\nThe whole project team plays a larger role in identifying what needs to be procured.\n<\/li>\n<li>\nTends to have a living contract that can be adapted based on the evaluation of the project. \n<\/li>\n<li>\nCan change more easily than traditional procurement methods. \n<\/li>\n<\/ul>\n\n<p>\nTraditional procurement management: \n<\/p>\n\n<ul>\n<li>\nTends to focus on standard contracts with clear terms and deliverables. \n<\/li>\n<li>\nThe project manager may be responsible for end-to-end procurement instead of the entire team providing input. \n<\/li>\n<li>\nThe contracts may feature lengthy and extensive documentation that includes fixed requirements and comprehensive detail of the services and deliverables. \n<\/li>\n<li>\nWhile this may appear more rigid, the benefit is you've outlined clearer workstreams and deadlines. \n<\/li>\n<\/ul>\n\n<h3 id=\"n0_85\">Tips for initiating<\/h3>\n<p>While planning your project, figure out which materials, resources, and supplies you will need to get the job done. During this step, you will decide which items will be internally procured and which items will be externally outsourced. Once you’ve decided which items you need to outsource, compare each of those items specifications, components, quality measurements, standards, and characteristics with your project’s requirements. You may find that some of the items have features you don’t need. If you can identify those unnecessary features, you will know exactly what you want and don’t want in an item, possibly reducing your total cost.<\/p>\n<h3 id=\"n0_86\">Tips for selecting<\/h3>\n<p>\nNow that you have outlined what you need for your project, you need to determine vendors to source these items. Research and assess various vendors and suppliers, and try to find out if your preferred vendors have a reputation for delivering quality work on time. After you’ve identified your preferred vendors and suppliers, interview them to learn more about their products and services. If possible, make site visits to see exactly how each vendor runs their business in person. \n<\/p>\n\n<h3 id=\"n0_87\">Tips for contract writing<\/h3>\n<p>Contract writing requires excellent attention to detail, so pay close attention to the inclusions and exclusions in the vendor’s offer. There may be some items included in the vendor’s price that you can provide in-house at low or no additional cost. Sometimes, the vendor may write the contract. In this case, checking carefully for clarity and accuracy ensures that you know exactly what you are getting from the vendor. Whether the contract is written by you or by the vendor, you will almost always want to consult with a legal and compliance team to ensure that everything in the contract is ethical and legal.<\/p>\n<h3 id=\"n0_88\">Tips for controlling<\/h3>\n<p>\nensure that the work is being done according to the terms of the contract. You will need to periodically review the performance and quality of each vendor. When communicating with vendors, remain professional but firm to ensure that all project requirements are being fulfilled and that all major milestones are being met on time and at cost. Building and maintaining a good relationship with your vendors benefits the team and the overall project. This relationship will make it easier to make adjustments and contract revisions if the need arises. Taking certain measures, like conducting regular check-in meetings, will ensure that the work is being completed according to plan. \n<\/p>\n\n<h3 id=\"n0_89\">Tips for completing<\/h3>\n<p>Ask yourself:<\/p>\n<ul>\n<li>Were the materials created good quality?<\/li>\n<li>Were there any issues with labor contracts?<\/li>\n<li>How were your relationships with vendors?<\/li>\n<\/ul>\n<h3 id=\"n0_90\">Common procurement documentation<\/h3>\n<p>In the initiating phase, a project manager will create a nondisclosure agreement, otherwise known as an NDA.<\/p>\n<p>\n In the selecting phase, a project manager creates a request for proposal, or an RFP.\n<\/p>\n\n<p>In the contracting phase, a statement of work or an SOW is created<\/p>\n<p>NDA is a standard within a lot of companies, and it's best practice to ask external contract workers to sign an NDA. The purpose of an NDA is to keep confidential information within the organization.<\/p>\n<p>\nRFP, a document that outlines the details and requirements of an organization's project to be passed on to vendors. RFPs are used to solicit bids from vendors so that you can then select which vendor might be the best for your project. An RFP is widely used within different departments in a company and across various industries. An RFP typically includes an overview of the project, the desired outcomes, and goals, budget, deadlines, milestones, and contact information so each vendor can get back to you with a detailed proposal of how they plan to tackle the job. \n<\/p>\n\n<p>\nStatement of Work, or an SOW. An SOW is sent after the vendor is selected and evolves as the project goes on. \n<\/p>\n\n<h3 id=\"n0_91\">Creating a Statement of Work<\/h3>\n<p>\n A statement of work is a document that clearly lays out the products and services a vendor or contractor will provide for the organization. An SoW also provides a description of the contractor's needs and requirements to properly perform the agreed-upon services. Although the SoW covers the customer's needs, it's equally as important to include the organization's needs and the vendor's needs too. It's critical that all parties involved understand what is expected from each of them in order to deliver the best possible products or services. The project manager is tasked with developing the SoW but often asks for input from subject matter experts or SMEs for technical expertise that the project manager may not have. \n<\/p>\n\n<h3 id=\"n0_92\">Ethical traps<\/h3>\n<p>is an ethical dilemma that causes us to make a certain decision without regard for our ethical principles. You may face ethical traps throughout the course of a project. However, ethics can be of particular concern when it comes to procurement.<\/p>\n<p>a few of the most common ethical traps that exist when conducting procurements are corruption and bribery, sole-supplier sourcing, and interactions with state-owned agencies.<\/p>\n<ul>\n<li>\n<b><u>Corruption and bribery:<\/u><\/b> when a vendor seeks to reduce the competition for a contract during the bidding process. A company may attempt to bribe members within the organization to sway their decision into a favorable outcome for the vendor. Bribes may include things like money, gifts, tickets to events, and more. Another type of corruption scheme is to offer a certain percentage of an awarded contract—also known as a <i>kickback<\/i>—to an official who can ensure that their company wins the bid.\n<\/li>\n<li>\n<u>Sole-supplier sourcing:<\/u><b> <\/b>vendors may reach out to buyers before a bid is even requested. When the buyer’s organization decides to work with that vendor based on their previously-established relationship, that limits competition before the bidding has even begun. When this happens, companies and the public miss out on the advantages of competition, such as reasonable pricing, product quality standards, or speedy delivery options. \n<\/li>\n<li>\n<b><u>Interactions with state-owned entities:<\/u><\/b> If you are unfamiliar with any governmental restrictions that may affect your industry, organization, or project, you could unintentionally fall into an ethical trap.\n<\/li>\n<\/ul>\n\n<p>The Project Management Institute’s (PMI) <a href=\"https://www.pmi.org/about/ethics/code\"><b><u>code of ethics<\/u><\/b><\/a><b>  <\/b>provides detailed guidelines to help ensure you maintain ethical conduct in your projects.<\/p>\n<h3 id=\"n0_93\"><b>Test your ethics.<\/b><\/h3>\n<p>When you face an ethical dilemma, ask yourself questions in each of the following categories:<\/p>\n<ul>\n<li><b>Shame: <\/b>Would you be ashamed if someone knew what you did?<\/li>\n<li><b>Community: <\/b>Would you want your friends to know the decision you made?<\/li>\n<li><b>Legal: <\/b>Would you face legal action if you took this action?<\/li>\n<li><b>Situation: <\/b>Would your actions be justified in this situation?<\/li>\n<li><b>Consequence: <\/b>Would a negative outcome be worth your actions?<\/li>\n<\/ul>\n<h3 id=\"n0_94\">Managing risk effectively<\/h3>\n<p>a Risk is a potential event which can occur and can impact your project. you will think about them as hypothetical. In other words, these aren't events that will definitely happen, but because there's a possibility that they could happen, it's your responsibility as the project manager to identify and plan for those risks.<\/p>\n<p>\nA Issue  is a known or real problem that can affect the ability to complete a task. \n<\/p>\n\n<p>a risk is an event that could potentially happen. If the event actually happens, then the risk becomes an issue.<\/p>\n<p>How you manage those risks is known as risk management. Risk management is the process of identifying and evaluating potential risks and issues that could impact a project.<\/p>\n<p>\nRisk management is a crucial part of the planning process by giving you an understanding of: \n<\/p>\n\n<ul>\n<li>\nWhat could go wrong with your project. \n<\/li>\n<li>\nWho you need to consult about the risk. \n<\/li>\n<li>\nHow the potential risk could be mitigated. \n<\/li>\n<\/ul>\n\n<p>This way, if or when something goes wrong, you'll have a plan prepared and ready to go.<\/p>\n<p>\nIt is important to keep calm, figure out the root cause of the problem, and come up with a solution. Risk management is a really important topic for project managers to understand. \n<\/p>\n\n<h3 id=\"n0_95\">Phases of risk management<\/h3>\n<p><b>risk management<\/b> is the process of identifying and evaluating potential risks and issues that could impact your project. Risk management is an ongoing practice throughout the life cycle of your project. It typically involves some variation of these five steps:<\/p>\n<ol>\n<li>Identify the risk.<\/li>\n<li>Analyze the risk.<\/li>\n<li>Evaluate the risk.<\/li>\n<li>Treat the risk.<\/li>\n<li>Monitor and control the risk.<\/li>\n<\/ol>\n<p>1.<b> Identify the risk. <\/b>The first phase of the risk management process is to identify and define potential project risks with your team. After all, you can only manage risks if you know what they are.<\/p>\n<p>2.<b> A
