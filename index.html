ange of use. \n<\/p>\n\n<p>Each project will need to define its own set of successful adoption metrics, such as:<\/p>\n<ul>\n<li>Conversion rates<\/li>\n<li>Time to value (TTV)<\/li>\n<li>Onboarding completion rates<\/li>\n<li>Frequency of purchases<\/li>\n<li>Providing feedback (rating the product or service)<\/li>\n<li>Completing a profile<\/li>\n<\/ul>\n<p>\nEngagement metrics might include the daily usage rate of a design feature or tracking orders and customer interactions. \n<\/p>\n\n<p><b>Which key metrics should you track?<\/b> Essential ones include schedule adherence, budget management, scope definition, productivity, and ROI<\/p>\n<p>Some of the metrics<\/p>\n<ul>\n<li><b>Schedule: <\/b>Naturally, one of the first project management performance metrics you should review is the timeline. Were project tasks and milestones achieved on time, as determined in the <a href=\"https://www.wrike.com/project-management-guide/faq/what-is-planning-in-project-management/\">planning<\/a> phase? What about final <a href=\"https://www.pmi.org/learning/library/selecting-best-project-delivery-system-8910\">project delivery<\/a>? Was it completed on schedule? With the right <a href=\"https://www.wrike.com/teams/project-management/\">task management tools<\/a> in place, you can easily track timelines throughout the project lifecycle, and analyze them after project completion to determine exactly where things went off course.<\/li>\n<li><b>Budget:<\/b> Going over budget often due to poor planning. Maybe you forgot to account for a project element like design, materials, or testing. Whatever the reason, delivering a project within its initial budget is a critical metric of success.<\/li>\n<li><a href=\"https://www.wrike.com/project-management-guide/faq/what-is-scope-in-project-management/\"><b>Scope<\/b><\/a><b>:<\/b> A project’s scope includes its stated goals and <a href=\"https://smallbusiness.chron.com/examples-project-deliverables-31486.html\">deliverables<\/a>, as well as the individual tasks that are required to achieve these. Often, <a href=\"https://www.wrike.com/project-management-guide/faq/what-is-scope-creep-in-project-management/\">scope creep<\/a> occurs as the project progresses, leading to budget overages and delayed delivery. This is why it’s critical to clearly define project scope at the outset and ensure every team member and <a href=\"https://www.wrike.com/project-management-guide/faq/what-is-a-stakeholder-in-project-management/\">stakeholder<\/a> understands its goals.<\/li>\n<li><b>Productivity:<\/b> <a href=\"https://www.forbes.com/sites/serenitygibbons/2019/11/05/how-to-improve-your-teams-happiness--and-productivity/#7acc244d29bc\">Productivity<\/a> defines the relationship between a project’s inputs and its outputs. While this metric is useful at the organizational level, it can also be used from project to project to get a clear picture of team efficiency. <a href=\"https://www.forbes.com/sites/serenitygibbons/2019/11/05/how-to-improve-your-teams-happiness--and-productivity/#7acc244d29bc\">Productivity<\/a> defines the relationship between a project’s inputs and its outputs. The goal is to get as many units of output as you can using the least amount of inputs possible.<\/li>\n<li><b>Return on investment (ROI): <\/b>ROI looks specifically at the value of a project’s outcomes vs. the dollar amount spent to complete the project. ROI can be expressed as a mathematical equation. To calculate it, you must first assign a value to each benefit derived from the project. Common benefits include <a href=\"https://www.wrike.com/project-management-guide/faq/what-is-cost-in-project-management/\">cost<\/a> savings, improvements, increased output, or contribution to profit. Once you find these, use the formula ROI = (net benefits/costs) x 100 to calculate the project’s <a href=\"https://www.entrepreneur.com/encyclopedia/return-on-investment-roi\">return on investment<\/a>.<\/li>\n<li><b>Customer satisfaction: <\/b>This metric assesses the quality of a product or service using customer survey data. Ideally, the service or product should serve its intended purpose and satisfy the real needs of customers. Tracking customer satisfaction metrics can monitor aspects like revenue generated, repeat purchase clients, lost clients, complaints, and customer survey results.<\/li>\n<li><b>Actual cost: <\/b>Actual cost reveals the total amount of money spent on a project calculated by adding up all the expenditures throughout its lifecycle.<\/li>\n<li><a href=\"https://www.wrike.com/project-management-guide/faq/what-is-schedule-variance-in-project-management/\"><b>Schedule variance<\/b><\/a><b>: <\/b>This metric considers the budgeted cost of work scheduled and work completed. It tells if the project is under budget or exceeding its budget. Learn <a href=\"https://www.wrike.com/project-management-guide/faq/how-to-calculate-earned-value-in-project-management/\">how to calculate earned value<\/a> by subtracting the budgeted cost of work completed from the budgeted cost of work scheduled. Negative schedule variance means that the project is running late.<\/li>\n<li><a href=\"https://www.wrike.com/project-management-guide/faq/what-is-cost-variance-in-project-management/\"><b>Cost variance<\/b><\/a><b>: <\/b>This shows the discrepancy between the predicted budget and the actual costs within a specified period. A negative cost variance shows the project runs over budget, whereas if it’s positive, it means the project is under budget.<\/li>\n<li><b>Cost performance: <\/b>This metric is also used to measure cost efficiency. It is calculated by dividing the value of tasks performed (<a href=\"https://www.wrike.com/project-management-guide/faq/how-to-calculate-earned-value-in-project-management/\">earned value<\/a>) to the actual costs incurred. Cost performance projection helps you to make more accurate budget estimates.<\/li>\n<\/ul>\n<h3 id=\"n2_7\">Discerning important data<\/h3>\n<p>A signal is an observable change, and it can help you to determine the overall health of your project and identify early signs that something isn't quite right.<\/p>\n<h3 id=\"n2_8\">Data Ethics<\/h3>\n<p>\nThe data you collect will usually hold <b>PII (personally identifiable information)<\/b>—information that could be used to directly identify, contact, or locate an individual. \n<\/p>\n\n<p>Collecting, analyzing, and sharing this data in an ethical way is extremely important for maintaining the integrity of your organization, your projects, and your position.<\/p>\n<p><b>Data ethics<\/b> is the study and evaluation of moral challenges related to data collection and analysis. This includes generating, recording, curating, processing, sharing, and using data in order to come up with ethical solutions.<\/p>\n<p>Businesses apply data ethics practices so they can:<\/p>\n<ul>\n<li>Comply with regulations<\/li>\n<li>Show that they are trustworthy<\/li>\n<li>Ensure fair and reasonable data usage<\/li>\n<li>Minimize biases<\/li>\n<li>Develop a positive public perception<\/li>\n<\/ul>\n<h3 id=\"n2_9\">Data privacy<\/h3>\n<p>is a key part of data ethics. Data privacy deals with the proper handling of data. This includes the purpose of data collection and processing, privacy preferences, the way organizations manage personal data, and the rights of individuals. It focuses on making sure the ways we collect, process, share, archive, and delete data are all in accordance with the law.<\/p>\n<p>ensure the privacy of data collected:<\/p>\n<ul>\n<li><b>Increasing data privacy awareness<\/b>. Make sure every member of your project team—plus the vendors, contractors, and other stakeholders from outside of your company—are made aware of your organization's data security and privacy protocols.<\/li>\n<li><b>Using security tools<\/b>. Free security tools, like encrypted storage solutions and password managers, can decrease your project’s vulnerability to a data breach. In a lot of applications, like ones that are part of Google Workspace and Microsoft OneDrive, privacy settings can be adjusted to only give access to specific individuals.<\/li>\n<li><b>Anonymizing data<\/b>. Data anonymization refers to one or more techniques such as blanking, hashing, or masking personal and identifying information to protect the identities of people included in the data. This helps protect individuals’ personal information by keeping them anonymous. Once the information has been anonymized, it can then be used and shared freely. Types of data that should be anonymized include names, telephone numbers, social security numbers, email addresses, photographs, and account numbers.<\/li>\n<\/ul>\n<h3 id=\"n2_10\">Data bias<\/h3>\n<p>Another important data ethics practice is making sure that the data you collect does not indicate any biases.  is a type of error that tends to skew results in a certain direction. Maybe the questions on your survey had a particular slant to influence answers, or maybe your sample group was not fully representative of the population you want to study. can also happen if a sample group lacks inclusivity.<\/p>\n<p>There are different types of biases:<\/p>\n<ul>\n<li><b>Sampling bias <\/b>is when a sample is not representative of the population as a whole. For example, maybe your sample did not include people above the age of 65. Or maybe you excluded people from certain socioeconomic groups.<\/li>\n<li><b>Observer bias <\/b>is the tendency for different people to observe things differently. For example, stakeholders from different parts of the world might view the same data differently and draw different conclusions from it.<\/li>\n<li><b>Interpretation bias<\/b> is the tendency to always interpret situations that don’t have obvious answers in a strictly positive or negative way, when, in fact there is more than one way to understand the data. Data that does not provide an obvious set of conclusions makes some people feel anxious, which can lead to interpretation bias. For example, a team member might interpret inconclusive survey results negatively, while other team members might be able to think more carefully and assess the data from different angles.<\/li>\n<li><b>Confirmation bias<\/b> is the tendency to search for or interpret information in a way that confirms pre-existing beliefs. For example, you might ask only specific stakeholders for feedback on parts of your project because you know they are the most likely to have the same perspective as you.<\/li>\n<\/ul>\n<p>“Ethics is about making the best possible decisions concerning people, resources, and the environment. Ethical choices diminish risk, advance positive results, increase trust, determine long term success, and build reputations. Leadership is absolutely dependent on ethical choices.”<\/p>\n<h3 id=\"n2_11\">Using data analysis to inform decisions<\/h3>\n<p>Data analysis is the process of collecting and organizing information to help draw conclusions.<\/p>\n<p>Businesses use data analysis to reveal important insights and patterns within their data that help inform actions and drive results.<\/p>\n<p>What you learn from your analysis becomes knowledge that powers smart solutions for your project.<\/p>\n<p>Project managers will often apply data analysis to look for repeated behaviors and to find a solution based on data predictions.<\/p>\n<p>\nsix main steps involved in data analysis: \n<\/p>\n\n<ul>\n<li>\n<b>Ask<\/b>: What is the problem? When defining the problem, look at the current state of the business and identify how it is different from the ideal state. You want to be as specific as possible. You also want to stay focused on the problem itself, not just the symptoms.\n<\/li>\n<li>\n<b>Prepare<\/b>: This is where you collect and store the data you will use for the upcoming analysis process. \n<\/li>\n<li>\n<b>Process<\/b>: You will “clean” your data, which means you will enter your data into a spreadsheet, or another tool of your choice, and eliminate any inconsistencies and inaccuracies that can get in the way of results.\n<\/li>\n<li>\n<b>Analyze<\/b>: You take a close look at your data to draw conclusions, make predictions, and decide on next steps. Here, you will transform and organize the data in a way that highlights the full scope of the results so you can figure out what it all means.<b> <\/b>\n<\/li>\n<li>\n<b>Share<\/b>: you use <b>data visualization<\/b> to organize your data in a format that is clear and digestible for your audience. When sharing, you can offer the insights you gained during your analysis to help stakeholders make effective, data-driven decisions for solving the problem.<b> <\/b>\n<\/li>\n<li>\n<b>Act<\/b>: Takes all of the insights you have provided and puts them into action to solve the original business problem. \n<\/li>\n<\/ul>\n\n<h3 id=\"n2_12\">Presenting data to tell a project´s story<\/h3>\n<p>\nStorytelling is the process of turning facts into narrative to communicate something to your audience. Storytelling is how you bring data to life and is a useful way to tell stakeholders within your organization about your project. \n<\/p>\n\n<p>Stories usually have a beginning, middle, and end.<\/p>\n<p>there are six main steps to storytelling:<\/p>\n<ul>\n<li><b><u>Define your audience:<\/u><\/b> it's important to know who you're presenting to. Are you presenting to project sponsors or executives? Or to team members? Define your audience and find out what matters most to them. Begin by asking yourself qualifying questions like: What would my audience want to know about the project? Or, what are their most urgent concerns? Which key data points influence the story and project outcome? This will set you up to know the type of story you want to tell and the type of data you should use to tell it.<\/li>\n<li><b><u>Collect the data:<\/u><\/b> begin searching for data from trustworthy resources to support the point you're trying to make. Leverage the relevant project resources in documents like your project plan or work management software to download and analyze key data points.<\/li>\n<li><b><u>Filter and analyze the data:<\/u><\/b> you'll need to vet it for credibility and filter the information.<\/li>\n<li><b><u>Choose a visual representation:<\/u><\/b> Visualizations are a great way to help people remember the information you're presenting and are an essential piece of storytelling. You can use data in different ways to tell a story, like using dashboards, charts, infographics, and mappings<\/li>\n<li><b><u>Shape the story:<\/u><\/b> Take some time to think about what you're hoping to achieve, the points you want to make, and the questions and concerns you want to answer.<\/li>\n<li><b><u>Gather your feedback:<\/u><\/b> Try getting feedback from someone who's not connected to the project. Their feedback can help you identify areas of your story that were unclear or unmemorable and give you a final chance to make adjustments.<\/li>\n<\/ul>\n<h3 id=\"n2_13\">Data visualization<\/h3>\n<p>is the graphical representation of information to facilitate understanding.<\/p>\n<p>They're useful for communicating data to others because they help filter information by focusing the audience on the most important data points and insights.<\/p>\n<p>more efficient way to summarize information because they condense long ideas and facts into a single image or representation, and crucially, they help the viewer make sense of and remember the information being presented<\/p>\n<h3 id=\"n2_14\">Dashboard<\/h3>\n<div class=\"cols\">\n<div class=\"col\">\n<p>\nis a type of user interface, typically a graph or summary chart, that provides a snapshot view of your project's progress or performance. It acts as a centralized location for project stakeholders to draw quick insights. It can display a tight summary of metrics, stats, and key performance indicators, or KPIs. \n<\/p>\n<\/div>\n<div class=\"col\">\n<p class=\"imgph\">Screenshot in Notion: Screenshot 2025-12-15 at 8.18.14 AM.png<\/p>\n<\/div>\n<\/div>\n<p>dashboards are great visualizations for efficient status updates because they enable you to group, summarize, and highlight top project data points.<\/p>\n<p>A <b><u>KPI<\/u><\/b> is a measurable value or metric that demonstrates how effective an organization is at achieving key objectives. They serve as a great aid in helping your team and stakeholders understand if you're on the right track.<\/p>\n<h3 id=\"n2_15\">Infographics<\/h3>\n<p>Are visual representations of information, such as data or facts, and are typically in the form of what we call at Google a \"one-pager\" or a \"one-sheeter.”<\/p>\n<p>they're typically concise summaries of that data.<\/p>\n<p>Through graphics or drawings, emphasizing the biggest points with added text for further explanation. Use infographics to present complex information quickly, professionally, and clearly, especially when you may not be present to share all the details yourself. Infographics should be able to communicate strong information without the need for extra support and explanation.<\/p>\n<h3 id=\"n2_16\">Show relationships<\/h3>\n<div class=\"cols\">\n<div class=\"col\">\n<p>\nA <b>scatter plot<\/b>, sometimes referred to as a scatter chart or scatter graph, uses dots to represent values for two different variables. The position of each dot on the horizontal and vertical axis indicates values for an individual data point. Scatter plots will sometimes have a line drawn across its center. This line is known as the trend line and highlights the direction the points are trending towards. \n<\/p>\n<p>Scatter plots show the relationship between data sets, and can help us understand the impact of one factor on another.<\/p>\n<\/div>\n<div class=\"col\">\n<p class=\"imgph\">Screenshot in Notion: Screenshot 2025-12-16 at 2.02.52 AM.png<\/p>\n<\/div>\n<\/div>\n<h3 id=\"n2_17\">Comparing values<\/h3>\n<div class=\"cols\">\n<div class=\"col\">\n<p>\n<b>Bar graphs<\/b> use size contrast to compare two or more values. \n<\/p>\n<p>Bar graph best practices:<\/p>\n<ul>\n<li>Use consistent colors throughout the chart<\/li>\n<li>Use accent colors to highlight important data points or changes over time<\/li>\n<li>Use horizontal labels so it is easier to read<\/li>\n<\/ul>\n<\/div>\n<div class=\"col\">\n<p class=\"imgph\">Screenshot in Notion: Screenshot 2025-12-16 at 2.04.31 AM.png<\/p>\n<\/div>\n<\/div>\n<h3 id=\"n2_18\">Demonstrating composition<\/h3>\n<div class=\"cols\">\n<div class=\"col\">\n<p>\nPie charts show us the <b>composition <\/b>of something. In other words, how much each part of something makes up the whole. \n<\/p>\n<p>Pie chart best practices:<\/p>\n<ul>\n<li>Avoid including too many categories so it is easy to compare slices<\/li>\n<li>Make sure that the slice values add up to 100%<\/li>\n<li>Order slices according to their size<\/li>\n<\/ul>\n<\/div>\n<div class=\"col\">\n<p class=\"imgph\">Screenshot in Notion: Screenshot 2025-12-16 at 2.06.12 AM.png<\/p>\n<\/div>\n<\/div>\n<h3 id=\"n2_19\"><b>Analyzing trends and behaviors  <\/b><\/h3>\n<div class=\"cols\">\n<div class=\"col\">\n<p><b>Line graphs <\/b>are a great tool for visually showing change over time, but they can be paired with other factors, too.<\/p>\n<p>Line graph best practices:<\/p>\n<ul>\n<li>To avoid clutter, don't show more than four categories.<\/li>\n<li>Organize highly variable data at the top of the chart to make it easy to read<\/li>\n<\/ul>\n<\/div>\n<div class=\"col\">\n<p class=\"imgph\">Screenshot in Notion: Screenshot 2025-12-16 at 2.07.21 AM.png<\/p>\n<\/div>\n<\/div>\n<h3 id=\"n2_20\">Giving effective presentations<\/h3>\n<ul>\n<li><b><u>Be precise:<\/u><\/b> Identify the problem you're solving for your audience and remove any content that dilutes your narrative. keep my presentation slides simple, including only the most relevant data points, to avoid overloading my audience with text they don't have time to read.<\/li>\n<li><b><u>Be flexible:<\/u><\/b> Consider the approach you'd take if you had to shorten your presentation from an hour to 30 minutes, or even just five. Practice to aboid mistakes that could distract from your message. Identify and come up with answers to potential audience questions. Imagine and prepare for possible objections<\/li>\n<li><b><u>Be memorable:<\/u><\/b> Develop a strategy that helps make your narrative unforgettable. Think back to effective storytelling. Use stories or repetition to help your audience remember information. be aware of your body language when presenting. Maintain an upright posture and rest your hands at your side. When making a point, try elevating your tone of voice for emphasis. Pace yourself by using intentional pauses and speak about half the speed you would normally speak while keeping your sentences short. Make eye contact with your audience and keep your facial expressions warm and friendly. Finally, have confidence.<\/li>\n<\/ul>\n<h3 id=\"n2_21\">Preparing an effective presentation<\/h3>\n<p><b><u>Preparation:<\/u><\/b><\/p>\n<ul>\n<li>\n<u>Get clear on your golas and the purpose of your presentation:<\/u> Be clear and specific about what you want to get out of the meeting, then frame the discussion with that goal in mind.\n<\/li>\n<li>\n<u>Seek input and set expectations:<\/u> Ask your manager or check with stakeholders regarding your presentation goals. Get their input and feedback ahead of time.\n<\/li>\n<li>\nCreate a delivery plan: \n\nIdentify a headline for each slide, which is the one-sentence main point that you are trying to illustrate with that slide.\n\n- Create a couple of supporting points that add interest to the headline, such as anecdotes, charts, data, etc.\n- Build in signposts. These are ways to clue the audience in to where you are going and what to expect with your presentation.\n- Limit the number of slides in the main presentation. At the same time, consider creating backup slides for potential challenges, difficult questions, trade-offs, or alternative solutions. You can hide these backup slides at the end of your presentation if you don’t need them, or add them into your presentation if you do.\n<\/li>\n<li>\n<b><u>Be mindful of your audience’s time:<\/u><\/b> Invite only participants who need to be there.\n<\/li>\n<li>\n<u>Develop a strategy for making your presentation memorable:<\/u>  Use stories and repeat key points.\n\n- Start with a strong intro. Spend extra prep time on the beginning. The beginning is when your nerves are typically the highest, and delivering the introduction successfully can help you quickly gain confidence.\n<\/li>\n<\/ul>\n\n<p><b><u>Practice:<\/u><\/b><\/p>\n<ul>\n<li><u>Guide your audience through your presentation:<\/u> Help them notice what you notice, and transition between slides by using phrases like “Building on this point . . .” or “As I mentioned before . . .”<\/li>\n<li><u>Do a mock presentation with your team:<\/u> If there will be more than one presenter, coordinate what each person will cover and how you will manage handoffs.<\/li>\n<li>Practice a question-and-answer (Q&amp;A) session, anticipating the kinds of questions your participants might ask so you are prepared with a quick and confident response. In addition, practice what you will say if you are asked a question that you don’t know the answer to.<\/li>\n<li>Be prepared to run the whole meeting yourself. If a co-presenter fails to show up, are you prepared to step in?<\/li>\n<li><u>Schedule time to practice:<\/u> Once you’ve outlined what you want to say, practice it—ideally in front of a mirror—or record yourself. This may help you identify awkward phrasing that could be improved and other issues.<\/li>\n<li>Be prepared for surprises: if time runs short, can you quickly summarize the key points? Can you pivot the content according to what is most important to your audience?<\/li>\n<\/ul>\n<p><b><u>Presentation and pace:<\/u><\/b><\/p>\n<ul>\n<li><u>Get right to the point:<\/u> Identify what problem you are solving and state it up front. Tell the audience why you are in the room with them and what you will be covering. Lay down the ground rules. For example, how do you want to handle questions and comments? Will you take them throughout your presentation or afterwards?<\/li>\n<li>Check your pace: Be mindful of clues from your audience and adjust accordingly<\/li>\n<\/ul>\n","s":[["n2_1","The value of data"],["n2_2","Benefits of using data"],["n2_3","Common types of project data"],["n2_4","Data, metrics and analytics"],["n2_5","Productivity metrics"],["n2_6","Quality metrics"],["n2_7","Discerning important data"],["n2_8","Data Ethics"],["n2_9","Data privacy"],["n2_10","Data bias"],["n2_11","Using data analysis to inform decisions"],["n2_12","Presenting data to tell a project´s story"],["n2_13","Data visualization"],["n2_14","Dashboard"],["n2_15","Infographics"],["n2_16","Show relationships"],["n2_17","Comparing values"],["n2_18","Demonstrating composition"],["n2_19","Analyzing trends and behaviors"],["n2_20","Giving effective presentations"],["n2_21","Preparing an effective presentation"]],"w":false},{"g":"Project management","t":"Leadership and influencing skills","h":"\n<h3 id=\"n3_1\">Team<\/h3>\n<p>A group of people who plan, solve problems, make decisions, and review progress in service of a specific project or objective<\/p>\n<h3 id=\"n3_2\">Work groups<\/h3>\n<p>People in an organization who work toward a common goal. Work groups are more likely to be coordinated, controlled, or assignad by a single person or entity<\/p>\n<p>\nProject managers develop and lead effective teams by fostering a culture of teamwork. Teamwork is an effective collaborative way of working in which each person is committed to and heading toward a shared goal. Teamwork maximizes the individual strength of each team member to bring out the best in each person. \n<\/p>\n\n<ul>\n<li>\n<u>Teamwork fosters creativity:<\/u> diverse perspectives, skills and experiences of their members to devise better solutions and build products that address more diverse user needs than they might have if they were working independently of each other.\n<\/li>\n<li>\n<u>Teamwork also encourages accountability:<\/u> The knowledge that the execution of your tasks directly impacts the tasks of the rest of the team can be a powerful motivator.\n<\/li>\n<li>\n<u>Teamwork helps you get stuff done:<\/u> complex projects need smart, capable people to complete tasks and to reach milestones to meet the project goals. \n<\/li>\n<\/ul>\n\n<h3 id=\"n3_3\">Factors that impact team effectiveness<\/h3>\n<ul>\n<li><u>Psychological safety:<\/u> An individual's perception, of the consequences of taking an Interpersonal risks.  they believe it's safe to take risks within their team and they don't risk being labeled as ignorant, incompetent, negative or disruptive. On teams with high psychological safety, teammates feel comfortable taking risks around fellow team members, seeking differing opinions and resolving interpersonal conflict when it comes up<\/li>\n<li><u>Dependability:<\/u> Members are reliable and complete their work on time. Creating a dependable team requires the combination of setting, negotiating and meeting expectations.<\/li>\n<li><u>Structure and clarity:<\/u> An individual's understanding of job expectations, knowledge of how to meet those expectations and the consequences of their performance. Each team member has a clear sense of their individual role, plans and goals. And they have a sense of how their work affects the group.<\/li>\n<li><u>Meaning:<\/u> Finding a sense of purpose either in the work itself or in the results of that work.<\/li>\n<li><u>Impact:<\/u> The belief that the results of one's work matters and creates change.<\/li>\n<\/ul>\n<h3 id=\"n3_4\">Build a high-functioning team<\/h3>\n<ul>\n<li>create systems that turn chaos into order<\/li>\n<li>Communicate and listen<\/li>\n<li>Promote trust and psychological safety<\/li>\n<li>Demonstrate empathy and create motivation<\/li>\n<li>Delegate responsibility and prioritize<\/li>\n<li>Celebrate team's success<\/li>\n<\/ul>\n<h3 id=\"n3_5\">Air cover<\/h3>\n<p>\nrefers to support for and protection of a team in the face of out-of-scope requests or criticism from leadership. \n<\/p>\n\n<p>when you will need to prioritize the needs of your team over the wants of your stakeholders<\/p>\n<p> <\/p>\n\n<h3 id=\"n3_6\">Team development and managing team dynamics<\/h3>\n<p>\nTo understand how your team might develop over time - Bruce Tuckman's five stages of team development: \n<\/p>\n\n<ul>\n<li>\n<b><u>Forming:<\/u><\/b>\n\n<ul>\n<li>\nEverything feels shiny and new\n<\/li>\n<li>\nIndividuals on the team are just getting to know on another, and they're eager to make a good impression\n<\/li>\n<li>\nExcited for the work to begin\n<\/li>\n<li>\nProject manager should clarify project goals, roles, and context about the project. \n<\/li>\n<\/ul>\n<\/li>\n<li>\nStorming: \n\n- Feelings of frustration might emerge.\n- Project manager should focus on conflict resolution, listen as the team addresses problems to solve, and share insights on how the team might better function as a unit\n<\/li>\n<li>\nNorming: \n\n- Conflict is mostly resolved and team is working together\n- Project manager should codify the team norms, ensure that the team is aware of those norms, and reinforce them when needed\n<\/li>\n<li>\nPerforming: \n\n- Team works together seamlessly\n- Project manager should focus on delegating, motivating, and providing feedback to keep up the team’s momentum\n<\/li>\n<li>\nAdjourning:\n\n- Project wraps up\n- Team disbands\n- Celebrate final milestones and successes\n<\/li>\n<\/ul>\n\n<p>Team dynamics refer to the forces both conscious and unconscious, that impact team behavior and performance.<\/p>\n<h3 id=\"n3_7\">Why managing team dynamics is important<\/h3>\n<ul>\n<li>Teams have individuals with different skill sets, varying degrees of autonomy, and competing priorities<\/li>\n<li>Create a collaborative and psychologically safe environment<\/li>\n<li>Helps you understand how to motivate your team<\/li>\n<\/ul>\n<h3 id=\"n3_8\">Ethical leadership<\/h3>\n<p>A form of leadership that promotes and values honesty, justice, respect, community and integrity<\/p>\n<p>promoting ethical leadership:<\/p>\n<ul>\n<li>Defining and aligning values within your team<\/li>\n<li>Demonstrating how adhering to those values benefits the mission of the organization<\/li>\n<\/ul>\n<p>Create forums where employees can:<\/p>\n<ul>\n<li>\nRaise viewpoints\n<\/li>\n<li>\nFeel heard\n<\/li>\n<li>\nReceive follow-ups on their concerns \n<\/li>\n<\/ul>\n\n<p>Inclusive leadership aims to put what we’ve heard into action to create an environment that encourages and empowers each and every member of our community<\/p>\n<h3 id=\"n3_9\">Inclusive leadership<\/h3>\n<p>A form of leadership where everyone’s unique identity, background, and experiences are respected, valued, and integrated into how the team operates<\/p>\n<h3 id=\"n3_10\">Diversity<\/h3>\n<p>The set of differences each of us possesses, whether visible or invisible, that give us each a unique perspective on the world and our work<\/p>\n<h3 id=\"n3_11\">Inclusion<\/h3>\n<p>What the team does with the diversity of thought and perspective<\/p>\n<h3 id=\"n3_12\">Project managers lead inclusivity by<\/h3>\n<ul>\n<li>Fostering a culture of respect:<\/li>\n<li>Modeling the values of your organization<\/li>\n<li>Taking appropiate action<\/li>\n<li>Creating a comfortable environment for communication<\/li>\n<li>Recognizing team contributions<\/li>\n<li>Creating an equal opportunity yo succeed<\/li>\n<li>Regular communication<\/li>\n<li>Accessible documentation<\/li>\n<li>Regular check-ins with the team<\/li>\n<li>Inviting and integrating diverse perspectives<\/li>\n<li>Create a sense of psychological safety<\/li>\n<li>Invite teammates to share thoughts, ideas, and concerns<\/li>\n<\/ul>\n<p><b>Ethics<\/b> can be defined as the principles of conduct governing an individual or a group.<\/p>\n<p class=\"imgph\">Screenshot in Notion: Screenshot 2025-12-18 at 3.02.40 PM.png<\/p>\n\n<p><b>Recognize an ethical issue<\/b><\/p>\n<p>\nask yourself questions about the nature of the issue. \n<\/p>\n\n<ul>\n<li>\nCould your decision negatively impact another person or group of people? \n<\/li>\n<li>\nDoes the issue go beyond what is legal or efficient? \n<\/li>\n<\/ul>\n\n<p><b>Get the facts<\/b><\/p>\n<p>Decide what you should do about the issue, and seek answers as needed.<\/p>\n<p><b>Evaluate alternative actions<\/b><\/p>\n<p>alternative actions by asking yourself the following questions:<\/p>\n<ul>\n<li>“Which option will produce the most good and do the least harm?”<\/li>\n<li>“Which option best respects the rights of all who have a stake?”<\/li>\n<li>“Which option treats people equally or proportionally?”<\/li>\n<li>“Which option best serves the community as a whole, not just some members?”<\/li>\n<li>“Which option leads me to act as the sort of person I want to be?”<\/li>\n<\/ul>\n<p><b>Make a decision and test it<\/b><\/p>\n<p>\n test it by imagining the reaction to your choice from a person whose opinion you value. \n<\/p>\n\n<p><b>Act and reflect on the outcome<\/b><\/p>\n<p>Consider how to carry out your decision with thoughtfulness and care, and after you act, consider the results of your decision.<\/p>\n<h3 id=\"n3_13\">Steps to effective influencing<\/h3>\n<p>\n Influencing is the ability to alter another person's thinking or behaviors\n<\/p>\n\n<p>1- <b><u>Establish credibility:<\/u><\/b> make the case for why your audience should listen to you. You need to demonstrate to your audience that you're an expert on a given topic, whether that's through professional experience, extensive research, or something else, and you need to demonstrate relationship credibility by establishing that you're honest, trustworthy, and someone who they want to work with.<\/p>\n<p>2- <b><u>Frame for common ground:<\/u><\/b> make the case for how your idea can benefit your audience. What about your idea will appeal to them, and how will they stand to benefit from agreeing to your idea?<\/p>\n<p>3- <b><u>Provide evidence:<\/u><\/b> make your case through hard data and persuasive storytelling. Numbers aren't strong enough on their own. They need stories to liven them up.<\/p>\n<p>\n4- <b><u>Connect emotionally:<\/u><\/b> Demonstrate to your audience that you're emotionally committed to your idea and you'll do your best to match their emotional state. \n<\/p>\n\n<p>Common influencing mistakes<\/p>\n<ul>\n<li>Approaching the audience aggressively<\/li>\n<li>Resisting compromise<\/li>\n<li>Failing to stablish credibility, frame for common ground, or connect emotionally<\/li>\n<\/ul>\n<h3 id=\"n3_14\">Using sources of power to influence<\/h3>\n<p>Most power sources fall into two buckets:<\/p>\n<ul>\n<li>\n<b><u>Organizational<\/u><\/b>: include your role, information, network, and reputation. \n<\/li>\n<li>\n<b><u>Personal<\/u><\/b>: Power sources that come from you. Which include knowledge, expressiveness, history, and character. \n<\/li>\n<\/ul>\n\n<h3 id=\"n3_15\">Organizational<\/h3>\n<p>\n<b><u>Role:<\/u><\/b> Refers to your position within an organization or team. \n<\/p>\n\n<p>In a project management role, you have a certain level of power over the project, and therefore more influence.<\/p>\n<p><b><u>Information:<\/u><\/b> Refers to your level of access and control over information. As a project manager, you possess a huge amount of information about your work and your stakeholders, which can work to your benefit.<\/p>\n<p>To be a good influencer you should ask questions and consider all ideas. You may even hear new insights and notice issues in a different way.<\/p>\n<p><b><u>Network:<\/u><\/b> Refers to people you're connected with professionally and personally. Strong connections within your organization and beyond it can boost your ability to influence others and help your project continue on<\/p>\n<p>\nYou should use your network to help colleagues make new connections. Your team's effectiveness will increase as you take on the responsibility of helping each person develop their skills and expand their network, which in turn increases their own influencing power. \n<\/p>\n\n<p><b><u>Reputation:<\/u><\/b> Refers to how others perceive you overall. People with positive reputations tend to be more influential than those with negative reputations.<\/p>\n<h3 id=\"n3_16\">Personal<\/h3>\n<p>\n<b><u>Knowledge:<\/u><\/b> Refers to the power that you draw from your expertise in certain subjects, your unique abilities and skill sets, and even your ability to learn new things. \n<\/p>\n\n<p>\n<b><u>Expressiveness:<\/u><\/b> Refers to your ability to communicate with others. Strong communication skills like these can significantly increase your ability to influence others. \n<\/p>\n\n<p><b><u>History:<\/u><\/b> Refers to the level of personal history there is between yourself and another person<\/p>\n<p><b><u>Character:<\/u><\/b> Refers to other people's view of the qualities that make you, you. Like, honesty, integrity, kindness, and so much more<\/p>\n<h3 id=\"n3_17\">Creating an effective influencing statement<\/h3>\n<p><b>Influencing<\/b> is the ability to alter another person’s thinking or behaviors.<\/p>\n<p>Conger’s four steps:<\/p>\n<ol>\n<li><b>Establish credibility: <\/b>Ask yourself, why should this person listen to you?<b> <\/b>By<b> <\/b>showing a level of expertise on the topic at hand. You can also build credibility through strong relationships with your audience and others around you<\/li>\n<li><b>Frame for common ground: <\/b>By making a case for how your idea would benefit your audience, and you can determine how your ideas will benefit your audience by gaining a strong understanding of them and what they value.<\/li>\n<li><b>Provide evidence: <\/b>They share stories, examples, and metaphors to help influence their audiences. Using vivid language can help bring your figures to life and draw stakeholders’ interest to your proposal.<\/li>\n<li><b>Connect emotionally: <\/b> Illustrate that you are emotionally invested in the idea that you are presenting. Determine and match the emotional state of your audience.<\/li>\n<\/ol>\n<h3 id=\"n3_18\">Project document responsibilities<\/h3>\n<ul>\n<li>How documents get used<\/li>\n<li>Who has access to documents<\/li>\n<li>How often the documents get updated<\/li>\n<\/ul>\n<h3 id=\"n3_19\">Principles of effective email writing<\/h3>\n<ul>\n<li>State what you want clearly<\/li>\n<li>Keep the content short and concise<\/li>\n<li>Structure your writing<\/li>\n<li>Check grammar, punctuation, and spelling<\/li>\n<\/ul>\n<p><b><u>State what you want clearly:<\/u><\/b><\/p>\n<p>\nBefore composing an email, think about what you want, when you need what you want, and the best way to get what you want when you want it. \n<\/p>\n\n<p>Some tips:<\/p>\n<ul>\n<li>Include your request in the subject line of your email.<\/li>\n<li>State your request within the first two paragraphs of your email message.<\/li>\n<li>Indicate the specific call-to-action associated with your request (for example, reply, review, RSVP).<\/li>\n<li>Write clear, concise sentences when providing details.<\/li>\n<li>Define terms. Avoid using acronyms and terminology that users may not know. Provide additional information as necessary to avoid misunderstanding.<\/li>\n<\/ul>\n<p><b><u>Keep the content concise:<\/u><\/b><\/p>\n<ul>\n<li>Summarize the content you want to convey, and remove anything in your email that doesn’t contribute to your goal.<\/li>\n<li>Aim to write “question-less” and “self-standing” emails. This means that the message contains enough information to stand on its own. The reader shouldn’t have any questions about what you want and when you want it.<\/li>\n<li>Know your audience. Some people—such as executives and other busy leadership—may not want to read emails of more than a few sentences or click on external links for further information. Try to tailor your emails accordingly.<\/li>\n<\/ul>\n<p><b><u>Structure your writing:<\/u><\/b><\/p>\n<ul>\n<li><b>Use bullets<\/b>. Bullets break up the visual flow. If you have more than one of something, consider using bullets. Write strong action verbs at the start of each bullet.<\/li>\n<li><b>Use labels<\/b>. Labels help guide the reader to what information is most important.<\/li>\n<li><b>Add hyperlinks<\/b>. Hyperlinks allow readers to directly access additional information, rather than adding lengthy details to your email.<\/li>\n<li><b>Write a strong topic sentence<\/b>. Place the main idea of the paragraph in the topic sentence.<\/li>\n<\/ul>\n<p><b><u>Check the grammar, punctuation and spelling:<\/u><\/b><\/p>\n<p>\nTurning grammar and spelling suggestions on in your email application can help you quickly identify errors. Be sure to correct any errors before sending off. \n<\/p>\n\n<p>Example: Issac was given the task of sending an email about the company’s annual team building retreat.<\/p>\n<p class=\"imgph\">Screenshot in Notion: Screenshot 2026-01-04 at 4.57.11 PM.png<\/p>\n\n<h3 id=\"n3_20\">Common communication tools<\/h3>\n<p>\n<b><u>Email<\/u><\/b> \n<\/p>\n\n<p>\nis standard for business communications, so it's important to streamline the number of emails that you send out. \n<\/p>\n\n<p>\nCarefully select who you're sending an email to, and most importantly, be conscious of why you're sending it. \n<\/p>\n\n<p>\nMake sure the subject field clearly states what the email is about. \n<\/p>\n\n<p>\nIf it's urgent or requires a response, add that to the subject and the first line of the email. \n<\/p>\n\n<p>Keep your messages as short as possible and stay on topic.<\/p>\n<p>Your language choices matter, so avoid slang, acronyms, and shortcuts for words that might be more appropriate for texts.<\/p>\n<p><b><u>Instant messaging <\/u><\/b><\/p>\n<p>helps reduce back and forth emails or phone calls that can quickly clear up miscommunications or let you know if and when you should take an issue to a meeting.<\/p>\n<p>This kind of quick communication could lead to distraction and informality. It can easily become an outlet to share non work related information or information that sensitive or confidential.<\/p>\n<p>\nAsk people's preferences on how they like to be communicated with. \n<\/p>\n\n<p><b><u>Virtual meeting tools<\/u><\/b><\/p>\n<p>like Google Meet and Zoom are great for communicating, especially as remote work becomes more standard.<\/p>\n<p>\nallow you and your team to interact in real-time. Which can help boost morale and create a sense of team when it's not possible to be together in person. \n<\/p>\n\n<p>can be highly engaging, as attendees can access and share files during the meeting.<\/p>\n<p><b><u>Work management and collaboration tools<\/u><\/b><\/p>\n<p>\nlike Google Drive, Asana, and Smartsheet. These kinds of tools make it easier to share information among teams, even better with work management and collaboration tools information sharing goes both ways. \n<\/p>\n\n<p>\nTeam members can easily update their progress without the need for extra meetings or phone calls. \n<\/p>\n\n<p>These tools can accomplish many different things like tracking progress on tasks, deliverables, and milestones.<\/p>\n<p>allow you to focus your communications within the context of specific tasks, project details and timeline.<\/p>\n<p>the work gets done in real time. These tools allow remote teams to collaborate and communicate as though they're physically working in the same office together.<\/p>\n<h3 id=\"n3_21\">How to organize effective meetings<\/h3>\n<p>Meetings can be an effective method to distribute information, communicate with your team and stakeholders, and help keep a project on track<\/p>\n<p>Effective meetings always have the following elements in common:<\/p>\n<ul>\n<li>\n<b><u>Structured:<\/u><\/b> they start and end on time. The attendees have been carefully selected. The meeting topics are prioritized. And the designated note taker has been assigned. It's good to think about and set expectations for how long you expect the group to spend on a given topic. This is defined as timeboxing, which just means you're setting a time limit for discussion. In a timebox, you give each topic a buffer of a few minutes to make sure you're not over packing your agenda.\n<\/li>\n<li>\n<b><u>Intentional:<\/u><\/b>  They have a clearly stated purpose and expectations, which should be in the meeting agenda as well as the meeting invite. So everyone understands why they're attending. The agenda needs to set clear expectations for what needs to occur before and during the meeting. It helps attendees prepare, keeps everyone focused on the right topics, and clarifies meeting expectations and goals. \n<\/li>\n<li>\n<b><u>Collaborative:<\/u><\/b> Is when people work together to produce or create something.<br />There are lots of ways to make your meetings collaborative, even if the purpose is for one person to share important information with the rest of the group. One easy way to do this is to be sure the agenda isn’t just full of presentations where participants are talked at. Be sure the agenda is clear about the objectives of the session.\n<\/li>\n<li>\n<b><u>Inclusive:<\/u><\/b> Is the practice or policy of including people who might otherwise be excluded or marginalized\n<\/li>\n<\/ul>\n\n<h3 id=\"n3_22\">Facilitating inclusive and accesible meetings<\/h3>\n<p>Effective meetings generally have four elements in common: they are structured, intentional, collaborative, and inclusive<\/p>\n<p>In order to help facilitate inclusive meetings that feel empowering to everyone, you should put procedures in place that are consistently followed and predictable.<\/p>\n<ul>\n<li>\nFormalize initial check-ins for the group that build understanding and ensure everyone knows their input is needed. Create a process that consistently asks each person for an update on their work and/or how they are doing in their daily lives.\n<\/li>\n<li>\nGive everyone your full attention. \n<\/li>\n<li>\nHelp all participants to be heard. \n<\/li>\n<li>\nHelp participants feel comfortable sharing different perspectives.\n<\/li>\n<\/ul>\n\n<p>When planning your meetings, you should consider the needs of people experiencing the following types of disabilities:<\/p>\n<ul>\n<li><b>Hearing loss and deafness<\/b><\/li>\n<li><b>Visual impairments and blindness<\/b><\/li>\n<li><b>Mobility disabilities<\/b>, which means having difficulty getting around, such as people who require wheelchairs or canes<\/li>\n<li><b>Neurological disorders<\/b><\/li>\n<\/ul>\n<h3 id=\"n3_23\">Checklist for productive meetings<\/h3>\n<p>Plenty of things can make meetings unproductive, productive meetings have three elements in common:<\/p>\n<ol>\n<li>Active participation from attendees<\/li>\n<li>A clear and concise agenda that is followed throughout<\/li>\n<li>The correct attendees (meaning the participants can contribute to achieving the meeting’s goal)<\/li>\n<\/ol>\n<p><u>Before the meeting<\/u><\/p>\n<ul>\n<li>Prepare an agenda that states the purpose and goals of the meeting, and share the agenda with participants.<\/li>\n<li>Only invite people who need to be there<b> <\/b>and who can help reach the goals of the meeting. Make participants’ roles and responsibilities for the meeting clear. Add non-essential participants as optional to the meeting invitation.<\/li>\n<li>If you are working with people in different time zones, share the time zone burden by alternating recurring meeting times.<\/li>\n<li>Evaluate the need for the meeting and cancel if it isn’t necessary. Consider whether the meeting content can be covered via email.<\/li>\n<li>Schedule shorter meetings. Meetings tend to expand to the time allotted to them, so try to get more done in a shorter amount of time.<\/li>\n<li>Set aside time to prepare for the meeting. Read the necessary materials, review the agenda, and come ready to participate.<\/li>\n<\/ul>\n<p><u>During the meeting<\/u><\/p>\n<ul>\n<li>At the beginning of the meeting, clearly state the meeting goals.<b> <\/b>Stick to the agenda throughout the meeting to avoid getting derailed.<b> <\/b>For recurring meetings, review the action items from the previous meeting to ensure accountability.<\/li>\n<li>Encourage participants to put phones and laptops away during meetings and silence notifications, if possible.<\/li>\n<li>Practice and demonstrate active listening. Respond verbally (e.g., “That makes sense. Tell us more.”) and non-verbally (through head nodding and eye contact) to show engagement.<\/li>\n<li>Encourage participation and give everyone a chance to speak<b>,<\/b> including remote participants. Ask open-ended questions like, “What does everyone think?” instead of “Does everyone agree?”<\/li>\n<li>Help everyone relax and feel more comfortable<b> <\/b>by starting meetings with open-ended, personal questions like, “How was your weekend?”<\/li>\n<li>Capture key points, action items, and decisions from the meeting, and assign action items to the appropriate meeting participants.<\/li>\n<\/ul>\n<p><u>After the meeting<\/u><\/p>\n<ul>\n<li>Recap key decisions, action items, timelines, and notes and send out to participants.<\/li>\n<li>Schedule necessary follow-up meetings with relevant context.<\/li>\n<li>Assess the need for and frequency of recurring meetings. Schedule meetings less frequently, if possible.<\/li>\n<\/ul>\n<h3 id=\"n3_24\">Most common types of meeting<\/h3>\n<p><b><u>1- Project kick-off:<\/u><\/b> The official beginning of a project and serves as a way to align the team’s understanding of the project with actual plans and procedures. Attendes: members of your team, senior management and key stakeholde<\/p>\n<p><b><u>2- Status updates:<\/u><\/b> Includes regular team meetings where the primary goal is to align the team on updates, progrtess, challenges, and next steps. Is a tool throughout the life cycle of a project to check in on the project. Topics: task updates, schedule status, budget status, current or anticipated issues and action items<\/p>\n<p>Discuss current or anticipated issues like changes, risks, resource issue, vendor issue<\/p>\n<p>Action items is a task on your list that needs to be completed<\/p>\n<p>Are beneficial because they provide an opportunity for recognizing milestones, sharing information, and raising concerns to the team<\/p>\n<p>To determine the frequency depends on the project complexity, number of team members, level of information required by the project sponsor, clients, and others<\/p>\n<p><b><u>3- Stakeholders reviews:<\/u><\/b> The goal is to get buy-in and support. Stakeholders, each have their own set of tools, know-how, and expertise. Most meetings are limited to communicating critical information. Present a project update. Start the meeting witha. short overall projects’s status update of 2-5 minutes<\/p>\n<p>Seek and listen to feedback<\/p>\n<p>Make a decision or resolve a major issue<\/p>\n<p>Generally are more formal, it’s normal to prepare reading materials and documents to review ahead of time to help get people in the right mindset for the metting<\/p>\n<p>The frequency will depend on why the stakeholder is involved in the project<\/p>\n<p><b><u>4-Project reviews:<\/u><\/b> It’s called a retrospective, includes reviewing lessons learned about what’s going well, what you should keep doing, and what can be improved. Equally important to celebrate the project’s success<\/p>\n<h3 id=\"n3_25\">Execute your meetings more efficiently with AI<\/h3>\n<p>Write a prompt like this:<\/p>\n<blockquote>\n<p>Summarize the following meetings notes in a succinct, two paragraph email that identifies the key points and action items. Include a friendly opening line and a warm sign-off.<\/p>\n<\/blockquote>\n","s":[["n3_1","Team"],["n3_2","Work groups"],["n3_3","Factors that impact team effectiveness"],["n3_4","Build a high-functioning team"],["n3_5","Air cover"],["n3_6","Team development and managing team dynamics"],["n3_7","Why managing team dynamics is important"],["n3_8","Ethical leadership"],["n3_9","Inclusive leadership"],["n3_10","Diversity"],["n3_11","Inclusion"],["n3_12","Project managers lead inclusivity by"],["n3_13","Steps to effective influencing"],["n3_14","Using sources of power to influence"],["n3_15","Organizational"],["n3_16","Personal"],["n3_17","Creating an effective influencing statement"],["n3_18","Project document responsibilities"],["n3_19","Principles of effective email writing"],["n3_20","Common communication tools"],["n3_21","How to organize effective meetings"],["n3_22","Facilitating inclusive and accesible meetings"],["n3_23","Checklist for productive meetings"],["n3_24","Most common types of meeting"],["n3_25","Execute your meetings more efficiently with AI"]],"w":false},{"g":"Project management","t":"Project Charter","h":"\n<p>A formal document that clearly defines the project and outlines the necessary details to reach the project’s goals<\/p>\n<p>The PM creates the chartes during the initiation phase, which is the first phase of the project life cycle<\/p>\n<ul>\n<li>Helps organize vital project information<\/li>\n<li>Helps create a framework for the work that needs to be done<\/li>\n<li>Helps communicate these details to the necessary people<\/li>\n<li>Is useful as a reference<\/li>\n<\/ul>\n<p>Contains:<\/p>\n<ul>\n<li>Summary: Provide an overview of the project and to outline the goals you hope to accomplish<\/li>\n<li>Goals: The desired results of the project, address the overall result that the stakeholders are aiming to achieve. They are determined by input from stakeholders and the PM<\/li>\n<li>Deliverables: specific tasks and tangible outcomes that enable the team to meet project goals.<\/li>\n<li>Scope: the boundaries of a project.<\/li>\n<\/ul>\n<p>the charter contains information about work that's out-of-scope. Details that don't contribute to the project's goals are considered out of scope.<\/p>\n<p>Discuss how to use the charter as a tool to get the project’s stakeholders in alignment about the project’s scope and goals<\/p>\n<p>Any time you're communicating the details of your project, you need to think about your audience and what information is important to them<\/p>\n<ul>\n<li>\nWho are your stakeholders? \n<\/li>\n<li>\nWhat details are most important to them?\n<\/li>\n<li>\nAre there project details that they might disagree with? \n<\/li>\n<\/ul>\n\n<p>a project charter is also an alignment tool. Here, alignment refers to reaching agreement between two or more parties.<\/p>\n<p>That's why it's so important to align with your stakeholders before the work begins.<\/p>\n<p>When presenting a project chartes to stakeholders:<\/p>\n<ul>\n<li>Collect feedback<\/li>\n<li>Identify where there are misalignments<\/li>\n<li>Make changes to address those alignments<\/li>\n<\/ul>\n<p>Documenting misalignments and their resolutions in the project chartes allows you to reference those decisions later on<\/p>\n<p>to make a goal SMART<\/p>\n<p>Look out for subjective words, such as:<\/p>\n<ul>\n<li>Bigger<\/li>\n<li>Better<\/li>\n<li>Faster<\/li>\n<\/ul>\n<p>Connect with your stakeholders and define these terms, add numbers to your terms<\/p>\n<h3 id=\"n4_1\">Benchmarking<\/h3>\n<p>Evaluating success against a standard<\/p>\n<p>One best practice for determining the relevance of your project goals is to notice how closely your project goals align with the wider goals of your company or organization.<\/p>\n<p>\n a tool for organization-wide goal setting called objectives and key results, or OKRs. \n<\/p>\n\n<p>OKRs combine a goal and a metric to determine a measurable outcome.<\/p>\n<p>\n<b>Stakeholder management<\/b> is the process of maintaining good relationships with the people who have the most influence on your work. it encourages good communication, teamwork, trust among members, and so much more. \n<\/p>\n\n<p>Someone's position on the grid shows you the actions you have to take with them:<\/p>\n<ul>\n<li><b>Higher power<\/b>, <b>higher interest<\/b>: These people are your highest priority. You must manage them closely and make every effort to fully engage with them.<\/li>\n<li><b>Higher power<\/b>, <b>lower interest<\/b>: These people require a high level of effort to keep satisfied, as far as the success of the project is concerned, but do not want to be overburdened with project communications.<\/li>\n<li><b>Lower power<\/b>, <b>higher interest<\/b>: Show consideration to these people by keeping them adequately informed. Talk to them to ensure that no major issues are arising. These people can often be very helpful with the details of your project.<\/li>\n<li><b>Lower power<\/b>, <b>lower interest<\/b>: Monitor these people, but do not overload them with excessive communication. These people require minimal effort.<\/li>\n<\/ul>\n<h3 id=\"n4_2\">Finding mutually beneficial solutions<\/h3>\n<p>\npersuasion and negotiation are constructive tools you can use to enhance communication, clarify wants and needs, and achieve workable solutions for everyone involved. \n<\/p>\n\n<p>Being skilled at persuasion and negotiation will also boost your level of influence. It's important that you view the people you're negotiating with as your colleagues and peers, not as opponents. That's why you do a stakeholder analysis—so you can get to know your stakeholders as people, with their own jobs and responsibilities, and as partners who want the project to succeed.<\/p>\n<p>Mutual benefit is when all parties involved gain some kind of benefit or advantage. For example, let's say there's a disagreement over how many people to hire for a project.<\/p>\n<h3 id=\"n4_3\">Conger’s steps to effectively influence:<\/h3>\n<ul>\n<li>Establish credibility<\/li>\n<li>Frame form common ground<\/li>\n<li>Provide evidence<\/li>\n<li>Connect emotionally<\/li>\n<\/ul>\n<p>One way is to form a coalition<\/p>\n<p>A coalition is a temporary alliance or partnering of individuals or groups in order to achieve a common purpose or to engage in a joint activity.<\/p>\n<p>this can:<\/p>\n<ul>\n<li>Boosts your credibility<\/li>\n<li>Find common ground and provide evidence<\/li>\n<li>Can connect emotionally<\/li>\n<\/ul>\n<p>An effective coalition includes people with the right mix of influence or power and interest.<\/p>\n<h3 id=\"n4_4\">Tips for defining project tasks<\/h3>\n<ul>\n<li>Define project tasks in one or two sentences<\/li>\n<\/ul>\n<p>When writing descriptions of project tasks, keep them to one or two sentences long. If you find that a certain task description needs to be longer than one or two sentences, this indicates that the task is complex and could be broken down into smaller tasks or that it may need further clarification.<\/p>\n<ul>\n<li>Look at project task dependencies<\/li>\n<\/ul>\n<p>\nwhat has to be completed or handed off from one person to another before work on each task can begin. Identifying dependencies can help you decide how much a task needs to be broken down. \n<\/p>\n\n<ul>\n<li>Enlist help from team members<\/li>\n<\/ul>\n<p>\nIs helpful for your team to be involved in the task breakdown process. \n<\/p>\n\n<ul>\n<li>Define project tasks by the amount of time they will take to complete<\/li>\n<\/ul>\n<p>\nDefining project tasks by the amount of time they’re expected to take will reveal any especially lengthy tasks. If a task is expected to take a long time, it could indicate that there are additional subtasks that need to be defined. Identifying tasks by time is helpful for scheduling other tasks or events around the longer tasks. \n<\/p>\n\n<ul>\n<li>Identify project tasks by their “done” factors<\/li>\n<\/ul>\n<p>Begin with the end in mind: What does it mean for the task to be considered “done”? From there, you can work backwards to see if you’ve missed any steps and identify checkpoints for completion along the way<\/p>\n<h3 id=\"n4_5\">\nTips for project research \n<\/h3>\n\n<ul>\n<li>Search online for news coverage of similar projects at other companies<\/li>\n<li>Search online for research on topics related to your project.<\/li>\n<li>Research similar projects in other industries<\/li>\n<li>Review your list of tasks and research the specifics of executing that work<\/li>\n<\/ul>\n<h3 id=\"n4_6\">Analyzing key conversations<\/h3>\n<p>Discussions with other people working on the project can help you uncover missing tasks or clarify smaller subtasks<\/p>\n<p>Some ways:<\/p>\n<ul>\n<li>brainstorming with team members assigned to similar or related tasks<\/li>\n<li>Holding one-on-one conversations with team members about tasks<\/li>\n<li>consulting with other people in your organization who are experts on given tasks<\/li>\n<li>having conversations with stakeholders.<\/li>\n<\/ul>\n<p>The right level of detail to include in your task list will vary from project to project and team to team<\/p>\n<h3 id=\"n4_7\">Ordering tasks and identifying milestones<\/h3>\n<ul>\n<li>List all the necessary tasks in your project plan<\/li>\n<li>Rearrenge the tasks in the order in which your team needs to complete them<\/li>\n<li>Consider the natural sequence of tasks<\/li>\n<li>Consider dependencies or prerequisites for each task<\/li>\n<li>Determine milestones<\/li>\n<li>Identify points in the project plan where you can test the work completed so far<\/li>\n<li>Identify tasks stakeholders have a particular interest in<\/li>\n<li>Identify tasks that carry a high risk or signal the completion of a phase or major task<\/li>\n<\/ul>\n","s":[["n4_1","Benchmarking"],["n4_2","Finding mutually beneficial solutions"],["n4_3","Conger’s steps to effectively influence:"],["n4_4","Tips for defining project tasks"],["n4_6","Analyzing key conversations"],["n4_7","Ordering tasks and identifying milestones"]],"w":false},{"g":"Project management","t":"Closing a project","h":"\n<p>Project closing refers to the process performed to formally complete the project, the current phase, and contractual obligations<\/p>\n<p>There are 3 criteria that make up a project closing:<\/p>\n<p>\n1- Make sure the work is done. \n<\/p>\n\n<p>\n2- Ensure that the agreed upon project management processes are executed \n<\/p>\n\n<p>3- Get formal recognition from stakeholders that the project is done<\/p>\n<p><u>Never-ending<\/u> project exists when the project deliverables and tasks cannot be completed<\/p>\n<p><u>Abandoned<\/u> project exists when inadequate handoff or transition on the project deliverables occurs<\/p>\n<h3 id=\"n5_1\">Steps to conducting a closing process after each phase or milestone:<\/h3>\n<ul>\n<li>Refer to prior documentation<\/li>\n<li>Statement of Work<\/li>\n<li>Request for proposal<\/li>\n<li>Risk register<\/li>\n<li>RACI chart<\/li>\n<li>Put together closing documentation<\/li>\n<li>Conduct administrative closure of the procurement process<\/li>\n<li>Make sure all stakeholders are aware that a phase, or project, is ending<\/li>\n<li>Execute necessary follow-up work<\/li>\n<\/ul>\n<h3 id=\"n5_2\">Steps to conducting a closing process at the end of your project<\/h3>\n<ul>\n<li>Provide the necessary training, tools, documentation, and capability to use your product<\/li>\n<li>Ensure that the project has satisfied its goals and desired outcomes<\/li>\n<li>Document acceptance from all stakeholders<\/li>\n<li>Review all contracts and documentation with the team<\/li>\n<li>Conduct a formal retrospective<\/li>\n<li>Disband and thank the project team<\/li>\n<\/ul>\n<h3 id=\"n5_3\">Impact reporting<\/h3>\n<p>\nPresentation that is given at the end of a project for key stakeholders. How the project landed in terms of time, scope, and budget. \n<\/p>\n\n<p>State when the new service or product launch and discuss any available feedback from users, and you’ll explain how the desired outcomes were achieved<\/p>\n<p>\nhow to demonstrate the impact of your project to your stakeholders through <b>impact reporting<\/b>. Impact reporting is a presentation or formal report prepared for key stakeholders at the end of a project. \n<\/p>\n\n<p>\nThe purpose is to show your key stakeholders the impact your project had on the organization. Goals, objectives, budget, schedules, and key performance indicators (KPIs) need to be determined at the beginning of your project. Your impact report should demonstrate how well you did against those early targets. \n<\/p>\n\n<p>answer the question: What was the problem we were trying to solve, and how did we solve it?<\/p>\n<p>Highlight these key performance areas to demonstrate to your stakeholders how you achieved successful results and outcomes:<\/p>\n<ul>\n<li>First, describe the goals and objectives you set for the project and what you hoped to have achieved by the end.<\/li>\n<li>Then, describe how you met those objectives against your KPIs. A KPI is a measurable value that demonstrates how effective a company is at achieving their objectives. In your impact report, review how you defined the success of your project at the beginning, and highlight the outcomes you achieved that demonstrate this success.<\/li>\n<li>Finally, showcase your schedule and budget performance by outlining your cost savings and efficiencies. Demonstrate that you met the deadlines set in your project scope and that your project was completed within budget.<\/li>\n<\/ul>\n<h3 id=\"n5_4\">Use metrics to showcase your results<\/h3>\n<ul>\n<li>Improvement in schedule performance<\/li>\n<li>Revenue growth<\/li>\n<li>Positive return on investment (ROI)<\/li>\n<li>Increased external user counts<\/li>\n<li>Increased percentage of internal users<\/li>\n<li>Cost vs. margins<\/li>\n<li>High percentage of customer satisfaction<\/li>\n<li>Reduction in overhead<\/li>\n<li>Reduction in technical issues<\/li>\n<li>Time saved<\/li>\n<\/ul>\n<h3 id=\"n5_5\">Closing process for the team<\/h3>\n<p>A retrospective is a meeting aimed to discuss successes, failures and possible future improvements on the project. They can occur after a major milestone completion and at the end of a project<\/p>\n<p>Three benefits of retrospectives:<\/p>\n<ul>\n<li>\nEncourage team building: Allow team members to understand differing perspectives\n<\/li>\n<li>\nFacilitate improved collaboration\n<\/li>\n<li>\nPromote positive changes in future procedures and processes \n<\/li>\n<\/ul>\n\n<h3 id=\"n5_6\">Closing process for the project manager<\/h3>\n<p>A project closeout report is a document created by project managers for project managers, and serves three major purposes:<\/p>\n<ul>\n<li>\n It’s a blueprint to document what the team did, how they did it, and what they delivered\n<\/li>\n<li>\nProvides an evaluation of the quality of work\n<\/li>\n<li>\nEvaluates the project’s performance with respect to budget and schedule\n<\/li>\n<\/ul>\n\n<p>Include the following things:<\/p>\n<ul>\n<li>Executive summary: a description of the process and what the purpose of the project was<\/li>\n<li>A list of Key accomplishments: Highlight the team’s accomplishments, as well as the overall impact of the project<\/li>\n<li>Lessons learned: What went well? and why?, What went wrong? And why?, What processes did not work well? and why?, What are the effects of key problem areas? Why?, technical challenges, suggestions for next time<\/li>\n<li>Open items: Thing you didn’t get to, ideas you had that you’d like to do if you only had more time<\/li>\n<li>Next step and future considerations: Are there expected follow-up projects? And, us there any ongoing maintenance required?<\/li>\n<li>Project timeline (milestones, dates, issues)<\/li>\n<li>Resources and project archive (project proposal, project plan, dashboards, meeting minutes)<\/li>\n<\/ul>\n","s":[["n5_1","Steps to conducting a closing process after each phase or milestone:"],["n5_2","Steps to conducting a closing process at the end of your project"],["n5_3","Impact reporting"],["n5_4","Use metrics to showcase your results"],["n5_5","Closing process for the team"],["n5_6","Closing process for the project manager"]],"w":false},{"g":"Agile and Scrum","t":"Agile","h":"\n<h3 id=\"n6_1\">\nWaterfall \n<\/h3>\n\n<p>is a popular project management methodology that refers to the sequential or linear ordering of phases. You complete one phase at a time, not proceeding to the next until it is done. You move down line like a waterfall, starting at the top of the mountain and traveling to the bottom.<\/p>\n<h3 id=\"n6_2\">Agile<\/h3>\n<p>Refers to being able to move quickly and easily, also to flexibility and the willingness and ability to change and adapt.<\/p>\n<p>Projects that adopt an agile project management take an iterative approach, the project processes are repeated often many times during the life cycle of the project - Many shorters blocks of time called iterations<\/p>\n<p>During each iteration, the team takes a subset of all the project’s activities and does all the work required to complete that subset of activities.<\/p>\n<p>Enable the project to move quickly, as well as making it much more adaptive to change.<\/p>\n<p>In Project management is an approach to project and team management based on the Agile manifesto<\/p>\n<p>Waterfall is linear and sequential and does not encourage changing up the process once it is started.<\/p>\n<p>Agile is iterative, flexible and incorporates necessary changes throughout the process. Agile values, principles, and frameworks have been applied to every industry<\/p>\n<p>Agile aims to get customer feedback more quickly, we focus on streamlining the process without reducing product quality or value<\/p>\n<p>Reduce waste<\/p>\n<h3 id=\"n6_3\">Aspects of a project<\/h3>\n<ul>\n<li>\nRequirements: conditions that must be met or tasks that must be finished to ensure the successful completion of the project.\n<\/li>\n<li>\nDocumentation\n<\/li>\n<li>\nDeliverables: is a tangible outcome from a project. \n<\/li>\n<\/ul>\n\n<h3 id=\"n6_4\">The four values of the Agile Manifesto<\/h3>\n<p>1- <b><u>Individuals and interactions<\/u><\/b> over processes and tools<\/p>\n<p>2- <b><u>Working software<\/u><\/b> over comprehensive documentation<\/p>\n<p>3- <b><u>Customer collaboration<\/u><\/b> over contract negotiation<\/p>\n<p>4- <b><u>Responding to change<\/u><\/b> over following a plan<\/p>\n<blockquote>\n<p>That is, wile there is value in the items on the right, we value the items on the left more<\/p>\n<\/blockquote>\n<h3 id=\"n6_5\">The 12 principles of the Agile manifesto<\/h3>\n<p>The four themes of the Agile principles are:<\/p>\n<ul>\n<li>\nValue delivery: How Agile teams deliver highly valuable products to their customers\n<\/li>\n<li>\nBusiness Collaboration: How do Agile teams collaborate with their business partners and stakeholders to create business value to the organization and their users? \n<\/li>\n<li>\nTeam Dynamics and Culture: how does a team create and maintain the right interpersonal and team dynamics to deliver value for the customers and the business?\n<\/li>\n<li>\nRetrospectives and Continuous Learning: How does the project learn to continuously increase performance of an organization and business?\n<\/li>\n<\/ul>\n\n<p>Under the first theme: <b><u>Value Delivery<\/u><\/b> we have 5 principles<\/p>\n<p>1- Our highest priority is to satisfy the customer through early and continuous delivery of valuable software<\/p>\n<p>2- Deliver working software frequently, from a couple of weeks toa. couple of months, with a preference for the shorter timescale<\/p>\n<p>3- Working software is the primary measure of progress<\/p>\n<p>4- Simplicity - The art of maximizing the amount of work not done - is essential<\/p>\n<p>5- Continuous attention to technical excellence and good design enhances agility<\/p>\n<p>The second theme: Business Collaboration has 2 principles<\/p>\n<p>6- Welcome changing requirements, even late in development. Agile processes harness change for the customer’s competitive advantage<\/p>\n<p>7- Business people and developers must work together daily throughout the project<\/p>\n<p>The third theme: Team Dynamics and Cultures<\/p>\n<p>8- Build projects around motivated individuals. Give them the environment and support they need, and trust them to get the job done<\/p>\n<p>9- The most efficient and effective method of conveying information to and within a development team is face-to-face conversation<\/p>\n<p>10- Agile processes promote sustainable development. The sponsors, developers, and users should be able to maintain a constant pace indefinitely<\/p>\n<p>11- The best architectures, requirements, and designs emerge from self-organizing teams<\/p>\n<p>The last theme: Retrospectives and Continuous Learning<\/p>\n<p>12- At regular intervals, the team reflects on how to become more effective, then tunes and adjust its behavior accordingly<\/p>\n<p>Questions for improvement:<\/p>\n<ul>\n<li>How is the team doing?<\/li>\n<li>Are the customers happy?<\/li>\n<li>Are there processes we could optimize? Are our tools working for us?<\/li>\n<li>Are we following the values?<\/li>\n<li>Are we accumulating any debt, technical or otherwise?<\/li>\n<\/ul>\n<h3 id=\"n6_6\">VUCA<\/h3>\n<p>An acronym that defines the conditions that affect organizations in a changing complex world<\/p>\n<p>Stands for:<\/p>\n<ul>\n<li>Volatility: Refers to the rate of change and churn in a business or situation<\/li>\n<li>Uncertainty: Refers to the lack of predictability or high potential for surprise<\/li>\n<li>Complexity: refers to the high number of interrelated forces, issues, organizations, and factors that would influence the project<\/li>\n<li>Ambiguity: Refers to the possibility of misunderstanding the conditions and root causes of events or circumstances.<\/li>\n<\/ul>\n<p>When starting a new project, it;s helpful to examine the environment and conditions in which the project exists before deciding the best approach to use<\/p>\n<p>If the project has high levels of VUCA parameters, it’s a good sign you should consider an Agile approach<\/p>\n<p>An Agile approach will lead to better outcomes by giving you and your team tools and systems to mitigate VUCA risks<\/p>\n","s":[["n6_2","Agile"],["n6_3","Aspects of a project"],["n6_4","The four values of the Agile Manifesto"],["n6_5","The 12 principles of the Agile manifesto"],["n6_6","VUCA"]],"w":false},{"g":"Agile and Scrum","t":"Scrum overview","h":"\n<p>Refers to a formation in rugby, where a group of players on a team, lead forward, lock their heads together, and then work as one unit to try and gain precious yards towards the scoring line<\/p>\n<p>When you use Scrum for project management, you form a team that will work together to quickly develop and test a deliverable. The work is completed in short cycles, and the team meets daily to discuss current tasks and clear up anything that’s blocking their progress<\/p>\n<ul>\n<li><b><u>Product Backlog:<\/u><\/b> Is the central artifact in SCRUM, where all possible ideas, deliverables, features, or tasks are captured for the team to work on. It’s prioritized and proactively managed by the team continuously throughout the life of the project<\/li>\n<li><b><u>Sprint:<\/u><\/b> The name of the time-boxed period in SCRUM where work is done. Can be between one and four weeks long, most are two weeks. This is called the iteration<\/li>\n<li><b><u>Daily Scrum:<\/u><\/b> A meeting of 15 or fewer minutes every day of the Sprint<\/li>\n<li>Roles:<\/li>\n<li>Scrum Master: Responsible for ensuring the team lives Agile values and principles, follows the processes and practices that the team agreed to, shares information to the larger project team, and help the team focus on doing their best work<\/li>\n<li>Product Owner: Responsible for maximizing the value of the product and the work of the team, owns the inventory of work and has the final say in how to prioritize the work<\/li>\n<li>Development Team: Responsible for how a team will deliver that product<\/li>\n<\/ul>\n<p>Is popular because various reasons:<\/p>\n<ul>\n<li>Clear roles and responsibilities, while continuously emphasizing the power of the team as a whole<\/li>\n<li>Regular and predictable meeting and delivery schedules, formats, and outcomes<\/li>\n<li>Supports and reinforces the Agile values and principles, while adding structure and foundations that help new Agile teams get started and more experienced teams get better<\/li>\n<li>Free and open for all to use. Huge amounts of online guidance and support, as well as Scrum specific training and certifications<\/li>\n<\/ul>\n<p>Characteristics of a team help to move the Scrum downfield:<\/p>\n<ul>\n<li>Built-in instability<\/li>\n<li>Self-organizing teams<\/li>\n<li>Overlapping development phases<\/li>\n<li>Multi-learning<\/li>\n<li>Subtle control<\/li>\n<li>Organizational transfer of learning<\/li>\n<\/ul>\n<h3 id=\"n7_1\">Kanban<\/h3>\n<p>\nis a methodology that can be applied in a very simple way, or it can be used to drive the entire project. The Kanban name comes from two japanese words. \"Kan\" meaning \"sign,\" and \"ban\" meaning \"board.\" \n<\/p>\n\n<p>Kanban boards or charts display the progress of a project as to do in progress and done<\/p>\n<p>Benefits of Kanban:<\/p>\n<ul>\n<li>Provides transparent visual feedback<\/li>\n<li>Ensures that the project team only accepts a sustainable amount of in progress work. Work-in-Progress (WIP) Limit, tasks are limited to what the team can actually handle during a certain amount of time<\/li>\n<\/ul>\n<p>The WIP limit is decided on by the team. This is a reflection of agile in that teams are both self organizing and empowered, and they're operating at a sustainable pace. The team members add new tasks to be completed only after they finished their previous task and are below the WIP limit. This approach means that once a task is started to be worked on, it becomes a priority for the whole team to get it to done. By focusing on less work, the work gets done faster. This goal of trying to maximize efficiency is called flow, and is a core principle of Kanban<\/p>\n<h3 id=\"n7_2\">XP<\/h3>\n<p>\nAnother Agile methodology, extreme programming (XP). \n<\/p>\n\n<p>\nAims to improve product quality and the ability to respond to changing customer needs. It does this by taking best practices for the development process to extreme levels. \n<\/p>\n\n<p>There are four basic activities that are performed during the product development process that the XP method tries to enhance:<\/p>\n<ul>\n<li>Designing: in software development, this is where you write a design document describing the parts of the code or instructions for the product and how it will function<\/li>\n<li>Coding: code is the language that's used to write software programs. It's the instructions that tell the computer what to do. XP demands clear and concise code, so that others can easily read and understand the program<\/li>\n<li>Testing: like I described earlier means checking the product for flaws so they don't end up in the final product. In XP, more is better. The goal is to test for and eliminate any flaws in a feature before building it and continuing on.<\/li>\n<li>Listening: To the customer and ensuring that the requirements are integrated into the product<\/li>\n<\/ul>\n<p>XP Innovative Practice<\/p>\n<ul>\n<li>Pair programming:<\/li>\n<li>Two team members work together at the same time on one task<\/li>\n<li>Continuous integration and Continuous Refactoring:<\/li>\n<li>Merging product changes into a shared version of the product<\/li>\n<li>Avoid big design Up Front:<\/li>\n<li>Design is just enough to get started and should be continuously improved as the product evolves<\/li>\n<li>Write test, not requirements:<\/li>\n<li>Embed product requirements into the test plan<\/li>\n<\/ul>\n<h3 id=\"n7_3\">LEAN<\/h3>\n<p>5 principles:<\/p>\n<p><b>1- <\/b><b><u>Define value:<\/u><\/b
