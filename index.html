<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guía de estudio Product Owner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE everyday study tool, calm and focused
   IDEA a study desk: decks of index cards grouped in four parts, plus the official guide as the reference book
   PICTURE the large current card itself, with its deck drawn as a stack; the guide reads like a clean book page
   COLOUR deep green band, white cards, lime-white for progress, coral for mistakes and interview tags
   TYPE Inter Tight 700 + Inter
   LAYOUT green band with title, progress and tabs; parts as bands of module cards; phone stacks */
:root{color-scheme:light dark;--bg:light-dark(#f4f7f5,#0d1513);--card:light-dark(#ffffff,#16211e);--ink:light-dark(#101a17,#e6efea);--soft:light-dark(#4a5a55,#a9bab3);--line:light-dark(#d9e3de,#2a3a35);--green:#00463c;--lime:#e6f5c8;--coral:#e0533d;--ok:light-dark(#1d7a50,#5fd39a);--okbg:light-dark(#e3f4ea,#173326);--badbg:light-dark(#fde8e4,#3a1d18);--keybg:light-dark(#eef7dc,#22301b);--hi:light-dark(#00463c,#e6f5c8)}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
html{scroll-padding-top:16px}
body{background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Inter Tight",Inter,sans-serif;letter-spacing:-.02em;line-height:1.08;margin:0}
.top{background:var(--green);color:#fff;padding:clamp(24px,4vw,44px) max(5vw,16px) 0}
.wrap{max-width:1100px;margin:0 auto}
.top h1{font-size:clamp(30px,5vw,46px);text-wrap:balance}
.top p{margin:8px 0 0;color:#cfe5dc;max-width:66ch}
.prog{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 14px;align-items:center;margin-top:20px;max-width:640px}
.track{height:10px;background:rgba(255,255,255,.18);border-radius:6px;overflow:hidden}
.track i{display:block;height:100%;background:var(--lime);border-radius:6px;transition:width .4s}
.prog b{white-space:nowrap;color:var(--lime);font-weight:600;font-size:15px}
.tabs{display:flex;gap:4px;margin-top:22px;overflow-x:auto}
.tabs button{flex:none;font:600 15px Inter,sans-serif;border:0;background:transparent;color:#cfe5dc;padding:12px 16px;border-radius:10px 10px 0 0;cursor:pointer;min-height:44px}
.tabs button[aria-selected=true]{background:var(--bg);color:var(--ink)}
button:focus-visible,.mod:focus-visible,a:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
main{padding:clamp(20px,3vw,40px) max(5vw,16px) 56px}
.part{margin-top:34px}
.part h2{font-size:clamp(24px,3vw,30px)}
.part>p{margin:6px 0 14px;color:var(--soft)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.mod{all:unset;box-sizing:border-box;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:8px;min-height:180px}
.mod:hover{border-color:var(--green)}
.mod .n{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font:600 14px Inter;color:var(--soft)}
.mod h3{font-size:21px}
.mod p{margin:0;color:var(--soft);font-size:15px;flex:1}
.tag{font:600 13px Inter;padding:2px 9px;border-radius:20px;white-space:nowrap}
.tag.ex{background:var(--okbg);color:var(--ok)}
.tag.en{background:var(--badbg);color:light-dark(#a8361f,#ff9a85)}
.mbar{height:6px;background:var(--line);border-radius:4px;overflow:hidden}
.mbar i{display:block;height:100%;background:var(--ok)}
.mstate{font-size:14px;color:var(--soft)}
.mstate.done{color:var(--ok);font-weight:600}
.intro{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.box h2{font-size:24px;margin-bottom:8px}
.box p,.box li{color:var(--soft);margin:6px 0}
.box ul{padding-left:20px;margin:6px 0}
.deck{max-width:760px;margin:0 auto}
.crumb{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.crumb h2{font-size:clamp(24px,3.4vw,32px)}
.stack{position:relative;padding-bottom:14px}
.stack::before,.stack::after{content:"";position:absolute;left:14px;right:14px;bottom:6px;height:20px;background:var(--card);border:1px solid var(--line);border-radius:16px;z-index:0}
.stack::after{left:28px;right:28px;bottom:0;opacity:.7}
.card{position:relative;z-index:1;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:clamp(22px,4vw,40px);min-height:360px;display:flex;flex-direction:column;gap:14px;box-shadow:0 8px 24px rgba(0,40,30,.08);animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.card{animation:none}.track i{transition:none}}
.card .k{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font:600 14px Inter;color:var(--soft)}
.card h3{font-size:clamp(24px,3.6vw,32px)}
.card .body p{margin:0 0 10px}
.card .body ul{margin:0 0 10px;padding-left:22px}
.card .body li{margin:5px 0}
.key{background:var(--keybg);border-radius:12px;padding:14px 16px;margin-top:auto}
.key b{display:block;font-size:14px;margin-bottom:2px}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:16px 0}
.dots span{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots span.on{background:var(--hi)}
.nav{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.btn{font:600 16px Inter,sans-serif;min-height:46px;padding:10px 20px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn.pri{background:var(--green);border-color:var(--green);color:#fff}
.btn.sm{min-height:40px;padding:8px 14px;font-size:15px}
.btn:disabled{opacity:.4;cursor:default}
.btn.on{background:var(--hi);border-color:var(--hi);color:var(--bg)}
.q{font-size:clamp(20px,2.8vw,24px);font-family:"Inter Tight",Inter,sans-serif;font-weight:700;line-height:1.25;margin:0}
.opts{display:grid;gap:10px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;min-height:48px;background:var(--card)}
.opt:hover:not([disabled]){border-color:var(--green)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--coral);background:var(--badbg)}
.opt[disabled]{cursor:default}
.why{border-radius:12px;padding:14px 16px;background:var(--keybg)}
.why b{display:block}
.score{font:700 clamp(56px,10vw,88px)/1 "Inter Tight",sans-serif;letter-spacing:-.03em}
.pass{color:var(--ok)}.fail{color:var(--coral)}
.miss{border-top:1px solid var(--line);padding:12px 0}
.miss p{margin:4px 0}
.miss .s{color:var(--soft);font-size:15px}
.week{display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;border-top:1px solid var(--line);padding:20px 0}
.week h3{font-size:22px}
.week .w{font:700 40px/1 "Inter Tight",sans-serif;color:var(--hi)}
.week ul{margin:8px 0 0;padding-left:20px}.week li{margin:6px 0}
.note{font-size:14px;color:var(--soft);margin-top:24px}
a{color:inherit}
.gbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.seg{display:flex;gap:6px}
.toc{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;margin-bottom:8px;border-bottom:1px solid var(--line)}
.toc button{flex:none;font:500 14px Inter;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:8px 14px;min-height:40px;cursor:pointer}
.book{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:clamp(22px,4vw,48px);max-width:820px;margin:0 auto}
.book h2{font-size:clamp(26px,3.4vw,32px);margin:36px 0 12px}
.book h2:first-of-type{margin-top:8px}
.book h3{font-size:22px;margin:26px 0 8px}
.book h4{font-size:18px;margin:20px 0 6px}
.book p{margin:0 0 12px;max-width:70ch}
.book ul,.book ol{margin:0 0 12px;padding-left:24px;max-width:70ch}
.book li{margin:5px 0}
.book .flash{animation:fl 1.6s ease}
@keyframes fl{from{background:var(--keybg)}to{background:transparent}}
.attr{font-size:14px;color:var(--soft);max-width:820px;margin:0 auto 14px}
@media(max-width:700px){.intro{grid-template-columns:minmax(0,1fr)}.week{grid-template-columns:minmax(0,1fr);gap:4px}.card{min-height:300px}.nav .btn{flex:1 1 auto}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <h1>Guía de estudio Product Owner</h1>
    <p>Preparación para la certificación PSPO I (Professional Scrum Product Owner I) y para entrevistas de Product Owner. Incluye la Scrum Guide 2020 completa y tus notas del curso de Google Project Management.</p>
    <div class="prog">
      <div class="track"><i id="pbar1" style="width:0"></i></div><b id="ptxt1"></b>
      <div class="track"><i id="pbar2" style="width:0"></i></div><b id="ptxt2"></b>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" id="t-mod" data-tab="mod" aria-selected="true">Módulos</button>
      <button role="tab" id="t-guia" data-tab="guia" aria-selected="false">Scrum Guide</button>
      <button role="tab" id="t-plan" data-tab="plan" aria-selected="false">Plan de 4 semanas</button>
      <button role="tab" id="t-exam" data-tab="exam" aria-selected="false">Simulacro final</button>
    </div>
  </div>
</header>
<main><div class="wrap" id="view"></div></main>

<script>
{
const D={"MD":{"agile":{"t":"Agile y el Manifiesto Ágil","d":"Waterfall frente a Agile, los 4 valores, los 12 principios y cuándo conviene cada enfoque.","tag":"en","cards":[{"h":"Waterfall frente a Agile","b":"<p><b>Waterfall</b> (cascada) ordena el trabajo en fases secuenciales: se termina una antes de pasar a la siguiente, y cambiar el rumbo a mitad de camino es caro.</p><p><b>Agile</b> trabaja en <b>iteraciones cortas</b>: en cada una, el equipo toma una parte del trabajo y la hace completa. Así recibe opiniones del cliente antes, se adapta a los cambios y reduce el desperdicio sin bajar la calidad.</p>","k":"Waterfall no es \"lo malo\". Sirve cuando los requisitos son estables o hay regulaciones estrictas. En una entrevista suma mostrar criterio para elegir, no fanatismo."},{"h":"Los 4 valores del Manifiesto Ágil","b":"<ul><li><b>Individuos e interacciones</b> por sobre procesos y herramientas.</li><li><b>Software que funciona</b> por sobre documentación exhaustiva.</li><li><b>Colaboración con el cliente</b> por sobre negociación de contratos.</li><li><b>Responder al cambio</b> por sobre seguir un plan.</li></ul><p>El cierre del Manifiesto: lo de la derecha tiene valor, pero se valora más lo de la izquierda.</p>","k":"Ágil no significa \"sin documentación\" ni \"sin plan\". Es una cuestión de prioridad."},{"h":"Los 12 principios, en 4 temas","b":"<ul><li><b>Entrega de valor</b> (principios 1 a 5): satisfacer al cliente con entregas tempranas y continuas; entregar seguido, mejor en semanas que en meses; el producto que funciona es la medida principal de progreso; simplicidad, es decir, maximizar el trabajo que no se hace; excelencia técnica.</li><li><b>Colaboración con el negocio</b> (6 y 7): aceptar cambios aunque lleguen tarde; negocio y desarrolladores trabajan juntos todos los días.</li><li><b>Equipo y cultura</b> (8 a 11): personas motivadas con el apoyo y la confianza que necesitan; conversación cara a cara; ritmo sostenible; equipos autoorganizados.</li><li><b>Mejora continua</b> (12): el equipo reflexiona a intervalos regulares y ajusta su forma de trabajar.</li></ul>","k":"\"Simplicidad: el arte de maximizar el trabajo que no se hace\" es una de las frases que más se citan en entrevistas de producto."},{"h":"Cuándo conviene un enfoque ágil","b":"<p>Antes de elegir enfoque, mirá el entorno con el modelo <b>VUCA (Volatility, Uncertainty, Complexity, Ambiguity)</b>:</p><ul><li><b>Volatilidad:</b> qué tan rápido cambia la situación.</li><li><b>Incertidumbre:</b> cuánto se puede predecir.</li><li><b>Complejidad:</b> cuántos factores se influyen entre sí.</li><li><b>Ambigüedad:</b> cuánto riesgo hay de malinterpretar las causas.</li></ul><p>Si los cuatro son altos, conviene un enfoque ágil.</p>","k":"Conecta con la Scrum Guide: Scrum existe para \"problemas complejos\"."},{"h":"Combinar Waterfall y Agile","b":"<p>Muchas organizaciones trabajan de forma híbrida. Razones habituales:</p><ul><li>Los interesados o clientes se sienten más cómodos con un enfoque tradicional, aunque el equipo ya use Scrum.</li><li>Hay requisitos regulatorios que exigen ciertos procesos tradicionales.</li><li>Un proveedor trabaja de forma tradicional y hay que integrarse con él.</li></ul>","k":"Buena pregunta para hacer en una entrevista: \"¿Qué tan abierta es la dirección a combinar enfoques?\""}],"qz":[{"q":"¿Qué caracteriza a Waterfall?","o":["Fases secuenciales: se termina una antes de empezar la siguiente","Iteraciones cortas con entregas frecuentes","Equipos autogestionados sin plan","Cambios bienvenidos en cualquier momento"],"a":0,"w":"Waterfall es lineal y secuencial; cambiar a mitad de camino es costoso."},{"q":"¿Cuál de estos es un valor del Manifiesto Ágil?","o":["Responder al cambio por sobre seguir un plan","Seguir un plan por sobre responder al cambio","Documentación exhaustiva por sobre software que funciona","Negociación de contratos por sobre colaboración con el cliente"],"a":0,"w":"Los otros tres invierten el orden de los valores."},{"q":"Según el Manifiesto, ¿qué lugar tiene la documentación?","o":["Tiene valor, pero se valora más el software que funciona","No tiene valor y hay que eliminarla","Es lo más importante del proyecto","Solo la escribe el Product Owner"],"a":0,"w":"Lo de la derecha tiene valor; se valora más lo de la izquierda."},{"q":"Según los principios ágiles, ¿cuál es la medida principal de progreso?","o":["El producto que funciona","Las horas trabajadas","El porcentaje del plan cumplido","La cantidad de reuniones hechas"],"a":0,"w":"Principio 7 del Manifiesto: el software que funciona es la medida principal de progreso."},{"q":"Un proyecto tiene mucha volatilidad, incertidumbre y complejidad. ¿Qué enfoque conviene?","o":["Un enfoque ágil","Waterfall estricto","Ninguno: hay que esperar a que se estabilice","Planificar todo al detalle antes de empezar"],"a":0,"w":"Cuanto más alto el entorno VUCA (Volatility, Uncertainty, Complexity, Ambiguity), más conviene un enfoque ágil."}],"g":null},"lean":{"t":"Lean, Kanban y otros marcos","d":"Los principios Lean, el tablero Kanban, Extreme Programming y cómo se relacionan con Scrum.","tag":"en","cards":[{"h":"Los 5 principios Lean","b":"<ul><li><b>Definir el valor</b> desde lo que quiere el cliente, involucrándolo.</li><li><b>Mapear el flujo de valor:</b> todos los pasos que producen valor, cuestionando los que son desperdicio.</li><li><b>Crear flujo:</b> que el trabajo avance sin trabas.</li><li><b>Establecer el \"pull\":</b> que el cliente tire del producto pidiendo funcionalidades y entregas.</li><li><b>Buscar la perfección:</b> mejorar continuamente los cuatro pasos anteriores.</li></ul>","k":"Scrum se apoya en el pensamiento Lean: reducir el desperdicio y enfocarse en lo esencial."},{"h":"Kanban","b":"<p>Kanban viene de dos palabras japonesas: \"kan\" (señal) y \"ban\" (tablero). El tablero muestra el trabajo en columnas: por hacer, en curso y hecho.</p><p>Su herramienta clave es el <b>límite de WIP (Work In Progress)</b>, es decir, de trabajo en curso. Lo decide el equipo, y nadie empieza algo nuevo hasta estar por debajo del límite. Al enfocarse en menos cosas, el trabajo se termina más rápido: eso es el <b>flujo</b>.</p>","k":"La idea se resume en \"dejar de empezar y empezar a terminar\"."},{"h":"Extreme Programming","b":"<p>XP (Extreme Programming) busca mejorar la calidad llevando las buenas prácticas de desarrollo al extremo:</p><ul><li><b>Programación en pares:</b> dos personas trabajan juntas en una misma tarea.</li><li><b>Integración continua:</b> los cambios se unen seguido a una versión compartida.</li><li><b>Evitar el gran diseño inicial:</b> diseñar lo justo para empezar y mejorar sobre la marcha.</li><li><b>Escribir pruebas en lugar de requisitos.</b></li></ul>","k":"Con tus 5 años como desarrollador, esta es una conversación en la que tenés ventaja frente a otros candidatos a Product Owner."},{"h":"Agile, Scrum, Kanban y XP","b":"<p><b>Agile</b> es la filosofía y la mentalidad. <b>Scrum</b>, <b>Kanban</b> y <b>XP (Extreme Programming)</b> son formas concretas de llevarla a la práctica:</p><ul><li>Scrum: Sprints, responsabilidades y eventos fijos.</li><li>Kanban: flujo continuo y límites de trabajo en curso.</li><li>XP (Extreme Programming): excelencia técnica.</li></ul><p>Muchos equipos los combinan, por ejemplo con un tablero Kanban dentro de un Sprint.</p>","k":"Si te preguntan la diferencia entre Agile y Scrum: Agile es el \"por qué\", Scrum es un \"cómo\"."}],"qz":[{"q":"¿Para qué sirve el límite de trabajo en curso en Kanban?","o":["Para limitar el trabajo simultáneo y que el trabajo fluya","Para medir las horas de cada persona","Para fijar la fecha de entrega","Para decidir quién hace cada tarea"],"a":0,"w":"Al enfocarse en menos cosas a la vez, el trabajo se termina más rápido."},{"q":"¿Quién decide el límite de trabajo en curso?","o":["El equipo","El gerente","El cliente","El Product Owner"],"a":0,"w":"Lo decide el equipo, coherente con la idea de equipos autoorganizados."},{"q":"¿Cuál es el primer principio Lean?","o":["Definir el valor desde lo que quiere el cliente","Reducir costos de personal","Planificar todo de antemano","Maximizar la utilización de los recursos"],"a":0,"w":"Todo parte de entender qué valora el cliente."},{"q":"La programación en pares es una práctica de:","o":["Extreme Programming","Kanban","Waterfall","Lean"],"a":0,"w":"XP (Extreme Programming) lleva las buenas prácticas de desarrollo al extremo."},{"q":"¿Cuál es la relación entre Agile y Scrum?","o":["Agile es la filosofía y Scrum es un marco que la lleva a la práctica","Son lo mismo con distinto nombre","Scrum es la filosofía y Agile un marco","Scrum es una variante de Waterfall"],"a":0,"w":"Agile es la mentalidad; Scrum es un marco concreto."}],"g":null},"fund":{"t":"Fundamentos de Scrum","d":"Qué es Scrum, en qué teoría se apoya, sus pilares y sus valores.","tag":"ex","cards":[{"h":"Qué es Scrum","b":"<p>Scrum es un <b>marco de trabajo liviano</b> que ayuda a personas, equipos y organizaciones a generar valor con soluciones adaptativas para <b>problemas complejos</b>.</p><p>El ciclo básico: el Product Owner ordena el trabajo en un Product Backlog, el Scrum Team convierte una parte en un Increment de valor durante un Sprint, el equipo y los interesados inspeccionan el resultado y se adaptan. Y se repite.</p>","k":"Scrum es incompleto a propósito: define solo lo mínimo necesario y deja espacio para que cada equipo sume sus propias prácticas."},{"h":"Teoría: empirismo y Lean","b":"<p><b>Empirismo:</b> el conocimiento viene de la experiencia y las decisiones se toman sobre lo observado, no sobre lo que se predijo.</p><p><b>Pensamiento Lean:</b> reducir el desperdicio y enfocarse en lo esencial.</p><p>Scrum trabaja de forma <b>iterativa e incremental</b> para mejorar la previsibilidad y controlar el riesgo.</p>","k":"Si una opción habla de planificar todo de antemano o de seguir un plan fijo, casi seguro es incorrecta."},{"h":"Los tres pilares","b":"<ul><li><b>Transparencia:</b> el proceso y el trabajo tienen que ser visibles para quienes lo hacen y quienes lo reciben. Con poca transparencia se toman decisiones que bajan el valor y suben el riesgo.</li><li><b>Inspección:</b> revisar seguido los artefactos y el progreso para detectar problemas. Los eventos dan la cadencia.</li><li><b>Adaptación:</b> si algo se desvía, se ajusta lo antes posible.</li></ul>","k":"La cadena es: la transparencia permite la inspección, y la inspección permite la adaptación. Inspeccionar sin adaptar no sirve."},{"h":"Los cinco valores","b":"<p><b>Compromiso, Foco, Franqueza, Respeto y Coraje</b> (en inglés: Commitment, Focus, Openness, Respect, Courage).</p><p>Cuando el equipo vive estos valores, los pilares cobran vida y se genera confianza.</p>","k":"Memorizalos en inglés también: en el examen aparecen así. \"Velocidad\" o \"Calidad\" no son valores de Scrum."}],"qz":[{"q":"¿En qué se basa la teoría de Scrum?","o":["Empirismo y pensamiento Lean","Planificación predictiva detallada","Lean y Six Sigma","Kanban y gestión de riesgos"],"a":0,"w":"La Scrum Guide dice que Scrum se basa en el empirismo y en el pensamiento Lean."},{"q":"¿Cuáles son los tres pilares empíricos de Scrum?","o":["Transparencia, inspección y adaptación","Compromiso, foco y coraje","Planificar, ejecutar y controlar","Transparencia, respeto y adaptación"],"a":0,"w":"Compromiso, foco y coraje son valores, no pilares."},{"q":"¿Qué riesgo trae que los artefactos tengan poca transparencia?","o":["Decisiones que reducen el valor y aumentan el riesgo","Sprints más largos","Que el Scrum Master tenga que intervenir","Ninguno, si el equipo es experimentado"],"a":0,"w":"Las decisiones se basan en el estado percibido de los artefactos; si no es transparente, las decisiones empeoran."},{"q":"¿Cuál de estos NO es un valor de Scrum?","o":["Velocidad","Franqueza","Coraje","Respeto"],"a":0,"w":"Los valores son Compromiso, Foco, Franqueza, Respeto y Coraje."},{"q":"Verdadero o falso: Scrum es intencionalmente incompleto.","o":["Verdadero","Falso"],"a":0,"w":"Define solo las partes necesarias para implementar su teoría; el resto lo aportan las prácticas de cada equipo."}],"g":{"es":"Definición de Scrum","en":"Scrum Definition"}},"team":{"t":"El Scrum Team","d":"Cómo se forma el equipo, su tamaño y las tres responsabilidades.","tag":"ex","cards":[{"h":"La unidad fundamental","b":"<p>Un Scrum Team tiene <b>un Scrum Master, un Product Owner y Developers</b>. No hay subequipos ni jerarquías: es una unidad enfocada en un objetivo a la vez, el <b>Objetivo del Producto</b> (Product Goal).</p><p>Suele tener <b>10 personas o menos</b>.</p>","k":"La guía de 2017 hablaba de 3 a 9 Developers. En la de 2020 es \"10 o menos\" para todo el equipo. Es una trampa frecuente."},{"h":"Multifuncional y autogestionado","b":"<p><b>Multifuncional:</b> entre todos tienen las habilidades para crear valor en cada Sprint.</p><p><b>Autogestionado:</b> deciden internamente quién hace qué, cuándo y cómo.</p><p>El equipo es responsable de todo lo relacionado con el producto: colaborar con interesados, verificar, mantener, operar, experimentar e investigar.</p>","k":"Todo el Scrum Team es responsable de crear un Increment valioso y útil en cada Sprint, no solo los Developers."},{"h":"Varios equipos, un producto","b":"<p>Si el equipo crece demasiado, conviene dividirlo en varios Scrum Teams enfocados en el mismo producto.</p><p>Esos equipos comparten <b>el mismo Objetivo del Producto, el mismo Product Backlog y el mismo Product Owner</b>.</p>","k":"Un producto, un Product Backlog, un Product Owner. Siempre."},{"h":"Developers","b":"<p>Son quienes se comprometen a crear el Increment en cada Sprint. Siempre son responsables de:</p><ul><li>Crear el plan del Sprint, el Sprint Backlog.</li><li>Asegurar la calidad cumpliendo la Definición de Terminado (Definition of Done).</li><li>Adaptar su plan cada día hacia el Objetivo del Sprint.</li><li>Hacerse responsables entre sí como profesionales.</li></ul>","k":"\"Developers\" no significa solo programadores: incluye a cualquiera que construya el Increment."},{"h":"Scrum Master","b":"<p>Es responsable de establecer Scrum como lo define la guía y de la <b>efectividad del Scrum Team</b>. Es un líder que sirve al equipo, al Product Owner y a la organización.</p><p>Al Product Owner lo ayuda con técnicas para definir el Objetivo del Producto, gestionar el backlog y facilitar la colaboración con los interesados.</p>","k":"El Scrum Master no es un jefe de proyecto ni asigna tareas."}],"qz":[{"q":"Según la Scrum Guide 2020, ¿qué tamaño suele tener un Scrum Team?","o":["10 personas o menos","Entre 3 y 9 Developers","Entre 5 y 7 personas","No hay recomendación"],"a":0,"w":"\"3 a 9 Developers\" era la guía de 2017. La de 2020 dice 10 personas o menos."},{"q":"¿Quién decide quién hace qué, cuándo y cómo dentro del Scrum Team?","o":["El propio Scrum Team","El Scrum Master","El Product Owner","El gerente del área"],"a":0,"w":"Los Scrum Teams son autogestionados."},{"q":"Tres Scrum Teams trabajan sobre el mismo producto. ¿Qué deben compartir?","o":["Objetivo del Producto, Product Backlog y Product Owner","Scrum Master, Daily Scrum y Sprint Backlog","Solo la Definición de Terminado","Nada, cada equipo es independiente"],"a":0,"w":"Un producto tiene un único Product Backlog, un único Product Owner y un único Objetivo del Producto."},{"q":"¿Quién es responsable de crear el Sprint Backlog?","o":["Los Developers","El Product Owner","El Scrum Master","El Product Owner junto con los interesados"],"a":0,"w":"Es una de las responsabilidades de los Developers: es su plan."},{"q":"¿De qué es responsable el Scrum Master?","o":["De la efectividad del Scrum Team","De maximizar el valor del producto","De asignar tareas a los Developers","De aprobar el Increment"],"a":0,"w":"Maximizar el valor es del Product Owner; el Scrum Master responde por la efectividad del equipo."}],"g":{"es":"Scrum Team","en":"Scrum Team"}},"po":{"t":"El Product Owner","d":"Tu rol: valor, Product Backlog y toma de decisiones. Es el módulo más importante.","tag":"ex","cards":[{"h":"Maximizar el valor","b":"<p>El Product Owner es responsable de <b>maximizar el valor del producto</b> que resulta del trabajo del Scrum Team.</p><p>Cómo lo hace varía mucho según la organización y la persona; la guía no impone un método.</p>","k":"Valor, no velocidad ni cantidad de funcionalidades. Ante la duda en el examen, elegí la opción que habla de valor."},{"h":"Gestión del Product Backlog","b":"<p>El Product Owner es responsable de:</p><ul><li>Desarrollar y comunicar el Objetivo del Producto.</li><li>Crear y comunicar los elementos del Product Backlog.</li><li>Ordenar los elementos del Product Backlog.</li><li>Asegurar que el Product Backlog sea transparente, visible y se entienda.</li></ul>","k":"Puede delegar ese trabajo, pero sigue siendo el responsable. Delegar no transfiere la responsabilidad."},{"h":"Una persona, no un comité","b":"<p>El Product Owner es <b>una persona</b>. Puede representar las necesidades de muchos interesados en el Product Backlog, pero la decisión es suya.</p><p>Quien quiera cambiar el Product Backlog tiene que <b>convencer al Product Owner</b>.</p>","k":"Si en una pregunta un gerente agrega ítems directamente o un comité decide el orden, esa opción es incorrecta."},{"h":"Respeto a sus decisiones","b":"<p>Para que el Product Owner tenga éxito, <b>toda la organización tiene que respetar sus decisiones</b>.</p><p>Esas decisiones se ven en el contenido y el orden del Product Backlog, y en el Increment que se inspecciona en la Sprint Review.</p>","k":"Solo el Product Owner puede cancelar un Sprint, y lo hace si el Objetivo del Sprint queda obsoleto."},{"h":"Qué no hace el Product Owner","b":"<ul><li>No decide <b>cómo</b> los Developers hacen el trabajo.</li><li>No decide <b>cuánto</b> trabajo entra en el Sprint: eso lo eligen los Developers en la Sprint Planning, conversando con él.</li><li>No estima los elementos: el dimensionamiento lo hacen los Developers.</li><li>No tiene obligación de ir a la Daily Scrum, salvo que trabaje en ítems del Sprint Backlog.</li></ul>","k":"Qué y por qué: Product Owner. Cómo y cuánto: Developers."}],"qz":[{"q":"¿Cuál es la responsabilidad central del Product Owner?","o":["Maximizar el valor del producto","Maximizar la velocidad del equipo","Asegurar que se cumplan los plazos","Escribir todas las historias de usuario"],"a":0,"w":"La guía define al Product Owner como responsable de maximizar el valor del producto."},{"q":"¿El Product Owner puede delegar la gestión del Product Backlog?","o":["Sí, pero sigue siendo el responsable","No, nunca","Sí, y la responsabilidad pasa a quien la recibe","Solo al Scrum Master"],"a":0,"w":"Puede delegar el trabajo, pero no la responsabilidad."},{"q":"Un gerente necesita que se priorice una funcionalidad urgente. ¿Qué tiene que hacer?","o":["Hablar con el Product Owner y tratar de convencerlo","Agregarla arriba del Product Backlog","Pedírsela directamente a los Developers","Plantearla en la Daily Scrum"],"a":0,"w":"Quien quiera cambiar el Product Backlog lo hace convenciendo al Product Owner."},{"q":"¿Quién tiene la autoridad para cancelar un Sprint?","o":["Solo el Product Owner","El Scrum Master","Los Developers","Los interesados clave"],"a":0,"w":"Solo el Product Owner, y cuando el Objetivo del Sprint se vuelve obsoleto."},{"q":"¿Quién decide cuántos elementos del Product Backlog entran en un Sprint?","o":["Los Developers, conversando con el Product Owner","El Product Owner","El Scrum Master","Los interesados en la Sprint Review"],"a":0,"w":"En la Sprint Planning los Developers seleccionan los elementos a través de una conversación con el Product Owner."},{"q":"En una empresa grande, ¿puede el rol de Product Owner ser un comité?","o":["No, es una sola persona que puede representar a muchos interesados","Sí, si el producto es muy grande","Sí, si el Scrum Master lo aprueba","Solo en equipos con más de 10 personas"],"a":0,"w":"El Product Owner es una persona, no un comité."}],"g":{"es":"Product Owner","en":"Product Owner"}},"eventos":{"t":"Los eventos","d":"El Sprint y sus cuatro eventos: propósito, quién participa y límites de tiempo.","tag":"ex","cards":[{"h":"El Sprint","b":"<p>Es el contenedor de todos los demás eventos: un evento de duración fija de <b>un mes o menos</b>. Un Sprint nuevo empieza inmediatamente después del anterior.</p><p>Durante el Sprint:</p><ul><li>No se hacen cambios que pongan en peligro el Objetivo del Sprint.</li><li>La calidad no baja.</li><li>El Product Backlog se refina según haga falta.</li><li>El alcance se puede aclarar y renegociar con el Product Owner.</li></ul>","k":"No existen el \"Sprint 0\", el \"Sprint de estabilización\" ni pausas entre Sprints."},{"h":"Sprint Planning","b":"<p>Inicia el Sprint. Responde tres preguntas:</p><ul><li><b>Por qué</b> es valioso este Sprint: el equipo define el Objetivo del Sprint, que tiene que quedar listo antes de que termine la Planning.</li><li><b>Qué</b> se puede hacer: los Developers eligen elementos del backlog con el Product Owner.</li><li><b>Cómo</b> se hará: lo deciden solo los Developers.</li></ul><p>Máximo <b>8 horas</b> para un Sprint de un mes.</p>","k":"Objetivo del Sprint, más elementos elegidos, más el plan, forman el Sprint Backlog."},{"h":"Daily Scrum","b":"<p>Evento de <b>15 minutos para los Developers</b>, a la misma hora y en el mismo lugar. Sirve para inspeccionar el progreso hacia el Objetivo del Sprint y ajustar el Sprint Backlog.</p><p>Los Developers eligen la estructura que quieran. Si el Product Owner o el Scrum Master trabajan en ítems del Sprint Backlog, participan como Developers.</p>","k":"No es una reunión de reporte al Scrum Master ni al Product Owner, y no hace falta seguir las \"tres preguntas\"."},{"h":"Sprint Review","b":"<p>Inspecciona el resultado del Sprint y define adaptaciones futuras. El equipo muestra su trabajo a los interesados clave y se discute el progreso hacia el Objetivo del Producto. El Product Backlog se puede ajustar.</p><p>Es el penúltimo evento. Máximo <b>4 horas</b> para un Sprint de un mes.</p>","k":"Es una sesión de trabajo, no solo una presentación o demo. Tampoco es una \"puerta\" para aprobar entregas."},{"h":"Sprint Retrospective","b":"<p>Planifica formas de aumentar la <b>calidad y la efectividad</b>. El equipo inspecciona personas, interacciones, procesos, herramientas y su Definición de Terminado.</p><p>Las mejoras más útiles se encaran cuanto antes, y hasta pueden entrar al Sprint Backlog del siguiente Sprint.</p><p>Cierra el Sprint. Máximo <b>3 horas</b> para un Sprint de un mes.</p>","k":"Orden de los límites: Planning 8 h, Review 4 h, Retrospective 3 h, Daily 15 min. Para Sprints más cortos, suelen ser menores."},{"h":"Refinamiento","b":"<p>El refinamiento del Product Backlog es dividir y detallar los elementos (descripción, orden, tamaño) para que estén listos para una Sprint Planning.</p><p><b>No es un evento</b>: es una actividad continua.</p>","k":"Si te preguntan cuántos eventos tiene Scrum: cinco (el Sprint y los cuatro que contiene). El refinamiento no cuenta."}],"qz":[{"q":"¿Cuál es la duración máxima de un Sprint?","o":["Un mes","Dos semanas","Seis semanas","La que defina el Scrum Master"],"a":0,"w":"Los Sprints duran un mes o menos."},{"q":"¿Cuándo tiene que quedar definido el Objetivo del Sprint?","o":["Antes de que termine la Sprint Planning","En la primera Daily Scrum","Antes de la Sprint Review","Lo define el Product Owner antes de la Planning"],"a":0,"w":"El Objetivo del Sprint se define entre todo el equipo y debe completarse antes de terminar la Planning."},{"q":"¿Para quién es la Daily Scrum?","o":["Para los Developers","Para todo el Scrum Team, con asistencia obligatoria","Para que el equipo reporte al Scrum Master","Para que el Product Owner revise el avance"],"a":0,"w":"Es un evento de 15 minutos para los Developers."},{"q":"A mitad del Sprint, los Developers ven que no llegan con todo lo planificado. ¿Qué corresponde?","o":["Renegociar el alcance con el Product Owner sin poner en peligro el Objetivo del Sprint","Extender el Sprint una semana","Bajar la exigencia de calidad para llegar","Cancelar el Sprint"],"a":0,"w":"El alcance se puede aclarar y renegociar con el Product Owner; la calidad no baja y el Sprint no se extiende."},{"q":"¿Qué evento cierra el Sprint?","o":["Sprint Retrospective","Sprint Review","Sprint Planning del siguiente Sprint","El refinamiento"],"a":0,"w":"La Retrospective concluye el Sprint; la Review es el penúltimo evento."},{"q":"¿Qué es el refinamiento del Product Backlog?","o":["Una actividad continua, no un evento","Un evento obligatorio de 2 horas","Parte de la Sprint Retrospective","Una tarea exclusiva del Scrum Master"],"a":0,"w":"El refinamiento es una actividad continua para detallar y ordenar los elementos."}],"g":{"es":"Eventos de Scrum","en":"Scrum Events"}},"artef":{"t":"Artefactos y compromisos","d":"Product Backlog, Sprint Backlog e Increment, cada uno con su compromiso.","tag":"ex","cards":[{"h":"Tres artefactos, tres compromisos","b":"<ul><li><b>Product Backlog</b> → Objetivo del Producto (Product Goal).</li><li><b>Sprint Backlog</b> → Objetivo del Sprint (Sprint Goal).</li><li><b>Increment</b> → Definición de Terminado (Definition of Done).</li></ul><p>Los compromisos dan transparencia y foco: contra ellos se mide el progreso.</p>","k":"Este cuadro sale seguro en el examen. Aprendelo de memoria, en inglés y en español."},{"h":"Product Backlog","b":"<p>Lista <b>emergente y ordenada</b> de lo que hace falta para mejorar el producto. Es la <b>única fuente</b> de trabajo del Scrum Team.</p><p>El <b>Objetivo del Producto</b> describe un estado futuro del producto; es el objetivo a largo plazo del equipo. Hay que cumplirlo (o abandonarlo) antes de pasar al siguiente.</p>","k":"Los Developers que van a hacer el trabajo son los responsables del dimensionamiento (estimar)."},{"h":"Sprint Backlog","b":"<p>Se compone del <b>Objetivo del Sprint (por qué)</b>, los elementos seleccionados <b>(qué)</b> y el plan para entregar el Increment <b>(cómo)</b>.</p><p>Es un plan <b>de y para los Developers</b>, se actualiza durante todo el Sprint y tiene que tener detalle suficiente para inspeccionarlo en la Daily.</p>","k":"El Objetivo del Sprint es fijo durante el Sprint; los elementos y el plan pueden cambiar a medida que se aprende."},{"h":"Increment y Definición de Terminado","b":"<p>Un Increment es un paso concreto hacia el Objetivo del Producto. Se suma a los anteriores y tiene que ser <b>utilizable</b>.</p><ul><li>Se pueden crear <b>varios Increments</b> en un Sprint.</li><li>Se pueden <b>entregar antes</b> de que termine el Sprint.</li><li>Si un elemento no cumple la Definición de Terminado, no se presenta en la Review y <b>vuelve al Product Backlog</b>.</li></ul>","k":"Si la organización tiene una Definición de Terminado estándar, todos los equipos la siguen como mínimo. Si varios equipos comparten producto, comparten la misma definición."}],"qz":[{"q":"¿Cuál es el compromiso del Increment?","o":["La Definición de Terminado","El Objetivo del Sprint","El Objetivo del Producto","Los criterios de aceptación"],"a":0,"w":"Product Backlog → Objetivo del Producto; Sprint Backlog → Objetivo del Sprint; Increment → Definición de Terminado."},{"q":"¿De quién es el Sprint Backlog?","o":["De los Developers","Del Product Owner","Del Scrum Master","De todo el Scrum Team y los interesados"],"a":0,"w":"Es un plan hecho por y para los Developers."},{"q":"¿Quién dimensiona (estima) los elementos del Product Backlog?","o":["Los Developers que harán el trabajo","El Product Owner","El Scrum Master","El Product Owner con los interesados"],"a":0,"w":"El Product Owner puede ayudar a entender las alternativas, pero el dimensionamiento es de los Developers."},{"q":"Al final del Sprint, un elemento no cumple la Definición de Terminado. ¿Qué pasa?","o":["No forma parte del Increment y vuelve al Product Backlog","Se presenta igual en la Review como avance","Se extiende el Sprint hasta terminarlo","Se marca como terminado con una nota"],"a":0,"w":"Solo lo que cumple la Definición de Terminado forma parte del Increment."},{"q":"¿Se puede entregar un Increment a los interesados antes de que termine el Sprint?","o":["Sí","No, solo después de la Sprint Review","Solo si el Scrum Master lo aprueba","Solo en el último Sprint del proyecto"],"a":0,"w":"La Review no es una puerta para liberar valor; se pueden entregar Increments antes."},{"q":"¿Qué compone el Sprint Backlog?","o":["Objetivo del Sprint, elementos seleccionados y el plan para entregarlos","Solo los elementos seleccionados","Todo el Product Backlog ordenado","Las tareas asignadas por el Scrum Master"],"a":0,"w":"Por qué (objetivo), qué (elementos) y cómo (plan)."}],"g":{"es":"Artefactos de Scrum","en":"Scrum Artifacts"}},"trampas":{"t":"Trampas: tus notas frente a la guía 2020","d":"Tus notas de Notion siguen la Scrum Guide 2017. Acá están las diferencias que el examen usa para hacerte fallar.","tag":"ex","cards":[{"h":"Por qué este módulo","b":"<p>La parte de Scrum de tus notas del curso de Google sigue la <b>Scrum Guide 2017</b> y suma prácticas propias del curso. El examen usa la <b>guía 2020</b>.</p><p>Los conceptos de fondo son parecidos, pero cambiaron palabras y reglas. Si respondés con la versión vieja, vas a fallar preguntas que creías saber.</p>","k":"Regla práctica: ante la duda, gana lo que dice la Scrum Guide 2020, que tenés completa en la pestaña \"Scrum Guide\"."},{"h":"El equipo","b":"<ul><li>Tus notas dicen <b>\"Development Team\"</b>. La guía 2020 dice <b>\"Developers\"</b>: ya no hay un equipo dentro del equipo.</li><li>Tus notas dicen <b>\"de 3 a 9\"</b>. La guía 2020 dice que todo el Scrum Team tiene, en general, <b>10 personas o menos</b>.</li><li>Tus notas dicen <b>\"autoorganizado\"</b> (quién y cómo). La guía 2020 dice <b>\"autogestionado\"</b>: el equipo decide quién, cómo y en qué trabajar.</li></ul>","k":"Si una opción habla del \"Development Team\" como un grupo separado, probablemente esté desactualizada."},{"h":"Los eventos","b":"<ul><li><b>Daily Scrum:</b> tus notas usan las \"tres preguntas\". En 2020 ya no son obligatorias; los Developers eligen el formato.</li><li><b>Sprint Planning:</b> la guía 2020 agrega el tema \"<b>por qué</b> es valioso este Sprint\", que define el Objetivo del Sprint.</li><li><b>Asignación de tareas:</b> tus notas dicen que en la Planning se define \"quién es responsable de qué tarea\" con la facilitación del Scrum Master. En Scrum nadie asigna tareas: los Developers se organizan solos.</li><li><b>Sprint Review:</b> tus notas la describen como una demostración. La guía 2020 la define como una sesión de trabajo, no solo una presentación.</li></ul>","k":"Duración del Sprint: tus notas dicen \"de 1 a 4 semanas\"; la guía dice \"un mes o menos\". Es equivalente, pero el examen usa la segunda frase."},{"h":"Los artefactos","b":"<ul><li>El Product Backlog es una lista <b>ordenada</b>, no \"priorizada\".</li><li>Aparecen los <b>compromisos</b>: Objetivo del Producto, Objetivo del Sprint y Definición de Terminado.</li><li>El Sprint Backlog incluye el <b>por qué</b> (Objetivo del Sprint), el qué y el cómo.</li><li>Tus notas asocian el Increment a un MVP (Minimum Viable Product, producto mínimo viable). La guía solo exige que sea <b>utilizable</b> y cumpla la Definición de Terminado.</li><li>Tus notas incluyen \"el Product Owner acepta la historia\" dentro de la Definición de Terminado. La guía no dice eso: la Definición de Terminado es el estándar de calidad del Increment.</li></ul>","k":"Si una opción dice que el Product Owner \"aprueba\" o \"acepta\" el trabajo como requisito de Scrum, desconfiá."},{"h":"Prácticas útiles que no son Scrum","b":"<p>Historias de usuario, story points, planning poker, velocidad, gráficos burndown y tableros Kanban son <b>prácticas complementarias</b>. Son útiles y muy usadas, pero la Scrum Guide no las exige.</p><p>Tus notas también dicen que el Scrum Master \"es responsable de cuándo se entrega\". En la guía 2020, el Scrum Master es responsable de la <b>efectividad del Scrum Team</b>.</p>","k":"Si una opción del examen dice que Scrum \"exige\" historias de usuario, story points o gráficos burndown, es incorrecta."}],"qz":[{"q":"Según la guía 2020, ¿cómo se llama a quienes construyen el Increment?","o":["Developers","Development Team","Equipo de desarrollo y pruebas","Implementadores"],"a":0,"w":"La guía 2020 eliminó el \"Development Team\" como equipo separado."},{"q":"En la Daily Scrum, ¿es obligatorio responder las tres preguntas?","o":["No: los Developers eligen el formato, siempre que se enfoquen en el progreso hacia el Objetivo del Sprint","Sí, son parte de la definición del evento","Solo si lo pide el Scrum Master","Solo en equipos nuevos"],"a":0,"w":"La guía 2020 eliminó las preguntas de la Daily Scrum."},{"q":"¿Scrum exige usar historias de usuario y story points?","o":["No, son prácticas complementarias","Sí, son obligatorias","Solo las historias de usuario","Solo en Sprints de un mes"],"a":0,"w":"La Scrum Guide no prescribe esas técnicas."},{"q":"En la Sprint Planning, ¿quién decide qué Developer hace cada tarea?","o":["Los propios Developers","El Scrum Master","El Product Owner","Se asigna por especialidad según el plan"],"a":0,"w":"Los Developers son autogestionados: nadie les dice cómo hacer el trabajo."},{"q":"¿Qué tema agregó la guía 2020 a la Sprint Planning?","o":["Por qué es valioso el Sprint","Cuánto cuesta el Sprint","Quién es responsable de cada tarea","Qué salió mal en el Sprint anterior"],"a":0,"w":"Se sumó el \"por qué\", que da lugar al Objetivo del Sprint."},{"q":"¿Cómo describe la guía 2020 al Product Backlog?","o":["Una lista emergente y ordenada de lo que hace falta para mejorar el producto","Una lista priorizada y cerrada de requisitos","La lista de tareas que asigna el Scrum Master","El plan detallado de todo el proyecto"],"a":0,"w":"Emergente (cambia) y ordenada (no \"priorizada\")."}],"g":{"es":"Cambios de la Guía Scrum 2017 a la Guía Scrum 2020","en":null}},"backlog":{"t":"El backlog en la práctica","d":"Historias de usuario, criterios INVEST, épicas y cómo se refina un backlog en el día a día.","tag":"en","cards":[{"h":"Qué tiene cada elemento del backlog","b":"<ul><li><b>Descripción:</b> clara, para que se entienda sin explicaciones extra.</li><li><b>Valor:</b> cuánto aporta a usuarios, clientes o negocio. El equipo acuerda cómo expresarlo.</li><li><b>Estimación:</b> cuánto esfuerzo relativo lleva.</li><li><b>Orden:</b> su lugar en la lista, de lo más a lo menos importante.</li></ul><p>Valor y estimación ayudan al Product Owner a decidir el orden.</p>","k":"Un ítem de mucho valor y poco esfuerzo suele subir. Uno de poco valor y mucho esfuerzo, bajar."},{"h":"Historias de usuario","b":"<p>Son descripciones cortas de una funcionalidad, contadas desde el punto de vista de quien la usa. Formato típico:</p><p><b>\"Como [tipo de usuario], quiero [acción], para [beneficio].\"</b></p><p>Ejemplo: \"Como coordinadora de barrio, quiero ver qué familias tienen la obra atrasada, para acompañarlas antes del sábado\".</p><p>Se completan con la <b>persona</b> (una descripción detallada del tipo de usuario), los <b>criterios de aceptación</b>, las tareas y las opiniones de usuarios que ya existan.</p>","k":"En una entrevista, practicá escribir 2 o 3 historias sobre un producto real: muestra que pensás desde el usuario."},{"h":"Los criterios INVEST","b":"<p>Una buena historia cumple <b>INVEST (Independent, Negotiable, Valuable, Estimable, Small, Testable)</b>:</p><ul><li><b>Independiente:</b> se puede empezar y terminar sola.</li><li><b>Negociable:</b> deja lugar a conversar el detalle.</li><li><b>Valiosa:</b> entrega valor al terminarla.</li><li><b>Estimable:</b> está lo bastante clara para estimarla.</li><li><b>Pequeña:</b> entra en un Sprint; si no, se divide.</li><li><b>Testeable:</b> se puede verificar que cumple sus criterios de aceptación.</li></ul>","k":"Si una historia no entra en un Sprint, la respuesta es dividirla, no alargar el Sprint."},{"h":"Épicas","b":"<p>Una <b>épica</b> es un conjunto de historias relacionadas. Sirve para registrar ideas grandes y todavía difusas, que después se parten en historias concretas.</p><p>Si una historia es un capítulo, la épica es el libro.</p>","k":"Ejemplo: la épica \"Seguimiento de obras\" puede dividirse en historias como \"ver obras atrasadas\" o \"registrar visitas\"."},{"h":"Refinar el backlog","b":"<p>Refinar es mantener el backlog descripto, estimado y ordenado para que el equipo pueda trabajar bien. En cada revisión se mira:</p><ul><li>Que estén los ítems que corresponden: nada falta ni sobra.</li><li>Que el orden refleje lo más valioso.</li><li>Que los ítems de arriba estén listos, con criterios de aceptación claros.</li><li>Que tengan una estimación.</li></ul><p>El equipo decide cuándo y cada cuánto refinar.</p>","k":"Un backlog con 300 ítems detallados es una señal de alerta: solo lo de arriba necesita detalle."}],"qz":[{"q":"¿Cuál es el formato típico de una historia de usuario?","o":["Como [usuario], quiero [acción], para [beneficio]","Tarea, responsable y fecha","Requisito, prioridad y costo","Problema, causa y solución técnica"],"a":0,"w":"La historia se cuenta desde la perspectiva del usuario y su beneficio."},{"q":"En INVEST (Independent, Negotiable, Valuable, Estimable, Small, Testable), ¿qué pide la \"S\"?","o":["Que la historia sea pequeña y entre en un Sprint","Que sea simple de programar","Que tenga un responsable","Que sea segura"],"a":0,"w":"Small: si no entra en un Sprint, se divide."},{"q":"¿Qué es una épica?","o":["Un conjunto de historias relacionadas","La historia más importante del backlog","Un Sprint más largo de lo normal","Un error grave en producción"],"a":0,"w":"Las épicas agrupan ideas grandes que después se parten en historias."},{"q":"Una historia es demasiado grande para un Sprint. ¿Qué conviene hacer?","o":["Dividirla en historias más pequeñas","Alargar el Sprint","Pasarla a otro equipo","Bajar la calidad para que entre"],"a":0,"w":"Las historias tienen que entrar en un Sprint."},{"q":"¿Qué deberían tener los ítems de arriba del backlog?","o":["Criterios de aceptación claros y una estimación","Un responsable asignado por el Scrum Master","Un presupuesto aprobado","Nada: se detallan durante el Sprint"],"a":0,"w":"Tienen que estar listos para la Sprint Planning."}],"g":null},"estim":{"t":"Estimación ágil","d":"Estimación relativa, talles de remera, story points, planning poker, velocidad y burndown.","tag":"en","cards":[{"h":"Relativa, no absoluta","b":"<p>En lugar de calcular cuántas horas lleva una tarea (estimación absoluta), se <b>compara su esfuerzo con el de otra</b> (estimación relativa).</p><p>Es más rápida, más precisa entre ítems y evita discutir si algo lleva 7 o 10 días.</p>","k":"Las personas comparamos mucho mejor de lo que medimos en abstracto."},{"h":"Talles de remera","b":"<p>El equipo elige un ítem <b>ancla</b> de tamaño mediano y lo marca como \"M\". Después compara cada ítem con ese: ¿es S, L o XL?</p><p>Es rápida, fácil de entender e ideal para equipos que recién empiezan a estimar.</p>","k":"Algunos equipos eligen dos anclas: una chica y una grande."},{"h":"Story points","b":"<p>Es la misma idea, pero con números de la serie de <b>Fibonacci</b>: 1, 2, 3, 5, 8, 13, 21.</p><p>Los saltos crecen porque, a mayor tamaño, mayor incertidumbre. Así no tiene sentido discutir entre 21 y 25, pero sí entre 21 y 34. Un punto combina esfuerzo y riesgo.</p><p>El equipo acuerda los valores permitidos (algunos saltan de 21 a 100) y un ítem ancla.</p>","k":"Los puntos no son horas. Si te preguntan \"¿cuántas horas es un punto?\", la respuesta es que no se convierten."},{"h":"Planning poker y otras técnicas","b":"<ul><li><b>Planning poker:</b> cada persona elige una carta boca abajo, se dan vuelta todas juntas y se discuten las diferencias. La carta \"?\" significa \"no entiendo\" y la del café, \"necesito una pausa\".</li><li><b>Sistema de baldes:</b> permite estimar cientos de ítems en una hora.</li><li><b>Votación con puntos:</b> cada persona pega puntos de colores según el tamaño.</li><li><b>Grande, incierto, chico:</b> solo tres categorías.</li><li><b>Mapa de afinidad:</b> agrupar ítems parecidos y ordenar los grupos.</li></ul>","k":"Mostrar las cartas al mismo tiempo evita el sesgo de anclaje: que todos copien el primer número que se dice."},{"h":"Por qué estimar en equipo","b":"<ul><li>Evita la <b>falsa precisión</b>.</li><li>Evita el <b>sesgo de anclaje</b>.</li><li>Es <b>inclusivo</b>: todos opinan y crece la confianza.</li><li>Ayuda a <b>descubrir cómo</b> hacer el trabajo.</li></ul>","k":"En Scrum, el dimensionamiento lo hacen los Developers que van a hacer el trabajo, no el Product Owner."},{"h":"Velocidad y burndown","b":"<p><b>Velocidad:</b> cuántos puntos completa el equipo por Sprint en promedio, mirando al menos tres Sprints. Sirve para pronosticar cuánto entra en el próximo y cuándo podría terminarse el backlog.</p><p><b>Burndown:</b> un gráfico del trabajo que queda a lo largo del tiempo.</p>","k":"La velocidad no mide valor, no compara equipos y no evalúa personas. Es una herramienta de pronóstico del propio equipo."}],"qz":[{"q":"¿Qué es la estimación relativa?","o":["Comparar el esfuerzo de un ítem con el de otro","Calcular las horas exactas de cada tarea","Estimar en días hábiles","Que el Product Owner fije los tiempos"],"a":0,"w":"Se compara contra un ítem de referencia en lugar de medir en horas."},{"q":"¿Por qué se usa la serie de Fibonacci para los story points?","o":["Porque a mayor tamaño hay más incertidumbre, y los saltos grandes lo reflejan","Porque es más fácil sumar","Porque cada punto equivale a una hora","Porque lo exige la Scrum Guide"],"a":0,"w":"Los saltos crecientes reflejan la incertidumbre y evitan discusiones inútiles."},{"q":"En planning poker, ¿por qué se muestran todas las cartas al mismo tiempo?","o":["Para evitar el sesgo de anclaje","Para ahorrar tiempo","Para que el Scrum Master decida","Para que no haya discusión"],"a":0,"w":"Si alguien dice un número primero, los demás tienden a copiarlo."},{"q":"¿Qué técnica sirve para estimar cientos de ítems rápido?","o":["El sistema de baldes","Planning poker","Estimación en horas","Votación del Product Owner"],"a":0,"w":"Permite estimar un par de cientos de ítems en una hora."},{"q":"¿Para qué sirve la velocidad del equipo?","o":["Para pronosticar cuánto trabajo puede entrar en los próximos Sprints","Para comparar el rendimiento entre equipos","Para medir el valor entregado","Para evaluar a cada persona"],"a":0,"w":"Es una herramienta de pronóstico del propio equipo, no una medida de valor ni de desempeño."}],"g":null},"vision":{"t":"Visión, estrategia y roadmap","d":"Misión y visión, los cuatro bloques de la gestión de producto, el roadmap y las metas medibles.","tag":"en","cards":[{"h":"Misión y visión","b":"<p>La <b>misión</b> dice <b>por qué</b> hacemos el trabajo. Es corta y se mantiene constante.</p><p>La <b>visión del producto</b> ayuda a imaginar <b>cómo se verá</b> cuando esté hecho, y marca los límites de lo que le toca al equipo.</p>","k":"Ejercicio: escribí en una línea la misión de Módulo Sanitario y la visión de su proceso social. Te va a servir en entrevistas."},{"h":"Los cuatro bloques de la gestión de producto","b":"<ul><li><b>Visión:</b> qué problema resuelve el producto, para quién y qué valor aporta.</li><li><b>Estrategia:</b> el camino hacia la visión: mercado objetivo, diferenciales y plan de salida al mercado. Se adapta según lo que se aprende.</li><li><b>Roadmap:</b> traduce la estrategia en un plan con funcionalidades, lanzamientos, tiempos y prioridades.</li><li><b>Medir el éxito:</b> indicadores que muestran si se avanza hacia la visión.</li></ul>","k":"Una buena visión es inspiradora pero alcanzable, y nace de entender las necesidades reales del usuario."},{"h":"El roadmap de valor","b":"<p>Tiene tres partes:</p><ul><li><b>Visión del producto:</b> qué es, cómo apoya la estrategia y quién lo usará.</li><li><b>Roadmap del producto:</b> una vista general de lo que se espera, con hitos estimados.</li><li><b>Planes de lanzamiento:</b> objetivo del lanzamiento, ítems que incluye y fecha estimada.</li></ul><p>Sirve para mostrar el orden de las entregas, conectar el trabajo del equipo con la visión y mostrar a los interesados el valor que llega en cada etapa.</p>","k":"El roadmap muestra valor incremental, no una gran entrega final."},{"h":"Errores comunes con el roadmap","b":"<ul><li>Hacer creer a los interesados que es fijo e inamovible.</li><li>Ajustar fechas al detalle en lugar de mantenerlas aproximadas y precisarlas a medida que se acercan.</li><li>Dedicarle más tiempo al roadmap que a entregar.</li></ul><p>Buenas prácticas: tenerlo visible, marcar lo más prioritario y lo más valioso, y revisarlo seguido con el equipo y los interesados.</p>","k":"Un roadmap es una hipótesis que se actualiza, no un contrato."},{"h":"Metas medibles: SMART y OKR","b":"<p>Una meta es <b>SMART (Specific, Measurable, Achievable, Relevant, Time-bound)</b> cuando es específica, medible, alcanzable, relevante y con plazo. Ojo con palabras como \"mejor\" o \"más rápido\": hay que ponerles números.</p><p>Un <b>OKR (Objectives and Key Results)</b> separa el <b>objetivo</b> (qué querés lograr) de los <b>resultados clave</b> (cómo sabés que lo lograste). Se definen en distintos niveles (empresa, área, proyecto) y tienen que estar alineados.</p>","k":"Si cumplís el 100% de tus resultados clave, probablemente los pusiste demasiado fáciles."}],"qz":[{"q":"¿Cuál es la diferencia entre misión y visión?","o":["La misión dice por qué se hace el trabajo; la visión, cómo se verá el resultado","Son lo mismo","La misión cambia cada Sprint; la visión es fija","La visión la define el equipo y la misión el cliente"],"a":0,"w":"La misión es el por qué; la visión es la imagen del resultado."},{"q":"¿Qué traduce la estrategia en un plan concreto con tiempos y prioridades?","o":["El roadmap","La visión","La misión","El Sprint Backlog"],"a":0,"w":"El roadmap convierte la estrategia en un plan tangible."},{"q":"¿Cuál es un error común con el roadmap?","o":["Presentarlo como fijo e inamovible","Revisarlo seguido con los interesados","Marcar los ítems más valiosos","Tenerlo visible para el equipo"],"a":0,"w":"Un roadmap rígido impide adaptarse a lo que se aprende."},{"q":"En un OKR (Objectives and Key Results), ¿qué son los resultados clave?","o":["Resultados medibles que indican si se cumplió el objetivo","Las tareas del equipo","El presupuesto del proyecto","La visión de la empresa"],"a":0,"w":"El objetivo dice qué lograr; los resultados clave, cómo saber si se logró."},{"q":"¿Cuál de estas metas es SMART (Specific, Measurable, Achievable, Relevant, Time-bound)?","o":["Pasar de 10 a 16 familias por proceso antes de diciembre","Mejorar el proceso social","Ser más rápidos con las obras","Crecer mucho este año"],"a":0,"w":"Es específica, medible y tiene plazo."}],"g":null},"kpi":{"t":"Indicadores de producto","d":"Cómo se conectan los indicadores con la visión y qué indicadores usa un Product Owner.","tag":"en","cards":[{"h":"Indicadores, visión, estrategia y roadmap","b":"<p>Los <b>KPI (Key Performance Indicators)</b>, o indicadores clave de desempeño, conectan el trabajo diario con el rumbo del producto:</p><ul><li><b>Visión:</b> los indicadores reflejan la aspiración de largo plazo.</li><li><b>Estrategia:</b> si apunta a un segmento de usuarios, se mide la adquisición en ese segmento.</li><li><b>Roadmap:</b> en cada etapa (primera versión, adquisición, monetización) se mide si se logró lo esperado.</li></ul>","k":"Los indicadores sirven para decidir: si no van a cambiar ninguna decisión, no hace falta medirlos."},{"h":"Adquisición y valor del cliente","b":"<ul><li><b>Costo de adquisición:</b> cuánto cuesta conseguir un usuario nuevo.</li><li><b>Valor de vida del cliente:</b> el ingreso total que se espera de un cliente.</li><li><b>Tasa de conversión:</b> porcentaje de usuarios que hacen la acción buscada.</li><li><b>Crecimiento de ingresos.</b></li></ul>","k":"Si el valor de vida del cliente es menor que el costo de adquirirlo, el modelo no cierra."},{"h":"Uso y retención","b":"<ul><li><b>Usuarios activos</b> diarios o mensuales.</li><li><b>Tasa de abandono:</b> porcentaje de usuarios que dejan de usar el producto.</li><li><b>Uso de funcionalidades:</b> con qué frecuencia e intensidad se usa cada una.</li><li><b>Tiempo hasta el valor:</b> cuánto tarda un usuario nuevo en experimentar el valor central.</li></ul>","k":"El tiempo hasta el valor es clave en productos nuevos: si tarda demasiado, la gente abandona antes de entender para qué sirve."},{"h":"Satisfacción","b":"<ul><li><b>NPS (Net Promoter Score):</b> mide la lealtad a partir de cuán probable es que alguien recomiende el producto.</li><li><b>CSAT (Customer Satisfaction Score):</b> mide la satisfacción con una interacción concreta.</li></ul>","k":"Combiná indicadores de uso (lo que la gente hace) con los de satisfacción (lo que dice)."},{"h":"Datos, métricas y análisis","b":"<p>Los <b>datos</b> son la información disponible. Las <b>métricas</b> definen qué medir de esos datos. El <b>análisis</b> usa los datos para responder preguntas, encontrar patrones y predecir.</p><p>Hay métricas de productividad (cuánto y qué tan rápido se avanza) y de calidad (qué tan bien se hace).</p>","k":"En una entrevista, elegí 2 o 3 indicadores y explicá por qué esos y qué decisión tomarías según el resultado."}],"qz":[{"q":"¿Qué mide la tasa de abandono?","o":["El porcentaje de usuarios que dejan de usar el producto","Cuánto cuesta conseguir un usuario","Cuántos usuarios recomiendan el producto","El tiempo de carga de la aplicación"],"a":0,"w":"Es un indicador central de retención."},{"q":"¿Qué es el \"tiempo hasta el valor\"?","o":["Cuánto tarda un usuario nuevo en experimentar el valor central del producto","Cuánto tarda el equipo en terminar un Sprint","El tiempo hasta recuperar la inversión","La duración de una sesión de uso"],"a":0,"w":"Mide qué tan rápido el usuario entiende para qué sirve el producto."},{"q":"¿Qué mide el NPS (Net Promoter Score)?","o":["La probabilidad de que un usuario recomiende el producto","La cantidad de usuarios activos","Los ingresos por usuario","Los errores en producción"],"a":0,"w":"Es una medida de lealtad."},{"q":"La estrategia apunta a conquistar un segmento de usuarios. ¿Qué indicador corresponde?","o":["La adquisición de usuarios dentro de ese segmento","La velocidad del equipo","La cantidad de funcionalidades entregadas","Las horas de desarrollo"],"a":0,"w":"Los indicadores tienen que alinearse con la estrategia."},{"q":"¿Cuál es la diferencia entre métrica y análisis?","o":["La métrica define qué medir; el análisis usa los datos para responder preguntas","Son lo mismo","El análisis es solo un gráfico","La métrica la define siempre el cliente"],"a":0,"w":"Primero se define qué medir; después se interpreta."}],"g":null},"valor":{"t":"Valor y evidencia","d":"Cómo piensa un Product Owner el valor, según la Evidence-Based Management Guide.","tag":"ex","cards":[{"h":"Qué es un producto","b":"<p>Un producto es un <b>vehículo para entregar valor</b>. Tiene un límite claro, interesados conocidos y usuarios o clientes bien definidos.</p><p>Puede ser un servicio, un producto físico o algo más abstracto.</p>","k":"Esto conecta con tu experiencia: el proceso social de Módulo Sanitario también es un producto, con usuarios (las familias) e interesados."},{"h":"Resultados, no producción","b":"<p>El valor se mide por los <b>resultados</b> para usuarios y clientes (outcomes), no por la cantidad de cosas producidas (outputs).</p><p>Por eso la <b>velocidad</b> del equipo o la cantidad de funcionalidades entregadas no prueban que el producto genere valor.</p>","k":"Si la velocidad sube, eso no dice nada sobre el valor por sí solo."},{"h":"Las cuatro áreas clave de valor","b":"<ul><li><b>Valor actual</b> (Current Value): el valor que el producto entrega hoy.</li><li><b>Valor no realizado</b> (Unrealized Value): el valor potencial que todavía se podría capturar.</li><li><b>Capacidad de innovar</b> (Ability to Innovate): qué tan bien se pueden entregar cosas nuevas.</li><li><b>Tiempo de llegada al mercado</b> (Time to Market): qué tan rápido se aprende y se entrega.</li></ul>","k":"Son de la Evidence-Based Management Guide, que también entra en el examen. Aprendé los nombres en inglés."},{"h":"Metas en capas","b":"<p>La guía de gestión basada en evidencia propone metas a distinta distancia:</p><ul><li><b>Meta estratégica</b> (Strategic Goal): lejana y ambiciosa.</li><li><b>Meta intermedia</b> (Intermediate Goal): un paso concreto hacia la estratégica.</li><li><b>Meta táctica inmediata</b> (Immediate Tactical Goal): lo próximo, en general a nivel de Sprint.</li></ul><p>Se avanza con ciclos de experimentar, medir y adaptar.</p>","k":"Es el mismo empirismo de Scrum, aplicado a la estrategia del producto."},{"h":"Ordenar el Product Backlog","b":"<p>Scrum no impone un método para ordenar. El Product Owner ordena como mejor sirva para maximizar el valor, considerando por ejemplo:</p><ul><li>valor para usuarios y negocio,</li><li>riesgo y lo que se aprende al reducirlo,</li><li>dependencias,</li><li>el Objetivo del Producto.</li></ul>","k":"La guía habla de \"ordenar\", no de \"priorizar\". Cualquier opción que imponga una técnica obligatoria es sospechosa."}],"qz":[{"q":"¿Cuál de estas es una de las cuatro áreas clave de valor?","o":["Capacidad de innovar","Velocidad del equipo","Horas trabajadas","Cantidad de historias de usuario terminadas"],"a":0,"w":"Valor actual, valor no realizado, capacidad de innovar y tiempo de llegada al mercado."},{"q":"¿Qué muestra mejor que un producto genera valor?","o":["Los resultados para usuarios y clientes","La velocidad del equipo","El porcentaje de horas facturadas","La cantidad de funcionalidades entregadas"],"a":0,"w":"El valor se mide por resultados (outcomes), no por producción (outputs)."},{"q":"¿Qué significa \"valor no realizado\"?","o":["Valor potencial que todavía se podría capturar","Valor que se perdió por errores","Trabajo terminado que no se entregó","Funcionalidades que nadie usa"],"a":0,"w":"Es la brecha entre lo que el producto entrega hoy y lo que podría entregar."},{"q":"La velocidad del equipo subió 30%. ¿Qué podés concluir sobre el valor del producto?","o":["Nada por sí sola: hay que mirar los resultados","Que el valor subió 30%","Que el equipo trabaja de más","Que conviene alargar los Sprints"],"a":0,"w":"La velocidad mide producción, no valor."},{"q":"¿Cómo debe ordenar el Product Owner el Product Backlog?","o":["Como mejor sirva para maximizar el valor; Scrum no impone un método","Solo por valor de negocio","Por orden de llegada","Por votación de los interesados"],"a":0,"w":"La guía no prescribe una técnica; el criterio es maximizar el valor."}],"g":null},"stake":{"t":"Interesados e influencia","d":"Análisis de interesados, matriz de poder e interés, matriz RACI y cómo influir sin autoridad.","tag":"en","cards":[{"h":"Análisis de interesados","b":"<p>Pasos: listar a todos los afectados por el proyecto, evaluar su <b>influencia</b> (cuánto pueden afectar el resultado) y su <b>interés</b> (cuánto los afecta a ellos), y ver cómo involucrarlos.</p><p>La <b>matriz de poder e interés</b> indica qué hacer con cada uno:</p><ul><li><b>Mucho poder y mucho interés:</b> gestionarlos de cerca.</li><li><b>Mucho poder y poco interés:</b> mantenerlos satisfechos sin saturarlos.</li><li><b>Poco poder y mucho interés:</b> mantenerlos informados.</li><li><b>Poco poder y poco interés:</b> monitorearlos con poco esfuerzo.</li></ul>","k":"El día a día de un Product Owner es, en gran parte, gestionar interesados. Tus ejemplos con los sponsors del club sirven acá."},{"h":"La matriz RACI","b":"<p><b>RACI (Responsible, Accountable, Consulted, Informed)</b> define quién hace qué en cada tarea:</p><ul><li><b>Responsable:</b> quien hace el trabajo.</li><li><b>Quien rinde cuentas:</b> se asegura de que se haga y aprueba el resultado. Tiene que ser <b>una sola persona</b>.</li><li><b>Consultado:</b> da su opinión, como un experto.</li><li><b>Informado:</b> solo necesita saber el resultado.</li></ul>","k":"Pensalo con Scrum: el Product Owner es quien rinde cuentas por el Product Backlog, aunque delegue parte del trabajo."},{"h":"Fuentes de poder","b":"<p><b>Organizacionales:</b> tu rol, la información a la que accedés, tu red de contactos y tu reputación.</p><p><b>Personales:</b> tu conocimiento, tu capacidad de expresarte, tu historia y tu carácter.</p>","k":"Un Product Owner tiene responsabilidad sin autoridad sobre las personas: su poder es casi todo personal."},{"h":"Cómo influir","b":"<p>Los pasos de Conger para influir:</p><ul><li>Establecer credibilidad.</li><li>Plantear terreno común.</li><li>Aportar evidencia.</li><li>Conectar emocionalmente.</li></ul><p>Otras herramientas: armar una <b>coalición</b> (una alianza temporal con un objetivo común) y buscar el <b>beneficio mutuo</b>, viendo a los interesados como colegas y no como rivales.</p>","k":"Buena historia de entrevista: una vez que convenciste a alguien con más poder que vos, contada con estos cuatro pasos."}],"qz":[{"q":"¿Qué hacés con un interesado con mucho poder y poco interés?","o":["Mantenerlo satisfecho sin saturarlo de información","Gestionarlo de cerca todos los días","Ignorarlo","Mantenerlo informado de cada detalle"],"a":0,"w":"Necesita atención para que esté conforme, pero no quiere demasiada comunicación."},{"q":"En una matriz RACI (Responsible, Accountable, Consulted, Informed), ¿cuántas personas rinden cuentas por cada tarea?","o":["Una sola","Todas las que trabajan en la tarea","Dos, para cubrir ausencias","Ninguna: la responsabilidad es compartida"],"a":0,"w":"Una sola persona que rinde cuentas deja clara la propiedad."},{"q":"¿Cuál es el primer paso de Conger para influir?","o":["Establecer credibilidad","Conectar emocionalmente","Aportar evidencia","Armar una coalición"],"a":0,"w":"Sin credibilidad, lo demás pierde peso."},{"q":"¿Cuál de estas es una fuente de poder personal?","o":["El conocimiento","El rol en la organización","El acceso a la información","La red de contactos"],"a":0,"w":"Rol, información, red y reputación son organizacionales; conocimiento, expresividad, historia y carácter son personales."},{"q":"Negociando con un interesado difícil, ¿qué conviene buscar?","o":["Un beneficio mutuo, tratándolo como colega","Ganar la discusión","Escalar el problema enseguida","Ceder siempre para evitar el conflicto"],"a":0,"w":"Persuadir y negociar buscando que ambas partes ganen."}],"g":null},"riesgos":{"t":"Riesgos y dependencias","d":"Tipos de riesgo, dependencias, cómo mitigar, la técnica ROAM y cuándo escalar.","tag":"en","cards":[{"h":"Tipos de riesgo","b":"<ul><li><b>De tiempo:</b> que las tareas tarden más de lo previsto.</li><li><b>De presupuesto:</b> que suban los costos.</li><li><b>De alcance:</b> que el proyecto no produzca los resultados buscados.</li><li><b>Externos:</b> factores fuera de control, como el clima o cambios regulatorios.</li></ul><p>Ojo con el <b>crecimiento descontrolado del alcance</b> (scope creep): pedidos que se suman sin revisar tiempos ni costos.</p>","k":"Ejemplo propio: la lluvia que suspende una jornada de obra es un riesgo externo de tiempo."},{"h":"Dependencias y puntos únicos de falla","b":"<p>Una <b>dependencia</b> existe cuando una tarea necesita que otra empiece o termine. Puede ser <b>interna</b> (bajo tu control) o <b>externa</b> (fuera de tu control).</p><p>Un <b>punto único de falla</b> es un riesgo que, si ocurre, frena todo el proyecto.</p>","k":"En software, un punto único de falla típico es que una sola persona sepa cómo funciona una parte crítica."},{"h":"Cómo mitigar","b":"<p>Cuatro estrategias: <b>evitar</b> el riesgo, <b>aceptarlo</b>, <b>reducirlo o controlarlo</b>, o <b>transferirlo</b> a un tercero (por ejemplo, con un seguro o un proveedor).</p><p>Se registran en un <b>plan de gestión de riesgos</b>, un documento vivo que se actualiza. Un <b>árbol de decisión</b> ayuda a ver el impacto de cada alternativa.</p>","k":"Aceptar un riesgo es una decisión válida, siempre que sea consciente y quede registrada."},{"h":"La técnica ROAM","b":"<p>Cuando un riesgo aparece, se clasifica con <b>ROAM (Resolved, Owned, Accepted, Mitigated)</b>:</p><ul><li><b>Resuelto:</b> ya no es un problema.</li><li><b>Con dueño:</b> alguien se hace cargo y lo sigue.</li><li><b>Aceptado:</b> se acordó no hacer nada.</li><li><b>Mitigado:</b> se tomó una acción que baja su probabilidad o su impacto.</li></ul>","k":"Lo importante es que ningún riesgo quede sin clasificar."},{"h":"Escalar","b":"<p>Escalar es pedir ayuda a niveles superiores para quitar un obstáculo, aclarar prioridades o validar los pasos siguientes. Conviene hacerlo <b>ante la primera señal</b> de un problema crítico: algo que puede atrasar un hito, generar sobrecostos o hacer perder un cliente.</p><p>Bien usado, evita las \"guerras de trinchera\" entre áreas y los malos acuerdos.</p>","k":"Escalar no es acusar: es un mecanismo sano de control. Un buen correo de escalamiento explica el problema, el impacto y qué decisión necesitás."}],"qz":[{"q":"¿Qué es un riesgo de alcance?","o":["Que el proyecto no produzca los resultados buscados","Que suban los costos","Que las tareas tarden más","Que llueva el día de la entrega"],"a":0,"w":"El riesgo de alcance afecta lo que el proyecto entrega."},{"q":"¿Qué es una dependencia externa?","o":["Una dependencia que está fuera de tu control","Una tarea que hace un proveedor contratado por vos","Una dependencia entre dos tareas del mismo equipo","Un riesgo que ya se resolvió"],"a":0,"w":"Las internas las controla el equipo; las externas, no."},{"q":"En ROAM (Resolved, Owned, Accepted, Mitigated), ¿qué significa que un riesgo esté \"aceptado\"?","o":["Que se acordó no hacer nada al respecto","Que ya se resolvió","Que alguien se hizo cargo","Que se redujo su impacto"],"a":0,"w":"Aceptar es una decisión consciente de no actuar."},{"q":"¿Cuándo conviene escalar un problema?","o":["Ante la primera señal de un problema crítico","Solo cuando ya es imposible resolverlo","Nunca: el equipo tiene que arreglarse solo","Al cierre del proyecto"],"a":0,"w":"Cuanto antes se resuelve un problema crítico, mejor para el proyecto."},{"q":"¿Qué significa transferir un riesgo?","o":["Pasar su impacto a un tercero, como una aseguradora o un proveedor","Ignorarlo","Asignárselo a otra persona del equipo","Eliminarlo por completo"],"a":0,"w":"El riesgo sigue existiendo, pero su impacto lo asume otro."}],"g":null},"equipos":{"t":"Equipos, coaching y escala","d":"Etapas de un equipo, gestionar frente a coachear, señales de problemas y cómo llevar lo ágil a varios equipos.","tag":"en","cards":[{"h":"Las etapas de un equipo","b":"<p>Según Tuckman, un equipo pasa por cinco etapas:</p><ul><li><b>Formación:</b> todo es nuevo. Hay que aclarar objetivos, roles y contexto.</li><li><b>Conflicto:</b> aparecen frustraciones. Hay que escuchar y ayudar a resolver.</li><li><b>Normalización:</b> el equipo se ordena. Hay que hacer explícitas las normas.</li><li><b>Desempeño:</b> el equipo funciona solo. Hay que delegar, motivar y dar devoluciones.</li><li><b>Disolución:</b> el proyecto termina. Hay que celebrar y cerrar.</li></ul>","k":"Cada proceso nuevo de Módulo con voluntarios nuevos recorre estas etapas. Es un buen ejemplo para una entrevista."},{"h":"Gestionar frente a coachear","b":"<p><b>Gestionar</b> es dar dirección: asignar, supervisar y decidir.</p><p><b>Coachear</b> es enseñar: hacer preguntas para que el equipo llegue a sus propias soluciones, dar devoluciones y abrir oportunidades de desarrollo. Un coach motiva, apoya y reconoce el esfuerzo.</p><p>En equipos ágiles, autogestionados, el coaching pesa más que la gestión tradicional.</p>","k":"Algunas situaciones piden gestionar y otras coachear. Saber distinguirlas es parte del rol."},{"h":"Proteger al equipo","b":"<p>Dar <b>cobertura</b> al equipo (en inglés, air cover) es protegerlo de pedidos fuera de alcance o de críticas de la dirección, priorizando lo que el equipo necesita por sobre lo que quieren los interesados.</p>","k":"Para un Product Owner, decir \"ahora no\" a un interesado es muchas veces la forma de proteger el foco del equipo."},{"h":"Señales de problemas y soluciones","b":"<ul><li><b>Entrega de valor:</b> fechas incumplidas, cansancio, demasiado trabajo en curso. <i>Soluciones:</i> más demostraciones, retrospectivas, una Definición de Terminado clara y menos historias por Sprint.</li><li><b>Colaboración con el negocio:</b> aluvión de cambios o un clima de \"nosotros contra ellos\". <i>Soluciones:</i> más demostraciones y cambios al backlog solo entre Sprints.</li><li><b>Dinámica del equipo:</b> moral baja, mucho conflicto o ningún conflicto. <i>Soluciones:</i> acuerdos de convivencia, cambiar la forma de trabajo o capacitarse juntos.</li></ul>","k":"Que no haya ningún conflicto también es una señal de alerta: puede significar que nadie se anima a opinar."},{"h":"Introducir lo ágil y estabilizar el roadmap","b":"<p>Para llevar prácticas ágiles a un equipo: <b>empezar de a poco</b> (por ejemplo, con un tablero Kanban), <b>escuchar</b>, <b>ser estratégico</b> y <b>buscar aliados</b>.</p><p>Si el roadmap cambia todo el tiempo: acordar de antemano cómo se tratan las oportunidades nuevas, revisar el roadmap con todo el equipo y validar los supuestos con investigación de usuarios.</p>","k":"Esto es casi literalmente lo que hiciste al cambiar el modelo heredado de Buenos Aires en Módulo."},{"h":"Escalar a varios equipos","b":"<ul><li><b>Scrum of Scrums:</b> un representante por equipo se reúne para coordinar.</li><li><b>SAFe (Scaled Agile Framework):</b> el más usado; organiza los equipos en \"trenes\" según flujos de valor.</li><li><b>LeSS (Large-Scale Scrum):</b> aplica Scrum a gran escala con lo mínimo indispensable.</li><li><b>DAD (Disciplined Agile Delivery):</b> un enfoque híbrido que combina varios marcos.</li></ul>","k":"El principio más importante: no escalar si no hace falta. Cuanto más grande el equipo, más complejo todo."}],"qz":[{"q":"¿En qué etapa de Tuckman aparecen las frustraciones y los conflictos?","o":["Conflicto","Formación","Normalización","Desempeño"],"a":0,"w":"En la etapa de conflicto, el líder escucha y ayuda a resolver."},{"q":"¿Qué distingue a coachear de gestionar?","o":["Hacer preguntas para que el equipo llegue a sus propias soluciones","Asignar tareas con más detalle","Supervisar más de cerca","Tomar todas las decisiones importantes"],"a":0,"w":"El coaching enseña; la gestión dirige."},{"q":"¿Qué significa dar cobertura al equipo?","o":["Protegerlo de pedidos fuera de alcance y de críticas","Cubrir a alguien que está de vacaciones","Hacer el trabajo por el equipo","Ocultar problemas a la dirección"],"a":0,"w":"Es priorizar el foco del equipo frente a presiones externas."},{"q":"Hay un clima de \"nosotros contra ellos\" entre el equipo y la gerencia. ¿Qué tipo de problema es?","o":["De colaboración con el negocio","De entrega de valor","De estimación","Técnico"],"a":0,"w":"Se trabaja con más demostraciones y cambios al backlog solo entre Sprints."},{"q":"¿Cuál es el consejo principal sobre escalar lo ágil?","o":["No escalar si no es necesario","Escalar siempre con SAFe (Scaled Agile Framework)","Pasar directo de Waterfall a un marco escalado","Tener un solo equipo de 30 personas"],"a":0,"w":"Escalar agrega complejidad: solo conviene cuando hace falta."}],"g":null}},"PARTS":[{"t":"Bases ágiles","d":"La mentalidad detrás de Scrum. Sale de tus notas del curso de Google Project Management.","m":["agile","lean"]},{"t":"Scrum para la certificación","d":"Todo lo que entra en el examen, según la Scrum Guide 2020.","m":["fund","team","po","eventos","artef","trampas"]},{"t":"El oficio del Product Owner","d":"Cómo se trabaja en el día a día: backlog, estimación, roadmap e indicadores.","m":["backlog","estim","vision","kpi","valor"]},{"t":"Proyectos y personas","d":"Interesados, riesgos y equipos: lo que te van a preguntar en entrevistas.","m":["stake","riesgos","equipos"]}],"GUIDE":{"es":[{"t":"h2","x":"Propósito de la Guía Scrum"},{"t":"p","x":"Desarrollamos Scrum a principios de la década de 1990. Escribimos la primera versión de la Guía Scrum en 2010 para ayudar a las personas de todo el mundo a comprender Scrum. Hemos desarrollado la Guía desde entonces a través de pequeñas actualizaciones funcionales. Juntos, la respaldamos."},{"t":"p","x":"La Guía de Scrum contiene la definición de Scrum. Cada elemento del marco de trabajo tiene un propósito específico que es esencial para el valor general y los resultados obtenidos con Scrum. Cambiar el diseño o las ideas esenciales de Scrum, omitir elementos o no seguir las reglas de Scrum, oculta los problemas y limita los beneficios de Scrum, e incluso potencialmente lo vuelve inútil."},{"t":"p","x":"Seguimos el uso creciente de Scrum dentro de un mundo complejo en constante crecimiento. Nos sentimos honrados de ver que Scrum está siendo adoptado en muchos dominios que tienen un trabajo esencialmente complejo, más allá del desarrollo de productos de software donde Scrum tiene sus raíces. A medida que se extiende el uso de Scrum, los desarrolladores, investigadores, analistas, científicos y otros especialistas hacen el trabajo. Usamos la palabra \"desarrolladores\" en Scrum no para excluir, sino para simplificar. Si obtiene valor de Scrum, considérese incluido."},{"t":"p","x":"A medida que se utiliza Scrum, se pueden encontrar, aplicar y diseñar patrones, procesos y enfoques que se ajusten al marco de trabajo Scrum como se describe en este documento. Su descripción va más allá del propósito d
