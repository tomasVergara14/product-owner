nalyze the risk<\/b>. After identifying the risks, determine their likelihood and potential impact to your project. Serious risks with a high probability of occurring pose the greatest threat.<\/p>\n<p>3. <b>Evaluate the risk<\/b>. Next, use the results of your risk analysis to determine which risks to prioritize.<\/p>\n<p>4. <b>Treat the risk<\/b>. During this phase, make a plan for how to treat and manage each risk. You might choose to ignore minor risks, but serious risks need detailed mitigation plans.<\/p>\n<p>5. <b>Monitor and control the risk. <\/b>Finally, assign team members to monitor, track, and mitigate risks if the need arises.<\/p>\n<h3 id=\"n0_96\">Uncover opportunities using risk management<\/h3>\n<p>\nwhen identifying risks, it is important to also consider the good things that could happen, which are considered <b>opportunities<\/b>. \n<\/p>\n\n<p>An opportunity is a potential positive outcome of a risk. It is important to recognize opportunities and to capitalize on them as they appear so you can reach your project goals faster, more cheaply, or with less effort.<\/p>\n<ul>\n<li>Completing a milestone ahead of schedule<\/li>\n<li>Discounted materials<\/li>\n<li>Availability of additional resources (people, investments, equipment)<\/li>\n<\/ul>\n<p>\nAn <b>opportunity<\/b> is a potential positive outcome that may bring additional value to a project. You can use the same tools and techniques that you use in risk management—identify, analyze, evaluate, treat, and control—to add potential opportunities to your risk management plan. \n<\/p>\n\n<h3 id=\"n0_97\">Tools to help identify risks<\/h3>\n<ul>\n<li>Brainstorming<\/li>\n<\/ul>\n<p>\nBrainstorming is one of the most effective techniques for identifying risks with the team because it allows groups to spontaneously share ideas without judgment. \n<\/p>\n\n<p>\nDiverse teams bring different perspectives, experiences, and skill sets, and this may help you to identify risks that you may not have thought of on your own. \n<\/p>\n\n<p>\nA great tool that you can use during brainstorming is called a cause-and-effect diagram, also sometimes known as a fishbone diagram. Cause-and-effect diagrams show the possible causes of an event or risk and are very useful at risk management. \n<\/p>\n\n<p>Cause-and-effect diagrams can help identify all the ways that things could go wrong by identifying a potential risk, known as the effect, and working backwards to consider the potential causes of that risk<\/p>\n<p>By categorizing and breaking them down into further causes, you are able to identify areas that could lead to a potential problem, like exceeding your budget or allowing scope creep to impact your timeline.<\/p>\n<p>\nList the outcomes from the brainstorm in a risk register. \n<\/p>\n\n<p>A risk register is a table or chart that contains your list of risks.<\/p>\n<p>You will adopt a risk assessment technique. Risk assessment is the stage of risk management where qualities of a risk are estimated or measured. By qualities, we're mainly referring to how likely the risk is to occur and its potential impact on a project.<\/p>\n<ul>\n<li>Probability and impact matrix<\/li>\n<\/ul>\n<p>\n A probability and impact matrix is a tool used to prioritize project risks. To create a probability and impact matrix, you will need to think about the level of impact. \n<\/p>\n\n<p>Impact refers to the damage a risk could cause if it occurs. Impact is also determined on a scale of high, medium, and low. High means that if the risk occurs, it will substantially alter the project. Low means if the risk occurs, it will have a slight impact but it's not likely to derail the project. You will also need to think about probability.<\/p>\n<p>Probability is the likelihood that a risk will occur. We also determine probability on a scale of high, medium, and low. High probability means there's a high likelihood of this happening. Low probability means you've identified a risk that could happen, but it isn't likely that the risk will occur.<\/p>\n<p>\nThese two considerations come together to determine the inherent risk rating. Inherent risk is the measure of a risk calculated by its probability and impact. Measuring the inherent risk gives us a method for understanding a risk. Inherent risk is also determined on a high, medium, and low scale. Basically, if a risk has a low impact and low probability, it has a low inherent risk rating. \n<\/p>\n\n<p>Medium to high risks are the risks you should focus on and create detailed mitigation plans for.<\/p>\n<p>When you're creating a probability and impact matrix, it's important to ensure you create a matrix that meets accessibility guidelines and has information and formatting that everyone can easily and quickly understand. One way to do this is to use both color and distinct shapes or text to communicate levels of risk.<\/p>\n<h3 id=\"n0_98\">How to create a fishbone diagram<\/h3>\n<p>Fishbone diagrams—also known as <b>Ishikawa diagrams<\/b> or <b>cause-and-effect diagrams<\/b>—were developed by Japanese organizational theorist Kaoru Ishikawa in the 1960s to measure quality control processes in the shipbuilding industry<\/p>\n<p>\nAre a visual way to look at cause and effect. They are called fishbone diagrams because they have a similar shape to a fish skeleton. \n<\/p>\n\n<p>\nFishbone diagrams help the team to brainstorm potential causes of a problem or risk and sort them into useful categories. \n<\/p>\n\n<p>These categories show the areas that you should focus on to mitigate that risk. Fishbone diagrams are also very helpful in finding the root cause of a problem. A <b>root cause<\/b> is the initial cause of a situation that introduces a problem or risk.<\/p>\n<p class=\"imgph\">Screenshot in Notion: Screenshot 2025-11-27 at 3.20.56 AM.png<\/p>\n\n<p>\nFishbone diagrams are tools that can be useful during any phase of the project. When you use them in risk planning, you are trying to identify the possible causes of a problem that may or may not occur. When you use them in the execution phase, you are trying to find the root cause of an issue that has already occurred. \n<\/p>\n\n<p>the steps to create a fishbone diagram are:<\/p>\n<ul>\n<li>Define the problem<\/li>\n<li>Identify the categories<\/li>\n<li>Brainstorm the causes<\/li>\n<li>Analyze the causes<\/li>\n<\/ul>\n<h3 id=\"n0_99\">Types of risk<\/h3>\n<ul>\n<li>\nTime risks \n<\/li>\n<li>\nBudget risks  \n<\/li>\n<li>\nScope risks\n<\/li>\n<\/ul>\n\n<p>\nTime risks refers to the possibility that project tasks will take longer than anticipated to complete. You'll need to be aware of time risks because time is money. \n<\/p>\n\n<p>Budget risk refers to the possibility that the cost of a project will increase due to poor planning or expanding the project scope. You need to be aware of budget risk since budgeting provides the basis for project costs control.<\/p>\n<p>\nScope risk refers to the possibility that a project won't produce the results outlined in the project goals. You need to be aware of scope risks because the deliverables of your project might not be acceptable to your stakeholders or customers, and that may defeat the purpose of the entire project. \n<\/p>\n\n<p>there are other types of external risks that you should be aware of. By external risks, we're referring to risks that result from factors outside of the company that you have little to no control over. (environmental risk, like a major storm, or a legal risk, like a change in regulatory requirements)<\/p>\n<p>A single point of failure is a risk that has the potential to be catastrophic and halt work across a project. Meaning that no one can make progress on their tasks until the issue is resolved<\/p>\n<p>A dependency is a relationship between two project tasks, where the start or completion of one depends on the start or completion of the other. A dependency must be addressed before the task can be completed or before another task can begin.<\/p>\n<p>\nThere are two types of dependencies: internal and external. Internal dependencies refer to dependencies within the project that you and your team have control over. External dependencies are dependencies that you have no control over. \n<\/p>\n\n<h3 id=\"n0_100\">Managing single point of failure risks<\/h3>\n<p>\nA <b>single point of failure <\/b>is<b> <\/b>a<b> <\/b>risk that, if it were to materialize, could cause a significant amount of disruption to your project and could even shut it down. \n<\/p>\n\n<p class=\"imgph\">Screenshot in Notion: Screenshot 2025-11-27 at 3.32.29 AM.png<\/p>\n\n<ul>\n<li>\nAvoid: This strategy seeks to sidestep—or avoid—the situation as a whole.\n<\/li>\n<li>\nMinimize: Trying to minimize the catastrophic effects that it could have on the project. The key to minimizing risk starts with realizing that the risk exists. That is why you will usually hear mitigation strategies referred to as <i>workarounds<\/i>.\n<\/li>\n<li>\nTransfer: transferring shifts the<b> <\/b>responsibility of handling the risk to someone else. \n<\/li>\n<li>\nAccept: accept the risk as the normal cost of doing business. <b>Active<\/b> <b>acceptance of risk<\/b> usually means setting aside extra funds to pay your way out of trouble. <b>Passive<\/b> <b>acceptance of risk <\/b>is the “do nothing” approach. While passive acceptance may be reasonable for smaller risks, it is not recommended for most single point of failure risks. It is also important to be proactive and mitigate risks ahead of time whenever possible, as this may save you from having to accept risks. \n<\/li>\n<\/ul>\n\n<h3 id=\"n0_101\">Visualizing dependency relationships<\/h3>\n<p><b>Dependencies<\/b> are a relationship between two project tasks in which the completion or the initiation of one is reliant on the completion or initiation of the other.<\/p>\n<p>Types:<\/p>\n<ul>\n<li><b>Finish to start:<\/b> Task A must be completed before Task B can start. This is the most common dependency in project management. It follows the natural progression from one task to another.<\/li>\n<\/ul>\n<p class=\"imgph\">Screenshot in Notion: Screenshot 2025-11-28 at 3.46.12 AM.png<\/p>\n\n<ul>\n<li><b>Finish to finish:<\/b> Task A must finish before Task B can finish. (This type of dependency is not common.)<\/li>\n<\/ul>\n<p class=\"imgph\">Screenshot in Notion: Screenshot 2025-11-28 at 3.47.18 AM.png<\/p>\n\n<ul>\n<li><b>Start to start: <\/b>Task B can’t begin until Task A begins. This means Tasks A and B start at the same time and run in parallel.<\/li>\n<\/ul>\n<p class=\"imgph\">Screenshot in Notion: Screenshot 2025-11-28 at 3.48.11 AM.png<\/p>\n\n<ul>\n<li><b>Start to finish: <\/b>Task A must begin before Task B can be completed<\/li>\n<\/ul>\n<p class=\"imgph\">Screenshot in Notion: Screenshot 2025-11-28 at 3.48.51 AM.png<\/p>\n\n<p>There are four types of task dependencies:<\/p>\n<ul>\n<li>Finish to Start<\/li>\n<li>Finish to Finish<\/li>\n<li>Start to Start<\/li>\n<li>Start to Finish<\/li>\n<\/ul>\n<p>A dependency graph can help you visualize these different dependencies and the flow of the work that needs to be done on a project. They can also help you identify any risk associated with them.<\/p>\n<h3 id=\"n0_102\">Risk mitigation strategies<\/h3>\n<p>Risk mitigation planning is about finding ways to eliminate or reduce the impact of potential risks to your project.<\/p>\n<p>\nThere are four common ways to mitigate risk: \n<\/p>\n\n<ul>\n<li>\nAvoid it \n<\/li>\n<li>\nAccept it \n<\/li>\n<li>\nReduce or control it  \n<\/li>\n<li>\nTransfer it.\n<\/li>\n<\/ul>\n\n<p>\nA D<b>ecision Tree<\/b> is a flowchart that helps visualize the wider impact of a decision on the rest of your project. \n<\/p>\n\n<h3 id=\"n0_103\">Building a risk management plan<\/h3>\n<p>documentation is a crucial part of your role as a project manager.<\/p>\n<p>\nA <b>risk management<\/b> plan is a living document that contains information regarding high-level risks and the mitigation plan for each of those risks. \n<\/p>\n\n<p>This plan helps ensure that teammates and stakeholders have a clear understanding of potential problems and a plan to address them should they occur.<\/p>\n<p>\nhe plan should be updated regularly to add newly-identified risks, remove risks that are no longer relevant, and include any changes in the mitigation plans. \n<\/p>\n\n<p>\nAt the top of the document, we include the name of the company, and below it, the name of the project. \n<\/p>\n\n<p>\nWe also include the document author so that anyone reviewing the plan knows exactly who to reach out to if they have any questions. \n<\/p>\n\n<p>\nThis template also designates a spot for the document status. \n<\/p>\n\n<p>\nAs you're building your plan, you can list the status as \"in progress.\" \n<\/p>\n\n<p>\nOnce the plan is complete, you can change the status to \"final.\" \n<\/p>\n\n<p>We've also included helpful details like when the document was created and when it was last updated.<\/p>\n<p>Below these details, we have the document objective.<\/p>\n<p>Below that, we've added an executive summary of our project. Executive summaries should include a brief introduction to the normal conditions of a project and an outline of the potential risks that could impact the project.<\/p>\n<p>also includes the risk register you learned about earlier, which is a table or a chart that contains your list of possible risks. Remember that inherent risk is the measure of a risk calculated by its probability and impact. A mitigation plan has also been included for this risk<\/p>\n<p>Down in the appendix of the document, you'll find the probability and impact charts as well as the probability and impact matrix that we use to assess our risks.<\/p>\n<h3 id=\"n0_104\">Communicating risk to stakeholders<\/h3>\n<p>\nYour stakeholders need to be aware of the risks facing a project, because if you don't tell your stakeholders about important risks, they may be less equipped to help you if an issue does arise. they might not be able to provide you with more budget should you need it or with more resources should you require them. \n<\/p>\n\n<p>\nHow do you communicate risks to stakeholders during the planning phase? That depends on the severity of the identified risk. \n<\/p>\n\n<p>\nlow-level risks, something as simple as an e-mail might suffice. \n<\/p>\n\n<p>For medium level risks, you might increase your level of communication to a direct e-mail between yourself and the stakeholder in which you outline the risk with more specifics and provide a detailed explanation of your plan to mitigate the risk. You might also link to your risk management plan to provide them with more information. You might write \"urgent\" in the subject line to stress the e-mail's importance.<\/p>\n<p>\nThe serious nature of high-level risks requires a thorough and direct level of communication. \n<\/p>\n\n<p>When you're meeting with stakeholders to go over the project plan, you might add an agenda item to present serious risks and your plans to mitigate these risks. You can also use this time to collect feedback on your risk management plan and ask for insights from stakeholders on how they suggest handling these high-level risks.<\/p>\n<h3 id=\"n0_105\">Organizing communication and documentation<\/h3>\n<p>\nCommunication is the flow of information. It includes everything that's shared, how it's shared, and with whom. \n<\/p>\n\n<p>\nGood effective communication is always: \n<\/p>\n\n<ul>\n<li>\nClear h\n<\/li>\n<li>\nHonest \n<\/li>\n<li>\nRelevant \n<\/li>\n<li>\nFrequent (but not too frequent, There is such a thing as information overload)\n<\/li>\n<\/ul>\n\n<p>Effective communication makes it possible for your project to run on time and up to the expectations outlined in the project plan<\/p>\n<p>It needs to happen throughout the entire life cycle of the project, from the project team and stakeholders, as well as from you.<\/p>\n<p>Be sure to clarify goals and client expectations, follow up on action items, and communicate delays as the project progresses. This will help you avoid issues and setbacks.<\/p>\n<p> <\/p>\n\n<h3 id=\"n0_106\">Tips for effective communication<\/h3>\n<p>Communication is key to any successful project. As a project manager, you are central to that communication, which is an ongoing process throughout the life cycle of a project.<\/p>\n<p>\nIt is important to develop a communication plan for the duration of your project. Good communication helps your project run smoothly, leads to better outcomes, and supports a healthy team culture. \n<\/p>\n\n<p class=\"imgph\">Screenshot in Notion: Screenshot 2025-11-28 at 4.43.57 AM.png<\/p>\n\n<h3 id=\"n0_107\">Recognize and understand individual differences<\/h3>\n<p>You can encourage open, inclusive communication by:<\/p>\n<ul>\n<li>Not making assumptions about your audience’s backgrounds, identities, or experiences.<\/li>\n<li>Being mindful of your own biases.<\/li>\n<li>Using appropriate, professional, and neutral language.<\/li>\n<li>Including, respecting, and being curious about diverse points of view.<\/li>\n<\/ul>\n<h3 id=\"n0_108\">Brainstorm and craft the appropriate message<\/h3>\n<p>Communicate the right message by thinking about your intended audience. With whom are you communicating? In your communications, always be clear about your reasons for reaching out:<\/p>\n<ul>\n<li>What channels can your audience use to contact you or the team?<\/li>\n<li>Are you conveying information?<\/li>\n<li>Are you asking for input?<\/li>\n<li>Are you clarifying an issue?<\/li>\n<li>Are you resolving a problem?<\/li>\n<\/ul>\n<p>\nNo matter your audience, you should be sure to identify the purpose of the message, state the information or request clearly and concisely, and stay on topic. \n<\/p>\n\n<h3 id=\"n0_109\">Deliver your message<\/h3>\n<p>think about which methods are available and appropriate for communicating with various members of your team, whether that is in person, in a video conference, over the phone, via email, or in a meeting. Choosing the right method is especially important if you have team members or stakeholders in different regions and time zones. Also, be sure to:<\/p>\n<ul>\n<li>Avoid including any sensitive or potentially private information.<\/li>\n<li>Assume everyone at the company will receive the communication.<\/li>\n<\/ul>\n<h3 id=\"n0_110\">Obtain feedback and incorporate that feedback going forward<\/h3>\n<p>Communication doesn’t end when you deliver your message, so be sure to follow up with your audience by:<\/p>\n<ul>\n<li>Checking to make sure your message was clear.<\/li>\n<li>Asking them for feedback.<\/li>\n<li>Encouraging open communication.<\/li>\n<li>Responding to questions quickly.<\/li>\n<\/ul>\n<h3 id=\"n0_111\">Starting a communication plan<\/h3>\n<p>A communication plan organizes and documents the process, types, and expectations of communication for the project. The size and complexity of your communication plan will be different for every project, but it is always good to have one.<\/p>\n<p>\nYour communication plan needs to address these questions: \n<\/p>\n\n<ul>\n<li>What needs to be communicated<\/li>\n<li>Who needs to communicate<\/li>\n<li>When communication needs to happen<\/li>\n<li>Why and how to communicate<\/li>\n<li>Where the information communicated is stored.<\/li>\n<\/ul>\n<p>\nYour communication plan should include what you're communicating on, or in other words, the type of communication. This could include things like status updates, issues, feedback from users, daily check-ins, and other types of project meetings. \n<\/p>\n\n<p>\nThen, you need to identify who you communicate with. These are recipients of the information, like key stakeholders and the core project team. \n<\/p>\n\n<p>For each type of communication, record when to communicate. This includes the frequency, which is how often you'll communicate, and key dates like deadlines or major meetings. Not everyone needs to receive the same amount of information at the same time.<\/p>\n<p>\nHow you're communicating or what delivery method you'll use. This could be email, in-person, or virtual meetings, or a formal presentation. \n<\/p>\n\n<p>Your plan also needs to include the goal of communicating. This is your \"why.\" So ask yourself: why are you communicating? Is it to give a progress update, identify a risk, and address barriers?<\/p>\n<h3 id=\"n0_112\">Starting a communication plan<\/h3>\n<p>A communication plan organizes and documents the process, types, and expectations of communication for the project.<\/p>\n<p>\nYour communication plan needs to address these questions: \n<\/p>\n\n<ul>\n<li>\nWhat needs to be communicated\n<\/li>\n<li>\nWho needs to communicate \n<\/li>\n<li>\nWhen communication needs to happen \n<\/li>\n<li>\nWhy and how to communicate\n<\/li>\n<li>\nWhere the information communicated is stored.\n<\/li>\n<\/ul>\n\n<p>\nYour communication plan should include what you're communicating on, or in other words, the type of communication. This could include things like status updates, issues, feedback from users, daily check-ins, and other types of project meetings. \n<\/p>\n\n<p>\nThen, you need to identify who you communicate with. These are recipients of the information, like key stakeholders and the core project team. \n<\/p>\n\n<p>\nFor each type of communication, record when to communicate. This includes the frequency, which is how often you'll communicate, and key dates like deadlines or major meetings. \n<\/p>\n\n<p>\nnot everyone needs to receive the same amount of information at the same time. \n<\/p>\n\n<p>Include how you're communicating or what delivery method you'll use. This could be email, in-person, or virtual meetings, or a formal presentation.<\/p>\n<p>Your plan also needs to include the goal of communicating. This is your \"why.\" So ask yourself: why are you communicating? Is it to give a progress update, identify a risk, and address barriers? Or perhaps you need to figure out next steps, detailed preparation plans, and reflect on lessons learned. There must be a purpose for communicating, otherwise you risk wasting valuable time.<\/p>\n<p>\ninclude where communication resources are located, along with any other notes. \n<\/p>\n\n<p>The communication plan also helps with effective change management, the process of delivering your final project and getting it successfully implemented.<\/p>\n<h3 id=\"n0_113\">Developing a communication plan<\/h3>\n<p>\nhow to set up a communication plan that works best for all the different people involved with your project and what kind of information to include in your plan. Things like: \n<\/p>\n\n<ul>\n<li>\nWho needs to be involved in the project communication? \n<\/li>\n<li>\nWhat's the best way to communicate? \n<\/li>\n<li>\nWhy are you communicating? \n<\/li>\n<li>\nHow often should you communicate?\n<\/li>\n<\/ul>\n\n<p>\nThere are few key benefits to planning your communications up front. Creating a communication plan helps: \n<\/p>\n\n<ul>\n<li>\nImprove the overall effectiveness of communication\n<\/li>\n<li>\nKeeps people engaged and motivated throughout the project\n<\/li>\n<li>\nGets stakeholders involved in effective conversations. \n<\/li>\n<\/ul>\n\n<p>you need to make sure you're able to reach everyone you need to communicate with. It helps if communication is a team effort, especially on more complex projects. You shouldn't be the only one communicating.<\/p>\n<p>\nIf you're only presenting information in just one or two ways, you risk engaging some people but not others. \n<\/p>\n\n<p>\nYour goal as project manager is to optimize and streamline communications. \n<\/p>\n\n<p>\nA great way to optimize your communications for everyone on the team is by sending a brief email or survey that asks three questions: \n<\/p>\n\n<ul>\n<li>\nWhat is working in how we communicate with you about the project? \n<\/li>\n<li>\nWhat is not working or is not effective in our communications? \n<\/li>\n<li>\nWhere can we improve our communications with you? \n<\/li>\n<\/ul>\n\n<p>Some concepts:<br />• <u>Barriers to Communication:<\/u><b> <\/b>Challenges that may hinder effective communication, including time zone differences, language barriers, and privacy issues.<br />• <u>Documenting the Plan: <\/u>The process of recording communication strategies and details in a structured format to ensure clarity and accessibility for the team.<br />• <u>Feedback and Evaluation:<\/u><b> <\/b>The practice of assessing the effectiveness of the communication plan through stakeholder input and making necessary adjustments.<br />• <u>Goals of Communication:<\/u><b> <\/b>The intended outcomes of communication efforts, such as obtaining responses, encouraging engagement, or providing updates.<br />• <u>Stakeholders: <\/u>Individuals or groups who have an interest in the project's outcome and need to be informed throughout the project lifecycle.<br />• <u>Communication Frequency and Method:<\/u><b> <\/b>The timing and preferred channels of communication with stakeholders, which are crucial for maintaining engagement and clarity.<\/p>\n<h3 id=\"n0_114\">Best practices for building a communication plan<\/h3>\n<p>Before you begin creating the plan, answer these questions to ensure that you have all of the relevant information:<\/p>\n<ul>\n<li><b>Project stakeholders<\/b>: Have you created a RACI chart or stakeholder map of all your stakeholders? Who is your audience? Who will need to be informed at different points during the project life cycle?<\/li>\n<li><b>Communication frequency and method<\/b>: When and how often should you check in with your stakeholders? What methods of communication do they prefer? How much detail does each stakeholder need?<\/li>\n<li><b>Goals<\/b>: What is the goal of your communication? Do you need a response? Are you trying to encourage engagement or simply providing an update?<\/li>\n<li><b>Barriers<\/b>: Are there any time zone limitations? Language barriers? Do some stakeholders require time to reply or respond (e.g., an executive)? Are there any privacy or internet access issues?<\/li>\n<\/ul>\n<p>Choose a tool or template to document all of your communication needs, and begin developing your plan.<\/p>\n<ul>\n<li><u>Add a column for notes.<\/u><b> <\/b><br />Project management is not one-size-fits-all, and there are a lot of pieces that need to be tracked. For instance, if you are reaching out to a senior leader or executive, do you need to copy anyone else on the email? If a stakeholder is out of office or unavailable on certain dates, do you have a backup plan? Add notes to set reminders and any additional relevant details.<\/li>\n<li><u>Use formatting to highlight any key details in the plan.<\/u><b> <\/b><br />Is there a launch announcement or an urgent decision needed for the project to move forward? Highlight these pivotal elements in a different font color or size to stress their importance.<\/li>\n<li><u>Ensure that the team can access your document. <\/u><br />Share the plan with your team. Allowing your team to review the document ensures that they are aware of the plan and gives them a chance to offer feedback. Sharing the document also serves as an extra check to make sure you aren’t missing any crucial pieces.<\/li>\n<li><u>Test your plan. <\/u><br />If you are sending a team-wide email or link, send a test email to yourself or a colleague. If you are planning a virtual presentation, be sure to test the visual, audio, and other technical aspects in advance. That way, you can minimize any technical problems.<\/li>\n<\/ul>\n<p>\nScheduling routine check-ins will help you understand what is and is not working so you can improve your plan. You want to ensure that your communication plan gets the right information to the right stakeholders at the right time. \n<\/p>\n\n<p>Evaluate where you may be over- or under-sharing information or missing stakeholders. You can do this through:<\/p>\n<ul>\n<li>Anonymous survey forms<\/li>\n<li>Polls or open feedback sessions during team meetings<\/li>\n<li>One-on-one conversations and check-ins with key stakeholders<\/li>\n<\/ul>\n<h3 id=\"n0_115\">The value of project documentation<\/h3>\n<p>\nEach team was responsible for their own set of deliverables. To keep all teams on the same page, it was important for everyone to store their plans and reports in one centralized place. This allowed any team member to quickly find the documents they needed. \n<\/p>\n\n<p>\nDocumentation storage and sharing is very important. Having plans in one place makes communication quicker, easier, and more streamlined because everyone knows where to find any information they need. \n<\/p>\n\n<p>\nDocumenting and organizing plans also provides visibility and accountability. Each task has an owner and a due date. This creates visibility for the members of the project team and accountability for the task owner. \n<\/p>\n\n<p>If someone isn't a core part of the project team, you might not want them to have full access to all of the meeting notes. Instead, summarize the relevant information into a status report for those who need to stay informed of final outcomes but don't need all background information.<\/p>\n<p>It's always useful to store guides, manuals, meeting notes, plans, and processes all in a centralized place and clearly labeled. You'll also want to make sure the people in relevant roles are granted access to those documents.<\/p>\n<h3 id=\"n0_116\">Knowledge management<\/h3>\n<p>A way of ensuring that project data can be accessed in the future by others who need it for informing decisions or planning similar projects<\/p>\n<p>Documenting your plans and making them available is part of a project management best practice<\/p>\n<p>So even if you're not present, the project can carry on. As project manager, it's your job to ensure that project data can be accessed in the future by others.<\/p>\n<p>It's also important to determine what kind of information to share with whom and when.<\/p>\n<h3 id=\"n0_117\">Need-to-know basis<\/h3>\n<p>Telling someone facts they need to know at the time they need to know them, and nothing more<\/p>\n<h3 id=\"n0_118\">Personally Identifiable Information (PII)<\/h3>\n<p>Information that could be used on its own to directly identify, contact, or precisely locate an individual<\/p>\n<ul>\n<li>\nscreen name \n<\/li>\n<li>\npassword \n<\/li>\n<li>\nphone number \n<\/li>\n<li>\ne-mail address \n<\/li>\n<li>\nfirst or last name\n<\/li>\n<\/ul>\n\n<h3 id=\"n0_119\">Organizing project documentation<\/h3>\n<p>Organizing your project plans makes everyone's job easier and eliminates opportunity for confusion<\/p>\n<p>\nyour goal is to have all of your project resources documented and linked in a way to where you or anyone on the project can access what they need quickly. \n<\/p>\n\n","s":[["n0_2","What a project manage do on daily basis?"],["n0_3","Types of Job"],["n0_4","Prioritization:"],["n0_5","Delegation:"],["n0_6","Effective communication:"],["n0_7","Core skills of a project manager"],["n0_8","Leadership and team dynamics"],["n0_9","Project life cycle"],["n0_10","Organizational strucure"],["n0_11","Classic organizational structures"],["n0_12","Matrix organization structures"],["n0_13","The role of a Project Management Office"],["n0_14","Organizational Culture"],["n0_15","Change Management"],["n0_16","Corporate and project governance"],["n0_17","Corporate governance"],["n0_18","Project governance"],["n0_19","Initiation Phase"],["n0_20","Cost-benefit analysis"],["n0_21","OKRs"],["n0_22","Project Scope"],["n0_23","Scope management best practices"],["n0_24","Managing Project Scope"],["n0_25","Launching and landing a project"],["n0_26","Defining Success Criteria"],["n0_27","Success Criteria"],["n0_28","Product Quality"],["n0_29","Working effectively with stakeholders"],["n0_30","Stakeholders Analysis"],["n0_31","RACI Chart"],["n0_32","Why projects fail: Initiation missteps"],["n0_33","Resources"],["n0_34","Documentation"],["n0_35","Project Proposal"],["n0_36","Project Charter"],["n0_37","Tools for effective project management"],["n0_38","Types of project management tools"],["n0_39","Common project management tools"],["n0_40","The benefits of project planning"],["n0_41","Launching the planning phase"],["n0_42","Facilitating a project kick-off meeting"],["n0_43","Kick off best practices"],["n0_44","Understanding tasks and milestones"],["n0_45","The importance of setting milestones"],["n0_46","How to set milestones"],["n0_47","Setting milestones: Best practices"],["n0_48","Set tasks to identify milestones"],["n0_49","Milestone-setting pitfalls"],["n0_50","Work breakdown structure (WBS)"],["n0_51","Steps to build a WBS"],["n0_52","Components of a project plan"],["n0_53","How project plan components are connected"],["n0_54","Project scope and goals"],["n0_55","Work Breakdown Structure (WBS)"],["n0_56","Budget"],["n0_57","Management plans"],["n0_58","Making realistic time estimates"],["n0_59","The planning fallacy and optimism bias"],["n0_60","Capacity"],["n0_61","Capacity planning"],["n0_62","Critical Path"],["n0_63","How to create a critical path"],["n0_64","Soft skills"],["n0_65","Developing a project schedule"],["n0_66","Project plan best practices"],["n0_67","Tools and templates"],["n0_68","Using a spreadsheet to build a project plan"],["n0_69","Kanban Boards"],["n0_70","The importance of budget setting"],["n0_71","Key components of a project budget"],["n0_72","Project budgeting 101"],["n0_73","Categorize differrent types of costs"],["n0_74","Develop a baseline budget"],["n0_75","Perform a reserve analysis"],["n0_76","Creating a project budget"],["n0_77","Maintaining a project budget"],["n0_78","Budget pre-allocation"],["n0_79","Total cost of ownership (TCO)"],["n0_80","Scope creep"],["n0_81","Budgeting terms"],["n0_82","Procurement"],["n0_83","Vendors"],["n0_84","The procurement process"],["n0_85","Tips for initiating"],["n0_86","Tips for selecting"],["n0_87","Tips for contract writing"],["n0_88","Tips for controlling"],["n0_89","Tips for completing"],["n0_90","Common procurement documentation"],["n0_91","Creating a Statement of Work"],["n0_92","Ethical traps"],["n0_93","Test your ethics."],["n0_94","Managing risk effectively"],["n0_95","Phases of risk management"],["n0_96","Uncover opportunities using risk management"],["n0_97","Tools to help identify risks"],["n0_98","How to create a fishbone diagram"],["n0_99","Types of risk"],["n0_100","Managing single point of failure risks"],["n0_101","Visualizing dependency relationships"],["n0_102","Risk mitigation strategies"],["n0_103","Building a risk management plan"],["n0_104","Communicating risk to stakeholders"],["n0_105","Organizing communication and documentation"],["n0_106","Tips for effective communication"],["n0_107","Recognize and understand individual differences"],["n0_108","Brainstorm and craft the appropriate message"],["n0_109","Deliver your message"],["n0_110","Obtain feedback and incorporate that feedback going forward"],["n0_111","Starting a communication plan"],["n0_112","Starting a communication plan"],["n0_113","Developing a communication plan"],["n0_114","Best practices for building a communication plan"],["n0_115","The value of project documentation"],["n0_116","Knowledge management"],["n0_117","Need-to-know basis"],["n0_118","Personally Identifiable Information (PII)"],["n0_119","Organizing project documentation"]],"w":false},{"g":"Project management","t":"Project execution","h":"\n<h3 id=\"n1_1\">The importance of tracking<\/h3>\n<p>\nTracking, by definition, is a method of following the progress of a project's activities. \n<\/p>\n\n<p>\nMeasuring project performance regularly to identify deviations from the project plan can help ensure that the project stays on track. \n<\/p>\n\n<p>\nA deviation is anything that alters your original course of action. Deviations from the project plan can be positive or negative. \n<\/p>\n\n<p>tracking makes key project information transparent, and transparency is essential for accurate decision-making.<\/p>\n<p>Tracking centralizes project information so that everyone can understand the status of each part of the project, which can then help you identify gaps in your knowledge.<\/p>\n<p>\nTracking helps ensure that you don't risk forgetting something. \n<\/p>\n\n<p>tracking helps keep all team members and stakeholders in touch with deadlines and goals.<\/p>\n<p>\nis also crucial for recognizing risks and issues that can derail your progress. \n<\/p>\n\n<p>helps build confidence that the project is set to be delivered on time, in-scope, and within budget.<\/p>\n<p>\ntracking is important for a few key reasons:  \n<\/p>\n\n<ul>\n<li>\ntransparency \n<\/li>\n<li>\nrisk management \n<\/li>\n<li>\nkeeping the project on track.\n<\/li>\n<\/ul>\n\n<h3 id=\"n1_2\">Common items to track<\/h3>\n<ul>\n<li>\n<u>Project schedule:<\/u> This is made up of tasks and activities that ensure that the project is effectively heading toward its completion date.\n<\/li>\n<li>\n<u>Status of action items, key tasks, and activities:<\/u>  to ensure that that work is actually getting done. \n<\/li>\n<li>\n<u>Progress toward milestones<\/u>\n<\/li>\n<li>\n<u>Costs:<\/u> to ensure that you don't overspend or underspend on project tasks.\n<\/li>\n<li>\n<u>Key decisions and changes<\/u>\n<\/li>\n<\/ul>\n\n<h3 id=\"n1_3\">Different tracking methods<\/h3>\n<ul>\n<li>GANTT Chart<\/li>\n<li>Roadmap<\/li>\n<li>Burndown Chart<\/li>\n<\/ul>\n<p>Whichever type you choose depends on what you deem suitable for your project.<br />It's important to remember to select something that the entire team can easily understand, reference, and keep up to date.<\/p>\n<h3 id=\"n1_4\">GANTT CHART<\/h3>\n<p>\n It's a tried and true tool to keep your project on track. A Gantt chart measures tasks against time and includes useful information, like who will own each task and what the order of the tasks should be. \n<\/p>\n\n<p>\nit's a useful chart for staying on schedule and for projects with many dependencies or tasks or activities or milestones that are reliant on one another. \n<\/p>\n\n<p>\nstarts to look like a waterfall; hence, why Gantt charts are commonly used in Waterfall project management. \n<\/p>\n\n<p>\nEach task is represented by a horizontal progress bar, and the length of the bar is dependent on how much time is allotted to the task. The bars are stacked on top of each other to denote that the task at the top must be completed before the next one below it can be completed. \n<\/p>\n\n<p>are useful for:<\/p>\n<ul>\n<li>Helping a team stay on schedule<\/li>\n<li>Projects with lots of tasks, dependencies, and milestones<\/li>\n<li>Projects with large teams, because ownership and responsibilities are explicitly laid out visually<\/li>\n<\/ul>\n<p class=\"imgph\">Screenshot in Notion: Screenshot 2025-12-01 at 5.02.23 AM.png<\/p>\n\n<p>\nEx: [https://docs.google.com/spreadsheets/d/1W3Z0uFZTf-HKjZFY7S-1NvglFBUDpcaFZ8gRuehcb8Y/template/preview](https://docs.google.com/spreadsheets/d/1W3Z0uFZTf-HKjZFY7S-1NvglFBUDpcaFZ8gRuehcb8Y/template/preview) \n<\/p>\n\n<h3 id=\"n1_5\">ROADMAP<\/h3>\n<p>is best suited for when you need a way to track big milestones in your project. It's useful for illustrating how a project should evolve over time to a team and key stakeholders.<\/p>\n<p>\nIn order to reach that milestone, each department needs to complete specific tasks, and the roadmap tracks both individual and project progress toward milestones. \n<\/p>\n\n<p>also track both individual and project progress toward milestones. However, Roadmaps are best suited for tracking big milestones in your project<\/p>\n<p>are useful for:<\/p>\n<ul>\n<li>High-level tracking of large milestones. Roadmaps outline the project as a whole and provide an overall snapshot of key points—just like an actual roadmap contains points of interest and mile markers.<\/li>\n<li>Illustrating to your team or key stakeholders how a project should evolve over time<\/li>\n<\/ul>\n<p class=\"imgph\">Screenshot in Notion: Screenshot 2025-12-01 at 5.04.10 AM.png<\/p>\n\n<p>Ex: <a href=\"https://docs.google.com/document/d/1z-UTxMCbx-s11TuArnzz4iykBesG434YFTBerFrqMFI/template/preview?resourcekey=0-9hyu73SuoUe2RRv_tf5LOA#heading=h.iw90cjfk1m4e\">https://docs.google.com/document/d/1z-UTxMCbx-s11TuArnzz4iykBesG434YFTBerFrqMFI/template/preview?resourcekey=0-9hyu73SuoUe2RRv_tf5LOA#heading=h.iw90cjfk1m4e<\/a><\/p>\n<h3 id=\"n1_6\">BURNDOWN CHART<\/h3>\n<p>\nthe most granular of the three tracking methods. A burndown chart measures time against the amount of work done and the amount of work remaining. \n<\/p>\n\n<p>\nTheir main uses are to keep the project team on top of targeted completion dates and to keep the team aware of scope creep as it occurs. \n<\/p>\n\n<p>\nAre best suited for projects that require a detailed, broken-down review of each task associated with a project, and they're great for projects where finishing on time is the top priority. \n<\/p>\n\n<p>used by Agile Scrum teams. Burndown charts reveal how quickly your team is working by displaying how much work is left and how much time remains to complete the work.<\/p>\n<p>The main uses of a Burndown chart are to keep the project team on top of targeted completion dates and make them aware of scope creep if it occurs.<\/p>\n<p>are useful for:<\/p>\n<ul>\n<li>Projects that require a detailed review of tasks<\/li>\n<li>Projects where finishing on time is the top priority<\/li>\n<\/ul>\n<p>\nBefore you continue on with your project, you'll need to decide which tracker makes the most sense. \n<\/p>\n\n<p>\nIf you need to communicate milestones to a large team, you might choose a roadmap. \n<\/p>\n\n<p>\nIf you have a project with multiple dependencies, you might choose a Gantt chart. \n<\/p>\n\n<p>\nIf tracking tasks against your deadline is especially important, then the burndown chart might be your best option. \n<\/p>\n\n<p>To sumarize<\/p>\n<ul>\n<li><b>Burndown charts: <\/b>Burndown charts track the amount of work remaining versus time, helping Agile teams monitor progress and manage scope creep.<\/li>\n<li><b>Roadmaps: <\/b>Roadmaps provide a high-level overview of project milestones and illustrate how a project should evolve over time.<\/li>\n<li><b>Gantt charts: <\/b>Gantt charts are visual tools that help project teams stay on schedule by outlining tasks, dependencies, and milestones.<\/li>\n<\/ul>\n<h3 id=\"n1_7\">Project status reports<\/h3>\n<p>A project status report gives an overview of all of the project’s common elements and summarizes them in a snapshot.<\/p>\n<p>Most status reports contain:<\/p>\n<ul>\n<li><b>Project name: <\/b>The project name should be specific to the purpose of the project so that the overall goal of the project can be understood at-a-glance.<\/li>\n<li><b>Date: <\/b>You will create project status reports many times during the course of a project’s implementation phase. Reports can be created weekly or monthly—it all depends on the stakeholders’ needs and pace of the project. Adding the date to each status report acts as a reference point for your audience and also creates a history log of the project’s status over time.<\/li>\n<li><b>Summary:<\/b> The summary condenses the project’s goals, schedule, highlights, and lowlights in one central place for easy stakeholder visibility. Usually, the summary section will be followed by, or grouped with, the timeline summary and the overall project status.<\/li>\n<li><b>Status:<\/b> As you can imagine, status is a crucial piece. The status of the project illustrates your actual progress versus your planned progress. In project management, a common way to depict this is through <b>RAG<\/b> (red, amber, green), or Red-Yellow-Green, status reporting<b>.<\/b> RAG follows a traffic light pattern to indicate progress and status. Red indicates that there are issues that need resolution and that the project may be delayed or go significantly over budget. Amber/Yellow means that there are potential issues with schedule or budget, but that the issues can likely be resolved with corrective actions. And green means the schedule and budget are doing fine and that the project is on track. You can use RAG to indicate the overall project status, as well as milestone status. Every project team and stakeholder may have a slightly different perspective on what the colors mean and how urgent it is to escalate issues when they see an amber/yellow or red status, so it’s important to make sure everyone understands what the different color statuses mean for your project.<\/li>\n<li><b>Milestones and tasks: <\/b>A summary of the project’s major milestones thus far and current tasks helps the team and stakeholders easily visualize the progress of those elements. In a project plan, you will typically depict the tasks and milestones as ‘not started,’ ‘in progress’ or ‘completed<i>’<\/i> at an item-by-item level. But, in the project status report, it is common to summarize these items into two categories to better communicate the status. You’ll use <b>key accomplishments<\/b> to detail what has happened, and <b>upcoming<\/b> to detail what big milestones you will accomplish next.<\/li>\n<li><b>Issues:<\/b> The issues include your project's current roadblocks and potential risks. Status reports are an important opportunity to set expectations with your stakeholders. If your project status is red or amber, you can flag what is preventing you from being where you planned to be. You can also use this opportunity to state your plan to get the project back to green, and ask for any resources or help you may need to do so. You will learn more about communicating big risks and issues in the upcoming videos.<\/li>\n<\/ul>\n<h3 id=\"n1_8\">Project status report types<\/h3>\n<p>\nIf you need to share a status report with your team for a project that contains multiple layers of complexity, it may be best to format the report in a <b>spreadsheet<\/b> in order to keep track of all the moving parts. \n<\/p>\n\n<p>If you simply need to communicate updates to senior stakeholders, your status report may be best formatted as a <b>slideshow<\/b><\/p>\n<p class=\"imgph\">Screenshot in Notion: Screenshot 2025-12-02 at 3.54.13 AM.png<\/p>\n\n<h3 id=\"n1_9\">Why risks and changes occur<\/h3>\n<p>a risk is a potential event that might occur and could impact your project.<\/p>\n<p>A change is anything that alters or impacts the tasks, structures, or processes within a project. Changes are typically unexpected. they have a negative impact on the project, and you'll have to learn to navigate that.<\/p>\n<p>\nChanges can encompass any variance from the original project plan in regards to the triple constraint. \n<\/p>\n\n<p>Type of changes<\/p>\n<ul>\n<li>\nNew or changing dependencies \n<\/li>\n<li>\nChanging priorities. \n<\/li>\n<li>\nNew limitation on your budget or resources.\n<\/li>\n<li>\nScope creep: Scope creep is when changes, growth, and other factors affect the project scope.\n<\/li>\n<li>\nforce majeure: This is another change that could occur due to a national or international crisis. If you aren't familiar with this term, it means an unforeseen circumstance that prevents someone from fulfilling the contract due to a major crisis. \n<\/li>\n<\/ul>\n\n<p>Changes should be measured against the baseline estimates of scope, budget, and time allotted for your project, given the original requirements.<\/p>\n<h3 id=\"n1_10\">Change request forms<\/h3>\n<p>\nYou and your stakeholders will use these forms in order to stay on top of, and adequately manage, any changes. \n<\/p>\n\n<p>\nit's important for the forms to be self-explanatory and very thorough. \n<\/p>\n\n<p>\ninclude information in the cells, such as: \n<\/p>\n\n<ul>\n<li>\nthe project name \n<\/li>\n<li>\nthe discussion owner \n<\/li>\n<li>\nwho's taking the lead on this discussion from the team \n<\/li>\n<li>\ndiscussion type\n<\/li>\n<li>\nlet your audience know if you'll be discussing a risk, opportunity, or anything else.\n<\/li>\n<li>\nthe teams involved and the expected outcome of the discussion\n<\/li>\n<li>\n target date for discussion\n<\/li>\n<li>\nIdentify which milestones or goals might be impacted. \n<\/li>\n<li>\nProvide a short description of the current situation\n<\/li>\n<li>\nthe change, and any difference you expect to make to the plan of record, like a snapshot of the before and after.\n<\/li>\n<li>\nbackground information so that everyone shares the same context.\n<\/li>\n<\/ul>\n\n<h3 id=\"n1_11\">Identifying and tracking dependencies<\/h3>\n<p>Dependencies are the links that connect one project task to another, they're often the greatest source of risk to a project.<\/p>\n<p>Types:<\/p>\n<ul>\n<li>Internal Dependencies: The relationship between two tasks within the same project<\/li>\n<li>External Dependencies: Tasks that are reliant on outside factors, like regulatory agencies or other projects<\/li>\n<li>Mandatory Dependencies: Tasks that are legally or contractually required<\/li>\n<li>Discretionary Dependencies: Tasks that could occur on their own, but the team chose to make them reliant on one another<\/li>\n<\/ul>\n<h3 id=\"n1_12\">Dependency Management<\/h3>\n<p>\n is the process of managing all of these interrelated tasks and resources within the project to ensure that your overall project is completed successfully on time and in budget.\n<\/p>\n\n<p>\nfour important steps: \n<\/p>\n\n<ul>\n<li>\n<u>Proper identification<\/u>: brainstorm all possible project dependencies with their team and categorize them accordingly.\n<\/li>\n<li>\n<u>Recording dependencies<\/u>: a risk register should be created. is a table or chart that contains your list of risks and dependencies. should include a description of the dependency, the date, and all activities or tasks that may be impacted by the dependency. \n<\/li>\n<li>\n<u>Continuous monitoring and control<\/u>: Schedule regular meetings to check in on the interrelated tasks, staying up-to-date on any progress being made and double checking for changes that will impact other tasks.\n<\/li>\n<li>\n<u>Efficient communication<\/u>: Keeping the project team and stakeholders updated can help resolve dependencies and keep the project going strong\n<\/li>\n<\/ul>\n\n<h3 id=\"n1_13\">Risk Management<\/h3>\n<p>is the process of identifying potential risks and issues which could impact a project, then evaluating and applying steps to address the effects of the identified risks and issues.<\/p>\n<p>One way to manage risks, and hopefully, prevent any risks from materializing is to focus on managing the changes and dependencies, as well as any scope creep in your project.<\/p>\n<p>To help prioritize risks within your risk register, you can calculate your risk exposure. Risk exposure is a way to measure the potential future loss resulting from a specific activity or event. A good method to calculate risk exposure is to build a matrix, two variables: risk impact and probability.<\/p>\n<p class=\"imgph\">Screenshot in Notion: Screenshot 2025-12-02 at 4.28.12 AM.png<\/p>\n\n<h3 id=\"n1_14\">ROAM Technique<\/h3>\n<p>\nstands for resolved, owned, accepted, and mitigated—is used to help manage actions after risks arise. \n<\/p>\n\n<p>\nOnce a risk has materialized, you need to decide what to do with it. \n<\/p>\n\n<ul>\n<li>\nIf a risk has been eliminated and will not be a problem, it goes into your \"resolved\" category. \n<\/li>\n<li>\nIf you give a team member ownership over a certain risk and entrust them to handle it, that risk goes into the \"owned\" category and is monitored through to completion. \n<\/li>\n<li>\nIf the risk has been \"accepted,\" it has been agreed that nothing will be done about it. \n<\/li>\n<li>\nIf some action has been taken such that the risk has been mitigated, either reducing the likelihood of it occurring or reducing the impact to the project, it goes into the \"mitigated\" category. \n<\/li>\n<\/ul>\n\n<h3 id=\"n1_15\">Escalation<\/h3>\n<p>\nis the process of enlisting the help of higher-level project leadership or management to remove an obstacle, clarify or reinforce priorities, and validate next steps. \n<\/p>\n\n<p>Are healthy and act as a checks and balances tool to make sure appropriate action is being taken.<\/p>\n<p>\nThey can result in speedy decision-making, and generally, the quicker a problem is resolved, the better off a project will be. \n<\/p>\n\n<p>\nreduce frustrations within the team. \n<\/p>\n\n<p>\nencourage participation. can promote trust and shared responsibility among teammates, which are signs of a healthy, functional team. \n<\/p>\n\n<p>\nA project manager should escalate an issue at the first sign of critical problems in the project. Critical problems are issues that may cause a delay to a major project milestone, issues that cause budget overruns, issues that can result in the loss of a customer, and issues that push back the estimated project completion date. \n<\/p>\n\n<p>is great for preventing two common issues within a project: trench wars and bad compromises.<\/p>\n<p>\n Trench wars occur when two peers or groups can't seem to come to an agreement, and neither party is willing to give in. \n<\/p>\n\n<p>A bad compromise occurs when two parties settle on a so-called solution, but the end product still suffers.<\/p>\n<h3 id=\"n1_16\">Communicating changes to the team<\/h3>\n<p>when communicating a <u>small change<\/u> that will affect an individual, it's a good idea to send an email. Be sure to avoid emotional topics or anything that needs to be discussed in depth.  Weekly meetings may not be necessary, particularly if your agenda is short.<\/p>\n<p>When there's a <u>big change<\/u> within your project that impacts more than one person and is likely to change the budget, deadline, or scope of the project, you'll probably want to have a team meeting.<\/p>\n<p>One useful tactic to keep in mind when navigating these changes in your project is called a timeout. A timeout means taking a moment away from the project in order to take a breath, regroup, and adjust the game plan. A timeout may temporarily disrupt your momentum, but it may be absolutely necessary to set you up for success in the long run.<\/p>\n<h3 id=\"n1_17\">Retrospective<\/h3>\n<p>A meeting focused on identifying the contributing causes of an incident or pattern of incidents without blaming any individual<\/p>\n<h3 id=\"n1_18\">Writing an effective escalation email<\/h3>\n<p>Effective escalation emails:<\/p>\n<ul>\n<li>Maintain a friendly tone<\/li>\n<li>State your connection to the project<\/li>\n<li>Explain the problem<\/li>\n<li>Explain the consequences<\/li>\n<li>Make a request<\/li>\n<\/ul>\n<p class=\"imgph\">Screenshot in Notion: Screenshot 2025-12-02 at 5.32.12 AM.png<\/p>\n\n<h3 id=\"n1_19\">Key quality management concepts<\/h3>\n<p>Quality is when you fulfill the outlined requirements for the deliverable and meet or exceed the needs or expectations of your customers.<\/p>\n<p>the four main concepts of quality management:<\/p>\n<ul>\n<li>\n<u>Quality standards<\/u> : provide requirements, specifications, or guidelines that can be used to ensure that products, processes, or services are fit for achieving the desired outcome. You will set quality standards with your team and your customer at the beginning of your project.\n<\/li>\n<li>\n<u>Quality planning<\/u>: the actions of a project manager or the team to establish and conduct a process for identifying and determining exactly which standards of quality are in fact relevant to the project as a whole, and how to satisfy them. What outcome do my customers want at the end of this project? What does quality look like for them? How can I meet their expectations? How will I determine if the quality measures will lead to project success?\n<\/li>\n<li>\n<u>Quality assurance<\/u>: often shortened to QA, is all about evaluating if your project is moving towards delivering a high-quality service or product. Quality assurance helps you make sure that you and your customers are getting the exact product you contracted for.    \n<\/li>\n<li>\n<u>Quality control<\/u>: often shortened to QC. Here, techniques are used in order to ensure quality standards when a problem is identified, or if the quality plan is not executed in the desired manner and corrective actions should be affected. involves monitoring project results and delivery to determine if they are meeting desired results or not.\n<\/li>\n<\/ul>\n\n<h3 id=\"n1_20\">Fostering customer relationships with communication skills<\/h3>\n<p>\n how should a project manager approach communication with a customer? Using soft skills like negotiation, empathetic listening, and trust building, will help foster a good relationship between you and your customers, and a good project manager knows how and when to apply these skills. \n<\/p>\n\n<p>It's important to ask open-ended questions and actively listen to understand the customer's current state versus their desired state and what might help them get from here to there.<\/p>\n<p>\nset clear expectations about when they'll communicate certain things to their customers. \n<\/p>\n\n<p>If you reach a point in the project where you can't possibly move forward without their help and input, you'll have to communicate the issue to them calmly and with empathy.<\/p>\n<p>\nthe main goal here is customer satisfaction throughout the negotiation process, you'll want to be considerate of their feelings and limitations. \n<\/p>\n\n<p>\nYou can do this by exhibiting empathy: \n<\/p>\n\n<ul>\n<li>\nunderstanding their frustrations, addressing them, and finding a solution that's beneficial for both of you. \n<\/li>\n<\/ul>\n\n<p>soft skills taht will help create a good relationship between you and your customers, and getting feedback from those customers will help you to iterate on a product or service<\/p>\n<ul>\n<li>\n negotiation, \n<\/li>\n<li>\nempathetic listening, \n<\/li>\n<li>\ntrust-building  \n<\/li>\n<\/ul>\n\n<h3 id=\"n1_21\">Measuring customer satisfaction<\/h3>\n<p>We can conduct a series of surveys or tests with customers and users. Some common ones are:<\/p>\n<ul>\n<li><b><u>Feedback surveys<\/u><\/b> : Feedback surveys are a survey in which users provide feedback on features of your product that they like or dislike.  can take place as you design, before you launch, in order to find out if people like and understand the product, or after you've launched, if you want to make sure the user experience is even more satisfying.<\/li>\n<li><b><u>User acceptance tests<\/u><\/b> : a UAT, is a test that helps a business make sure that a product or solution works for its users. must meet the agreed upon requirements and deliver the expected results. This test is typically used to assess the end-to-end experience for the user of a new process or product. A user acceptance test is incredibly important because it takes place near the end of a product's development, and therefore, is an overall user experience test of the entire product, software, or service. UATs are sometimes referred to as \"beta tests.\"<\/li>\n<\/ul>\n<p>UAT Agenda steps:<\/p>\n<ul>\n<li>Welcome users and thank them for participating<\/li>\n<li>Present your product to them<\/li>\n<li>Start UAT test cases<\/li>\n<li>Walk users through a demonstration<\/li>\n<li>Identify edge cases (are rare—outliers that the original requirements didn't account for. They deal with the extreme maximums and minimums of parameters.)<\/li>\n<li>Recap finding, identify issues, prioritize which issues should be addressed first<\/li>\n<\/ul>\n<h3 id=\"n1_22\">User acceptance testing: Goals, best practices, and management<\/h3>\n<p>The goals of UAT:<\/p>\n<ul>\n<li>Demonstrate that the product, service, or process is behaving in expected ways in real-world scenarios.<\/li>\n<li>Show that the product, service, or process is working as intended.<\/li>\n<li>Identify issues that need to be addressed before project completion.<\/li>\n<\/ul>\n<p>UAT simulates real-world conditions, so when the feature works as intended during the testing process, you can be more confident that your product, service, or process will work properly once it is launched. It allows a project team to gather detailed information about how users interact with a product, service, or process.<\/p>\n<p>\nanswer such questions as: \n<\/p>\n\n<ul>\n<li>\nDo users recognize its purpose and uses? \n<\/li>\n<li>\nHow do they interact with it? \n<\/li>\n<li>\nHow much time do users take to interact with it? \n<\/li>\n<li>\nDo they notice all of its features? \n<\/li>\n<li>\nIs the product, service, or process accessible to everyone? \n<\/li>\n<\/ul>\n\n<h3 id=\"n1_23\">Best practices for effective UAT<\/h3>\n<ul>\n<li><b>Define and write down your acceptance criteria<\/b>.<br /><b>Acceptance criteria<\/b> are pre-established standards or requirements that a product, service, or process must meet. Write down these requirements for each item that you intend to test. For example, if your project is to create a new employee handbook for your small business, you may set acceptance criteria that the handbook must be a digital PDF that is accessible on mobile devices and desktop.<\/li>\n<li><b>Create the test cases for each item that you are testing<\/b>.<br />A <b>test case<\/b> is a sequence of steps and its expected results. It usually consists of a series of actions that the user can perform to find out if the product, service, or process behaved the way it was supposed to. Continuing with the employee handbook example, you could create a test case process in which the user would click to download the PDF of the handbook on their mobile device or desktop to ensure that they could access it without issues.<\/li>\n<li><b>Select your users carefully<\/b>.<br />It is important to choose users who will actually be the end users of the product, service, or process.<\/li>\n<li><b>Write the UAT scripts based on user stories<\/b>.<br />These scripts will be delivered to the users during the testing process. A <b>user story<\/b> is an informal, general explanation of a feature written from the perspective of the end user. In our employee handbook example, a user story might be: As a new employee, I want to be able to use the handbook to easily locate the vacation policy and share it with my team via email.<\/li>\n<li><b>Communicate with users and let them know what to expect<\/b>.<br />If you can prepare users ahead of time, there will be fewer questions, issues, or delays during the testing process.<\/li>\n<li><b>Prepare the testing environment for UAT<\/b>.<br />Ensure that the users have proper credentials and access, and try out these credentials ahead of time to ensure they work.<\/li>\n<li><b>Provide a step-by-step plan to help guide users through the testing process.<\/b><br />It will be helpful for users to have some clear, easy-to-follow instructions that will help focus their attention on the right places. You can create this plan in a digital document or spreadsheet and share with them ahead of time.<\/li>\n<li><b>Compile notes in a single document and record any issues that are discovered<\/b>.<br />You can create a digital spreadsheet or document that corresponds to your plan. It can have designated areas to track issues for each item that is tested, including the users’ opinions on the severity of each issue. This will help you prioritize fixes.<\/li>\n<\/ul>\n<p>This feedback might include positive comments, bug reports, and change requests.<\/p>\n<ul>\n<li><b>Bugs or issues:<\/b> Users might report technical issues, also known as <b>bugs<\/b>, or other types of issues after performing UAT. You can track and monitor these issues in a spreadsheet or equivalent system and prioritize which issues to fix. For instance, critical issues, such as not being able to access, download, or search the employee handbook, need to be prioritized over non-critical issues, such as feedback on the cover art of the handbook.<\/li>\n<li><b>Change requests:<\/b> Sometimes the user might suggest minor changes to the product, service, or process after UAT. These types of requests or changes should also be managed and prioritized. Depending on the type and volume of the requests, you may want to share this data with your primary stakeholders, and you may also need to adjust your project timeline to implement these new requests.<\/li>\n<\/ul>\n<h3 id=\"n1_24\">Continuous improvement<\/h3>\n<p>An ongoing effort to improve products or services.<\/p>\n<p>\nbegins with recognizing when processes and tasks need to be created, eliminated, or improved. \n<\/p>\n\n<p>Then a project manager must plan for and implement changes to keep the project on track.  That's where process improvement comes from.<\/p>\n<h3 id=\"n1_25\">Process improvement<\/h3>\n<p>\nis the practice of identifying, analyzing, and improving existing processes to enhance the performance of your team and to develop best practices or to optimize consumer experiences. \n<\/p>\n\n<h3 id=\"n1_26\">Control<\/h3>\n<p>An experiment or observation designed to minimize the effects of variables<\/p>\n<p>Control groups are representative samples that help you to determine that the differences between your experimental groups and the norm are due to your changes, rather than something else<\/p>\n<h3 id=\"n1_27\">Data-driven improvement frameworks<\/h3>\n<p>\nTechniques used to make decisions based on actual data. \n<\/p>\n\n<p>DMAIC, stands for:<\/p>\n<ul>\n<li>\n<b><u>Define<\/u><\/b>: define the business problem, goals, resources, project scope, and project timeline.\n<\/li>\n<li>\n<b><u>Measure<\/u><\/b>: you'll conduct performance metrics and data collection to establish baselines and measure success.\n<\/li>\n<li>\n<b><u>Analyze<\/u><\/b>: Work to find the root causes of problems and understand their impact\n<\/li>\n<li>\n<b><u>Improve<\/u><\/b>: Implementing a reasonable solution to the problem. \n<\/li>\n<li>\n<b><u>Control<\/u><\/b>: Implement the changes and stay on top of monitoring the updated processes you've established\n<\/li>\n<\/ul>\n\n<p>\nand it maps out five steps that you can take when working toward continuous improvements. \n<\/p>\n\n<p>Another framework you can refer to when working through continuous improvements is PDCA.<\/p>\n<p>\nPDCA is a four-step process that focuses on identifying a problem, fixing that issue, assessing whether the fix was successful, and fine-tuning the final fix. \n<\/p>\n\n<p>\nThe steps are as follows: \n<\/p>\n\n<ul>\n<li>\n<b><u>Plan:<\/u><\/b> Identify the issue and root cause and brainstorm solutions to the problem. \n<\/li>\n<li>\n<b><u>Do:<\/u><\/b> Fix the problem\n<\/li>\n<li>\n<b><u>Check:<\/u><\/b> Comparte results to the goal to find out if the problem is fixed\n<\/li>\n<li>\n<b><u>Act:<\/u><\/b> Fine-tune the fix to ensure continuous improvement\n<\/li>\n<\/ul>\n\n<p>Both PDCA and DMAIC helps you:<\/p>\n<ul>\n<li>\nidentify issues \n<\/li>\n<li>\nreduce errors\n<\/li>\n<li>\noptimize your processes\n<\/li>\n<\/ul>\n\n<h3 id=\"n1_28\">Differentiating projects from programs<\/h3>\n<p>\nA <b><u>project<\/u><\/b> is a one single-foused endeavor \n<\/p>\n\n<p>A <b><u>program<\/u><\/b> is a collection of projects<\/p>\n<p>A <b><u>portfolio<\/u><\/b> is a collection of projects and programs across the whole organization<\/p>\n<h3 id=\"n1_29\">The purpose of a retrospective<\/h3>\n<p><b><u>Retrospective <\/u><\/b><\/p>\n<p>\nIs a workshop or meeting that gives project teams time to reflect on a project, known as retros, should happen throughout the life cycle of a project, but mostly are implemented after major milestones, or most commonly, after a project is completed. \n<\/p>\n\n<p>\ngive you a chance to discuss successes and setbacks that took place within the project or phases. \n<\/p>\n\n<p>\n three main purposes:\n<\/p>\n\n<ul>\n<li>\n<b><u>Encourage team building<\/u><\/b> because they allow team members to understand different perspectives within their team \n<\/li>\n<li>\n<b><u>Facilitate improved collaboration<\/u><\/b> on future projects. \n<\/li>\n<li>\n<b><u>Promote positive changes<\/u><\/b> in future procedures and processes\n<\/li>\n<\/ul>\n\n<p>\n The emphasis in retrospectives is on continuous improvement and change, instead of recycling old— and potentially bad—habits, procedures, and processes. \n<\/p>\n\n<h3 id=\"n1_30\">Reasons to hold a retrospective<\/h3>\n<ul>\n<li>Missed deadlines or expectations<\/li>\n<li>Miscommunications between stakeholders<\/li>\n<li>Reached the end of a sprint<\/li>\n<li>Product launches and landings<\/li>\n<li>Record key lessons that other people can learn from<\/li>\n<\/ul>\n<p>The way you decide to conduct a retrospective can vary, there is no exact formula<\/p>\n<p>\nYou may decide to conduct a formal, in-person retrospective if your team prefers to debrief in that setting. You can incorporate sticky notes, documents, or any other kind of physical tools to help your team debrief. \n<\/p>\n\n<p>You may decide a virtual or online retrospective<\/p>\n<p>\n the retrospective should be considered a positive experience where team members feel comfortable sharing their feedback.\n<\/p>\n\n<h3 id=\"n1_31\">Retrospective best practices<\/h3>\n<ul>\n<li>\nEnsure discussion is blameless: Making sure that everyone feels comfortable giving feedback as candidly as possible will result in the most productive retrospective.\n<\/li>\n<li>\nA couple of tactics a project manager can use to ensure the process remains blameless are changing perspective and switching from \"you\" language to \"we\" language. \n<\/li>\n<li>\nReflect on positive aspects of the project as well as the negatives\n<\/li>\n<li>\nMaintain a positive tone throughout the process. \n\n\n<p class=\"imgph\">Screenshot in Notion: Screenshot 2025-12-09 at 12.02.35 AM.png<\/p>\n\n<\/li>\n<\/ul>\n\n<p>\n Now that you've gone over how everything went, build a better future for your team by filling out the remaining tables. The first one is action items and will address the question \"What action should we take as a result of our lessons learned?”\n<\/p>\n\n<p class=\"imgph\">Screenshot in Notion: Screenshot 2025-12-09 at 12.04.09 AM.png<\/p>\n\n<p>\nThe next table is all about future considerations. Are there any risks that could become issues if not addressed in the next quarter? Do you need to pass off ownership of this project to someone else? \n<\/p>\n\n<p class=\"imgph\">Screenshot in Notion: Screenshot 2025-12-09 at 12.05.21 AM.png<\/p>\n\n<p>ex:<\/p>\n<p>\n\n\n\nRetrospective: Project Name\n<\/p>\n\n<p><i><b>Date<\/b><\/i><\/p>\n<p><b>Owner:<\/b><\/p>\n<p><b>Collaborators:<\/b><\/p>\n<p>Project Summary<\/p>\n<p><i>[Write up a short summary of the project, could be large or small or just point to a project planning doc. Objectives, Sponsors/Stakeholders, etc.]<\/i><\/p>\n<div class=\"tw\"><table>\n<tr>\n<td>\n<b>Project Status:<\/b>\n<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>\n<b>Project Goals and Objectives:<\/b>\n<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>\n<b>Duration of project:<\/b>\n<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>\n<b>Team:<\/b>\n<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>\n<b>Link to Project Doc(s)<\/b>\n<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>\n<b>Methodology:<\/b>\n<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>\n<b>Project Resources:<\/b>\n<\/td>\n<td><\/td>\n<\/tr>\n<\/table><\/div>\n\n<p>Lessons Learned<\/p>\n<div class=\"cols\">\n<div class=\"col\">\n<p>Things that went well:<\/p>\n<ul>\n<li><\/li>\n<li><\/li>\n<\/ul>\n<\/div>\n<div class=\"col\">\n<p>Things that need improvement:<\/p>\n<ul>\n<li><\/li>\n<li><\/li>\n<\/ul>\n<\/div>\n<div class=\"col\">\n<p>Where we got lucky:<\/p>\n<ul>\n<li><\/li>\n<li><\/li>\n<\/ul>\n<\/div>\n<\/div>\n<p>Action Items<\/p>\n<p><i>What actions should we take as a result of our lessons learned?<\/i><\/p>\n<div class=\"tw\"><table>\n<tr>\n<td>\n<b>Action Item<\/b>\n<\/td>\n<td>\n<b>Type<\/b><br />\\[tool, process, team\\]\n<\/td>\n<td>\n<b>Owner<\/b>\n<\/td>\n<td>\n<b>Links<\/b>\n<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/table><\/div>\n\n<p>Future Considerations<\/p>\n<p><i>What would we recommend future projects of a similar nature mitigate or design contingency plans for?<\/i><\/p>\n<div class=\"tw\"><table>\n<tr>\n<td>\n<b>Risk<\/b>\n<\/td>\n<td>\n<b>Type<\/b><br />\\[technical, process, team, schedule\\]\n<\/td>\n<td>\n<b>Contact<\/b>\n<\/td>\n<td>\n<b>Link(s)<\/b>\n<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/table><\/div>\n\n<p>Optional Supporting Materials and Notes<\/p>\n<p>Retrospective Meeting Notes<\/p>\n<p><b>Date:<\/b><\/p>\n<p><b>Owner:<\/b><\/p>\n<p><b>Attendees:<\/b><\/p>\n<p><b>Agenda:<\/b><\/p>\n<p><b>Notes:››‹<\/b><\/p>\n","s":[["n1_1","The importance of tracking"],["n1_2","Common items to track"],["n1_3","Different tracking methods"],["n1_4","GANTT CHART"],["n1_5","ROADMAP"],["n1_6","BURNDOWN CHART"],["n1_7","Project status reports"],["n1_8","Project status report types"],["n1_9","Why risks and changes occur"],["n1_10","Change request forms"],["n1_11","Identifying and tracking dependencies"],["n1_12","Dependency Management"],["n1_13","Risk Management"],["n1_14","ROAM Technique"],["n1_15","Escalation"],["n1_16","Communicating changes to the team"],["n1_17","Retrospective"],["n1_18","Writing an effective escalation email"],["n1_19","Key quality management concepts"],["n1_20","Fostering customer relationships with communication skills"],["n1_21","Measuring customer satisfaction"],["n1_22","User acceptance testing: Goals, best practices, and management"],["n1_23","Best practices for effective UAT"],["n1_24","Continuous improvement"],["n1_25","Process improvement"],["n1_26","Control"],["n1_27","Data-driven improvement frameworks"],["n1_28","Differentiating projects from programs"],["n1_29","The purpose of a retrospective"],["n1_30","Reasons to hold a retrospective"],["n1_31","Retrospective best practices"]],"w":false},{"g":"Project management","t":"Data-informed decision-making","h":"\n<h3 id=\"n2_1\">The value of data<\/h3>\n<p>Data is a collection of facts or information, and through data analysis, you'll learn how to use data to draw conclusions and make predictions and decisions<\/p>\n<h3 id=\"n2_2\">Benefits of using data<\/h3>\n<ul>\n<li>Make better decisions<\/li>\n<li>Solve problems<\/li>\n<li>Understand performance<\/li>\n<li>Improve processes<\/li>\n<li>Understand users<\/li>\n<\/ul>\n<h3 id=\"n2_3\">Common types of project data<\/h3>\n<p>A metric is a quantifiable measurement that is used to track and assess a business objective<\/p>\n<p>\nYou can group project metrics into productivity metrics and quality metrics. \n<\/p>\n\n<p>Productivity typically measures progress and output over time.<br />Productivity metrics allow you to track the effectiveness and efficiency of your project and include metrics like:<\/p>\n<ul>\n<li>\n<b><u>Milestones<\/u><\/b>: is an important point within the project schedule that indicates progress and usually signifies completion of a deliverable or phase of the project\n<\/li>\n<li>\n<b><u>Tasks<\/u><\/b>: is an activity that needs to be accomplished within a set period of time. \n<\/li>\n<li>\n<b><u>Projections<\/u><\/b>: is how you predict an outcome based on the information you have now. \n<\/li>\n<li>\n<b><u>Duration<\/u><\/b>: is the total time it takes to complete a project from start to finish. \n<\/li>\n<\/ul>\n\n<p>\nQuality metrics relates to achieving acceptable outcomes and can include metrics such as \n<\/p>\n\n<ul>\n<li>\n<b><u>Number of changes<\/u><\/b>: during the project or project scope helps to monitor risks. Changes show any inconsistencies from the initial requirements of the project. A change log is a record of all of the notable changes on a project.\n<\/li>\n<li>\n<b><u>Issues<\/u><\/b>: is a known and real problem that may affect the ability to complete a task.  \n<\/li>\n<li>\n<b><u>Cost variance<\/u><\/b>: compares what you plan to spend versus what you actually spent \n<\/li>\n<\/ul>\n\n<p>which all affect quality<\/p>\n<h3 id=\"n2_4\">Data, metrics and analytics<\/h3>\n<p><b>Data<\/b> is information.  It’s the numbers and feedback available to you about different aspects of your project.<\/p>\n<p><b>Metrics<\/b> are how you measure your data. They define the important or specific information (data) you need to know about your project, such as productivity, quality, or engagement<\/p>\n<p>\nOnce you determine your project’s metrics, you analyze the data according to those metrics to find patterns and answer questions about your project. This process is called <b>analytics<\/b>: using data to answer questions, discover relationships, and predict unknown outcomes. \n<\/p>\n\n<p>\nWhen analyzing data, ask: \n<\/p>\n\n<ul>\n<li>\nWhat do the metrics mean to you? \n<\/li>\n<li>\nHow do you want to use the metrics you've chosen? \n<\/li>\n<li>\nCan you find patterns to make predictions about your project? \n<\/li>\n<li>\nCan you find ways to improve—or <b>optimize<\/b>—certain aspects of your project? \n<\/li>\n<li>\nWhat lessons can you draw from your project's data?\n<\/li>\n<\/ul>\n\n<h3 id=\"n2_5\">Productivity metrics<\/h3>\n<p>\ntypically measure progress and output over time. They allow you to track—or predict—the effectiveness and efficiency of your project team. \n<\/p>\n\n<p>\nanalyze the <b>number of tasks or milestones completed<\/b> in a given time frame. \n<\/p>\n\n<p>questions like:<\/p>\n<ul>\n<li>\nwhat percentage of tasks are completed on time\n<\/li>\n<li>\n how long do they usually take? \n<\/li>\n<li>\n if tasks were not completed on time, how much longer than anticipated did it take to complete all the tasks?\n<\/li>\n<\/ul>\n\n<p><b>On-time completion rates<\/b> can help illustrate to clients and stakeholders how the project is progressing and when they can expect certain deliverables to be ready. If your project's completion rates are high, it means you're doing a good job of meeting your completion goals. If the rates are low, it means you're missing deadlines.<\/p>\n<p><b>duration <\/b>(how long something takes) can be useful for setting and evaluating tasks and milestones and determining if you'll meet project deadlines. This data is broken down into hours, days, weeks, months, and sometimes years.<\/p>\n<h3 id=\"n2_6\">Quality metrics<\/h3>\n<p>relate to achieving acceptable outcomes and can include metrics such as number of changes, issues, and cost variance, all of which affect quality.<\/p>\n<p><b>Changes <\/b>refer to differences in any aspect of the project from what was originally planned or required<\/p>\n<p><b>Issues <\/b>are problems that may affect task completion—and often result in a change.<\/p>\n<p>Track the number of changes and issues to identify patterns, refine processes, and share information about the project with stakeholders.<\/p>\n<p><b>Cost <\/b>or <b>budget variance<\/b> is the difference between the actual amount of money spent on a project and the amount that was budgeted for the project. A low variance means you've estimated your project budget accurately. A high variance means you should reevaluate your estimation process.<\/p>\n<p>\n<b>Happiness and satisfaction <\/b>relate to different aspects of the user's overall satisfaction with a product or service, like<b> visual appeal<\/b>, how likely they are to <b>recommend<\/b>, and<b> ease of use<\/b>. Happiness metrics can generally be captured with a well-designed survey or by tracking revenue generated, customer retention, or product returns. \n<\/p>\n\n<p>\n<b>Adoption and engagement. Adoption <\/b>refers to whether or not a product, service or process is accepted and used. <b>Engagement <\/b>refers to the degree to which it is used—the frequency of use, amount of time spent using it, and the r
