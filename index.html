<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product Owner Study Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE everyday study tool, calm and focused
   IDEA a study desk: decks of index cards grouped in four parts, plus the official guide as the reference book
   PICTURE the large current card itself, with its deck drawn as a stack; the guide reads like a clean book page
   COLOUR deep green band, white cards, lime-white for progress, coral for mistakes and interview tags
   TYPE Inter Tight 700 + Inter
   LAYOUT green band with title, progress and tabs; parts as bands of module cards; phone stacks */
:root{color-scheme:light dark;--bg:light-dark(#f4f7f5,#0d1513);--card:light-dark(#ffffff,#16211e);--ink:light-dark(#101a17,#e6efea);--soft:light-dark(#4a5a55,#a9bab3);--line:light-dark(#d9e3de,#2a3a35);--green:#00463c;--lime:#e6f5c8;--coral:#e0533d;--ok:light-dark(#1d7a50,#5fd39a);--okbg:light-dark(#e3f4ea,#173326);--badbg:light-dark(#fde8e4,#3a1d18);--keybg:light-dark(#eef7dc,#22301b);--hi:light-dark(#00463c,#e6f5c8)}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
html{scroll-padding-top:16px}
body{background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Inter Tight",Inter,sans-serif;letter-spacing:-.02em;line-height:1.08;margin:0}
.top{background:var(--green);color:#fff;padding:clamp(24px,4vw,44px) max(5vw,16px) 0}
.wrap{max-width:1100px;margin:0 auto}
.top h1{font-size:clamp(30px,5vw,46px);text-wrap:balance}
.top p{margin:8px 0 0;color:#cfe5dc;max-width:66ch}
.prog{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 14px;align-items:center;margin-top:20px;max-width:640px}
.track{height:10px;background:rgba(255,255,255,.18);border-radius:6px;overflow:hidden}
.track i{display:block;height:100%;background:var(--lime);border-radius:6px;transition:width .4s}
.prog b{white-space:nowrap;color:var(--lime);font-weight:600;font-size:15px}
.tabs{display:flex;gap:4px;margin-top:22px;overflow-x:auto}
.tabs button{flex:none;font:600 15px Inter,sans-serif;border:0;background:transparent;color:#cfe5dc;padding:12px 16px;border-radius:10px 10px 0 0;cursor:pointer;min-height:44px}
.tabs button[aria-selected=true]{background:var(--bg);color:var(--ink)}
button:focus-visible,.mod:focus-visible,a:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
main{padding:clamp(20px,3vw,40px) max(5vw,16px) 56px}
.part{margin-top:34px}
.part h2{font-size:clamp(24px,3vw,30px)}
.part>p{margin:6px 0 14px;color:var(--soft)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.mod{all:unset;box-sizing:border-box;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:8px;min-height:180px}
.mod:hover{border-color:var(--green)}
.mod .n{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font:600 14px Inter;color:var(--soft)}
.mod h3{font-size:21px}
.mod p{margin:0;color:var(--soft);font-size:15px;flex:1}
.tag{font:600 13px Inter;padding:2px 9px;border-radius:20px;white-space:nowrap}
.tag.ex{background:var(--okbg);color:var(--ok)}
.tag.en{background:var(--badbg);color:light-dark(#a8361f,#ff9a85)}
.mbar{height:6px;background:var(--line);border-radius:4px;overflow:hidden}
.mbar i{display:block;height:100%;background:var(--ok)}
.mstate{font-size:14px;color:var(--soft)}
.mstate.done{color:var(--ok);font-weight:600}
.intro{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.box h2{font-size:24px;margin-bottom:8px}
.box p,.box li{color:var(--soft);margin:6px 0}
.box ul{padding-left:20px;margin:6px 0}
.deck{max-width:760px;margin:0 auto}
.crumb{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.crumb h2{font-size:clamp(24px,3.4vw,32px)}
.stack{position:relative;padding-bottom:14px}
.stack::before,.stack::after{content:"";position:absolute;left:14px;right:14px;bottom:6px;height:20px;background:var(--card);border:1px solid var(--line);border-radius:16px;z-index:0}
.stack::after{left:28px;right:28px;bottom:0;opacity:.7}
.card{position:relative;z-index:1;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:clamp(22px,4vw,40px);min-height:360px;display:flex;flex-direction:column;gap:14px;box-shadow:0 8px 24px rgba(0,40,30,.08);animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.card{animation:none}.track i{transition:none}}
.card .k{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font:600 14px Inter;color:var(--soft)}
.card h3{font-size:clamp(24px,3.6vw,32px)}
.card .body p{margin:0 0 10px}
.card .body ul{margin:0 0 10px;padding-left:22px}
.card .body li{margin:5px 0}
.key{background:var(--keybg);border-radius:12px;padding:14px 16px;margin-top:auto}
.key b{display:block;font-size:14px;margin-bottom:2px}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:16px 0}
.dots span{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots span.on{background:var(--hi)}
.nav{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.btn{font:600 16px Inter,sans-serif;min-height:46px;padding:10px 20px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn.pri{background:var(--green);border-color:var(--green);color:#fff}
.btn.sm{min-height:40px;padding:8px 14px;font-size:15px}
.btn:disabled{opacity:.4;cursor:default}
.btn.on{background:var(--hi);border-color:var(--hi);color:var(--bg)}
.q{font-size:clamp(20px,2.8vw,24px);font-family:"Inter Tight",Inter,sans-serif;font-weight:700;line-height:1.25;margin:0}
.opts{display:grid;gap:10px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;min-height:48px;background:var(--card)}
.opt:hover:not([disabled]){border-color:var(--green)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--coral);background:var(--badbg)}
.opt[disabled]{cursor:default}
.why{border-radius:12px;padding:14px 16px;background:var(--keybg)}
.why b{display:block}
.score{font:700 clamp(56px,10vw,88px)/1 "Inter Tight",sans-serif;letter-spacing:-.03em}
.pass{color:var(--ok)}.fail{color:var(--coral)}
.miss{border-top:1px solid var(--line);padding:12px 0}
.miss p{margin:4px 0}
.miss .s{color:var(--soft);font-size:15px}
.week{display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;border-top:1px solid var(--line);padding:20px 0}
.week h3{font-size:22px}
.week .w{font:700 40px/1 "Inter Tight",sans-serif;color:var(--hi)}
.week ul{margin:8px 0 0;padding-left:20px}.week li{margin:6px 0}
.note{font-size:14px;color:var(--soft);margin-top:24px}
a{color:inherit}
.gbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.seg{display:flex;gap:6px}
.toc{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;margin-bottom:8px;border-bottom:1px solid var(--line)}
.toc button{flex:none;font:500 14px Inter;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:8px 14px;min-height:40px;cursor:pointer}
.book{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:clamp(22px,4vw,48px);max-width:820px;margin:0 auto}
.book h2{font-size:clamp(26px,3.4vw,32px);margin:36px 0 12px}
.book h2:first-of-type{margin-top:8px}
.book h3{font-size:22px;margin:26px 0 8px}
.book h4{font-size:18px;margin:20px 0 6px}
.book p{margin:0 0 12px;max-width:70ch}
.book ul,.book ol{margin:0 0 12px;padding-left:24px;max-width:70ch}
.book li{margin:5px 0}
.book .flash{animation:fl 1.6s ease}
@keyframes fl{from{background:var(--keybg)}to{background:transparent}}
.nbar{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;margin-bottom:14px}
.ngroup{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;align-items:center}
.ngroup span{flex:none;font:600 13px Inter;color:var(--soft);min-width:9.5em}
.ngroup button{flex:none;font:500 14px Inter;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:8px 14px;min-height:40px;cursor:pointer}
.ngroup button.on{background:var(--hi);border-color:var(--hi);color:var(--bg)}
.warn{background:var(--badbg);border-radius:12px;padding:12px 16px;margin:0 0 16px;font-size:15px}
.sub{margin:0 0 18px;border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.sub summary{cursor:pointer;font-weight:600;min-height:28px}
.sub ol{columns:2 260px;margin:8px 0 0;padding-left:22px}
.sub li{margin:3px 0;break-inside:avoid}
.sub a{text-decoration:none;color:var(--ink)}
.sub a:hover{text-decoration:underline}
.book .imgph{border:1px dashed var(--line);border-radius:10px;padding:10px 14px;color:var(--soft);font-size:14px}
.book details{border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:0 0 12px}
.book details summary{cursor:pointer;font-weight:600}
.book .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.book .tw{overflow-x:auto;margin:0 0 12px}
.book table{border-collapse:collapse;font-size:15px}
.book td{border:1px solid var(--line);padding:6px 10px;vertical-align:top}
.book td p{margin:0}
.book img{max-width:100%}
#tts{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--green);color:#fff;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:0 -4px 16px rgba(0,0,0,.18)}
#tts[hidden]{display:none}
#tts .in{max-width:1100px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
#tts button{font:600 15px Inter,sans-serif;min-height:42px;padding:8px 16px;border-radius:10px;border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;cursor:pointer}
#tts button.main{background:var(--lime);color:#00463c;border-color:var(--lime);min-width:104px}
#tts select{font:15px Inter,sans-serif;min-height:42px;border-radius:10px;border:1px solid rgba(255,255,255,.35);background:#0b5a4e;color:#fff;padding:6px 8px;max-width:220px}
#tts label{display:flex;align-items:center;gap:6px;font-size:15px;white-space:nowrap}
#tts input{width:20px;height:20px;accent-color:var(--lime)}
#tts .msg{font-size:14px;color:#cfe5dc;flex:1 1 180px}
body.has-tts main{padding-bottom:120px}
.reading{background:var(--keybg);border-radius:6px;box-shadow:0 0 0 4px var(--keybg)}
.attr{font-size:14px;color:var(--soft);max-width:820px;margin:0 auto 14px}
@media(max-width:700px){.intro{grid-template-columns:minmax(0,1fr)}.week{grid-template-columns:minmax(0,1fr);gap:4px}.card{min-height:300px}.nav .btn{flex:1 1 auto}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <h1>Product Owner Study Guide</h1>
    <p>Preparation for the PSPO I (Professional Scrum Product Owner I) certification and for Product Owner interviews. Includes the full 2020 Scrum Guide and your Google Project Management course notes.</p>
    <div class="prog">
      <div class="track"><i id="pbar1" style="width:0"></i></div><b id="ptxt1"></b>
      <div class="track"><i id="pbar2" style="width:0"></i></div><b id="ptxt2"></b>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" id="t-mod" data-tab="mod" aria-selected="true">Modules</button>
      <button role="tab" id="t-guia" data-tab="guia" aria-selected="false">Scrum Guide</button>
      <button role="tab" id="t-notes" data-tab="notes" aria-selected="false">My notes</button>
      <button role="tab" id="t-plan" data-tab="plan" aria-selected="false">4-week plan</button>
      <button role="tab" id="t-exam" data-tab="exam" aria-selected="false">Mock exam</button>
    </div>
  </div>
</header>
<main><div class="wrap" id="view"></div></main>
<div id="tts" hidden><div class="in"><button class="main" id="tts-play" type="button">Listen</button><button id="tts-stop" type="button">Stop</button><select id="tts-rate" aria-label="Speed"><option value="0.8">0.8x</option><option value="1" selected>1x</option><option value="1.15">1.15x</option><option value="1.3">1.3x</option><option value="1.5">1.5x</option></select><select id="tts-voice" aria-label="Voice"></select><label><input type="checkbox" id="tts-auto"> Keep going</label><span class="msg" id="tts-msg">Starts from the first paragraph on screen.</span></div></div>

<script>
{
const D={"MD":{"agile":{"t":"Agile and the Agile Manifesto","d":"Waterfall vs. Agile, the 4 values, the 12 principles and when each approach fits.","tag":"en","cards":[{"h":"Waterfall vs. Agile","b":"<p><b>Waterfall</b> runs work in sequential phases: you finish one before starting the next, and changing course midway is expensive.</p><p><b>Agile</b> works in <b>short iterations</b>: in each one, the team takes a slice of the work and completes it end to end. This brings customer feedback sooner, makes change easier and reduces waste without lowering quality.</p>","k":"Waterfall is not \"the bad one\". It fits when requirements are stable or regulation is strict. In an interview, showing judgment beats showing loyalty to a method."},{"h":"The 4 values of the Agile Manifesto","b":"<ul><li><b>Individuals and interactions</b> over processes and tools.</li><li><b>Working software</b> over comprehensive documentation.</li><li><b>Customer collaboration</b> over contract negotiation.</li><li><b>Responding to change</b> over following a plan.</li></ul><p>The Manifesto closes with: while there is value in the items on the right, we value the items on the left more.</p>","k":"Agile does not mean \"no documentation\" or \"no plan\". It is a question of priority."},{"h":"The 12 principles, in 4 themes","b":"<ul><li><b>Value delivery</b> (principles 1 to 5): satisfy the customer through early and continuous delivery; deliver frequently, preferring weeks over months; working software is the primary measure of progress; simplicity, the art of maximizing the amount of work not done; technical excellence.</li><li><b>Business collaboration</b> (6 and 7): welcome changing requirements, even late; business people and developers work together daily.</li><li><b>Team dynamics and culture</b> (8 to 11): motivated individuals with the support and trust they need; face-to-face conversation; sustainable pace; self-organizing teams.</li><li><b>Retrospectives and continuous learning</b> (12): at regular intervals the team reflects and adjusts how it works.</li></ul>","k":"\"Simplicity, the art of maximizing the amount of work not done\" is one of the most quoted lines in product interviews."},{"h":"When an Agile approach fits","b":"<p>Before choosing an approach, look at the environment with the <b>VUCA (Volatility, Uncertainty, Complexity, Ambiguity)</b> lens:</p><ul><li><b>Volatility:</b> how fast the situation changes.</li><li><b>Uncertainty:</b> how predictable it is.</li><li><b>Complexity:</b> how many interrelated forces are at play.</li><li><b>Ambiguity:</b> how easy it is to misread causes and conditions.</li></ul><p>When all four are high, an Agile approach fits better.</p>","k":"This connects to the Scrum Guide: Scrum exists for \"complex problems\"."},{"h":"Blending Waterfall and Agile","b":"<p>Many organizations work in a hybrid way. Common reasons:</p><ul><li>Stakeholders or customers are more comfortable with a traditional approach, even if the team already uses Scrum.</li><li>Regulatory requirements demand certain traditional processes.</li><li>A vendor works traditionally and the teams need to integrate.</li></ul>","k":"A good question to ask in an interview: \"How open is leadership here to blending approaches?\""}],"qz":[{"q":"What characterizes Waterfall?","o":["Sequential phases: one finishes before the next begins","Short iterations with frequent delivery","Self-managing teams without a plan","Change is welcome at any time"],"a":0,"w":"Waterfall is linear and sequential; changing course midway is costly."},{"q":"Which of these is a value of the Agile Manifesto?","o":["Responding to change over following a plan","Following a plan over responding to change","Comprehensive documentation over working software","Contract negotiation over customer collaboration"],"a":0,"w":"The other three reverse the order of the values."},{"q":"According to the Manifesto, what is the place of documentation?","o":["It has value, but working software is valued more","It has no value and should be removed","It is the most important part of the project","Only the Product Owner writes it"],"a":0,"w":"There is value in the items on the right; the items on the left are valued more."},{"q":"According to the Agile principles, what is the primary measure of progress?","o":["Working software","Hours worked","Percentage of the plan completed","Number of meetings held"],"a":0,"w":"Principle 7: working software is the primary measure of progress."},{"q":"A project has high volatility, uncertainty and complexity. Which approach fits?","o":["An Agile approach","Strict Waterfall","None: wait until things stabilize","Plan everything in detail before starting"],"a":0,"w":"The higher the VUCA (Volatility, Uncertainty, Complexity, Ambiguity), the better an Agile approach fits."}],"g":null},"lean":{"t":"Lean, Kanban and other frameworks","d":"The Lean principles, the Kanban board, Extreme Programming and how they relate to Scrum.","tag":"en","cards":[{"h":"The 5 Lean principles","b":"<ul><li><b>Define value</b> from what the customer wants, and involve the customer.</li><li><b>Map the value stream:</b> every step that produces value, challenging the wasteful ones.</li><li><b>Create flow:</b> keep work moving without blockers.</li><li><b>Establish pull:</b> the customer pulls the product by asking for features and increments.</li><li><b>Pursue perfection:</b> keep improving the four previous steps.</li></ul>","k":"Scrum is founded on lean thinking: reduce waste and focus on the essentials."},{"h":"Kanban","b":"<p>Kanban comes from two Japanese words: \"kan\" (sign) and \"ban\" (board). The board shows work in columns: to do, in progress and done.</p><p>Its key tool is the <b>WIP (Work In Progress) limit</b>. The team sets it, and nobody starts something new until the team is below the limit. Focusing on less work gets work done faster: that is <b>flow</b>.</p>","k":"The idea in one line: \"stop starting, start finishing\"."},{"h":"Extreme Programming","b":"<p>XP (Extreme Programming) improves quality by taking good development practices to the extreme:</p><ul><li><b>Pair programming:</b> two people work on the same task at the same time.</li><li><b>Continuous integration:</b> changes are merged often into a shared version.</li><li><b>Avoid big design up front:</b> design just enough to start, and improve as you go.</li><li><b>Write tests, not requirements.</b></li></ul>","k":"With 5 years as a developer, this is a conversation where you have an edge over other Product Owner candidates."},{"h":"Agile, Scrum, Kanban and XP","b":"<p><b>Agile</b> is the philosophy and mindset. <b>Scrum</b>, <b>Kanban</b> and <b>XP (Extreme Programming)</b> are concrete ways to put it into practice:</p><ul><li>Scrum: Sprints, accountabilities and fixed events.</li><li>Kanban: continuous flow and WIP (Work In Progress) limits.</li><li>XP (Extreme Programming): technical excellence.</li></ul><p>Many teams combine them, for example using a Kanban board inside a Sprint.</p>","k":"If asked the difference between Agile and Scrum: Agile is the \"why\", Scrum is one \"how\"."}],"qz":[{"q":"What is the purpose of a WIP (Work In Progress) limit in Kanban?","o":["To limit simultaneous work so that work flows","To track each person's hours","To set the delivery date","To decide who does each task"],"a":0,"w":"By focusing on less work at once, work gets finished faster."},{"q":"Who sets the WIP (Work In Progress) limit?","o":["The team","The manager","The customer","The Product Owner"],"a":0,"w":"The team sets it, in line with self-organizing teams."},{"q":"What is the first Lean principle?","o":["Define value from what the customer wants","Cut staff costs","Plan everything up front","Maximize resource utilization"],"a":0,"w":"Everything starts with understanding what the customer values."},{"q":"Pair programming is a practice of:","o":["Extreme Programming","Kanban","Waterfall","Lean"],"a":0,"w":"XP (Extreme Programming) takes development best practices to the extreme."},{"q":"What is the relationship between Agile and Scrum?","o":["Agile is the philosophy; Scrum is a framework that puts it into practice","They are the same thing with different names","Scrum is the philosophy; Agile is a framework","Scrum is a variant of Waterfall"],"a":0,"w":"Agile is the mindset; Scrum is a concrete framework."}],"g":null},"fund":{"t":"Scrum fundamentals","d":"What Scrum is, the theory it is founded on, its pillars and its values.","tag":"ex","cards":[{"h":"What Scrum is","b":"<p>Scrum is a <b>lightweight framework</b> that helps people, teams and organizations generate value through adaptive solutions for <b>complex problems</b>.</p><p>The basic loop: the Product Owner orders the work in a Product Backlog, the Scrum Team turns a selection of it into an Increment of value during a Sprint, and the team and its stakeholders inspect the results and adjust. Then repeat.</p>","k":"Scrum is purposefully incomplete: it defines only the parts required and leaves room for each team's own practices."},{"h":"Theory: empiricism and lean thinking","b":"<p><b>Empiricism:</b> knowledge comes from experience, and decisions are based on what is observed, not on predictions.</p><p><b>Lean thinking:</b> reduce waste and focus on the essentials.</p><p>Scrum uses an <b>iterative, incremental</b> approach to optimize predictability and control risk.</p>","k":"If an answer option talks about planning everything up front or following a fixed plan, it is almost certainly wrong."},{"h":"The three pillars","b":"<ul><li><b>Transparency:</b> the process and the work must be visible to those doing it and those receiving it. Low transparency leads to decisions that diminish value and increase risk.</li><li><b>Inspection:</b> artifacts and progress are inspected frequently to detect problems. The events provide the cadence.</li><li><b>Adaptation:</b> if something drifts outside acceptable limits, adjust as soon as possible.</li></ul>","k":"The chain: transparency enables inspection, and inspection enables adaptation. Inspection without adaptation is considered pointless."},{"h":"The five values","b":"<p><b>Commitment, Focus, Openness, Respect and Courage.</b></p><p>When the Scrum Team lives these values, the empirical pillars come to life, building trust.</p>","k":"\"Velocity\" or \"Quality\" are not Scrum values. Watch for distractors like these."}],"qz":[{"q":"What is Scrum founded on?","o":["Empiricism and lean thinking","Detailed predictive planning","Lean and Six Sigma","Kanban and risk management"],"a":0,"w":"The Scrum Guide says Scrum is founded on empiricism and lean thinking."},{"q":"What are the three empirical pillars of Scrum?","o":["Transparency, inspection and adaptation","Commitment, focus and courage","Plan, execute and control","Transparency, respect and adaptation"],"a":0,"w":"Commitment, focus and courage are values, not pillars."},{"q":"What is the risk of artifacts with low transparency?","o":["Decisions that diminish value and increase risk","Longer Sprints","The Scrum Master has to step in","None, if the team is experienced"],"a":0,"w":"Decisions are based on the perceived state of the artifacts."},{"q":"Which of these is NOT a Scrum value?","o":["Velocity","Openness","Courage","Respect"],"a":0,"w":"The values are Commitment, Focus, Openness, Respect and Courage."},{"q":"True or false: Scrum is purposefully incomplete.","o":["True","False"],"a":0,"w":"It defines only the parts required to implement Scrum theory."}],"g":{"es":"Definición de Scrum","en":"Scrum Definition"}},"team":{"t":"The Scrum Team","d":"How the team is formed, its size and the three accountabilities.","tag":"ex","cards":[{"h":"The fundamental unit","b":"<p>A Scrum Team consists of <b>one Scrum Master, one Product Owner and Developers</b>. There are no sub-teams or hierarchies: it is a cohesive unit focused on one objective at a time, the <b>Product Goal</b>.</p><p>It is typically <b>10 or fewer people</b>.</p>","k":"The 2017 guide said 3 to 9 Developers. The 2020 guide says \"10 or fewer\" for the whole Scrum Team. A classic trap."},{"h":"Cross-functional and self-managing","b":"<p><b>Cross-functional:</b> the members have all the skills needed to create value each Sprint.</p><p><b>Self-managing:</b> they internally decide who does what, when and how.</p><p>The team is responsible for all product-related activities: stakeholder collaboration, verification, maintenance, operation, experimentation, research and development.</p>","k":"The entire Scrum Team is accountable for creating a valuable, useful Increment every Sprint, not only the Developers."},{"h":"Many teams, one product","b":"<p>If the team grows too large, it should reorganize into multiple cohesive Scrum Teams focused on the same product.</p><p>Those teams share <b>the same Product Goal, Product Backlog and Product Owner</b>.</p>","k":"One product, one Product Backlog, one Product Owner. Always."},{"h":"Developers","b":"<p>The people committed to creating any aspect of a usable Increment each Sprint. They are always accountable for:</p><ul><li>Creating a plan for the Sprint, the Sprint Backlog.</li><li>Instilling quality by adhering to a Definition of Done.</li><li>Adapting their plan each day toward the Sprint Goal.</li><li>Holding each other accountable as professionals.</li></ul>","k":"\"Developers\" does not mean only programmers: it includes anyone who builds the Increment."},{"h":"Scrum Master","b":"<p>Accountable for establishing Scrum as defined in the Scrum Guide and for the <b>Scrum Team's effectiveness</b>. A true leader who serves the Scrum Team, the Product Owner and the organization.</p><p>For the Product Owner, the Scrum Master helps find techniques for defining the Product Goal, managing the backlog and facilitating stakeholder collaboration.</p>","k":"The Scrum Master is not a project manager and does not assign tasks."}],"qz":[{"q":"According to the 2020 Scrum Guide, what is the typical size of a Scrum Team?","o":["10 or fewer people","3 to 9 Developers","5 to 7 people","There is no guidance"],"a":0,"w":"\"3 to 9 Developers\" was the 2017 guide. The 2020 guide says 10 or fewer people."},{"q":"Who decides who does what, when and how within the Scrum Team?","o":["The Scrum Team itself","The Scrum Master","The Product Owner","The line manager"],"a":0,"w":"Scrum Teams are self-managing."},{"q":"Three Scrum Teams work on the same product. What must they share?","o":["Product Goal, Product Backlog and Product Owner","Scrum Master, Daily Scrum and Sprint Backlog","Only the Definition of Done","Nothing: each team is independent"],"a":0,"w":"A product has one Product Backlog, one Product Owner and one Product Goal."},{"q":"Who is accountable for creating the Sprint Backlog?","o":["The Developers","The Product Owner","The Scrum Master","The Product Owner with the stakeholders"],"a":0,"w":"It is one of the Developers' accountabilities: it is their plan."},{"q":"What is the Scrum Master accountable for?","o":["The Scrum Team's effectiveness","Maximizing the value of the product","Assigning tasks to the Developers","Approving the Increment"],"a":0,"w":"Maximizing value is the Product Owner's accountability."}],"g":{"es":"Scrum Team","en":"Scrum Team"}},"po":{"t":"The Product Owner","d":"Your role: value, the Product Backlog and decision-making. The most important module.","tag":"ex","cards":[{"h":"Maximizing value","b":"<p>The Product Owner is accountable for <b>maximizing the value of the product</b> resulting from the work of the Scrum Team.</p><p>How this is done may vary widely across organizations, Scrum Teams and individuals; the guide does not prescribe a method.</p>","k":"Value, not velocity or number of features. When in doubt on the exam, pick the option about value."},{"h":"Product Backlog management","b":"<p>The Product Owner is accountable for:</p><ul><li>Developing and explicitly communicating the Product Goal.</li><li>Creating and clearly communicating Product Backlog items.</li><li>Ordering Product Backlog items.</li><li>Ensuring that the Product Backlog is transparent, visible and understood.</li></ul>","k":"The Product Owner may delegate this work, but remains accountable. Delegating does not transfer accountability."},{"h":"One person, not a committee","b":"<p>The Product Owner is <b>one person</b>. They may represent the needs of many stakeholders in the Product Backlog, but the decision is theirs.</p><p>Those wanting to change the Product Backlog can do so by <b>trying to convince the Product Owner</b>.</p>","k":"If a manager adds items directly, or a committee decides the order, that option is wrong."},{"h":"Respecting their decisions","b":"<p>For Product Owners to succeed, <b>the entire organization must respect their decisions</b>.</p><p>These decisions are visible in the content and ordering of the Product Backlog, and through the inspectable Increment at the Sprint Review.</p>","k":"Only the Product Owner can cancel a Sprint, and does so if the Sprint Goal becomes obsolete."},{"h":"What the Product Owner does not do","b":"<ul><li>Does not decide <b>how</b> the Developers do the work.</li><li>Does not decide <b>how much</b> work goes into the Sprint: the Developers select items at Sprint Planning, through discussion with the Product Owner.</li><li>Does not size items: the Developers do the sizing.</li><li>Is not required at the Daily Scrum, unless actively working on Sprint Backlog items.</li></ul>","k":"What and why: Product Owner. How and how much: Developers."}],"qz":[{"q":"What is the Product Owner's core accountability?","o":["Maximizing the value of the product","Maximizing the team's velocity","Making sure deadlines are met","Writing all the user stories"],"a":0,"w":"The guide defines the Product Owner as accountable for maximizing the value of the product."},{"q":"Can the Product Owner delegate Product Backlog management?","o":["Yes, but the Product Owner remains accountable","No, never","Yes, and accountability moves to whoever receives it","Only to the Scrum Master"],"a":0,"w":"The work can be delegated; the accountability cannot."},{"q":"A manager needs an urgent feature prioritized. What should they do?","o":["Talk to the Product Owner and try to convince them","Add it to the top of the Product Backlog","Ask the Developers directly","Raise it at the Daily Scrum"],"a":0,"w":"Those wanting to change the Product Backlog do so by convincing the Product Owner."},{"q":"Who has the authority to cancel a Sprint?","o":["Only the Product Owner","The Scrum Master","The Developers","Key stakeholders"],"a":0,"w":"Only the Product Owner, when the Sprint Goal becomes obsolete."},{"q":"Who decides how many Product Backlog items go into a Sprint?","o":["The Developers, through discussion with the Product Owner","The Product Owner","The Scrum Master","The stakeholders at the Sprint Review"],"a":0,"w":"At Sprint Planning, the Developers select items through discussion with the Product Owner."},{"q":"In a large company, can the Product Owner be a committee?","o":["No, it is one person who may represent many stakeholders","Yes, if the product is very large","Yes, if the Scrum Master approves","Only in teams of more than 10 people"],"a":0,"w":"The Product Owner is one person, not a committee."}],"g":{"es":"Product Owner","en":"Product Owner"}},"eventos":{"t":"The Scrum events","d":"The Sprint and its four events: purpose, who attends and timeboxes.","tag":"ex","cards":[{"h":"The Sprint","b":"<p>The container for all other events: a fixed-length event of <b>one month or less</b>. A new Sprint starts immediately after the previous one ends.</p><p>During the Sprint:</p><ul><li>No changes are made that would endanger the Sprint Goal.</li><li>Quality does not decrease.</li><li>The Product Backlog is refined as needed.</li><li>Scope may be clarified and renegotiated with the Product Owner as more is learned.</li></ul>","k":"There is no \"Sprint 0\", no \"hardening Sprint\" and no gap between Sprints."},{"h":"Sprint Planning","b":"<p>Initiates the Sprint. It addresses three topics:</p><ul><li><b>Why</b> is this Sprint valuable? The Scrum Team defines the Sprint Goal, which must be finalized before the end of Sprint Planning.</li><li><b>What</b> can be Done this Sprint? The Developers select items through discussion with the Product Owner.</li><li><b>How</b> will the chosen work get done? Decided solely by the Developers.</li></ul><p>Timeboxed to a maximum of <b>8 hours</b> for a one-month Sprint.</p>","k":"Sprint Goal + selected items + the plan = the Sprint Backlog."},{"h":"Daily Scrum","b":"<p>A <b>15-minute event for the Developers</b>, at the same time and place every working day. Its purpose is to inspect progress toward the Sprint Goal and adapt the Sprint Backlog.</p><p>The Developers can choose whatever structure they want. If the Product Owner or Scrum Master are actively working on Sprint Backlog items, they participate as Developers.</p>","k":"It is not a status meeting for the Scrum Master or the Product Owner, and the \"three questions\" are not required."},{"h":"Sprint Review","b":"<p>Inspects the outcome of the Sprint and determines future adaptations. The Scrum Team presents its work to key stakeholders and progress toward the Product Goal is discussed. The Product Backlog may be adjusted.</p><p>The second-to-last event. Maximum <b>4 hours</b> for a one-month Sprint.</p>","k":"It is a working session, not just a presentation or demo. It is not a gate to releasing value either."},{"h":"Sprint Retrospective","b":"<p>Plans ways to increase <b>quality and effectiveness</b>. The team inspects individuals, interactions, processes, tools and its Definition of Done.</p><p>The most impactful improvements are addressed as soon as possible and may even be added to the next Sprint Backlog.</p><p>Concludes the Sprint. Maximum <b>3 hours</b> for a one-month Sprint.</p>","k":"Timeboxes: Planning 8 h, Review 4 h, Retrospective 3 h, Daily 15 min. For shorter Sprints they are usually shorter."},{"h":"Refinement","b":"<p>Product Backlog refinement is breaking down and further defining items (description, order, size) so they are ready for Sprint Planning.</p><p><b>It is not an event</b>: it is an ongoing activity.</p>","k":"If asked how many events Scrum has: five (the Sprint and the four inside it). Refinement does not count."}],"qz":[{"q":"What is the maximum length of a Sprint?","o":["One month","Two weeks","Six weeks","Whatever the Scrum Master decides"],"a":0,"w":"Sprints are one month or less."},{"q":"When must the Sprint Goal be finalized?","o":["Before the end of Sprint Planning","At the first Daily Scrum","Before the Sprint Review","The Product Owner sets it before Planning"],"a":0,"w":"The whole Scrum Team defines it, and it must be finalized before Planning ends."},{"q":"Who is the Daily Scrum for?","o":["The Developers","The whole Scrum Team, with mandatory attendance","Reporting to the Scrum Master","The Product Owner to check progress"],"a":0,"w":"It is a 15-minute event for the Developers."},{"q":"Mid-Sprint, the Developers realize they cannot finish everything planned. What should happen?","o":["Renegotiate scope with the Product Owner without endangering the Sprint Goal","Extend the Sprint by a week","Lower quality standards to finish","Cancel the Sprint"],"a":0,"w":"Scope may be clarified and renegotiated with the Product Owner; quality does not decrease and the Sprint is not extended."},{"q":"Which event concludes the Sprint?","o":["Sprint Retrospective","Sprint Review","The next Sprint Planning","Refinement"],"a":0,"w":"The Retrospective concludes the Sprint; the Review is second-to-last."},{"q":"What is Product Backlog refinement?","o":["An ongoing activity, not an event","A mandatory 2-hour event","Part of the Sprint Retrospective","A Scrum Master-only task"],"a":0,"w":"Refinement is ongoing work to break down and define items."}],"g":{"es":"Eventos de Scrum","en":"Scrum Events"}},"artef":{"t":"Artifacts and commitments","d":"Product Backlog, Sprint Backlog and Increment, each with its commitment.","tag":"ex","cards":[{"h":"Three artifacts, three commitments","b":"<ul><li><b>Product Backlog</b> → Product Goal.</li><li><b>Sprint Backlog</b> → Sprint Goal.</li><li><b>Increment</b> → Definition of Done.</li></ul><p>Commitments provide transparency and focus against which progress can be measured.</p>","k":"This mapping is almost guaranteed to appear on the exam. Learn it by heart."},{"h":"Product Backlog","b":"<p>An <b>emergent, ordered</b> list of what is needed to improve the product. It is the <b>single source</b> of work undertaken by the Scrum Team.</p><p>The <b>Product Goal</b> describes a future state of the product and is the team's long-term objective. It must be fulfilled (or abandoned) before taking on the next one.</p>","k":"The Developers who will be doing the work are responsible for the sizing."},{"h":"Sprint Backlog","b":"<p>Composed of the <b>Sprint Goal (why)</b>, the selected Product Backlog items <b>(what)</b> and an actionable plan for delivering the Increment <b>(how)</b>.</p><p>It is a plan <b>by and for the Developers</b>, updated throughout the Sprint, with enough detail to inspect progress at the Daily Scrum.</p>","k":"The Sprint Goal is fixed during the Sprint; the items and the plan can change as more is learned."},{"h":"Increment and Definition of Done","b":"<p>An Increment is a concrete stepping stone toward the Product Goal. It is additive to all prior Increments and must be <b>usable</b>.</p><ul><li><b>Multiple Increments</b> may be created within a Sprint.</li><li>An Increment may be <b>delivered before</b> the end of the Sprint.</li><li>If an item does not meet the Definition of Done, it cannot be presented at the Sprint Review and <b>returns to the Product Backlog</b>.</li></ul>","k":"If the organization has a standard Definition of Done, all teams follow it as a minimum. Teams working on the same product share one Definition of Done."}],"qz":[{"q":"What is the commitment of the Increment?","o":["The Definition of Done","The Sprint Goal","The Product Goal","The acceptance criteria"],"a":0,"w":"Product Backlog → Product Goal; Sprint Backlog → Sprint Goal; Increment → Definition of Done."},{"q":"Who owns the Sprint Backlog?","o":["The Developers","The Product Owner","The Scrum Master","The whole Scrum Team and the stakeholders"],"a":0,"w":"It is a plan by and for the Developers."},{"q":"Who sizes Product Backlog items?","o":["The Developers who will do the work","The Product Owner","The Scrum Master","The Product Owner with the stakeholders"],"a":0,"w":"The Product Owner may help the Developers understand trade-offs, but sizing is theirs."},{"q":"At the end of the Sprint, an item does not meet the Definition of Done. What happens?","o":["It is not part of the Increment and returns to the Product Backlog","It is presented at the Review as progress","The Sprint is extended until it is finished","It is marked as done with a note"],"a":0,"w":"Only work that meets the Definition of Done is part of the Increment."},{"q":"Can an Increment be delivered to stakeholders before the end of the Sprint?","o":["Yes","No, only after the Sprint Review","Only if the Scrum Master approves","Only in the last Sprint of the project"],"a":0,"w":"The Sprint Review should never be considered a gate to releasing value."},{"q":"What makes up the Sprint Backlog?","o":["The Sprint Goal, the selected items and the plan to deliver them","Only the selected items","The whole ordered Product Backlog","Tasks assigned by the Scrum Master"],"a":0,"w":"Why (goal), what (items) and how (plan)."}],"g":{"es":"Artefactos de Scrum","en":"Scrum Artifacts"}},"trampas":{"t":"Traps: your notes vs. the 2020 guide","d":"Your Notion notes follow the 2017 Scrum Guide. These are the differences the exam uses to trip you up.","tag":"ex","cards":[{"h":"Why this module","b":"<p>The Scrum part of your Google course notes follows the <b>2017 Scrum Guide</b> and adds practices from the course itself. The exam uses the <b>2020 guide</b>.</p><p>The core ideas are similar, but words and rules changed. If you answer with the old version, you will miss questions you thought you knew.</p>","k":"Rule of thumb: when in doubt, the 2020 Scrum Guide wins. You have it in full in the \"Scrum Guide\" tab."},{"h":"The team","b":"<ul><li>Your notes say <b>\"Development Team\"</b>. The 2020 guide says <b>\"Developers\"</b>: there is no team within the team anymore.</li><li>Your notes say <b>\"3 to 9\"</b>. The 2020 guide says the whole Scrum Team is typically <b>10 or fewer people</b>.</li><li>Your notes say <b>\"self-organizing\"</b> (who and how). The 2020 guide says <b>\"self-managing\"</b>: the team decides who does what, when and how.</li></ul>","k":"If an option treats the \"Development Team\" as a separate group, it is probably outdated."},{"h":"The events","b":"<ul><li><b>Daily Scrum:</b> your notes use the \"three questions\". In 2020 they are no longer required; the Developers choose the format.</li><li><b>Sprint Planning:</b> the 2020 guide adds the topic \"<b>why</b> is this Sprint valuable\", which produces the Sprint Goal.</li><li><b>Task assignment:</b> your notes say Planning decides \"who is responsible for what tasks\", facilitated by the Scrum Master. In Scrum nobody assigns tasks: the Developers self-manage.</li><li><b>Sprint Review:</b> your notes describe it as a demo. The 2020 guide calls it a working session, not just a presentation.</li></ul>","k":"Sprint length: your notes say \"one to four weeks\"; the guide says \"one month or less\". Equivalent, but the exam uses the second wording."},{"h":"The artifacts","b":"<ul><li>The Product Backlog is <b>ordered</b>, not \"prioritized\".</li><li>The 2020 guide introduces <b>commitments</b>: Product Goal, Sprint Goal and Definition of Done.</li><li>The Sprint Backlog includes the <b>why</b> (Sprint Goal), the what and the how.</li><li>Your notes link the Increment to an MVP (Minimum Viable Product). The guide only requires it to be <b>usable</b> and to meet the Definition of Done.</li><li>Your notes list \"the Product Owner accepts the user story\" as part of the Definition of Done. The guide does not say that: the Definition of Done is the quality standard for the Increment.</li></ul>","k":"If an option says the Product Owner must \"approve\" or \"accept\" work as a Scrum rule, be suspicious."},{"h":"Useful practices that are not Scrum","b":"<p>User stories, story points, Planning Poker, velocity, burndown charts and Kanban boards are <b>complementary practices</b>. They are useful and widely used, but the Scrum Guide does not require them.</p><p>Your notes also say the Scrum Master \"is responsible for when the team delivers\". In the 2020 guide, the Scrum Master is accountable for the <b>Scrum Team's effectiveness</b>.</p>","k":"If an exam option says Scrum \"requires\" user stories, story points or burndown charts, it is wrong."}],"qz":[{"q":"According to the 2020 guide, what are the people who build the Increment called?","o":["Developers","Development Team","Development and QA team","Implementers"],"a":0,"w":"The 2020 guide removed the \"Development Team\" as a separate team."},{"q":"At the Daily Scrum, are the three questions required?","o":["No: the Developers choose the format, as long as it focuses on progress toward the Sprint Goal","Yes, they are part of the event definition","Only if the Scrum Master asks","Only for new teams"],"a":0,"w":"The 2020 guide removed the Daily Scrum questions."},{"q":"Does Scrum require user stories and story points?","o":["No, they are complementary practices","Yes, both are mandatory","Only user stories","Only in one-month Sprints"],"a":0,"w":"The Scrum Guide does not prescribe these techniques."},{"q":"At Sprint Planning, who decides which Developer does each task?","o":["The Developers themselves","The Scrum Master","The Product Owner","Tasks are assigned by specialty according to the plan"],"a":0,"w":"Developers are self-managing: nobody tells them how to do the work."},{"q":"Which topic did the 2020 guide add to Sprint Planning?","o":["Why is this Sprint valuable","How much the Sprint costs","Who is responsible for each task","What went wrong in the last Sprint"],"a":0,"w":"The \"why\" was added, which produces the Sprint Goal."},{"q":"How does the 2020 guide describe the Product Backlog?","o":["An emergent, ordered list of what is needed to improve the product","A fixed, prioritized list of requirements","The task list assigned by the Scrum Master","The detailed plan for the whole project"],"a":0,"w":"Emergent (it changes) and ordered (not \"prioritized\")."}],"g":{"es":"Cambios de la Guía Scrum 2017 a la Guía Scrum 2020","en":null}},"backlog":{"t":"The backlog in practice","d":"User stories, INVEST criteria, epics and how a backlog is refined day to day.","tag":"en","cards":[{"h":"What each backlog item has","b":"<ul><li><b>Description:</b> clear enough to understand without extra explanation.</li><li><b>Value:</b> how much it delivers to users, customers or the business. The team agrees on how to express it.</li><li><b>Estimate:</b> its relative effort.</li><li><b>Order:</b> its place in the list, from most to least important.</li></ul><p>Value and estimate help the Product Owner decide the order.</p>","k":"High value and low effort usually moves up. Low value and high effort usually moves down."},{"h":"User stories","b":"<p>Short descriptions of a feature, told from the perspective of the person using it. Typical format:</p><p><b>\"As a [type of user], I want [action], so that [benefit].\"</b></p><p>Example: \"As a neighborhood coordinator, I want to see which families' builds are behind schedule, so that I can support them before Saturday.\"</p><p>They are completed with the <b>persona</b> (a detailed description of the user type), <b>acceptance criteria</b>, tasks and any existing user feedback.</p>","k":"In an interview, practice writing 2 or 3 stories about a real product: it shows you think from the user's side."},{"h":"The INVEST criteria","b":"<p>A good story meets <b>INVEST (Independent, Negotiable, Valuable, Estimable, Small, Testable)</b>:</p><ul><li><b>Independent:</b> can be started and finished on its own.</li><li><b>Negotiable:</b> leaves room to discuss the details.</li><li><b>Valuable:</b> delivers value when done.</li><li><b>Estimable:</b> clear enough to estimate.</li><li><b>Small:</b> fits in a Sprint; if not, split it.</li><li><b>Testable:</b> you can verify it meets its acceptance criteria.</li></ul>","k":"If a story does not fit in a Sprint, the answer is to split it, not to extend the Sprint."},{"h":"Epics","b":"<p>An <b>epic</b> is a collection of related user stories. It tracks large, loosely defined ideas that are later broken down into concrete stories.</p><p>If a story is a chapter, the epic is the book.</p>","k":"Example: the epic \"Build tracking\" could split into stories like \"see delayed builds\" or \"log visits\"."},{"h":"Refining the backlog","b":"<p>Refinement keeps the backlog described, estimated and ordered so the team can work well. Each pass checks:</p><ul><li>That the right items are there: nothing missing, nothing extra.</li><li>That the order reflects what is most valuable.</li><li>That top items are ready, with clear acceptance criteria.</li><li>That items have an estimate.</li></ul><p>The team decides when and how often to refine.</p>","k":"A backlog with 300 fully detailed items is a warning sign: only the top needs detail."}],"qz":[{"q":"What is the typical user story format?","o":["As a [user], I want [action], so that [benefit]","Task, owner and date","Requirement, priority and cost","Problem, cause and technical solution"],"a":0,"w":"The story is told from the user's perspective and benefit."},{"q":"In INVEST (Independent, Negotiable, Valuable, Estimable, Small, Testable), what does the \"S\" require?","o":["That the story is small enough to fit in a Sprint","That it is simple to code","That it has an owner","That it is secure"],"a":0,"w":"Small: if it does not fit in a Sprint, split it."},{"q":"What is an epic?","o":["A collection of related user stories","The most important story in the backlog","A longer-than-usual Sprint","A critical production bug"],"a":0,"w":"Epics group large ideas that are later split into stories."},{"q":"A story is too big for one Sprint. What should you do?","o":["Split it into smaller stories","Extend the Sprint","Hand it to another team","Lower quality so it fits"],"a":0,"w":"Stories must fit within a Sprint."},{"q":"What should the items at the top of the backlog have?","o":["Clear acceptance criteria and an estimate","An owner assigned by the Scrum Master","An approved budget","Nothing: they are detailed during the Sprint"],"a":0,"w":"They need to be ready for Sprint Planning."}],"g":null},"estim":{"t":"Agile estimation","d":"Relative estimation, T-shirt sizes, story points, Planning Poker, velocity and burndown.","tag":"en","cards":[{"h":"Relative, not absolute","b":"<p>Instead of calculating how many hours a task takes (absolute estimation), you <b>compare its effort to another item's</b> (relative estimation).</p><p>It is faster, more accurate between items and avoids debating whether something takes 7 or 10 days.</p>","k":"People are much better at comparing than at measuring in the abstract."},{"h":"T-shirt sizes","b":"<p>The team picks a medium-sized <b>anchor</b> item and calls it \"M\". Then it compares every other item to it: is it S, L or XL?</p><p>Quick, easy to understand and ideal for teams new to relative estimation.</p>","k":"Some teams pick two anchors: one small and one large."},{"h":"Story points","b":"<p>The same idea, using numbers from the <b>Fibonacci</b> sequence: 1, 2, 3, 5, 8, 13, 21.</p><p>The gaps grow because bigger items carry more uncertainty. There is no point debating 21 vs. 25, but 21 vs. 34 is a real conversation. A point combines effort and risk.</p><p>The team agrees on the allowed values (some jump from 21 to 100) and an anchor item.</p>","k":"Points are not hours. If asked \"how many hours is a point?\", the answer is that they do not convert."},{"h":"Planning Poker and other techniques","b":"<ul><li><b>Planning Poker:</b> everyone picks a card face down, all cards are turned over together and differences are discussed. The \"?\" card means \"I don't understand\"; the coffee cup means \"I need a break\".</li><li><b>Bucket System:</b> estimates hundreds of items in about an hour.</li><li><b>Dot voting:</b> people place colored dots by size.</li><li><b>Large/Uncertain/Small:</b> only three categories.</li><li><b>Affinity mapping:</b> group similar items, then order the groups.</li></ul>","k":"Revealing cards at the same time avoids anchoring bias: everyone copying the first number said aloud."},{"h":"Why estimate as a team","b":"<ul><li>Avoids <b>false precision</b>.</li><li>Avoids <b>anchoring bias</b>.</li><li>Is <b>inclusive</b>: everyone weighs in and trust grows.</li><li>Leads to <b>effort discovery</b>: how to actually do the work.</li></ul>","k":"In Scrum, sizing is done by the Developers who will do the work, not by the Product Owner."},{"h":"Velocity and burndown","b":"<p><b>Velocity:</b> how many points the team completes per Sprint on average, over at least three Sprints. Used to forecast what fits in the next Sprint and when the backlog might be done.</p><p><b>Burndown chart:</b> a chart of the remaining work over time.</p>","k":"Velocity does not measure value, does not compare teams and does not evaluate people. It is the team's own forecasting tool."}],"qz":[{"q":"What is relative estimation?","o":["Comparing the effort of one item to another","Calculating the exact hours of each task","Estimating in working days","The Product Owner setting the timelines"],"a":0,"w":"You compare against a reference item instead of measuring in hours."},{"q":"Why use the Fibonacci sequence for story points?","o":["Bigger items carry more uncertainty, and the growing gaps reflect that","Because it is easier to add up","Because each point equals one hour","Because the Scrum Guide requires it"],"a":0,"w":"Growing gaps reflect uncertainty and avoid pointless debates."},{"q":"In Planning Poker, why are all cards revealed at the same time?","o":["To avoid anchoring bias","To save time","So the Scrum Master can decide","So there is no discussion"],"a":0,"w":"If someone says a number first, others tend to copy it."},{"q":"Which technique helps estimate hundreds of items quickly?","o":["The Bucket System","Planning Poker","Estimating in hours","A Product Owner vote"],"a":0,"w":"It can size a couple hundred items in about an hour."},{"q":"What is the team's velocity used for?","o":["Forecasting how much work fits in upcoming Sprints","Comparing performance across teams","Measuring the value delivered","Evaluating each person"],"a":0,"w":"It is the team's forecasting tool, not a measure of value or performance."}],"g":null},"vision":{"t":"Vision, strategy and roadmap","d":"Mission and vision, the four building blocks of product management, the roadmap and measurable goals.","tag":"en","cards":[{"h":"Mission and vision","b":"<p>The <b>mission</b> says <b>why</b> we do the work. It is short and stays constant.</p><p>The <b>product vision</b> helps imagine <b>what it will look like</b> when done, and sets the boundaries of what the team is responsible for.</p>","k":"Exercise: write a one-line mission for Módulo Sanitario and a vision for its social process. You will use them in interviews."},{"h":"The four building blocks of product management","b":"<ul><li><b>Vision:</b> what problem the product solves, for whom and what value it provides.</li><li><b>Strategy:</b> the path to the vision: target market, key differentiators and go-to-market plan. It adapts as you learn.</li><li><b>Roadmap:</b> turns the strategy into a plan with features, releases, timelines and priorities.</li><li><b>Measuring success:</b> indicators that show whether you are moving toward the vision.</li></ul>","k":"A good vision is aspirational yet achievable, and grows from understanding real user needs."},{"h":"The value roadmap","b":"<p>It has three parts:</p><ul><li><b>Product vision:</b> what it is, how it supports the strategy and who will use it.</li><li><b>Product roadmap:</b> a high-level view of what is expected, with estimated milestones.</li><li><b>Release plans:</b> release goal, the items it includes and an estimated date.</li></ul><p>It shows the sequence of deliverables, connects the team's work to the vision and shows stakeholders the value arriving at each stage.</p>","k":"A roadmap shows incremental value, not one big final delivery."},{"h":"Common roadmap mistakes","b":"<ul><li>Letting stakeholders think it is fixed and unchangeable.</li><li>Fine-tuning delivery dates instead of keeping them rough and refining as they get closer.</li><li>Spending more time on the roadmap than on delivering.</li></ul><p>Good practices: keep it visible, mark the highest-priority and highest-value items, and review it often with the team and stakeholders.</p>","k":"A roadmap is a hypothesis you update, not a contract."},{"h":"Measurable goals: SMART and OKRs","b":"<p>A goal is <b>SMART (Specific, Measurable, Achievable, Relevant, Time-bound)</b> when it meets those five conditions. Watch out for words like \"better\" or \"faster\": put numbers on them.</p><p>An <b>OKR (Objectives and Key Results)</b> separates the <b>objective</b> (what you want to achieve) from the <b>key results</b> (how you know you achieved it). They are set at different levels (company, team, project) and must align.</p>","k":"If you hit 100% of your key results, they were probably too easy."}],"qz":[{"q":"What is the difference between mission and vision?","o":["The mission says why the work is done; the vision, what the result will look like","They are the same","The mission changes every Sprint; the vision is fixed","The team sets the vision and the customer sets the mission"],"a":0,"w":"Mission is the why; vision is the picture of the result."},{"q":"What turns the strategy into a concrete plan with timelines and priorities?","o":["The roadmap","The vision","The mission","The Sprint Backlog"],"a":0,"w":"The roadmap makes the strategy tangible."},{"q":"What is a common roadmap mistake?","o":["Presenting it as fixed and unchangeable","Reviewing it often with stakeholders","Marking the most valuable items","Keeping it visible to the team"],"a":0,"w":"A rigid roadmap blocks adapting to what you learn."},{"q":"In an OKR (Objectives and Key Results), what are key results?","o":["Measurable outcomes that show whether the objective was met","The team's tasks","The project budget","The company vision"],"a":0,"w":"The objective says what to achieve; key results, how to know you did."},{"q":"Which of these goals is SMART (Specific, Measurable, Achievable, Relevant, Time-bound)?","o":["Go from 10 to 16 families per process before December","Improve the social process","Be faster with the builds","Grow a lot this year"],"a":0,"w":"It is specific, measurable and time-bound."}],"g":null},"kpi":{"t":"Product metrics","d":"How metrics connect to the vision, and which metrics a Product Owner uses.","tag":"en","cards":[{"h":"Metrics, vision, strategy and roadmap","b":"<p><b>KPIs (Key Performance Indicators)</b> connect daily work to the product's direction:</p><ul><li><b>Vision:</b> metrics reflect the long-term aspiration.</li><li><b>Strategy:</b> if it targets a user segment, measure acquisition in that segment.</li><li><b>Roadmap:</b> at each stage (first version, acquisition, monetization), measure whether it achieved what was intended.</li></ul>","k":"Metrics exist to inform decisions: if a metric would not change any decision, you do not need it."},{"h":"Acquisition and customer value","b":"<ul><li><b>User acquisition cost:</b> what it costs to acquire a new user.</li><li><b>Customer lifetime value:</b> the total revenue expected from a customer.</li><li><b>Conversion rate:</b> the share of users who complete a desired action.</li><li><b>Revenue growth.</b></li></ul>","k":"If customer lifetime value is lower than acquisition cost, the business model does not work."},{"h":"Usage and retention","b":"<ul><li><b>Active users:</b> daily or monthly.</li><li><b>Churn rate:</b> the share of users who stop using the product.</li><li><b>Feature usage:</b> how often and how intensely each feature is used.</li><li><b>Time to value:</b> how long a new user takes to experience the core value.</li></ul>","k":"Time to value is critical for new products: if it is too long, people leave before they understand what it is for."},{"h":"Satisfaction","b":"<ul><li><b>NPS (Net Promoter Score):</b> measures loyalty based on how likely someone is to recommend the product.</li><li><b>CSAT (Customer Satisfaction Score):</b> measures satisfaction with a specific interaction.</li></ul>","k":"Combine usage metrics (what people do) with satisfaction metrics (what they say)."},{"h":"Data, metrics and analytics","b":"<p><b>Data</b> is the information available. <b>Metrics</b> define what to measure in that data. <b>Analytics</b> uses data to answer questions, find patterns and make predictions.</p><p>There are productivity metrics (how much and how fast you progress) and quality metrics (how well it is done).</p>","k":"In an interview, pick 2 or 3 metrics and explain why those, and what decision you would make based on the result."}],"qz":[{"q":"What does churn rate measure?","o":["The share of users who stop using the product","What it costs to acquire a user","How many users recommend the product","App load time"],"a":0,"w":"It is a core retention metric."},{"q":"What is \"time to value\"?","o":["How long a new user takes to experience the product's core value","How long the team takes to finish a Sprint","Time to recover the investment","Length of a usage session"],"a":0,"w":"It measures how quickly users understand what the product is for."},{"q":"What does NPS (Net Promoter Score) measure?","o":["How likely a user is to recommend the product","The number of active users","Revenue per user","Production errors"],"a":0,"w":"It is a loyalty measure."},{"q":"The strategy targets a specific user segment. Which metric fits?","o":["User acquisition within that segment","Team velocity","Number of features delivered","Development hours"],"a":0,"w":"Metrics must align with the strategy."},{"q":"What is the difference between a metric and analytics?","o":["A metric defines what to measure; analytics uses data to answer questions","They are the same","Analytics is just a chart","The customer always defines the metrics"],"a":0,"w":"First define what to measure; then interpret it."}],"g":null},"valor":{"t":"Value and evidence","d":"How a Product Owner thinks about value, based on the Evidence-Based Management Guide.","tag":"ex","cards":[{"h":"What a product is","b":"<p>A product is a <b>vehicle to deliver value</b>. It has a clear boundary, known stakeholders and well-defined users or customers.</p><p>It can be a service, a physical product or something more abstract.</p>","k":"This connects to your experience: Módulo Sanitario's social process is also a product, with users (the families) and stakeholders."},{"h":"Outcomes, not output","b":"<p>Value is measured by <b>outcomes</b> for users and customers, not by the amount of things produced (<b>output</b>).</p><p>That is why the team's <b>velocity</b> or the number of features delivered does not prove the product creates value.</p>","k":"If velocity goes up, that alone says nothing about value."},{"h":"The four Key Value Areas","b":"<ul><li><b>Current Value:</b> the value the product delivers today.</li><li><b>Unrealized Value:</b> the potential value that could still be captured.</li><li><b>Ability to Innovate:</b> how effectively new capabilities can be delivered.</li><li><b>Time to Market:</b> how quickly the organization can learn and deliver.</li></ul>","k":"These come from the Evidence-Based Management Guide, which also appears on the exam."},{"h":"Layered goals","b":"<p>Evidence-Based Management sets goals at different distances:</p><ul><li><b>Strategic Goal:</b> far away and ambitious.</li><li><b>Intermediate Goal:</b> a concrete step toward the strategic goal.</li><li><b>Immediate Tactical Goal:</b> the next one, usually at Sprint level.</li></ul><p>Progress comes through cycles of experimenting, measuring and adapting.</p>","k":"It is the same empiricism as Scrum, applied to product strategy."},{"h":"Ordering the Product Backlog","b":"<p>Scrum does not prescribe a method for ordering. The Product Owner orders items in whatever way best maximizes value, considering for example:</p><ul><li>value to users and the business,</li><li>risk and what is learned by reducing it,</li><li>dependencies,</li><li>the Product Goal.</li></ul>","k":"The guide says \"ordering\", not \"prioritizing\". Any option that imposes a mandatory technique is suspicious."}],"qz":[{"q":"Which of these is one of the four Key Value Areas?","o":["Ability to Innovate","Team velocity","Hours worked","Number of completed user stories"],"a":0,"w":"Current Value, Unrealized Value, Ability to Innovate and Time to Market."},{"q":"What best shows that a product creates value?","o":["Outcomes for users and customers","Team velocity","Percentage of billable hours","Number of features delivered"],"a":0,"w":"Value is measured by outcomes, not output."},{"q":"What does \"Unrealized Value\" mean?","o":["Potential value that could still be captured","Value lost through mistakes","Finished work that was not delivered","Features nobody uses"],"a":0,"w":"It is the gap between what the product delivers today and what it could deliver."},{"q":"The team's velocity went up 30%. What can you conclude about the product's value?","o":["Nothing on its own: you need to look at outcomes","Value went up 30%","The team is overworking","Sprints should be longer"],"a":0,"w":"Velocity measures output, not value."},{"q":"How should the Product Owner order the Product Backlog?","o":["However best maximizes value; Scrum does not prescribe a method","Only by business value","By order of arrival","By stakeholder vote"],"a":0,"w":"The guide prescribes no technique; the criterion is maximizing value."}],"g":null},"stake":{"t":"Stakeholders and influence","d":"Stakeholder analysis, the power/interest grid, the RACI chart and influencing without authority.","tag":"en","cards":[{"h":"Stakeholder analysis","b":"<p>Steps: list everyone the project affects, assess their <b>influence</b> (how much they can affect the outcome) and <b>interest</b> (how much it affects them), and find ways to involve them.</p><p>The <b>power/interest grid</b> tells you what to do with each:</p><ul><li><b>High power, high interest:</b> manage closely.</li><li><b>High power, low interest:</b> keep satisfied without overloading them.</li><li><b>Low power, high interest:</b> keep informed.</li><li><b>Low power, low interest:</b> monitor with minimal effort.</li></ul>","k":"A big part of a Product Owner's day is managing stakeholders. Your sponsor work at the club is a good example here."},{"h":"The RACI chart","b":"<p><b>RACI (Responsible, Accountable, Consulted, Informed)</b> defines who does what on each task:</p><ul><li><b>Responsible:</b> does the work.</li><li><b>Accountable:</b> makes sure it gets done and approves the result. Must be <b>only one person</b>.</li><li><b>Consulted:</b> gives input, like a subject-matter expert.</li><li><b>Informed:</b> only needs to know the outcome.</li></ul>","k":"Link it to Scrum: the Product Owner is accountable for the Product Backlog, even when delegating part of the work."},{"h":"Sources of power","b":"<p><b>Organizational:</b> your role, the information you have access to, your network and your reputation.</p><p><b>Personal:</b> your knowledge, your expressiveness, your history and your character.</p>","k":"A Product Owner has accountability without authority over people: their power is almost entirely personal."},{"h":"How to influence","b":"<p>Conger's steps to influence:</p><ul><li>Establish credibility.</li><li>Frame for common ground.</li><li>Provide evidence.</li><li>Connect emotionally.</li></ul><p>Other tools: build a <b>coalition</b> (a temporary alliance with a shared purpose) and look for <b>mutual benefit</b>, seeing stakeholders as colleagues, not opponents.</p>","k":"Good interview story: a time you convinced someone with more power than you, told through these four steps."}],"qz":[{"q":"What do you do with a stakeholder who has high power and low interest?","o":["Keep them satisfied without overloading them with information","Manage them closely every day","Ignore them","Keep them informed of every detail"],"a":0,"w":"They need attention to stay satisfied, but do not want much communication."},{"q":"In a RACI (Responsible, Accountable, Consulted, Informed) chart, how many people are accountable for each task?","o":["Only one","Everyone working on the task","Two, to cover absences","None: accountability is shared"],"a":0,"w":"A single accountable person makes ownership clear."},{"q":"What is the first of Conger's steps to influence?","o":["Establish credibility","Connect emotionally","Provide evidence","Build a coalition"],"a":0,"w":"Without credibility, everything else loses weight."},{"q":"Which of these is a personal source of power?","o":["Knowledge","Your role in the organization","Access to information","Your network"],"a":0,"w":"Role, information, network and reputation are organizational; knowledge, expressiveness, history and character are personal."},{"q":"When negotiating with a difficult stakeholder, what should you aim for?","o":["Mutual benefit, treating them as a colleague","Winning the argument","Escalating right away","Always giving in to avoid conflict"],"a":0,"w":"Persuade and negotiate so both sides gain."}],"g":null},"riesgos":{"t":"Risks and dependencies","d":"Types of risk, dependencies, mitigation, the ROAM technique and when to escalate.","tag":"en","cards":[{"h":"Types of risk","b":"<ul><li><b>Time:</b> tasks take longer than expected.</li><li><b>Budget:</b> costs go up.</li><li><b>Scope:</b> the project does not produce the intended results.</li><li><b>External:</b> factors outside your control, like weather or regulatory changes.</li></ul><p>Watch out for <b>scope creep</b>: requests piling up without reviewing time or cost.</p>","k":"A personal example: rain that cancels a build day is an external time risk."},{"h":"Dependencies and single points of failure","b":"<p>A <b>dependency</b> exists when one task needs another to start or finish. It can be <b>internal</b> (within your control) or <b>external</b> (outside your control).</p><p>A <b>single point of failure</b> is a risk that, if it happens, halts the whole project.</p>","k":"In software, a typical single point of failure is only one person knowing how a critical part works."},{"h":"How to mitigate","b":"<p>Four strategies: <b>avoid</b> the risk, <b>accept</b> it, <b>reduce or control</b> it, or <b>transfer</b> it to a third party (for example, through insurance or a vendor).</p><p>They are recorded in a <b>risk management plan</b>, a living document. A <b>decision tree</b> helps visualize the impact of each option.</p>","k":"Accepting a risk is a valid decision, as long as it is conscious and documented."},{"h":"The ROAM technique","b":"<p>When a risk shows up, classify it with <b>ROAM (Resolved, Owned, Accepted, Mitigated)</b>:</p><ul><li><b>Resolved:</b> no longer a problem.</li><li><b>Owned:</b> someone takes ownership and follows it through.</li><li><b>Accepted:</b> it was agreed to do nothing about it.</li><li><b>Mitigated:</b> action was taken to reduce its likelihood or impact.</li></ul>","k":"What matters is that no risk is left unclassified."},{"h":"Escalation","b":"<p>Escalating means enlisting higher-level leadership to remove an obstacle, clarify priorities or validate next steps. Do it <b>at the first sign</b> of a critical problem: something that could delay a milestone, cause budget overruns or lose a customer.</p><p>Used well, it prevents \"trench wars\" between groups and bad compromises.</p>","k":"Escalating is not blaming: it is a healthy check. A good escalation explains the problem, the impact and the decision you need."}],"qz":[{"q":"What is a scope risk?","o":["The project does not produce the intended results","Costs go up","Tasks take longer","It rains on delivery day"],"a":0,"w":"Scope risk affects what the project delivers."},{"q":"What is an external dependency?","o":["A dependency outside your control","A task done by a vendor you hired","A dependency between two tasks in the same team","A risk that has been resolved"],"a":0,"w":"Internal ones are within the team's control; external ones are not."},{"q":"In ROAM (Resolved, Owned, Accepted, Mitigated), what does it mean for a risk to be \"accepted\"?","o":["It was agreed to do nothing about it","It has been resolved","Someone took ownership","Its impact was reduced"],"a":0,"w":"Accepting is a conscious decision not to act."},{"q":"When should you escalate a problem?","o":["At the first sign of a critical problem","Only when it is impossible to solve","Never: the team should handle it","At project closure"],"a":0,"w":"The sooner a critical problem is solved, the better for the project."},{"q":"What does transferring a risk mean?","o":["Shifting its impact to a third party, like an insurer or a vendor","Ignoring it","Assigning it to another team member","Eliminating it completely"],"a":0,"w":"The risk still exists, but someone else absorbs its impact."}],"g":null},"equipos":{"t":"Teams, coaching and scaling","d":"Team stages, managing vs. coaching, warning signs and how to take Agile to many teams.","tag":"en","cards":[{"h":"The stages of a team","b":"<p>According to Tuckman, a team goes through five stages:</p><ul><li><b>Forming:</b> everything is new. Clarify goals, roles and context.</li><li><b>Storming:</b> frustrations appear. Listen and help resolve conflict.</li><li><b>Norming:</b> the team settles. Make the norms explicit.</li><li><b>Performing:</b> the team runs on its own. Delegate, motivate and give feedback.</li><li><b>Adjourning:</b> the project ends. Celebrate and close.</li></ul>","k":"Every new Módulo Sanitario process with new volunteers goes through these stages. A great interview example."},{"h":"Managing vs. coaching","b":"<p><b>Managing</b> is giving direction: assigning, overseeing and deciding.</p><p><b>Coaching</b> is teaching: asking questions so the team reaches its own solutions, giving feedback and creating development opportunities. A coach motivates, supports and appreciates effort.</p><p>In self-managing Agile teams, coaching matters more than traditional management.</p>","k":"Some situations call for managing and others for coaching. Knowing which is part of the job."},{"h":"Protecting the team","b":"<p>Giving the team <b>air cover</b> means protecting it from out-of-scope requests or criticism from leadership, putting what the team needs ahead of what stakeholders want.</p>","k":"For a Product Owner, saying \"not now\" to a stakeholder is often how you protect the team's focus."},{"h":"Warning signs and fixes","b":"<ul><li><b>Value delivery:</b> missed dates, burnout, too much in progress. <i>Fixes:</i> more demos, retrospectives, a clear Definition of Done and fewer stories per Sprint.</li><li><b>Business collaboration:</b> a flood of change requests or an \"us vs. them\" mindset. <i>Fixes:</i> more demos and backlog changes only between Sprints.</li><li><b>Team dynamics:</b> low morale, lots of conflict or no conflict at all. <i>Fixes:</i> team agreements, changing workflows or training together.</li></ul>","k":"No conflict at all is also a warning sign: it may mean nobody dares to speak up."},{"h":"Introducing Agile and stabilizing the roadmap","b":"<p>To bring Agile practices to a team: <b>start small</b> (for example, with a Kanban board), <b>listen to feedback</b>, <b>be strategic</b> and <b>find allies</b>.</p><p>If the roadmap keeps changing: agree up front how new opportunities are handled, review the roadmap with the whole team and validate assumptions with user research.</p>","k":"This is almost exactly what you did when you changed the model inherited from Buenos Aires at Módulo Sanitario."},{"h":"Scaling to many teams","b":"<ul><li><b>Scrum of Scrums:</b> one representative per team meets to coordinate.</li><li><b>SAFe (Scaled Agile Framework):</b> the most popular; organizes teams into \"Agile Release Trains\" around value streams.</li><li><b>LeSS (Large-Scale Scrum):</b> applies Scrum at scale with the bare minimum.</li><li><b>DAD (Disciplined Agile Delivery):</b> a hybrid approach that combines several frameworks.</li></ul>","k":"The most important principle: do not scale unless you need to. The bigger the team, the more complex everything gets."}],"qz":[{"q":"In which Tuckman stage do frustrations and conflicts appear?","o":["Storming","Forming","Norming","Performing"],"a":0,"w":"In storming, the leader listens and helps resolve conflict."},{"q":"What distinguishes coaching from managing?","o":["Asking questions so the team reaches its own solutions","Assigning tasks in more detail","Overseeing more closely","Making all the important decisions"],"a":0,"w":"Coaching teaches; managing directs."},{"q":"What does giving the team \"air cover\" mean?","o":["Protecting it from out-of-scope requests and criticism","Covering for someone on vacation","Doing the team's work","Hiding problems from leadership"],"a":0,"w":"It means prioritizing the team's focus over outside pressure."},{"q":"There is an \"us vs. them\" mindset between the team and management. What kind of problem is it?","o":["Business collaboration","Value delivery","Estimation","Technical"],"a":0,"w":"Address it with more demos and backlog changes only between Sprints."},{"q":"What is the main advice about scaling Agile?","o":["Do not scale unless it is necessary","Always scale with SAFe (Scaled Agile Framework)","Go straight from Waterfall to a scaled framework","Have a single team of 30 people"],"a":0,"w":"Scaling adds complexity: only do it when needed."}],"g":null}},"PARTS":[{"t":"Agile foundations","d":"The mindset behind Scrum, from your Google Project Management course notes.","m":["agile","lean"]},{"t":"Scrum for the certification","d":"Everything on the exam, based on the 2020 Scrum Guide.","m":["fund","team","po","eventos","artef","trampas"]},{"t":"The Product Owner's craft","d":"How the job works day to day: backlog, estimation, roadmap and metrics.","m":["backlog","estim","vision","kpi","valor"]},{"t":"Projects and people","d":"Stakeholders, risks and teams: what interviewers will ask you about.","m":["stake","riesgos","equipos"]}],"GUIDE":{"es":[{"t":"h2","x":"Propósito de la Guía Scrum"},{"t":"p","x":"Desarrollamos Scrum a principios de la década de 1990. Escribimos la primera versión de la Guía Scrum en 2010 para ayudar a las personas de todo el mundo a comprender Scrum. Hemos desarrollado la Guía desde entonces a través de pequeñas actualizaciones funcionales. Juntos, la respaldamos."},{"t":"p","x":"La Guía de Scrum contiene la definición de Scrum. Cada elemento del marco de trabajo tiene un propósito específico que es esencial para el valor general y los resultados obtenidos con Scrum. Cambiar el diseño o las ideas esenciales de Scrum, omitir elementos o no seguir las reglas de Scrum, oculta los problemas y limita los beneficios de Scrum, e incluso potencialmente lo vuelve inútil."},{"t":"p","x":"Seguimos el uso creciente de Scrum dentro de un mundo complejo en constante crecimiento. Nos sentimos honrados de ver que Scrum está siendo adoptado en muchos dominios que tienen un trabajo esencialmente com
