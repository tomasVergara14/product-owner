n permite la adaptación. La inspección sin adaptación se considera inútil. Los eventos Scrum están diseñados para provocar cambios."},{"t":"h3","x":"Adaptación"},{"t":"p","x":"Si algún aspecto de un proceso se desvía fuera de los límites aceptables o si el producto resultante es inaceptable, el proceso que se aplica o los materiales que se producen deben ajustarse. El ajuste debe realizarse lo antes posible para minimizar una mayor desviación."},{"t":"p","x":"La adaptación se vuelve más difícil cuando las personas involucradas no están empoderadas ni se autogestionan. Se espera que un Scrum Team se adapte en el momento en que aprenda algo nuevo a través de la inspección."},{"t":"h2","x":"Valores de Scrum"},{"t":"p","x":"El uso exitoso de Scrum depende de que las personas se vuelvan más competentes en vivir cinco valores: Compromiso, Foco, Franqueza, Respeto y Coraje"},{"t":"p","x":"El Scrum Team se compromete a lograr sus objetivos y a apoyarse mutuamente. Su foco principal está en el trabajo del Sprint para lograr el mejor progreso posible hacia estos objetivos. El Scrum Team y sus interesados son francos sobre el trabajo y los desafíos. Los miembros del Scrum Team se respetan entre sí para ser personas capaces e independientes, y son respetados como tales por las personas con las que trabajan. Los miembros del Scrum Team tienen el coraje de hacer lo correcto, para trabajar en problemas difíciles."},{"t":"p","x":"Estos valores dan dirección al Scrum Team con respecto a su trabajo, acciones y comportamiento. Las decisiones que se tomen, los pasos que se den y la forma en que se use Scrum deben reforzar estos valores, no disminuirlos ni socavarlos. Los miembros del Scrum Team aprenden y exploran los valores mientras trabajan con los eventos y artefactos Scrum. Cuando el Scrum Team y las personas con las que trabajan incorporan estos valores, los pilares empíricos de Scrum de transparencia, inspección y adaptación cobran vida y generan confianza."},{"t":"h2","x":"Scrum Team"},{"t":"p","x":"La unidad fundamental de Scrum es un pequeño equipo de personas, un Scrum Team. El Scrum Team consta de un Scrum Master, un Product Owner y Developers. Dentro de un Scrum Team, no hay subequipos ni jerarquías. Es una unidad cohesionada de profesionales enfocados en un objetivo a la vez, el Objetivo del Producto."},{"t":"p","x":"Los Scrum Teams son multifuncionales, lo que significa que los miembros tienen todas las habilidades necesarias para crear valor en cada Sprint. También se autogestionan, lo que significa que deciden internamente quién hace qué, cuándo y cómo."},{"t":"p","x":"El Scrum Team es lo suficientemente pequeño como para seguir siendo ágil y lo suficientemente grande como para completar un trabajo significativo dentro de un Sprint, generalmente 10 personas o menos. En general, hemos descubierto que los equipos más pequeños se comunican mejor y son más productivos. Si los Scrum Teams se vuelven demasiado grandes, deberían considerar reorganizarse en múltiples Scrum Teams cohesivos, cada uno enfocado en el mismo producto. Por lo tanto, deben compartir el mismo Objetivo del Producto, el Product Backlog y el Product Owner."},{"t":"p","x":"El Scrum Team es responsable de todas las actividades relacionadas con el producto, desde la colaboración de los interesados, la verificación, el mantenimiento, la operación, la experimentación, la investigación y el desarrollo, y cualquier otra cosa que pueda ser necesaria. Están estructurados y empoderados por la organización para gestionar su propio trabajo. Trabajar en Sprints a un ritmo sostenible mejora el enfoque y la consistencia del Scrum Team."},{"t":"p","x":"Todo el Scrum Team es responsable de crear un Increment valioso y útil en cada Sprint. Scrum define tres responsabilidades específicas dentro del Scrum Team: los Developers, el Product Owner y el Scrum Master."},{"t":"h3","x":"Developers"},{"t":"p","x":"Las personas del Scrum Team que se comprometen a crear cualquier aspecto de un Increment utilizable en cada Sprint son Developers."},{"t":"p","x":"Las habilidades específicas que necesitan los Developers suelen ser amplias y variarán según el ámbito de trabajo. Sin embargo, los Developers siempre son responsables de:"},{"t":"li","x":"Crear un plan para el Sprint, el Sprint Backlog;"},{"t":"li","x":"Inculcar calidad al adherirse a una Definición de Terminado;"},{"t":"li","x":"Adaptar su plan cada día hacia el Objetivo del Sprint; y,"},{"t":"li","x":"Responsabilizarse mutuamente como profesionales."},{"t":"h3","x":"Product Owner"},{"t":"p","x":"El Product Owner es responsable de maximizar el valor del producto resultante del trabajo del Scrum Team. La forma en que esto se hace puede variar ampliamente entre organizaciones, Scrum Teams e individuos."},{"t":"p","x":"El Product Owner también es responsable de la gestión efectiva del Product Backlog, lo que incluye:"},{"t":"li","x":"Desarrollar y comunicar explícitamente el Objetivo del Producto;"},{"t":"li","x":"Crear y comunicar claramente los elementos del Product Backlog;"},{"t":"li","x":"Ordenar los elementos del Product Backlog; y,"},{"t":"li","x":"Asegurarse de que el Product Backlog sea transparente, visible y se entienda."},{"t":"p","x":"El Product Owner puede realizar el trabajo anterior o puede delegar la responsabilidad en otros. Independientemente de ello, el Product Owner sigue siendo el responsable de que el trabajo se realice."},{"t":"p","x":"Para que los Product Owners tengan éxito, toda la organización debe respetar sus decisiones. Estas decisiones son visibles en el contenido y el orden del Product Backlog, y a través del Increment inspeccionable en la Sprint Review."},{"t":"p","x":"El Product Owner es una persona, no un comité. El Product Owner puede representar las necesidades de muchos interesados en el Product Backlog. Aquellos que quieran cambiar el Product Backlog pueden hacerlo intentando convencer al Product Owner."},{"t":"h3","x":"Scrum Master"},{"t":"p","x":"El Scrum Master es responsable de establecer Scrum como se define en la Guía de Scrum. Lo hace ayudando a todos a comprender la teoría y la práctica de Scrum, tanto dentro del Scrum Team como de la organización."},{"t":"p","x":"El Scrum Master es responsable de lograr la efectividad del Scrum Team. Lo hace apoyando al Scrum Team en la mejora de sus prácticas, dentro del marco de trabajo de Scrum."},{"t":"p","x":"Los Scrum Masters son verdaderos líderes que sirven al Scrum Team y a la organización en general."},{"t":"p","x":"El Scrum Master sirve al Scrum Team de varias maneras, que incluyen:"},{"t":"li","x":"Guiar a los miembros del equipo en ser autogestionados y multifuncionales;"},{"t":"li","x":"Ayudar al Scrum Team a enfocarse en crear Increments de alto valor que cumplan con la Definición de Terminado;"},{"t":"li","x":"Procurar la eliminación de impedimentos para el progreso del Scrum Team; y,"},{"t":"li","x":"Asegurarse de que todos los eventos de Scrum se lleven a cabo y sean positivos, productivos y se mantengan dentro de los límites de tiempo recomendados en esta Guía."},{"t":"p","x":"El Scrum Master sirve al Product Owner de varias maneras, que incluyen:"},{"t":"li","x":"Ayudar a encontrar técnicas para una definición efectiva de Objetivos del Producto y la gestión del Product Backlog;"},{"t":"li","x":"Ayudar al Scrum Team a comprender la necesidad de tener elementos del Product Backlog claros y concisos;"},{"t":"li","x":"Ayudar a establecer una planificación empírica de productos para un entorno complejo; y,"},{"t":"li","x":"Facilitar la colaboración de los interesados según se solicite o necesite."},{"t":"p","x":"El Scrum Master sirve a la organización de varias maneras, que incluyen:"},{"t":"li","x":"Liderar, capacitar y guiar a la organización en su adopción de Scrum;"},{"t":"li","x":"Planificar y asesorar implementaciones de Scrum dentro de la organización;"},{"t":"li","x":"Ayudar a los empleados y los interesados a comprender y aplicar un enfoque empírico para el trabajo complejo; y,"},{"t":"li","x":"Eliminar las barreras entre los interesados y los Scrum Teams."},{"t":"h2","x":"Eventos de Scrum"},{"t":"p","x":"El Sprint es un contenedor para todos los demás eventos. Cada evento en Scrum es una oportunidad formal para inspeccionar y adaptar los artefactos Scrum. Estos eventos están diseñados específicamente para habilitar la transparencia requerida. No operar cualquier evento según lo prescrito resulta en la pérdida de oportunidades para inspeccionar y adaptarse. Los eventos se utilizan en Scrum para crear regularidad y minimizar la necesidad de reuniones no definidas en Scrum. Lo óptimo es que todos los eventos se celebren al mismo tiempo y en el mismo lugar para reducir la complejidad."},{"t":"h3","x":"El Sprint"},{"t":"p","x":"Los Sprints son el corazón de Scrum, donde las ideas se convierten en valor."},{"t":"p","x":"Son eventos de duración fija de un mes o menos para crear consistencia. Un nuevo Sprint comienza inmediatamente después de la conclusión del Sprint anterior."},{"t":"p","x":"Todo el trabajo necesario para lograr el Objetivo del Producto, incluido la Sprint Planning, Daily Scrums, Sprint Review y Sprint Retrospective, ocurre dentro de los Sprints."},{"t":"p","x":"Durante el Sprint:"},{"t":"li","x":"No se realizan cambios que pongan en peligro el Objetivo del Sprint;"},{"t":"li","x":"La calidad no disminuye;"},{"t":"li","x":"El Product Backlog se refina según sea necesario; y,"},{"t":"li","x":"El alcance se puede aclarar y renegociar con el Product Owner a medida que se aprende más."},{"t":"p","x":"Los Sprints permiten la previsibilidad al garantizar la inspección y adaptación del progreso hacia un Objetivo del Producto al menos cada mes calendario. Cuando el horizonte de un Sprint es demasiado largo, el Objetivo del Sprint puede volverse inválido, la complejidad puede crecer y el riesgo puede aumentar. Se pueden emplear Sprints más cortos para generar más ciclos de aprendizaje y limitar el riesgo de costo y esfuerzo a un período de tiempo menor. Cada Sprint puede considerarse un proyecto corto."},{"t":"p","x":"Existen varias prácticas para pronosticar el progreso, como el trabajo pendiente (burn‐downs), trabajo completado (burn‐ups) o flujos acumulativos (cumulative flows). Si bien han demostrado su utilidad, no reemplazan la importancia del empirismo. En entornos complejos, se desconoce lo que sucederá. Solo lo que ya ha sucedido se puede utilizar para la toma de decisiones con miras al futuro."},{"t":"p","x":"Un Sprint podría cancelarse si el Objetivo del Sprint se vuelve obsoleto. Solo el Product Owner tiene la autoridad para cancelar el Sprint."},{"t":"h3","x":"Sprint Planning"},{"t":"p","x":"La Sprint Planning inicia el Sprint al establecer el trabajo que se realizará para el Sprint. El Scrum Team crea este plan resultante mediante trabajo colaborativo."},{"t":"p","x":"El Product Owner se asegura de que los asistentes estén preparados para discutir los elementos más importantes del Product Backlog y cómo se relacionan con el Objetivo del Producto. El Scrum Team también puede invitar a otras personas a asistir a la Sprint Planning para brindar asesoramiento."},{"t":"p","x":"La Sprint Planning aborda los siguientes temas:"},{"t":"h4","x":"Tema uno: ¿Por qué es valioso este Sprint?"},{"t":"p","x":"El Product Owner propone cómo el producto podría Incrementar su valor y utilidad en el Sprint actual. Luego, todo el Scrum Team colabora para definir un Objetivo del Sprint que comunica por qué el Sprint es valioso para los interesados. El Objetivo del Sprint debe completarse antes de que termine la Sprint Planning."},{"t":"h4","x":"Tema dos: ¿Qué se puede hacer en este Sprint?"},{"t":"p","x":"A través de una conversación con el Product Owner, los Developers seleccionan elementos del Product Backlog para incluirlos en el Sprint actual. El Scrum Team puede refinar estos elementos durante este proceso, lo que aumenta la comprensión y la confianza."},{"t":"p","x":"Seleccionar cuánto se puede completar dentro de un Sprint puede ser un desafío. Sin embargo, cuanto más sepan los Developers sobre su desempeño pasado, su capacidad actual y su Definición de Terminado, más confiados estarán en sus pronósticos para el Sprint."},{"t":"h4","x":"Tema tres: ¿Cómo se realizará el trabajo elegido?"},{"t":"p","x":"Para cada elemento del Product Backlog seleccionado, los Developers planifican el trabajo necesario para crear un Increment que cumpla con la Definición de Terminado. A menudo, esto se hace descomponiendo los elementos del Product Backlog en elementos de trabajo más pequeños de un día o menos. La forma de hacerlo queda a criterio exclusivo de los Developers. Nadie más les dice cómo convertir los elementos del Product Backlog en Increments de valor."},{"t":"p","x":"El Objetivo del Sprint, los elementos del Product Backlog seleccionados para el Sprint, más el plan para entregarlos se denominan juntos Sprint Backlog."},{"t":"p","x":"La Sprint Planning tiene un límite de tiempo de máximo ocho horas para un Sprint de un mes. Para Sprints más cortos, el evento suele ser de menor duración."},{"t":"h3","x":"Daily Scrum"},{"t":"p","x":"El propósito de la Daily Scrum es inspeccionar el progreso hacia el Objetivo del Sprint y adaptar el Sprint Backlog según sea necesario, ajustando el trabajo planificado entrante."},{"t":"p","x":"La Daily Scrum es un evento de 15 minutos para los Developers del Scrum Team. Para reducir la complejidad, se lleva a cabo a la misma hora y en el mismo lugar todos los días hábiles del Sprint. Si el Product Owner o Scrum Master están trabajando activamente en elementos del Sprint Backlog, participan como Developers."},{"t":"p","x":"Los Developers pueden seleccionar la estructura y las técnicas que deseen, siempre que su Daily Scrum se centre en el progreso hacia el Objetivo del Sprint y produzca un plan viable para el siguiente día de trabajo. Esto crea enfoque y mejora la autogestión."},{"t":"p","x":"Las Daily Scrums mejoran la comunicación, identifican impedimentos, promueven la toma rápida de decisiones y, en consecuencia, eliminan la necesidad de otras reuniones."},{"t":"p","x":"La Daily Scrum no es el único momento en el que los Developers pueden ajustar su plan. A menudo se reúnen durante el día para discusiones más detalladas sobre cómo adaptar o volver a planificar el resto del trabajo del Sprint."},{"t":"h3","x":"Sprint Review"},{"t":"p","x":"El propósito de la Sprint Review es inspeccionar el resultado del Sprint y determinar futuras adaptaciones. El Scrum Team presenta los resultados de su trabajo a los interesados clave y se discute el progreso hacia el Objetivo del Producto."},{"t":"p","x":"Durante el evento, el Scrum Team y los interesados revisan lo que se logró en el Sprint y lo que ha cambiado en su entorno. Con base en esta información, los asistentes colaboran sobre qué hacer a continuación. El Product Backlog también se puede ajustar para satisfacer nuevas oportunidades. La Sprint Review es una sesión de trabajo y el Scrum Team debe evitar limitarla a una presentación."},{"t":"p","x":"La Sprint Review es el penúltimo evento del Sprint y tiene un límite de tiempo de máximo cuatro horas para un Sprint de un mes. Para Sprints más cortos, el evento suele ser de menor duración."},{"t":"h3","x":"Sprint Retrospective"},{"t":"p","x":"El propósito de la Sprint Retrospective es planificar formas de aumentar la calidad y la efectividad."},{"t":"p","x":"El Scrum Team inspecciona cómo fue el último Sprint con respecto a las personas, las interacciones, los procesos, las herramientas y su Definición de Terminado. Los elementos inspeccionados suelen variar según el ámbito del trabajo. Se identifican los supuestos que los llevaron por mal camino y se exploran sus orígenes. El Scrum Team analiza qué salió bien durante el Sprint, qué problemas encontró y cómo se resolvieron (o no) esos problemas."},{"t":"p","x":"El Scrum Team identifica los cambios más útiles para mejorar su efectividad. Las mejoras más impactantes se abordan lo antes posible. Incluso se pueden agregar al Sprint Backlog para el próximo Sprint."},{"t":"p","x":"La Sprint Retrospective concluye el Sprint. Tiene un tiempo limitado a máximo tres horas para un Sprint de un mes. Para Sprints más cortos, el evento suele ser de menor duración."},{"t":"h2","x":"Artefactos de Scrum"},{"t":"p","x":"Los artefactos de Scrum representan trabajo o valor. Están diseñados para maximizar la transparencia de la información clave. Por lo tanto, todas las personas que los inspeccionan tienen la misma base de adaptación."},{"t":"p","x":"Cada artefacto contiene un compromiso para garantizar que proporcione información que mejore la transparencia y el enfoque frente al cual se pueda medir el progreso:"},{"t":"li","x":"Para el Product Backlog, es el Objetivo del Producto."},{"t":"li","x":"Para el Sprint Backlog, es el Objetivo del Sprint."},{"t":"li","x":"Para el Increment es la Definición de Terminado."},{"t":"p","x":"Estos compromisos existen para reforzar el empirismo y los valores de Scrum para el Scrum Team y sus interesados."},{"t":"h3","x":"Product Backlog"},{"t":"p","x":"El Product Backlog es una lista emergente y ordenada de lo que se necesita para mejorar el producto. Es la única fuente del trabajo realizado por el Scrum Team."},{"t":"p","x":"Los elementos del Product Backlog que el Scrum Team puede dar por Terminados dentro de un Sprint se consideran preparados para ser seleccionados en un evento de Sprint Planning. Suelen adquirir este grado de transparencia tras las actividades de refinamiento. El refinamiento del Product Backlog es el acto de dividir y definir aún más los elementos del Product Backlog en elementos más pequeños y precisos. Esta es una actividad continua para agregar detalles, como una descripción, orden y tamaño. Los atributos suelen variar según el ámbito del trabajo."},{"t":"p","x":"Los Developers que realizarán el trabajo son responsables del dimensionamiento. El Product Owner puede influir en los Developers ayudándolos a entender y seleccionar sus mejores alternativas."},{"t":"h4","x":"Compromiso: Objetivo del Producto"},{"t":"p","x":"El Objetivo del Producto describe un estado futuro del producto que puede servir como un objetivo para que el Scrum Team planifique. El Objetivo del Producto está en el Product Backlog. El resto del Product Backlog emerge para definir \"qué\" cumplirá con el Objetivo del Producto."},{"t":"p","x":"Un producto es un vehículo para entregar valor. Tiene un límite claro, personas interesadas conocidas, usuarios o clientes bien definidos. Un producto puede ser un servicio, un producto físico o algo más abstracto."},{"t":"p","x":"El Objetivo del Producto es el objetivo a largo plazo del Scrum Team. Ellos deben cumplir (o abandonar) un objetivo antes de asumir el siguiente."},{"t":"h3","x":"Sprint Backlog"},{"t":"p","x":"El Sprint Backlog se compone del Objetivo del Sprint (por qué), el conjunto de elementos del Product Backlog seleccionados para el Sprint (qué), así como un plan de acción para entregar el Increment (cómo)."},{"t":"p","x":"El Sprint Backlog es un plan realizado por y para los Developers. Es una imagen muy visible y en tiempo real del trabajo que los Developers planean realizar durante el Sprint para lograr el Objetivo del Sprint. En consecuencia, el Sprint Backlog se actualiza a lo largo del Sprint a medida que se aprende más. Debe tener suficientes detalles para que puedan inspeccionar su progreso en la Daily Scrum."},{"t":"h4","x":"Compromiso: Objetivo del Sprint"},{"t":"p","x":"El Objetivo del Sprint es el único propósito del Sprint. Si bien el Objetivo del Sprint es un compromiso de los Developers, proporciona flexibilidad en términos del trabajo exacto necesario para lograrlo. El Objetivo del Sprint también crea coherencia y enfoque, lo que alienta al Scrum Team a trabajar en conjunto en lugar de en iniciativas separadas."},{"t":"p","x":"El Objetivo del Sprint se crea durante el evento Sprint Planning y se agrega al Sprint Backlog. Mientras los Developers trabajan durante el Sprint, tienen en mente el Objetivo del Sprint. Si el trabajo resulta ser diferente de lo que esperaban, colaboran con el Product Owner para negociar el alcance del Sprint Backlog dentro del Sprint sin afectar el Objetivo del Sprint."},{"t":"h3","x":"Increment"},{"t":"p","x":"Un Increment es un peldaño concreto hacia el Objetivo del Producto. Cada Increment se suma a todos los Increments anteriores y se verifica minuciosamente, lo que garantiza que todos los Increments funcionen juntos. Para proporcionar valor, el Increment debe ser utilizable."},{"t":"p","x":"Se pueden crear múltiples Increments dentro de un Sprint. La suma de los Increments se presenta en la Sprint Review apoyando así el empirismo. Sin embargo, se puede entregar un Increment a los interesados antes del final del Sprint. La Sprint Review nunca debe considerarse una puerta para liberar valor."},{"t":"p","x":"El trabajo no puede considerarse parte de un Increment a menos que cumpla con la Definición de Terminado."},{"t":"h4","x":"Compromiso: Definición de Terminado"},{"t":"p","x":"La Definición de Terminado es una descripción formal del estado del Increment cuando cumple con las medidas de calidad requeridas para el producto."},{"t":"p","x":"En el momento en que un elemento del Product Backlog cumple con la Definición de Terminado, nace un Increment."},{"t":"p","x":"La Definición de Terminado crea transparencia al brindar a todos un entendimiento compartido de qué trabajo se completó como parte del Increment. Si un elemento del Product Backlog no cumple con la Definición de Terminado, no se puede publicar ni presentar en la Sprint Review. En su lugar, vuelve al Product Backlog para su consideración futura."},{"t":"p","x":"Si la Definición de Terminado para un Increment es parte de los estándares de la organización, todos los Scrum Teams deben seguirla como mínimo. Si no es un estándar organizacional, el Scrum Team debe crear una Definición de Terminado apropiada para el producto."},{"t":"p","x":"Los Developers deben adherirse a la Definición de Terminado. Si hay varios Scrum Teams trabajando juntos en un producto, deben definir y cumplir mutuamente la misma Definición de Terminado."},{"t":"h2","x":"Nota final"},{"t":"p","x":"Scrum es gratuito y se ofrece en esta Guía. El marco de trabajo Scrum, como se describe aquí, es inmutable. Si bien es posible implementar solo partes de Scrum, el resultado no es Scrum. Scrum existe solo en su totalidad y funciona bien como un contenedor para otras técnicas, metodologías y prácticas."},{"t":"h3","x":"Agradecimientos"},{"t":"h4","x":"Personas"},{"t":"p","x":"De los miles de personas que han contribuido a Scrum, debemos destacar a las que fueron fundamentales al principio: Jeff Sutherland trabajó con Jeff McKenna y John Scumniotales, y Ken Schwaber trabajó con Mike Smith y Chris Martin, y todos ellos trabajaron juntos. Muchos otros contribuyeron en los años siguientes y sin su ayuda Scrum no estaría refinado como lo está hoy."},{"t":"h4","x":"Historia de la Guía de Scrum"},{"t":"p","x":"Ken Schwaber y Jeff Sutherland copresentaron Scrum por primera vez en la Conferencia OOPSLA en"},{"t":"ol","x":"Básicamente, documentó el aprendizaje que Ken y Jeff adquirieron en los años anteriores y publicó la primera definición formal de Scrum."},{"t":"p","x":"La Guía de Scrum documenta Scrum como se ha desarrollado, evolucionado y sostenido durante más de 30 años por Jeff Sutherland y Ken Schwaber. Otras fuentes proporcionan patrones, procesos y enfoques que complementan el marco de trabajo Scrum. Estos pueden aumentar la productividad, el valor, la creatividad y la satisfacción con los resultados."},{"t":"p","x":"La historia completa de Scrum se describe en otros lugares. Para honrar los primeros sitios donde se probó y comprobó, reconocemos a Individual Inc., Newspage, Fidelity Investments e IDX (ahora GE Medical)."},{"t":"h4","x":"Traducción"},{"t":"p","x":"Esta guía ha sido traducida de la versión original en inglés proporcionada por Ken Schwaber y Jeff Sutherland. Las personas que han contribuido en la traducción son: Marcelo López, Marcelo García, Jorge Abad, Fabian Schwartz y Lucho Salazar. Información de contacto: Nombre: Lucho Salazar Correo electrónico: lucho.salazar@gmail.com Sitio Web: http://www.gazafatonarioit.com LinkedIn: http://www.linkedin.com/in/luchosalazar"},{"t":"h2","x":"Cambios de la Guía Scrum 2017 a la Guía Scrum 2020"},{"t":"h3","x":"Aún menos prescriptiva"},{"t":"p","x":"A lo largo de los años, la Guía Scrum comenzó a ser un poco más prescriptiva. La versión 2020 tenía como objetivo que Scrum volviera a ser un marco de trabajo mínimamente suficiente al eliminar o suavizar el lenguaje prescriptivo. Por ejemplo, eliminó las preguntas de la Daily Scrum, suavizó el lenguaje sobre los atributos de los PBI, suavizó el lenguaje sobre los elementos retro en el Sprint Backlog, acortó la sección de cancelación de Sprint y más."},{"t":"h3","x":"Un equipo, enfocado en un producto"},{"t":"p","x":"El objetivo era eliminar el concepto de un equipo separado dentro de un equipo que ha llevado a un comportamiento de \"proxy\" o de \"nosotros y ellos\" entre el PO y el Equipo de Desarrollo. Ahora solo hay un Scrum Team enfocado en el mismo objetivo, con tres diferentes conjuntos de responsabilidades: PO, SM y Developers."},{"t":"h3","x":"Introducción del Objetivo del Producto"},{"t":"p","x":"La Guía Scrum 2020 introduce el concepto de Objetivo del Producto para proporcionar enfoque al Scrum Team hacia un objetivo valioso más grande. Cada Sprint debería acercar el producto al Objetivo del Producto general."},{"t":"p","x":"Un hogar para el Objetivo del Sprint, la Definición de Terminado y el Objetivo del Producto Las Guías Scrum anteriores describían el Objetivo del Sprint y la Definición de Terminado sin realmente darles una identidad. No eran del todo artefactos, pero estaban algo unidos a los artefactos. Con la incorporación del Objetivo del Producto, la versión 2020 proporciona más claridad al respecto. Cada uno de los tres artefactos ahora contiene \"compromisos\" con ellos. Para el Product Backlog es el Objetivo del Producto, el Sprint Backlog tiene el Objetivo del Sprint y el Increment tiene la Definición de Terminado (ahora sin las comillas). Existen para aportar transparencia y enfocarse en el progreso de cada artefacto."},{"t":"h3","x":"Autogestión sobre autoorganización"},{"t":"p","x":"Las Guías Scrum anteriores se referían a los Equipos de Desarrollo como autoorganizados, eligiendo quién y cómo hacer el trabajo. Con un enfoque más en el Scrum Team, la versión 2020 enfatiza un Scrum Team autogestionado, eligiendo quién, cómo y en qué trabajar."},{"t":"h3","x":"Tres temas de la Sprint Planning"},{"t":"p","x":"Además de los temas de la Sprint Planning de \"Qué\" y \"Cómo\", la Guía de Scrum 2020 pone énfasis en un tercer tema, \"Por qué\", en referencia al Objetivo del Sprint."},{"t":"h3","x":"Simplificación general del lenguaje para una audiencia más amplia"},{"t":"p","x":"La Guía Scrum 2020 ha hecho hincapié en eliminar declaraciones redundantes y complejas, así como en eliminar cualquier inferencia restante al trabajo de TI (por ejemplo, pruebas, sistema, diseño, requisito, etc.). La Guía Scrum ahora tiene menos de 13 páginas."}],"en":[{"t":"h2","x":"Purpose of the Scrum Guide"},{"t":"p","x":"We developed Scrum in the early 1990s. We wrote the first version of the Scrum Guide in 2010 to help people worldwide understand Scrum. We have evolved the Guide since then through small, functional updates. Together, we stand behind it."},{"t":"p","x":"The Scrum Guide contains the definition of Scrum. Each element of the framework serves a specific purpose that is essential to the overall value and results realized with Scrum. Changing the core design or ideas of Scrum, leaving out elements, or not following the rules of Scrum, covers up problems and limits the benefits of Scrum, potentially even rendering it useless."},{"t":"p","x":"We follow the growing use of Scrum within an ever-growing complex world. We are humbled to see Scrum being adopted in many domains holding essentially complex work, beyond software product development where Scrum has its roots. As Scrum’s use spreads, developers, researchers, analysts, scientists, and other specialists do the work. We use the word “developers” in Scrum not to exclude, but to simplify. If you get value from Scrum, consider yourself included."},{"t":"p","x":"As Scrum is being used, patterns, processes, and insights that fit the Scrum framework as described in this document, may be found, applied and devised. Their description is beyond the purpose of the Scrum Guide because they are context sensitive and differ widely between Scrum uses. Such tactics for using within the Scrum framework vary widely and are described elsewhere."},{"t":"p","x":"Ken Schwaber & Jeff Sutherland November 2020"},{"t":"h2","x":"Scrum Definition"},{"t":"p","x":"Scrum is a lightweight framework that helps people, teams and organizations generate value through adaptive solutions for complex problems."},{"t":"p","x":"In a nutshell, Scrum requires a Scrum Master to foster an environment where:"},{"t":"ol","x":"A Product Owner orders the work for a complex problem into a Product Backlog."},{"t":"ol","x":"The Scrum Team turns a selection of the work into an Increment of value during a Sprint."},{"t":"ol","x":"The Scrum Team and its stakeholders inspect the results and adjust for the next Sprint."},{"t":"ol","x":"Repeat"},{"t":"p","x":"Scrum is simple. Try it as is and determine if its philosophy, theory, and structure help to achieve goals and create value. The Scrum framework is purposefully incomplete, only defining the parts required to implement Scrum theory. Scrum is built upon by the collective intelligence of the people using it. Rather than provide people with detailed instructions, the rules of Scrum guide their relationships and interactions."},{"t":"p","x":"Various processes, techniques and methods can be employed within the framework. Scrum wraps around existing practices or renders them unnecessary. Scrum makes visible the relative efficacy of current management, environment, and work techniques, so that improvements can be made."},{"t":"h2","x":"Scrum Theory"},{"t":"p","x":"Scrum is founded on empiricism and lean thinking. Empiricism asserts that knowledge comes from experience and making decisions based on what is observed. Lean thinking reduces waste and focuses on the essentials."},{"t":"p","x":"Scrum employs an iterative, incremental approach to optimize predictability and to control risk. Scrum engages groups of people who collectively have all the skills and expertise to do the work and share or acquire such skills as needed."},{"t":"p","x":"Scrum combines four formal events for inspection and adaptation within a containing event, the Sprint. These events work because they implement the empirical Scrum pillars of transparency, inspection, and adaptation."},{"t":"h3","x":"Transparency"},{"t":"p","x":"The emergent process and work must be visible to those performing the work as well as those receiving the work. With Scrum, important decisions are based on the perceived state of its three formal artifacts. Artifacts that have low transparency can lead to decisions that diminish value and increase risk."},{"t":"p","x":"Transparency enables inspection. Inspection without transparency is misleading and wasteful."},{"t":"h3","x":"Inspection"},{"t":"p","x":"The Scrum artifacts and the progress toward agreed goals must be inspected frequently and diligently to detect potentially undesirable variances or problems. To help with inspection, Scrum provides cadence in the form of its five events."},{"t":"p","x":"Inspection enables adaptation. Inspection without adaptation is considered pointless. Scrum events are designed to provoke change."},{"t":"h3","x":"Adaptation"},{"t":"p","x":"If any aspects of a process deviate outside acceptable limits or if the resulting product is unacceptable, the process being applied or the materials being produced must be adjusted. The adjustment must be made as soon as possible to minimize further deviation."},{"t":"p","x":"Adaptation becomes more difficult when the people involved are not empowered or self-managing. A Scrum Team is expected to adapt the moment it learns anything new through inspection."},{"t":"h2","x":"Scrum Values"},{"t":"p","x":"Successful use of Scrum depends on people becoming more proficient in living five values: Commitment, Focus, Openness, Respect, and Courage"},{"t":"p","x":"The Scrum Team commits to achieving its goals and to supporting each other. Their primary focus is on the work of the Sprint to make the best possible progress toward these goals. The Scrum Team and its stakeholders are open about the work and the challenges. Scrum Team members respect each other to be capable, independent people, and are respected as such by the people with whom they work. The Scrum Team members have the courage to do the right thing, to work on tough problems."},{"t":"p","x":"These values give direction to the Scrum Team with regard to their work, actions, and behavior. The decisions that are made, the steps taken, and the way Scrum is used should reinforce these values, not diminish or undermine them. The Scrum Team members learn and explore the values as they work with the Scrum events and artifacts. When these values are embodied by the Scrum Team and the people they work with, the empirical Scrum pillars of transparency, inspection, and adaptation come to life building trust."},{"t":"h2","x":"Scrum Team"},{"t":"p","x":"The fundamental unit of Scrum is a small team of people, a Scrum Team. The Scrum Team consists of one Scrum Master, one Product Owner, and Developers. Within a Scrum Team, there are no sub-teams or hierarchies. It is a cohesive unit of professionals focused on one objective at a time, the Product Goal."},{"t":"p","x":"Scrum Teams are cross-functional, meaning the members have all the skills necessary to create value each Sprint. They are also self-managing, meaning they internally decide who does what, when, and how."},{"t":"p","x":"The Scrum Team is small enough to remain nimble and large enough to complete significant work within a Sprint, typically 10 or fewer people. In general, we have found that smaller teams communicate better and are more productive. If Scrum Teams become too large, they should consider reorganizing into multiple cohesive Scrum Teams, each focused on the same product. Therefore, they should share the same Product Goal, Product Backlog, and Product Owner."},{"t":"p","x":"The Scrum Team is responsible for all product-related activities from stakeholder collaboration, verification, maintenance, operation, experimentation, research and development, and anything else that might be required. They are structured and empowered by the organization to manage their own work. Working in Sprints at a sustainable pace improves the Scrum Team’s focus and consistency."},{"t":"p","x":"The entire Scrum Team is accountable for creating a valuable, useful Increment every Sprint. Scrum defines three specific accountabilities within the Scrum Team: the Developers, the Product Owner, and the Scrum Master."},{"t":"h3","x":"Developers"},{"t":"p","x":"Developers are the people in the Scrum Team that are committed to creating any aspect of a usable Increment each Sprint."},{"t":"p","x":"The specific skills needed by the Developers are often broad and will vary with the domain of work. However, the Developers are always accountable for:"},{"t":"li","x":"Creating a plan for the Sprint, the Sprint Backlog;"},{"t":"li","x":"Instilling quality by adhering to a Definition of Done;"},{"t":"li","x":"Adapting their plan each day toward the Sprint Goal; and,"},{"t":"li","x":"Holding each other accountable as professionals."},{"t":"h3","x":"Product Owner"},{"t":"p","x":"The Product Owner is accountable for maximizing the value of the product resulting from the work of the Scrum Team. How this is done may vary widely across organizations, Scrum Teams, and individuals."},{"t":"p","x":"The Product Owner is also accountable for effective Product Backlog management, which includes:"},{"t":"li","x":"Developing and explicitly communicating the Product Goal;"},{"t":"li","x":"Creating and clearly communicating Product Backlog items;"},{"t":"li","x":"Ordering Product Backlog items; and,"},{"t":"li","x":"Ensuring that the Product Backlog is transparent, visible and understood."},{"t":"p","x":"The Product Owner may do the above work or may delegate the responsibility to others. Regardless, the Product Owner remains accountable."},{"t":"p","x":"For Product Owners to succeed, the entire organization must respect their decisions. These decisions are visible in the content and ordering of the Product Backlog, and through the inspectable Increment at the Sprint Review."},{"t":"p","x":"The Product Owner is one person, not a committee. The Product Owner may represent the needs of many stakeholders in the Product Backlog. Those wanting to change the Product Backlog can do so by trying to convince the Product Owner."},{"t":"h3","x":"Scrum Master"},{"t":"p","x":"The Scrum Master is accountable for establishing Scrum as defined in the Scrum Guide. They do this by helping everyone understand Scrum theory and practice, both within the Scrum Team and the organization."},{"t":"p","x":"The Scrum Master is accountable for the Scrum Team’s effectiveness. They do this by enabling the Scrum Team to improve its practices, within the Scrum framework."},{"t":"p","x":"Scrum Masters are true leaders who serve the Scrum Team and the larger organization."},{"t":"p","x":"The Scrum Master serves the Scrum Team in several ways, including:"},{"t":"li","x":"Coaching the team members in self-management and cross-functionality;"},{"t":"li","x":"Helping the Scrum Team focus on creating high-value Increments that meet the Definition of Done;"},{"t":"li","x":"Causing the removal of impediments to the Scrum Team’s progress; and,"},{"t":"li","x":"Ensuring that all Scrum events take place and are positive, productive, and kept within the timebox."},{"t":"p","x":"The Scrum Master serves the Product Owner in several ways, including:"},{"t":"li","x":"Helping find techniques for effective Product Goal definition and Product Backlog management;"},{"t":"li","x":"Helping the Scrum Team understand the need for clear and concise Product Backlog items;"},{"t":"li","x":"Helping establish empirical product planning for a complex environment; and,"},{"t":"li","x":"Facilitating stakeholder collaboration as requested or needed."},{"t":"p","x":"The Scrum Master serves the organization in several ways, including:"},{"t":"li","x":"Leading, training, and coaching the organization in its Scrum adoption;"},{"t":"li","x":"Planning and advising Scrum implementations within the organization;"},{"t":"li","x":"Helping employees and stakeholders understand and enact an empirical approach for complex work; and,"},{"t":"li","x":"Removing barriers between stakeholders and Scrum Teams."},{"t":"h2","x":"Scrum Events"},{"t":"p","x":"The Sprint is a container for all other events. Each event in Scrum is a formal opportunity to inspect and adapt Scrum artifacts. These events are specifically designed to enable the transparency required. Failure to operate any events as prescribed results in lost opportunities to inspect and adapt. Events are used in Scrum to create regularity and to minimize the need for meetings not defined in Scrum. Optimally, all events are held at the same time and place to reduce complexity."},{"t":"h3","x":"The Sprint"},{"t":"p","x":"Sprints are the heartbeat of Scrum, where ideas are turned into value."},{"t":"p","x":"They are fixed length events of one month or less to create consistency. A new Sprint starts immediately after the conclusion of the previous Sprint."},{"t":"p","x":"All the work necessary to achieve the Product Goal, including Sprint Planning, Daily Scrums, Sprint Review, and Sprint Retrospective, happen within Sprints."},{"t":"p","x":"During the Sprint:"},{"t":"li","x":"No changes are made that would endanger the Sprint Goal;"},{"t":"li","x":"Quality does not decrease;"},{"t":"li","x":"The Product Backlog is refined as needed; and,"},{"t":"li","x":"Scope may be clarified and renegotiated with the Product Owner as more is learned."},{"t":"p","x":"Sprints enable predictability by ensuring inspection and adaptation of progress toward a Product Goal at least every calendar month. When a Sprint’s horizon is too long the Sprint Goal may become invalid, complexity may rise, and risk may increase. Shorter Sprints can be employed to generate more learning cycles and limit risk of cost and effort to a smaller time frame. Each Sprint may be considered a short project."},{"t":"p","x":"Various practices exist to forecast progress, like burn-downs, burn-ups, or cumulative flows. While proven useful, these do not replace the importance of empiricism. In complex environments, what will happen is unknown. Only what has already happened may be used for forward-looking decision making."},{"t":"p","x":"A Sprint could be cancelled if the Sprint Goal becomes obsolete. Only the Product Owner has the authority to cancel the Sprint."},{"t":"h3","x":"Sprint Planning"},{"t":"p","x":"Sprint Planning initiates the Sprint by laying out the work to be performed for the Sprint. This resulting plan is created by the collaborative work of the entire Scrum Team."},{"t":"p","x":"The Product Owner ensures that attendees are prepared to discuss the most important Product Backlog items and how they map to the Product Goal. The Scrum Team may also invite other people to attend Sprint Planning to provide advice."},{"t":"p","x":"Sprint Planning addresses the following topics:"},{"t":"h4","x":"Topic One: Why is this Sprint valuable?"},{"t":"p","x":"The Product Owner proposes how the product could increase its value and utility in the current Sprint. The whole Scrum Team then collaborates to define a Sprint Goal that communicates why the Sprint is valuable to stakeholders. The Sprint Goal must be finalized prior to the end of Sprint Planning."},{"t":"h4","x":"Topic Two: What can be Done this Sprint?"},{"t":"p","x":"Through discussion with the Product Owner, the Developers select items from the Product Backlog to include in the current Sprint. The Scrum Team may refine these items during this process, which increases understanding and confidence."},{"t":"p","x":"Selecting how much can be completed within a Sprint may be challenging. However, the more the Developers know about their past performance, their upcoming capacity, and their Definition of Done, the more confident they will be in their Sprint forecasts."},{"t":"h4","x":"Topic Three: How will the chosen work get done?"},{"t":"p","x":"For each selected Product Backlog item, the Developers plan the work necessary to create an Increment that meets the Definition of Done. This is often done by decomposing Product Backlog items into smaller work items of one day or less. How this is done is at the sole discretion of the Developers. No one else tells them how to turn Product Backlog items into Increments of value."},{"t":"p","x":"The Sprint Goal, the Product Backlog items selected for the Sprint, plus the plan for delivering them are together referred to as the Sprint Backlog."},{"t":"p","x":"Sprint Planning is timeboxed to a maximum of eight hours for a one-month Sprint. For shorter Sprints, the event is usually shorter."},{"t":"h3","x":"Daily Scrum"},{"t":"p","x":"The purpose of the Daily Scrum is to inspect progress toward the Sprint Goal and adapt the Sprint Backlog as necessary, adjusting the upcoming planned work."},{"t":"p","x":"The Daily Scrum is a 15-minute event for the Developers of the Scrum Team. To reduce complexity, it is held at the same time and place every working day of the Sprint. If the Product Owner or Scrum Master are actively working on items in the Sprint Backlog, they participate as Developers."},{"t":"p","x":"The Developers can select whatever structure and techniques they want, as long as their Daily Scrum focuses on progress toward the Sprint Goal and produces an actionable plan for the next day of work. This creates focus and improves self-management."},{"t":"p","x":"Daily Scrums improve communications, identify impediments, promote quick decision-making, and consequently eliminate the need for other meetings."},{"t":"p","x":"The Daily Scrum is not the only time Developers are allowed to adjust their plan. They often meet throughout the day for more detailed discussions about adapting or re-planning the rest of the Sprint’s work."},{"t":"h3","x":"Sprint Review"},{"t":"p","x":"The purpose of the Sprint Review is to inspect the outcome of the Sprint and determine future adaptations. The Scrum Team presents the results of their work to key stakeholders and progress toward the Product Goal is discussed."},{"t":"p","x":"During the event, the Scrum Team and stakeholders review what was accomplished in the Sprint and what has changed in their environment. Based on this information, attendees collaborate on what to do next. The Product Backlog may also be adjusted to meet new opportunities. The Sprint Review is a working session and the Scrum Team should avoid limiting it to a presentation."},{"t":"p","x":"The Sprint Review is the second to last event of the Sprint and is timeboxed to a maximum of four hours for a one-month Sprint. For shorter Sprints, the event is usually shorter."},{"t":"h3","x":"Sprint Retrospective"},{"t":"p","x":"The purpose of the Sprint Retrospective is to plan ways to increase quality and effectiveness."},{"t":"p","x":"The Scrum Team inspects how the last Sprint went with regards to individuals, interactions, processes, tools, and their Definition of Done. Inspected elements often vary with the domain of work. Assumptions that led them astray are identified and their origins explored. The Scrum Team discusses what went well during the Sprint, what problems it encountered, and how those problems were (or were not) solved."},{"t":"p","x":"The Scrum Team identifies the most helpful changes to improve its effectiveness. The most impactful improvements are addressed as soon as possible. They may even be added to the Sprint Backlog for the next Sprint."},{"t":"p","x":"The Sprint Retrospective concludes the Sprint. It is timeboxed to a maximum of three hours for a one- month Sprint. For shorter Sprints, the event is usually shorter."},{"t":"h2","x":"Scrum Artifacts"},{"t":"p","x":"Scrum’s artifacts represent work or value. They are designed to maximize transparency of key information. Thus, everyone inspecting them has the same basis for adaptation."},{"t":"p","x":"Each artifact contains a commitment to ensure it provides information that enhances transparency and focus against which progress can be measured:"},{"t":"li","x":"For the Product Backlog it is the Product Goal."},{"t":"li","x":"For the Sprint Backlog it is the Sprint Goal."},{"t":"li","x":"For the Increment it is the Definition of Done."},{"t":"p","x":"These commitments exist to reinforce empiricism and the Scrum values for the Scrum Team and their stakeholders."},{"t":"h3","x":"Product Backlog"},{"t":"p","x":"The Product Backlog is an emergent, ordered list of what is needed to improve the product. It is the single source of work undertaken by the Scrum Team."},{"t":"p","x":"Product Backlog items that can be Done by the Scrum Team within one Sprint are deemed ready for selection in a Sprint Planning event. They usually acquire this degree of transparency after refining activities. Product Backlog refinement is the act of breaking down and further defining Product Backlog items into smaller more precise items. This is an ongoing activity to add details, such as a description, order, and size. Attributes often vary with the domain of work."},{"t":"p","x":"The Developers who will be doing the work are responsible for the sizing. The Product Owner may influence the Developers by helping them understand and select trade-offs."},{"t":"h4","x":"Commitment: Product Goal"},{"t":"p","x":"The Product Goal describes a future state of the product which can serve as a target for the Scrum Team to plan against. The Product Goal is in the Product Backlog. The rest of the Product Backlog emerges to define “what” will fulfill the Product Goal."},{"t":"p","x":"A product is a vehicle to deliver value. It has a clear boundary, known stakeholders, well-defined users or customers. A product could be a service, a physical product, or something more abstract."},{"t":"p","x":"The Product Goal is the long-term objective for the Scrum Team. They must fulfill (or abandon) one objective before taking on the next."},{"t":"h3","x":"Sprint Backlog"},{"t":"p","x":"The Sprint Backlog is composed of the Sprint Goal (why), the set of Product Backlog items selected for the Sprint (what), as well as an actionable plan for delivering the Increment (how)."},{"t":"p","x":"The Sprint Backlog is a plan by and for the Developers. It is a highly visible, real-time picture of the work that the Developers plan to accomplish during the Sprint in order to achieve the Sprint Goal. Consequently, the Sprint Backlog is updated throughout the Sprint as more is learned. It should have enough detail that they can inspect their progress in the Daily Scrum."},{"t":"h4","x":"Commitment: Sprint Goal"},{"t":"p","x":"The Sprint Goal is the single objective for the Sprint. Although the Sprint Goal is a commitment by the Developers, it provides flexibility in terms of the exact work needed to achieve it. The Sprint Goal also creates coherence and focus, encouraging the Scrum Team to work together rather than on separate initiatives."},{"t":"p","x":"The Sprint Goal is created during the Sprint Planning event and then added to the Sprint Backlog. As the Developers work during the Sprint, they keep the Sprint Goal in mind. If the work turns out to be different than they expected, they collaborate with the Product Owner to negotiate the scope of the Sprint Backlog within the Sprint without affecting the Sprint Goal."},{"t":"h3","x":"Increment"},{"t":"p","x":"An Increment is a concrete stepping stone toward the Product Goal. Each Increment is additive to all prior Increments and thoroughly verified, ensuring that all Increments work together. In order to provide value, the Increment must be usable."},{"t":"p","x":"Multiple Increments may be created within a Sprint. The sum of the Increments is presented at the Sprint Review thus supporting empiricism. However, an Increment may be delivered to stakeholders prior to the end of the Sprint. The Sprint Review should never be considered a gate to releasing value."},{"t":"p","x":"Work cannot be considered part of an Increment unless it meets the Definition of Done."},{"t":"h4","x":"Commitment: Definition of Done"},{"t":"p","x":"The Definition of Done is a formal description of the state of the Increment when it meets the quality measures required for the product."},{"t":"p","x":"The moment a Product Backlog item meets the Definition of Done, an Increment is born."},{"t":"p","x":"The Definition of Done creates transparency by providing everyone a shared understanding of what work was completed as part of the Increment. If a Product Backlog item does not meet the Definition of Done, it cannot be released or even presented at the Sprint Review. Instead, it returns to the Product Backlog for future consideration."},{"t":"p","x":"If the Definition of Done for an increment is part of the standards of the organization, all Scrum Teams must follow it as a minimum. If it is not an organizational standard, the Scrum Team must create a Definition of Done appropriate for the product."},{"t":"p","x":"The Developers are required to conform to the Definition of Done. If there are multiple Scrum Teams working together on a product, they must mutually define and comply with the same Definition of Done."},{"t":"h2","x":"End Note"},{"t":"p","x":"Scrum is free and offered in this Guide. The Scrum framework, as outlined herein, is immutable. While implementing only parts of Scrum is possible, the result is not Scrum. Scrum exists only in its entirety and functions well as a container for other techniques, methodologies, and practices."},{"t":"h3","x":"Acknowledgements"},{"t":"h4","x":"People"},{"t":"p","x":"Of the thousands of people who have contributed to Scrum, we should single out those who were instrumental at the start: Jeff Sutherland worked with Jeff McKenna and John Scumniotales, and Ken Schwaber worked with Mike Smith and Chris Martin, and all of them worked together. Many others contributed in the ensuing years and without their help Scrum would not be refined as it is today."},{"t":"h4","x":"Scrum Guide History"},{"t":"p","x":"Ken Schwaber and Jeff Sutherland first co-presented Scrum at the OOPSLA Conference in 1995. It essentially documented the learning that Ken and Jeff gained over the previous few years and made public the first formal definition of Scrum."},{"t":"p","x":"The Scrum Guide documents Scrum as developed, evolved, and sustained for 30-plus years by Jeff Sutherland and Ken Schwaber. Other sources provide patterns, processes, and insights that complement the Scrum framework. These may increase productivity, value, creativity, and satisfaction with the results."},{"t":"p","x":"The complete history of Scrum is described elsewhere. To honor the first places where it was tried and proven, we recognize Individual Inc., Newspage, Fidelity Investments, and IDX (now GE Medical)."}]}};
const MD=D.MD,PARTS=D.PARTS,GUIDE=D.GUIDE;
const ORD=PARTS.flatMap(p=>p.m);
const EXAM=ORD.filter(id=>MD[id].tag=='ex');
const TAG={ex:'For the exam',en:'For interviews'};
const KEY={ex:'For the exam',en:'For the interview'};
const v=document.getElementById('view');
let st={};
try{st=JSON.parse(localStorage.getItem('pspo-st')||'{}')}catch(e){st={}}
const old=['fund','team','po','eventos','artef','valor'];
old.forEach((id,i)=>{if(st['b'+i]!=null){st['m_'+id]=Math.max(st['m_'+id]||0,st['b'+i]);delete st['b'+i]}});
const save=()=>{try{localStorage.setItem('pspo-st',JSON.stringify(st))}catch(e){}};
save();
let cur={tab:'mod'};
const best=id=>st['m_'+id];
const passed=id=>(best(id)||0)>=80;

const shuf=a=>{const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
const prep=q=>({q:q.q,w:q.w,o:(q.o.length==2?q.o.map((t,i)=>({t,ok:i==q.a})):shuf(q.o.map((t,i)=>({t,ok:i==q.a}))))});
const top=()=>window.scrollTo(0,0);

function header(){
  const a=ORD.filter(passed).length,b=EXAM.filter(passed).length;
  document.getElementById('pbar1').style.width=(b/EXAM.length*100)+'%';
  document.getElementById('ptxt1').textContent='Road to the exam: '+b+' of '+EXAM.length;
  document.getElementById('pbar2').style.width=(a/ORD.length*100)+'%';
  document.getElementById('ptxt2').textContent='Overall: '+a+' of '+ORD.length+' modules';
  document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected',x.dataset.tab==cur.tab));
}

function home(){
  cur={tab:'mod'};
  v.innerHTML=`<div class="intro"><div class="box"><h2>How to use this guide</h2><ul><li>Each module has cards to read and a 5 or 6 question quiz. You pass with 80% or more.</li><li>Modules tagged <b>For the exam</b> are what you need for the certification. Modules tagged <b>For interviews</b> prepare you for the job.</li><li>The <b>Scrum Guide</b> tab has the full official guide, in English and Spanish.</li></ul></div><div class="box"><h2>The real exam</h2><ul><li>80 questions in 60 minutes, in English.</li><li>Passing score: 85%.</li><li>200 US dollars per attempt; the certification does not expire.</li></ul></div></div>
  ${PARTS.map((p,pi)=>`<section class="part"><h2>Part ${pi+1}: ${p.t}</h2><p>${p.d}</p><div class="grid">${p.m.map(id=>{const m=MD[id],b=best(id),n=ORD.indexOf(id)+1;const s=b==null?'Not started':(b>=80?'Passed, best score '+b+'%':'Best score '+b+'%, review it');return `<button class="mod" data-act="open" data-id="${id}"><span class="n"><span>Module ${n}, ${m.cards.length} cards</span><span class="tag ${m.tag}">${TAG[m.tag]}</span></span><h3>${m.t}</h3><p>${m.d}</p><div class="mbar"><i style="width:${b||0}%"></i></div><span class="mstate ${b>=80?'done':''}">${s}</span></button>`}).join('')}</div></section>`).join('')}`;
  header();
}

function study(id,c){
  cur={tab:'mod',mode:'study',id,c};
  const m=MD[id],k=m.cards[c],last=c==m.cards.length-1;
  v.innerHTML=`<div class="deck"><div class="crumb"><h2>${m.t}</h2><div class="seg">${m.g?`<button class="btn sm" data-act="readg" data-id="${id}">Read in the guide</button>`:''}<button class="btn sm" data-act="home">Modules</button></div></div>
  <div class="stack"><article class="card"><span class="k"><span>Card ${c+1} of ${m.cards.length}</span><span class="tag ${m.tag}">${TAG[m.tag]}</span></span><h3>${k.h}</h3><div class="body">${k.b}</div><div class="key"><b>${KEY[m.tag]}</b>${k.k}</div></article></div>
  <div class="dots">${m.cards.map((_,j)=>`<span class="${j<=c?'on':''}"></span>`).join('')}</div>
  <div class="nav"><button class="btn" data-act="prev" ${c==0?'disabled':''}>Previous</button>${last?`<button class="btn pri" data-act="quiz">Take the quiz</button>`:`<button class="btn pri" data-act="next">Next</button>`}</div></div>`;
  header();
}

function quiz(list,ctx){
  cur={tab:ctx.exam?'exam':'mod',mode:'quiz',list,ctx,n:0,right:0,miss:[],ans:false};
  ask();
}
function ask(){
  const s=cur,q=s.list[s.n];
  v.innerHTML=`<div class="deck"><div class="crumb"><h2>${s.ctx.title}</h2><button class="btn sm" data-act="${s.ctx.exam?'examhome':'home'}">Exit</button></div>
  <div class="stack"><article class="card"><span class="k"><span>Question ${s.n+1} of ${s.list.length}</span></span><p class="q">${q.q}</p><div class="opts">${q.o.map((o,j)=>`<button class="opt" data-act="pick" data-j="${j}">${o.t}</button>`).join('')}</div><div id="why"></div></article></div>
  <div class="dots">${s.list.map((_,j)=>`<span class="${j<s.n?'on':''}"></span>`).join('')}</div>
  <div class="nav"><span></span><button class="btn pri" data-act="nextq" id="nq" disabled>${s.n==s.list.length-1?'See result':'Next'}</button></div></div>`;
  header();
}
function pick(j){
  const s=cur;if(s.ans)return;s.ans=true;
  const q=s.list[s.n],ok=q.o[j].ok;
  if(ok)s.right++;else s.miss.push(q);
  v.querySelectorAll('.opt').forEach((b,x)=>{b.disabled=true;if(q.o[x].ok)b.classList.add('ok');else if(x==j)b.classList.add('bad')});
  v.querySelector('#why').innerHTML=`<div class="why"><b>${ok?'Correct.':'Not quite.'}</b>${q.w}</div>`;
  const nq=v.querySelector('#nq');nq.disabled=false;nq.focus();
}
function result(){
  const s=cur,pct=Math.round(s.right/s.list.length*100),goal=s.ctx.exam?85:80,ok=pct>=goal;
  if(s.ctx.exam){st.ex=Math.max(st.ex||0,pct)}else{st['m_'+s.ctx.id]=Math.max(best(s.ctx.id)||0,pct)}
  save();
  const right=s.miss.map(q=>q.o.find(o=>o.ok).t);
  v.innerHTML=`<div class="deck"><div class="crumb"><h2>${s.ctx.title}</h2></div>
  <div class="card"><span class="k"><span>Result</span></span><div class="score ${ok?'pass':'fail'}">${pct}%</div><p>${s.right} of ${s.list.length} correct. ${ok?(s.ctx.exam?'You are above the 85% the real exam requires.':'Module passed.'):(s.ctx.exam?'The exam requires 85%. Review the modules where you missed questions.':'You need 80% to pass. Reread the cards and retake the quiz.')}</p>
  ${s.miss.length?`<h3 style="font-size:22px;margin-top:8px">To review</h3>`+s.miss.map((q,x)=>`<div class="miss"><p><b>${q.q}</b></p><p>Correct answer: ${right[x]}</p><p class="s">${q.w}</p></div>`).join(''):''}
  </div>
  <div class="nav" style="margin-top:16px">${s.ctx.exam?`<button class="btn" data-act="examhome">Back</button><button class="btn pri" data-act="exam">Another mock exam</button>`:`<button class="btn" data-act="open" data-id="${s.ctx.id}">Reread cards</button><button class="btn" data-act="quiz">Retake quiz</button>${nextBtn(s.ctx.id)}`}</div></div>`;
  if(!s.ctx.exam)cur={tab:'mod',mode:'res',id:s.ctx.id};
  header();
}
function nextBtn(id){
  const i=ORD.indexOf(id),n=ORD[i+1];
  return n?`<button class="btn pri" data-act="open" data-id="${n}">Next module</button>`:`<button class="btn pri" data-act="home">Back to modules</button>`;
}

function guide(anchor){
  cur={tab:'guia'};
  const lang=st.glang||'en',G=GUIDE[lang];
  let html='',list=null;
  const close=()=>{if(list){html+=`</${list}>`;list=null}};
  G.forEach((b,i)=>{
    if(b.t=='li'||b.t=='ol'){const tg=b.t=='li'?'ul':'ol';if(list!=tg){close();html+=`<${tg}>`;list=tg}html+=`<li>${b.x}</li>`;return}
    close();
    html+=b.t=='p'?`<p>${b.x}</p>`:`<${b.t} id="g${i}">${b.x}</${b.t}>`;
  });
  close();
  const toc=G.map((b,i)=>b.t=='h2'?`<button data-act="gto" data-i="${i}">${b.x}</button>`:'').join('');
  v.innerHTML=`<div class="gbar"><h2 style="font-size:clamp(26px,3.4vw,34px)">${lang=='es'?'La Guía de Scrum (Spanish)':'The Scrum Guide'}</h2><div class="seg" role="group" aria-label="Language"><button class="btn sm ${lang=='en'?'on':''}" data-act="lang" data-l="en">English</button><button class="btn sm ${lang=='es'?'on':''}" data-act="lang" data-l="es">Español</button></div></div>
  <p class="attr">November 2020 version, by Ken Schwaber and Jeff Sutherland, offered under the Creative Commons Attribution Share-Alike 4.0 license. ${lang=='es'?'Spanish translation by Marcelo López, Marcelo García, Jorge Abad, Fabian Schwartz and Lucho Salazar.':'Original English text.'} Source: <a href="https://scrumguides.org" target="_blank" rel="noopener">scrumguides.org</a>.</p>
  <nav class="toc" aria-label="Sections">${toc}</nav>
  <article class="book">${html}</article>`;
  header();
  if(anchor){
    const t=anchor[lang];
    const i=t?G.findIndex(b=>b.t[0]=='h'&&b.x==t):-1;
    if(i>=0){const el=document.getElementById('g'+i);el.scrollIntoView();el.classList.add('flash')}
    else top();
  }else top();
}

function plan(){
  cur={tab:'plan'};
  v.innerHTML=`<div class="box" style="margin-bottom:8px"><h2>4-week plan</h2><p>Three weeks to pass the certification and a fourth to prepare for interviews. One hour a day is enough. Rule for buying the exam: score 95% or more on the Product Owner Open three times in a row.</p></div>
  <div class="week"><div class="w">1</div><div><h3>Build the foundation</h3><ul><li>Read the Scrum Guide end to end in the "Scrum Guide" tab (about 40 minutes). If something is unclear, check the Spanish version with the language switch.</li><li>Part 1: Agile and the Agile Manifesto, and Lean, Kanban and other frameworks. They are quick and give context.</li><li>Part 2: Scrum fundamentals, The Scrum Team and The Product Owner.</li><li>At the end of the week, take the Product Owner Open once, just to see where you stand.</li></ul></div></div>
  <div class="week"><div class="w">2</div><div><h3>Finish the exam material</h3><ul><li>Part 2: The Scrum events, Artifacts and commitments, and Traps: your notes vs. the 2020 guide.</li><li>Part 3: Value and evidence, which is also on the exam.</li><li>Read the Scrum Guide a second time, paying attention to exact wording.</li><li>Product Owner Open every other day, plus Mikhail Lapshin's quizzes. Write down every mistake and find the answer in the guide.</li></ul></div></div>
  <div class="week"><div class="w">3</div><div><h3>Simulate and take the exam</h3><ul><li>The mock exam in this guide until you pass 85% comfortably.</li><li>Product Owner Open every day until you score 95% or more three times in a row.</li><li>Buy the attempt and take it at a quiet time: you have 45 seconds per question. Flag the doubtful ones and come back at the end.</li></ul></div></div>
  <div class="week"><div class="w">4</div><div><h3>Prepare for interviews</h3><ul><li>Part 3: The backlog in practice, Agile estimation, Vision, strategy and roadmap, and Product metrics.</li><li>Part 4: Stakeholders and influence, Risks and dependencies, and Teams, coaching and scaling.</li><li>For each module, write down a real example from Módulo Sanitario or the club. Those examples are your interview answers.</li></ul></div></div>
  <div class="box" style="margin-top:16px"><h2>What stays outside the app</h2><p>All the study content is here. The only things you do elsewhere are practicing with the official simulators and buying the exam:</p><ul><li><a href="https://www.scrum.org/open-assessments/product-owner-open" target="_blank" rel="noopener">Product Owner Open</a>, the free official practice test.</li><li><a href="https://mlapshin.com" target="_blank" rel="noopener">Mikhail Lapshin's quizzes</a>, free.</li><li><a href="https://www.scrum.org/assessments/professional-scrum-product-owner-i-certification" target="_blank" rel="noopener">Certification page</a>, to buy the attempt.</li><li><a href="https://www.scrum.org/resources/evidence-based-management-guide" target="_blank" rel="noopener">Evidence-Based Management Guide</a>, optional: the key ideas are summarized in the Value and evidence module.</li></ul></div>
  <p class="note">The cards are an original summary based on the 2020 Scrum Guide, the Evidence-Based Management Guide and your Google Project Management course notes. If anything differs, the 2020 Scrum Guide wins.</p>`;
  header();
}

function examHome(){
  cur={tab:'exam'};
  const n=EXAM.reduce((a,id)=>a+MD[id].qz.length,0);
  v.innerHTML=`<div class="deck"><div class="card"><span class="k"><span>Mock exam</span></span><h3>20 mixed questions from the exam modules</h3><p>Questions are drawn at random from a bank of ${n}, across the ${EXAM.length} modules tagged "For the exam". As in the real exam, the target is 85% or more.</p>${st.ex!=null?`<p>Your best score: <b>${st.ex}%</b></p>`:''}<div class="key"><b>Tip</b>Take it once you have passed the ${EXAM.length} exam modules. Then move on to the Product Owner Open, which is closer to the real exam.</div></div>
  <div class="nav" style="margin-top:16px"><span></span><button class="btn pri" data-act="exam">Start mock exam</button></div></div>`;
  header();
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act],[data-tab]');if(!b)return;
  if(b.dataset.tab){const t=b.dataset.tab;t=='mod'?home():t=='guia'?guide():t=='plan'?plan():examHome();top();return}
  const a=b.dataset.act;
  if(a=='home'){home();top()}
  else if(a=='examhome'){examHome();top()}
  else if(a=='open'){study(b.dataset.id,0);top()}
  else if(a=='next'){study(cur.id,cur.c+1);top()}
  else if(a=='prev'){study(cur.id,cur.c-1);top()}
  else if(a=='quiz'){const id=cur.id;quiz(MD[id].qz.map(prep),{id,title:'Quiz: '+MD[id].t});top()}
  else if(a=='pick')pick(+b.dataset.j);
  else if(a=='nextq'){cur.n++;cur.ans=false;cur.n<cur.list.length?ask():result();top()}
  else if(a=='exam'){const all=EXAM.flatMap(id=>MD[id].qz);quiz(shuf(all).slice(0,20).map(prep),{exam:true,title:'Mock exam'});top()}
  else if(a=='readg')guide(MD[b.dataset.id].g);
  else if(a=='lang'){st.glang=b.dataset.l;save();guide()}
  else if(a=='gto'){const el=document.getElementById('g'+b.dataset.i);if(el){el.scrollIntoView({behavior:'smooth'});}}
});
document.addEventListener('keydown',e=>{
  if(cur.mode!='study')return;
  if(e.key=='ArrowRight'&&cur.c<MD[cur.id].cards.length-1)study(cur.id,cur.c+1);
  if(e.key=='ArrowLeft'&&cur.c>0)study(cur.id,cur.c-1);
});
home();
}
</script>
</body>
</html>
