> Identify and focus on what the customer wants and include the customer<\/p>\n<p><b>2- <\/b><b><u>Map value stream:<\/u><\/b> Including all the steps involved in producing value for the customer, and challenge all wasted steps<\/p>\n<p><b>3- <\/b><b><u>Create flow:<\/u><\/b> Ensuring the product flow through the value stream efficiently, continuing to eliminate waste throughout the cycle<\/p>\n<p><b>4- <\/b><b><u>Establish pull:<\/u><\/b> Ensure the customer is “puling” on the product through this stream by asking for features and incremental deliveries<\/p>\n<p><b>5- <\/b><b><u>Pursue perfection:<\/u><\/b> Push the team to continuously improve the first four process steps<\/p>\n<h3 id=\"n7_4\">Reasons to blend Waterfall and Agile styles<\/h3>\n<ul>\n<li>Your stakeholders, customers, or sponsors are more comfortable with traditional approaches and workflows, but your project team is already stablished in Scrum<\/li>\n<li>Regulatory requirements insist on certain traditional work processes<\/li>\n<li>A vendor is already following a traditional approach and the integrations between the teams requires some blending of methods<\/li>\n<\/ul>\n","s":[["n7_1","Kanban"],["n7_2","XP"],["n7_3","LEAN"],["n7_4","Reasons to blend Waterfall and Agile styles"]],"w":true},{"g":"Agile and Scrum","t":"Scrum 101","h":"\n<p>The Scrum Guide is a main source of truth for Scrum Teams and is available for free at Scrumguides.org<\/p>\n<p>Agile is the foundation philosophy and mindset, while Scrum is a framework that materializes or brings that philosophy to life<\/p>\n<h3 id=\"n8_1\">Scrum Theory<\/h3>\n<p>it has 3 pillars, and has 5 values.<\/p>\n<p>The roles are: Product Owner, Scrum Master, Development Team (3 to 9)<\/p>\n<p>Scrum is define as a framework developing, delivering, and sustaining complex products. Scrum uses an iterative and incremental approach.<\/p>\n<p>Iterative refers to the fact that project processes are repeated<\/p>\n<p>Incremental refers tto the work being divided into smaller chunks that build on each other<\/p>\n<p>The product is built over time through work done during each iteration<\/p>\n<p>\nPillards:  \n<\/p>\n\n<ul>\n<li><b><u>Transparency:<\/u><\/b>  means that we make most significant aspects of our work visible to those responsible for the outcome. Is critical to the team’s productivity and the project’s completion<\/li>\n<li><b><u>Inspection:<\/u><\/b> Conduction timely checks towards the outcome of a Sprint goal to detect undesirable variances. The more inspections that take place, the more improvement a team experiences in their work<\/li>\n<li><b><u>Adaptation:<\/u><\/b> Ajusting project, product, or processes to minimize any further deviation or issues. Includes immediate fixes to problems, it may also be about implementing a change so future projects don’t repeat past mistakes<\/li>\n<\/ul>\n<p>Values:<\/p>\n<ul>\n<li><b><u>Commitment:<\/u><\/b> Personally committing to achieving the goals of the Scrum team.<\/li>\n<li><b><u>Courage:<\/u><\/b> Members must have the courage to do the right thing and work on tough problems<\/li>\n<li><b><u>Focus:<\/u><\/b> Everyone focusing on the work of the sprint and the overall goals of the Scrum Team<\/li>\n<li><b><u>Openness:<\/u><\/b> The Scrum Team and its stakeholders agree to be open about all of the work and challenges with performing the work<\/li>\n<li>Respect: Team memebers should respect the opinions, skills, and independence of their teammates<\/li>\n<\/ul>\n<p>in Agile a Mission is a short statement that stays constant for your team throughout the process and gibes them something to work toward<\/p>\n<p>A Product vision, when you set a vision, you’re making it clear what the team is responsible for and where your team’s boundaries are<\/p>\n<p>A mission tells me <u>why<\/u> we’re doing the work. A product vision helps me imagine <u>what<\/u> the work will be when we’re done<\/p>\n<h3 id=\"n8_2\">Scrum Roles<\/h3>\n<ul>\n<li>\nScrum Master: Is responsible for when a team will deliver value to its users. Their job its to build the thing fast\n<\/li>\n<li>\nProduct Owner: Is responsible for what a team builds, and must ensure everyone understands the why. Their job is to build the right thing\n<\/li>\n<li>\nDevelopment Team: They are responsible for how the team will deliver that product. Their job is to build the thing right \n<\/li>\n<\/ul>\n\n<p>Scrum teams are cross-functional. When a Scrum Team delivers something, it’s the accomplishment of the entire team<\/p>\n<p>Scrum Team are self-organizing (or self-managing)<\/p>\n<h3 id=\"n8_3\">Traits of an effective Scrum Master<\/h3>\n<p>The Scrum Master promotes and supports the Scrum process by helping everyone understand and implement Scrum. They are responsible for helping the team be their very best<\/p>\n<p>The responsibilities includes:<\/p>\n<ul>\n<li>Coaching team memebers on Agile and Scrum practices, rules, and values<\/li>\n<li>Helping to find ways to manage the Product Backlog effectively<\/li>\n<\/ul>\n<p>The product backlog is the single authoritative source for things that a team works on to achieve the project goal. Contains product features, product requirements, and activities associated with product deliverables<\/p>\n<p>The Scrum Master is responsible for:<\/p>\n<ul>\n<li>Facilitating Scrum events<\/li>\n<li>Helping the team remove blockers<\/li>\n<li>Prevent unhelpful interactions from outside of the team<\/li>\n<\/ul>\n<p>Scrum Master needs to be:<\/p>\n<ul>\n<li>Persons with organizational skills<\/li>\n<li>Supportive leaders<\/li>\n<li>Facilitate productivity and collaboration<\/li>\n<li>Coach team members<\/li>\n<li>Great communicators<\/li>\n<\/ul>\n<h3 id=\"n8_4\">Traits of an effective Product Owner<\/h3>\n<p>A Product Owner is tasked with ensuring that the team is building the right product or service<\/p>\n<p>A Product Owners’s responsibilities include:<\/p>\n<ul>\n<li>Continuously maximizes the value of the product delivered by the Scrum Team<\/li>\n<li>Helps the Scrum Team understand why their work matters within the overall goal and mission<\/li>\n<li>Prioritizes the Product Backlog to optimize delivery and value to customers<\/li>\n<li>Ensures the Backlog is visible and transparent to all<\/li>\n<li>Makes sure the product or service fulfills the customers needs<\/li>\n<\/ul>\n<p>A Product Owners needs to be:<\/p>\n<ul>\n<li>Customer-focused<\/li>\n<li>Decisive<\/li>\n<li>Flexible<\/li>\n<li>Optimistic and positive<\/li>\n<li>Available<\/li>\n<li>Collaborative<\/li>\n<\/ul>\n<h3 id=\"n8_5\">Traits of an effective Development Team<\/h3>\n<p>Is made of the people who do the work to build the product<\/p>\n<p>Should be:<\/p>\n<ul>\n<li>Cross functional<\/li>\n<li>Self-organizing<\/li>\n<li>Supportive<\/li>\n<li>Customer-oriented<\/li>\n<\/ul>\n<p>Their responsibilities include:<\/p>\n<ul>\n<li>Creating a plan for the Sprint, the <b>Sprint Backlog<\/b> (the set of Product Backlog items that are selected to be completed during the upcoming Sprint)<\/li>\n<li>Instilling quality by adhering to a Definition of Done<\/li>\n<li>Adapting their plan each day toward the Sprint Goal<\/li>\n<li>Holding each other accountable as professionals<\/li>\n<li>Executing sprints by designing, building, and testing Product Backlog items in increments<\/li>\n<\/ul>\n<p class=\"imgph\">Screenshot in Notion: Screenshot 2026-01-26 at 11.02.10 PM.png<\/p>\n\n<p><b>Scrum Master vs. project manager <\/b><\/p>\n<p>A Scrum Master is responsible for helping the team understand Scrum theory and practice. They ensure Scrum events take place and help the team focus on delivering value by removing impediments. But unlike a traditional project manager, they do not take on the management of changes in scope or priorities. Additionally, Scrum Masters do not maintain traditional project artifacts like Gantt charts.<\/p>\n<h3 id=\"n8_6\">Product Backlog<\/h3>\n<p>The single authoritative source for things that a team works on. It contains all of the features, requirements, and activities associated with deliverables to achieve the goal of the project<\/p>\n<p>There are 3 key features of a product backlog:<\/p>\n<ul>\n<li>Is a living artifact: Items are added to the backlog at any time<\/li>\n<li>Owned and adjusted by the Product Owner<\/li>\n<li>Prioritized list of features<\/li>\n<\/ul>\n<p>There are a few best practices and pieces of data to capture when working with Product Backlogs<\/p>\n<ul>\n<li>The description: Describes an item, be really clear when adding Product Backlog items so the details are encouraged<\/li>\n<li>The value: The field that tells us how much business value the item delivers to the customers, to the team, or to the users. How to indicate value is a choice the Scrum team should make together (Using dollar signs for hig)<\/li>\n<li>The estimate: Is how much effort the Scrum Team thinks an item will take to complete. The relative effort estimate is captured in each Backlog item.<\/li>\n<li>The order: Both the estimate and value fields we just discussed help the Product Owner figure out where to place an item in the Backlog's order of hierarchy. Product Backlogs order items from highest to lowest priority. This is called a stacked rank.<\/li>\n<\/ul>\n<p>the Product Backlog is an ordered list of what needs to be done to improve a product.<\/p>\n<h3 id=\"n8_7\">User Stories<\/h3>\n<p>\nA way to capture and manage those Backlog items. User stories are short, simple descriptions of a feature told from the perspective of the user. This helps the team create a solution that's always centered around the user and the user experience. \n<\/p>\n\n<p>When writing effective user stories, the team must have a user in mind. Imagine that the user will interact with the product in order to achieve a specific outcome. What I really like to do at this stage is create personas or detailed descriptions of my different users. Sometimes I even give them names.<\/p>\n<p>\n<b>User stories<\/b> are short, simple descriptions of a deliverable told from the perspective of the user. Creating user stories helps the team develop a solution that is always centered around the user’s needs and overall experience. \n<\/p>\n\n<p>Are made up of three different elements: the user, the action they will take, and the benefit to them.<\/p>\n<p>\nWhen writing user stories, you will need to include the following elements: \n<\/p>\n\n<ul>\n<li><b>User persona. <\/b>What is your user like? What is their relation to the project? What goals do they have?<\/li>\n<li><b>Definition of Done. <\/b>This refers to an agreed upon set of items that must be completed before a user story can be considered complete.<\/li>\n<li><b>Tasks. <\/b>What are the key activities needed to complete the user story?<\/li>\n<li><b>Any feedback already provided. <\/b>If you are adding features to an existing product and you have already received feedback from customers on a past iteration, make sure to consider this feedback.<\/li>\n<\/ul>\n<p>Each user story should meet six different criteria, represented by the acronym I.N.V.E.S.T., or invest<\/p>\n<ul>\n<li>\nI for independent: the story should be able to be started and finished by itself.\n<\/li>\n<li>\nN for negotiable: there's room for negotiation and discussion about this item. \n<\/li>\n<li>\nV for valuable: this means that completing the user story has to deliver value. \n<\/li>\n<li>\nE for estimable: our Definition of Done must be clear so that the team can give each user story an estimate.\n<\/li>\n<li>\nS for small: each user story needs to be able to fit within a planned Sprint. If that user story is too big, it should be broken down into smaller stories.\n<\/li>\n<li>\nT for testable: a test can be written to check and make sure that it meets the acceptance criteria.\n<\/li>\n<\/ul>\n\n<p>The typical template for a user story looks like this: <b>As a <\/b><i><b>\\<user role><\/b><\/i><b>, I want this <\/b><i><b>\\<action><\/b><\/i><b> so that I can get this <\/b><i><b>\\<value>. <\/b><\/i>Therefore, an example user story for this situation might read: <i><b>As an avid reader, I want to be able to read reviews before I check out a book from my local branch so that I know I am getting a book I am interested in.<\/b><\/i><\/p>\n<p>EPIC<\/p>\n<p>A group or collection of user stories<\/p>\n<p>\nYou also learned that <b>epics<\/b> are a collection of user stories. Think of the concept of user stories in terms of books or films. A story is one single narrative, while an epic is a set of several related, independent stories. Each story tells a specific chronicle, while an epic gives a high-level view of the overall arc. \n<\/p>\n\n<p>Epics allow you to keep track of large, loosely-defined ideas, while user stories are a much smaller unit of work, inspired directly from the end user or customer. Both user stories and epics help teams ensure they are delivering value to the customer.<\/p>\n<h3 id=\"n8_8\">Work management tools and Product Backlog<\/h3>\n<p>a Product Backlog is one of the most important Scrum artifacts and functions as the single authoritative source for project tasks. It contains all of the features, requirements, and activities associated with the project deliverables in one place.<\/p>\n<p>Since it's a living artifact, you need to update and reorganize the Product Backlog according to the product owner’s evolving project needs.<\/p>\n<h3 id=\"n8_9\">Backlog Refinement<\/h3>\n<p>refers to the act of keeping the Backlog described, estimated and prioritized, so that the scrum team can operate effectively.<\/p>\n<p>Review the product backlog to ensure:<\/p>\n<ul>\n<li>It contains the appropiate items, and that nothing new is needed or nothing needs to be removed<\/li>\n<li>That the items are prioritized by the Product Owner, setting the order field<\/li>\n<li>That the items ar the top of the backlog are ready for delivery with clear acceptance criteria<\/li>\n<li>That the Backlog items include estimates or an informed assessment about how much work a particular backlog item will be<\/li>\n<\/ul>\n<p>Through estimation, we can find out how much work we have ahead of us.<\/p>\n<p>In Scrum, we try to overcome this problem by practicing relative estimation, instead of absolute estimation. Absolute estimation is also called time and effort estimation in traditional project management. Relative estimation means that instead of trying to determine exactly how long a task will take, we compare the effort of that task, to the effort for another task, and that becomes the estimate<\/p>\n<p>There are two common relative estimation methods that I find most useful when estimating user stories. These are T-shirt sizes and story points.<\/p>\n<h3 id=\"n8_10\">T-shirt<\/h3>\n<p>the team simply picks one item on the Backlog that seems to be about a medium size workload, and simply calls that a \"medium\" in the estimate field. After that they take another item on the Backlog and compare it to the medium item they just identified, and answer the question: if that first item was a medium, what size would I give this one? The team will repeat this process on each additional item or user story on the Backlog until they're all addressed and done<\/p>\n<h3 id=\"n8_11\">Story Points<\/h3>\n<p>Most teams use a famous mathematical sequence of numbers called the Fibonacci sequence. The sequence is 0,1,1,2,3,5,8,13, 21 continues on to infinity. For the sake of story points, we skip zero and the first 1. These numbers are special in that they start out close to one another, but as the numbers get higher, they spread farther and farther out. This is helpful because as the estimate gets higher, the uncertainty and risk also gets higher. This number combines both effort and risk into one number. In other words, there's not much use in debating estimation values between 21 and 25 points, but choosing between 21 and 34 is a real conversation. This concept can be tricky at first and practice is the best way to learn it to explain this concept.<\/p>\n<p>it's up to the team to decide when and how often to conduct Backlog refinement.<\/p>\n","s":[["n8_1","Scrum Theory"],["n8_2","Scrum Roles"],["n8_3","Traits of an effective Scrum Master"],["n8_4","Traits of an effective Product Owner"],["n8_5","Traits of an effective Development Team"],["n8_6","Product Backlog"],["n8_7","User Stories"],["n8_8","Work management tools and Product Backlog"],["n8_9","Backlog Refinement"],["n8_10","T-shirt"],["n8_11","Story Points"]],"w":true},{"g":"Agile and Scrum","t":"Scrum events","h":"\n<h3 id=\"n9_1\">Sprint<\/h3>\n<p>Sprints, which we also called iterations, provide the whole rhythm for the team and is one of the five Scrum events. They allow us to get feedback quicker, encourage team collaboration, and provide more focus for Scrum teams.<\/p>\n<p>Within a Sprint, the amount of work is planned based on the historical capacity of the team and is made ready for the Sprint Planning event.<\/p>\n<p>It might help to think of each Sprint as a mini-project with planning, execution, delivery, closing, and a retrospective all wrapped into this bite-sized package.<\/p>\n<h3 id=\"n9_2\">The Scrum Guide<\/h3>\n<p>defines 5 events:<\/p>\n<ul>\n<li>The Sprint<\/li>\n<li>Sprint planning<\/li>\n<li>Daily Scrum<\/li>\n<li>Sprint review<\/li>\n<li>Sprint retrospective<\/li>\n<\/ul>\n<h3 id=\"n9_3\">Timeboxes<\/h3>\n<ul>\n<li>Create a sense of urgency which will drive prioritization<\/li>\n<li>Provide a window of focus which will translate into productivity gains<\/li>\n<li>Help the team develop a predictable rhythm to their work<\/li>\n<\/ul>\n<p>Can range from one to four weeks.  How do you choose? Well, there are three considerations:<\/p>\n<p>1- Thing about what you expect the frequency of changes to be, if the needs are more stable, perhaps longer will be fine<\/p>\n<p>2- Think about how much focused time your solution developers need to build a Product Backlog item<\/p>\n<p>3- Think about how much overhead goes into a “delivery” of your product<\/p>\n<h3 id=\"n9_4\">The Sprint<\/h3>\n<p>Sprints are the heartbeat of Scrum, where ideas are turned into value.<\/p>\n<p>They are fixed length events of one month or less to create consistency. A new Sprint starts immediately after the conclusion of the previous Sprint.<\/p>\n<p>During the Sprint:<\/p>\n<ul>\n<li>No changes are made that would endanger the Sprint Goal;<\/li>\n<li>Quality does not decrease;<\/li>\n<li>The Product Backlog is refined as needed;<\/li>\n<li>Scope may be clarified and renegotiated with the Product Owner as more is learned.<\/li>\n<\/ul>\n<h3 id=\"n9_5\">Sprint Planning<\/h3>\n<p>the first event within the Sprint that sets your team up for success for the next one to four weeks, depending on the length you chose.<\/p>\n<p>The entire Scrum team comes together and meets to confirm how much capacity, meaning time and people, are available during this Sprint, and then they identify what items from the Backlog will be done during the Sprint.<\/p>\n<p>\nThis is a time for the Scrum Master to facilitate team communication and answer the following questions throughout the event: \n<\/p>\n\n<ul>\n<li>\nWho is available during this Sprint?\n<\/li>\n<li>\nAre there any vacations or conflicts that we should know about? \n<\/li>\n<li>\nWhat has been our average velocity, meaning how many points or Backlog items have we been able to complete in a single Sprint in the past? \n<\/li>\n<li>\nWhat can and should be accomplished by the team in this upcoming Sprint? \n<\/li>\n<li>\nWhat is the ultimate Sprint goal? \n<\/li>\n<li>\nHow will the work get done? \n<\/li>\n<li>\nThroughout the Sprint, who is responsible for what tasks? \n<\/li>\n<li>\nWe've discussed Sprint lengths and story sizes.\n<\/li>\n<\/ul>\n\n<h3 id=\"n9_6\">Definition of done<\/h3>\n<p>Refers to an agreed upon set of itmes that must be completed before a user story or backlog item can be considered complete<\/p>\n<ul>\n<li>The code or solution itself is reviewed by an independent peer group<\/li>\n<li>The product or unit passes all testing requirements, which could include security or preformance testing<\/li>\n<li>Documentation is completed<\/li>\n<li>All user story accpetance criteria specified by the Product Owner is met<\/li>\n<li>The Product Owner accepts the user story<\/li>\n<\/ul>\n<h3 id=\"n9_7\">The Sprint Backlog<\/h3>\n<p>The set of Product Backlog items that identified for completion during the upcoming Sprint. Is a subset of items from the Product Backlog that you'll aim to finish during that particular Sprint.<\/p>\n<h3 id=\"n9_8\">The Daily Scrum<\/h3>\n<p>\nSometimes referred to as stand up, is a time for the Scrum Team to synchronize and prioritize activities for the day. In 15 minutes, and at the same time and place every day, each team member answers the following questions: \n<\/p>\n\n<ul>\n<li>\nWhat did I do yesterday that helped the Development Team, meet the Sprint goal? \n<\/li>\n<li>\nWhat will I do today to help the Development Team meet the Sprint goal? \n<\/li>\n<li>\nDo I notice any impediment that prevents me or the Development Team from meeting our goals?\n<\/li>\n<\/ul>\n\n<p>\nShould provide the Scrum Master with the opportunity to quickly unblock the team with little delay. And Daily Stand-ups are an opportunity to reinforce focus on the Sprint Backlog and Sprint Goal. \n<\/p>\n\n<h3 id=\"n9_9\">The Sprint Review<\/h3>\n<p>At the closing of a Sprint. This Sprint event is crucial to the Scrum Pillars of inspection and adaptation, and demonstrates the values of openness, courage, and respect.<\/p>\n<p>is a meeting with the entire Scrum Team where the product is demonstrated in order to determine which aspects are finished and which aren't.<\/p>\n<p>It covers:<\/p>\n<ul>\n<li>Exploration of which items should be considered done in the Product Backlog<\/li>\n<li>Demonstrate and inspect the product<\/li>\n<\/ul>\n<p>It makes the feedback as inmediate as possible, everyone has a voice and the team learns more about how their teammate does their job, leading to greater trust and understanding between team members<\/p>\n<p>Is a time for the team to demonstrate what they've accomplished. The Sprint Review is also where team members unveil what is called the Product Increment.<\/p>\n<h3 id=\"n9_10\">Product Increment<\/h3>\n<p>is what's produced after a given Sprint and is considered releasable. A product is releasable when the team has developed a Minimum Viable Product, which has a set of implemented features or requirements. A Minimum Viable Product is a version of a product with just enough features to satisfy early customers<\/p>\n<p>\n is what is produced after a given Sprint and is considered releasable. The Scrum Guide states that “An Increment is a concrete stepping stone toward the Product Goal. Each Increment is additive to all prior Increments and thoroughly verified, ensuring that all Increments work together. In order to provide value, the Increment must be usable.”\n<\/p>\n\n<p>\nA related term is the <b>Definition of Done<\/b>. The Definition of Done is a formal description of the state of the potentially releasable Product Increment and what it means when it meets the quality measures required for the product. It is the team’s agreed-upon requirements for any backlog item that is considered “done.” \n<\/p>\n\n<h3 id=\"n9_11\">Sprint Retrospective<\/h3>\n<p>An essential meeting of up to 3 hours for the Scrum Team to take a step cback, reflect, and identify improvements about how to work together as a team<\/p>\n<p>the Scrum Team will reflect on:<\/p>\n<ul>\n<li>\n What's working or not working for the team regarding the people, the processes, the tools \n<\/li>\n<li>\nWhat improvements are worth exploring in the next Sprint? \n<\/li>\n<li>\nWhat improvements were put in place for the last Sprint? Were they helpful or not, and why? \n<\/li>\n<\/ul>\n\n<p>key measures to take to ensure Sprint Retrospectives are a success:<\/p>\n<ul>\n<li>Blamelessness<\/li>\n<li>Participation is key<\/li>\n<li>Balance the negative with the positive<\/li>\n<li>Act on it<\/li>\n<\/ul>\n<p>are workshops or meetings that give project teams time to reflect on a project and brainstorm potential future improvements.<\/p>\n<h3 id=\"n9_12\">Pitfalls<\/h3>\n<ul>\n<li><b>Avoid too many gimmicks<\/b>.<br />There are many fun games and exercises that can be used by a Scrum Master when facilitating a Sprint Retrospective. However, not all teams enjoy this style. Consider using these exercises only occasionally or when the team asks for new ways of doing retrospectives.<\/li>\n<li><b>Try not to only focus on the negative.<\/b><br />Not only is it necessary for the team to recognize what’s not working well, it is also important to highlight where they exceeded expectations. This ensures that the team both avoids failures and repeats successes as well.<\/li>\n<li><b>Avoid changing processes<\/b> <b>after each retrospective.<\/b><br />It is okay to keep a new process in place for a few Sprints before deciding whether it was useful or not. You can always make note of opportunities for change, but try to wait a few Sprints before implementing new changes.<\/li>\n<\/ul>\n<h3 id=\"n9_13\">Best practices<\/h3>\n<ul>\n<li><b>Ask open-ended, probing questions. <\/b><br />Ask questions that require thoughtful discussion rather than a yes-or-no answer. For example, ask, “How could we have better achieved our Sprint Goal?” rather than “Did we achieve the Sprint Goal?””<\/li>\n<li><b>Consider diverse styles<\/b> <b>of communication and participation.<\/b><br />Make it easy for all team members to contribute their ideas and feedback. For example, not everyone feels comfortable speaking up in a large group. Try things like starting the retrospective with silent reflection by journaling or putting the team into pairs before starting a larger group conversation.<\/li>\n<li><b>Cover the many aspects<\/b> <b>of the Sprint when conducting a retrospective.<\/b><\/li>\n<\/ul>\n<ol>\n<li>The productivity and efficiency of the team<\/li>\n<li>The scope and understanding of the definition of done<\/li>\n<li>Communication and interactions within the team<\/li>\n<li>Stakeholder communication<\/li>\n<li>Progress towards more long-range release plans<\/li>\n<\/ol>\n<ul>\n<li><b>Consider reflecting periodically on Scrum theory and values<\/b> <b>by asking specific questions.<\/b><br />For example, ask, “How could the team become more transparent?” or “How did we abide by our Scrum values in this Sprint?”<\/li>\n<\/ul>\n<h3 id=\"n9_14\">Burndown chart<\/h3>\n<p>measures time against the amount of work done and the amount of work remaining. The goal of using a burndown chart is to keep the team aware of how they're doing against their overall goals.<\/p>\n<h3 id=\"n9_15\">Velocity<\/h3>\n<p>is a measure of how many points a team burns down during a single Sprint on average.<\/p>\n<p>they're using their average velocity over at least three Sprints to determine how many items they can safely add to their Sprint Backlog.<\/p>\n<p>\nYou can tell them approximately how long it will take to complete the entire Product Backlog and how much of your Backlog will be completed by a particular time. \n<\/p>\n\n","s":[["n9_1","Sprint"],["n9_2","The Scrum Guide"],["n9_3","Timeboxes"],["n9_4","The Sprint"],["n9_5","Sprint Planning"],["n9_6","Definition of done"],["n9_7","The Sprint Backlog"],["n9_8","The Daily Scrum"],["n9_9","The Sprint Review"],["n9_10","Product Increment"],["n9_11","Sprint Retrospective"],["n9_12","Pitfalls"],["n9_13","Best practices"],["n9_14","Burndown chart"],["n9_15","Velocity"]],"w":true},{"g":"Agile and Scrum","t":"Agile effort estimation","h":"\n<p>Some examples of Agile estimation techniques are:<\/p>\n<ul>\n<li><b><u>Planning Poker:<\/u><\/b>\n<br />\n<p>\n  Used when Scrum teams have to make effort estimates for a small number of items (under 10) is consensus-based, meaning that everyone has to agree on the number chosen. In this technique, each individual has a deck of cards with numbers from the Fibonacci sequence on them. Planning Poker decks also include cards with coffee cups and question marks on them. The question mark card means that the person doesn’t understand what is being discussed or doesn’t have enough information to draw a conclusion. The coffee cup card means that the person needs a break.\n  <\/p>\n<\/li>\n<\/ul>\n<p>\n  Is used in Sprint Planning meetings. As each Product Backlog item/user story is discussed, each team member lays a card face down on the table. Then, everyone turns their card over at the same time and the team discusses the estimates, particularly when they are far apart from one another. By first hiding the estimates, the group avoids any bias that is presented when numbers are said aloud. \n  <\/p>\n<ul>\n<li>\n<p><b><u>Dot Voting:<\/u><\/b>\n<br />\n<p>\n  Is also good for sprints with a low number of Sprint Backlog items. Each team member starts with small dot stickers, color-coded by the estimated effort required (e.g., S=green, M=blue, L=orange, XL=red). The items or user stories are written out on pieces of paper placed around a table or put up on the wall. Then, team members walk around the table and add their colored stickers to the items. \n  <\/p><\/p>\n<\/li>\n<li>\n<p>The Bucket System:\n<br />\n<p>\n  Helpful for backlogs with many items since it can be done very quickly. A couple hundred items can be estimated in just one hour with the Bucket System. An effective strategy for sizing items because it explores each item in terms of pre-determined \"buckets\" of complexity.\n  <\/p>\n<\/p>\n<\/li>\n<\/ul>\n<p>\n  the team starts by setting up a line of note cards down the center of the table, each marked with a number representing a level of effort. Then, the team writes each item or user story on a card. Each person draws and reads a random item,  then places it somewhere along the line of numbered note cards. There is no need to discuss further with the team. If a person draws an item that they do not understand, then they can offer it to someone else to place. Additionally, if a person finds an item that they think does not fit where it was placed, they can discuss it with the team until a consensus about a more accurate placement is reached. Team members should spend no more than 120 seconds on each item.\n  <\/p>\n<ul>\n<li>\n<p>Large/Uncertain/Small:\n<br />\n<p>\n  This is the same general idea as the Bucket System, but instead of several buckets, you only use three categories: large, uncertain, and small. Starting with the simpler, more obvious user stories, the team places the items in one of the categories. Then, the team discusses and places more complex items until each is assigned to a category.\n  <\/p><\/p>\n<\/li>\n<li>\n<p>Ordering Method:\n<br />\n<p>\n   Ideal for projects with a smaller team and a large number of Product Backlog items. First, a scale is prepared and items are randomly placed ranging from low to high. Then, one at a time, each team member either moves any item one spot lower or higher on the scale or passes their turn. This continues until team members no longer want to move any items. \n  <\/p><\/p>\n<\/li>\n<li>\n<p>Affinity Mapping:\n<br />\n<p>\n  A best practice is to conduct this technique using sticky notes placed onto a wall, whiteboard, or table. Each sticky note features a different user story or item. Using sticky notes allows the team to move user stories around in order to group them by similar theme, group, and pattern. The team begins by placing one sticky note on the board. Then, the team takes the next sticky note and discusses whether it is similar to the first item. Based on the team’s assessment, the second sticky note is placed in the first group or into its own group.\n  <\/p>\n<\/p>\n<\/li>\n<\/ul>\n<p>\n  After all of the items are grouped (there should be anywhere from 3–10 groups total), the team gives a name to each group that represents the general theme of the items. Then, the groups are prioritized by importance so that the team knows which items to tackle first.\n  <\/p>\n\n<h3 id=\"n10_1\"><b>Characteristics of effective estimation<\/b><\/h3>\n<p>Regardless of which technique your team chooses, there are several important characteristics the techniques share that lead to effective estimation:<\/p>\n<ul>\n<li><b>Avoids gathering false precision of estimates. <\/b>In Scrum, assigning rough estimates results in more accuracy across the project. Therefore, if the team focuses on identifying relative estimates—rather than a team having a lengthy debate about whether a task will take seven or 10 days of work—the team saves time and avoids potentially missing deadlines.<\/li>\n<li><b>Avoids anchoring bias<\/b>. Many of these techniques (e.g., Planning Poker) keep the initial estimate private, which allows team members to form an independent opinion on the estimate before sharing their thoughts with the team. This prevents a known phenomenon called <i>anchoring bias<\/i>, where individuals find themselves compelled to put forth estimates similar to others in the room to avoid embarrassment.<\/li>\n<li><b>Promotes inclusivity<\/b>. These group estimation techniques not only lead to better estimates but also help the team develop trust and cohesiveness.<\/li>\n<li><b>Leads to effort discovery<\/b>. Estimating in these dynamic ways can help the team uncover strategies to get items completed which might otherwise not have been revealed.<\/li>\n<\/ul>\n<p><b>relative estimation<\/b> means to compare the effort estimated for completing a backlog item to the effort estimated for another backlog item. Doing this instead of trying to determine exactly how long a task will take allows your comparisons and estimates to be more accurate relative to one another.<\/p>\n<h3 id=\"n10_2\">T-shirt sizes<\/h3>\n<p>\nSome of the benefits to using this technique are that it is quick, well understood by Agile experts, and a good introduction for teams who are just learning relative estimation. \n<\/p>\n\n<p>The team:<\/p>\n<ul>\n<li>Agrees on the chosen scale and metrics to be used.<\/li>\n<li>Identifies at least one anchor backlog item. That item will be assigned a T-shirt size. Some teams will choose two anchor items—one at the top of the range and one at the bottom of the range.<\/li>\n<li>Sorts through the remaining backlog items and agrees on T-shirt sizes for each of them.<\/li>\n<\/ul>\n<h3 id=\"n10_3\">Story Points<\/h3>\n<p>Is a little more advanced than T-shirt sizes, but it is essentially the same concept. This method is good for experienced teams. Teams usually use the Fibonacci sequence<\/p>\n<ul>\n<li>Agrees on the permitted points values. Some teams cap the size at a certain number, like 21. Some teams decide to jump from 21 to 100 as the next larger value. This is a team decision.<\/li>\n<li>Identifies at least one anchor backlog item and agrees to assign it a points value. Some teams will choose two anchor items, one at the top of the range and one at the bottom of the range.<\/li>\n<li>Sorts through the remaining backlog items as a team, agrees on an estimate for each item, and captures it in the backlog management system.<\/li>\n<\/ul>\n","s":[["n10_1","Characteristics of effective estimation"],["n10_2","T-shirt sizes"],["n10_3","Story Points"]],"w":false},{"g":"Agile and Scrum","t":"Kanban Board","h":"\n<p>have three main features that make it a great Sprint tracking tool for Scrum Teams.<\/p>\n<ul>\n<li>\nVisualization \n<\/li>\n<li>\nWork-in-progress limits (also known as WIP limits)\n<\/li>\n<li>\nFlow of work\n<\/li>\n<\/ul>\n\n<p>WIP limits are constraints on how many work items the team actively works on at any given time. This provides focus for the team, which is one of our Scrum values.<\/p>\n<p>Kanban and Scrum boards are really useful because they help you visualize your progress, set and maintain your team's workload and WIP limits, and give you a sense of the flow of work throughout the team's execution process.<\/p>\n<h3 id=\"n11_1\">Value driven delivery<\/h3>\n<p>When the team is focused on delivering a product that has maximum value for its customers. One way to help teams make sure they're staying focused is by following a value roadmap<\/p>\n<h3 id=\"n11_2\">Value Roadmap<\/h3>\n<p>It's an Agile way of mapping out the timelines and requirements for the product development process and can be used in all types of businesses.<\/p>\n<p>is a guide that demonstrates where to go, how to get there, and what to accomplish along the way in order to maximize value. It helps map out a product idea and the strategy for how to deliver it.<\/p>\n<p>\nhelps the team explain the vision of the product and can also be used to identify important milestones. \n<\/p>\n\n<p>\nA typical value roadmap has three components: \n<\/p>\n\n<ul>\n<li>\n<b><u>Product vision:<\/u><\/b> defines what the product is, how it supports the customer's business strategy, and who will use it.\n<\/li>\n<li>\n<b><u>Product roadmap:<\/u><\/b> It provides a high-level view of the expected product, its requirements, and an estimated schedule for reaching milestones. It's key to making sure your team is building the right thing.\n<\/li>\n<li>\n<b><u>Release plans:<\/u><\/b> occur when the team has developed a basic working version of a given feature or requirement. A release plan includes the approximate date when the team is expected to release and deliver certain features to the customer or user. Contains a release goal, which is an overall business goal for the features you plan to include in the release; the list of Backlog items such as epics, user stories, or features that you require for that release goal; an estimated release date; and any other relevant dates that impact a release, like a convention or major holiday. \n<\/li>\n<\/ul>\n\n<p>The <b>benefits<\/b> of developing and maintaining a product roadmap are numerous:<\/p>\n<ul>\n<li>Clarifying the sequence of deliverables<\/li>\n<li>Showing teams how their efforts relate to the north-star vision. In other words, their ultimate goal.<\/li>\n<li>Showing stakeholders the incremental value that will be achieved over the course of the project (rather than reviewing it as one big delivery at the end)<\/li>\n<li>Helping stakeholders roughly understand the layout of the work behind the deliverable<\/li>\n<\/ul>\n<p>There are also some <b>pitfalls<\/b> around roadmaps to avoid:<\/p>\n<ul>\n<li>Letting stakeholders think the roadmap is set and unchangeable. This may cause stakeholders to impede teams’ ability to adapt in response to new information, as well as put a lot of pressure on teams to achieve deadlines no matter what it takes.<\/li>\n<li>Spending too much time fine-tuning delivery dates versus keeping them rough and improving specificity as the dates get closer<\/li>\n<li>Putting all the work into creating the roadmap rather than producing the deliverables<\/li>\n<\/ul>\n<p>Here are some <b>best practices<\/b> to help you get the most from your roadmaps:<\/p>\n<ul>\n<li>Make it highly noticeable to the team and refer to it frequently.<\/li>\n<li>Clearly indicate the highest priority items.<\/li>\n<li>If possible, clearly indicate the highest value items.<\/li>\n<li>Make it visible to your wider stakeholder group so that they can use it for their planning.<\/li>\n<li>Conduct regular reviews of the roadmap with sponsors, stakeholders, and the team to ensure that it is still providing the blueprint for the project.<\/li>\n<\/ul>\n<p>The three keys to influence:<\/p>\n<ul>\n<li>\nClarify measurable results:  effective results are specific, measurable, achievable, relevant, and time-bound (S.M.A.R.T). When setting goals for a project, remember to ask yourself what the “why” entails. Are the results specific and measurable? Is it what you intended? Is it time-bound? Also, make sure the measures are visible and transparent to the entire team throughout the change.\n<\/li>\n<li>\nFind vital behaviors: is the action an individual takes at a pivotal moment in the context of the change they are seeking. To determine vital behaviors, you might consult experts, scan the best and most-cited articles and research, or perform a culture assessment by identifying norms and customs within the team. When identifying the behaviors, evaluate which behaviors are constructive to the change you wish to promote and notice examples of those who succeed where most others fail.\n<\/li>\n<li>\nUse the six sources of influence: \n<\/li>\n<\/ul>\n\n<ol>\n<li><b>Personal motivation<\/b>: Are the individuals motivated internally to engage in the new behavior? Can you help them “love what they hate”?<br /><i>Example<\/i>: Ensure the Product Owner is timely, appreciative, and effective while giving their feedback.<\/li>\n<li><b>Personal ability<\/b>: Are the individuals capable of performing the behavior? Do they have the ability, knowledge, and skills to “do what they can't”?<br /><i>Example<\/i>: Ensure that the developer knows how to use the available demo tools and can easily send a quick video of the new feature in their email to the Product Owner.<\/li>\n<li><b>Social motivation<\/b>: Are there social contacts or networks encouraging or discouraging this new behavior?<br /><i>Example<\/i>: Have the Development Team members remind each other in the Daily Scrum to email the Product Owner before they finalize the work.<\/li>\n<li><b>Social ability<\/b>: Does the team have resources within their social network to help them carry out the new behaviors?<br /><i>Example<\/i>: Give the Development Team a tool to track all of their demos to the Product Owner during the Sprint.<\/li>\n<li><b>Structural motivation<\/b>: Are there rewards or incentives that they will receive if they perform the new behaviors?<br /><i>Example<\/i>: Provide a coffee gift card Sprint award that the Product Owner gets to award after each Sprint.<\/li>\n<li><b>Structural ability<\/b>: Are there environmental factors at play that either deter or support the new behavior? Can you make the incorrect behavior harder to do than the correct behavior?<br /><i>Example<\/i>: Add a rule to the content management system that pre-populates the name of the Product Owner in the reviewer list.<\/li>\n<\/ol>\n<h3 id=\"n11_3\">Coaching an Agile team<\/h3>\n<ul>\n<li>Design the “plays” with the team<\/li>\n<li>Provide feedback to the team<\/li>\n<li>Celebrate and learn with the team<\/li>\n<\/ul>\n<p>An example of this is to facilitated a brainstorming meeting with the team to discuss which parts of our process weren’t working and use sticky notes to organize our ideas for improvement and  then prioritized the ideas to implement<\/p>\n<p>Provide feedback as early as possible on a day-to-day basis. Providing feedback shouldn't only be about fixing broken things, but finding processes and activities that worked really well and encourage the team to continue using the things that work.<\/p>\n<p>\n Congratulate the team often on a job well done, a happy customer, or a big solution launch. If the team \"loses,\" meaning they weren't successful in fulfilling a requirement, acknowledge that loss as critical data that will help the team improve next time.\n<\/p>\n\n<p>Management is about giving direction, while coaching is about teaching. Some situations will call for coaching, and others will call for management.<\/p>\n<h3 id=\"n11_4\">Managing<\/h3>\n<p>This is very indicative of a traditional management approach. At its core, managing requires overseeing the work of others and can include:<\/p>\n<ul>\n<li>Onboarding and orienting new employees<\/li>\n<li>Conducting meetings<\/li>\n<li>Delegating tasks and assignments<\/li>\n<li>Monitoring progress and performance against those tasks<\/li>\n<li>Making high-level decisions<\/li>\n<\/ul>\n<p>In Agile project management, however, teams are designed to be self-managing. A self-managing team has the autonomy to choose how best to accomplish their work, rather than being directed by others from the top down. Agile team members should also feel empowered and equipped to problem-solve on their own.<\/p>\n<h3 id=\"n11_5\">Coaching<\/h3>\n<p>\nCoaching is a two-way communication style aimed at influencing and developing team members’ skills, motivation, and judgment. Coaching empowers team members to arrive at solutions on their own by teaching them critical thinking and decision-making skills. \n<\/p>\n\n<p>is achieved through offering feedback and providing opportunities for professional development.<\/p>\n<p>\ncoaches will offer guidance, then get out of the way. Coaches don’t jump in during times of crisis in a way that a manager would. Coaches ask questions to help team members arrive at conclusions on their own.  \n<\/p>\n\n<p>There are a few principles to keep in mind when coaching:<\/p>\n<ol>\n<li><b>Motivate<\/b>: Coaches motivate team members to take action. They point out the value in others’ work and instill within them a sense of pride in what they do.<\/li>\n<li><b>Support: <\/b>Coaches are an accessible resource for their team to come to when they experience problems or if they have an idea they want their feedback on.<\/li>\n<li><b>Encourage and appreciate: <\/b>When someone on their team is struggling with a heavy workload, a coach will acknowledge and validate the weight of their efforts and assure them that they are capable of handling the challenges ahead.<\/li>\n<\/ol>\n<h3 id=\"n11_6\">4 Themes of Agile principles<\/h3>\n<p>1- Value delivery: is about making sure the team is delivering working solutions frequently.<\/p>\n<p>2- Business collaboration: is about making sure that developers are collaborating with business people on how to build the right product.<\/p>\n<p>3- Team dynamics and culture: is about how human beings are complez creatures with a lot of different motivations and styles of working<\/p>\n<p>4- Retrospectives<\/p>\n<h3 id=\"n11_7\">Signs of value delivery issues<\/h3>\n<ul>\n<li>Missing expected delivery dates<\/li>\n<li>Burned out<\/li>\n<li>Too many items “ in progress”<\/li>\n<\/ul>\n<h3 id=\"n11_8\">Solutions to value delivery issues<\/h3>\n<ul>\n<li>More demos of the solutions<\/li>\n<li>Use Retrospectives<\/li>\n<li>Make sure that everyone understands what “done” means<\/li>\n<li>Focus on only a few user stories for Sprint<\/li>\n<\/ul>\n<h3 id=\"n11_9\">Signs of business collaboration issues<\/h3>\n<ul>\n<li>You might notice that the team is overwhelmed with critical feedback or change requests<\/li>\n<li>“Us vs. Them” mentality between the team doing the work and management<\/li>\n<\/ul>\n<h3 id=\"n11_10\">Solutions to business collaboration issues<\/h3>\n<ul>\n<li>Addressing critical feedback and change requests by doing more demos<\/li>\n<li>Conductig a solution design Sprint<\/li>\n<li>Ensuring changes to the Backlog are introduce only in between Sprints<\/li>\n<\/ul>\n<h3 id=\"n11_11\">Sign of team dynamics and culture issues<\/h3>\n<ul>\n<li>Low team morale<\/li>\n<li>Lots of conflict<\/li>\n<li>Low conflict<\/li>\n<\/ul>\n<h3 id=\"n11_12\">Solutions to team dynamics and culture issues<\/h3>\n<ul>\n<li>Run a team brainstorm session (how to work together better - dos and donts)<\/li>\n<li>Change up the workflows<\/li>\n<li>Take a training class together<\/li>\n<li>You can also try a retrospective technique from the internet - Six Hats Thinking Technique. In this technique, each team member chooses a different hat to explore the subject of the retrospective. The different hats each involve a different objective, like discussing positives or negatives that happened during the Sprint or sharing emotive statements. This helps to ensure that the team takes a well-rounded approach to the retrospective.<\/li>\n<\/ul>\n","s":[["n11_1","Value driven delivery"],["n11_2","Value Roadmap"],["n11_3","Coaching an Agile team"],["n11_4","Managing"],["n11_5","Coaching"],["n11_6","4 Themes of Agile principles"],["n11_7","Signs of value delivery issues"],["n11_8","Solutions to value delivery issues"],["n11_9","Signs of business collaboration issues"],["n11_10","Solutions to business collaboration issues"],["n11_11","Sign of team dynamics and culture issues"],["n11_12","Solutions to team dynamics and culture issues"]],"w":false},{"g":"Agile and Scrum","t":"Common coaching challenges","h":"\n<h3 id=\"n12_1\">Managing a unstable product roadmap<\/h3>\n<p>The main causes:<\/p>\n<ul>\n<li>Product ambition:<\/li>\n<li>When Product leadership is overly ambitious about what the team can realistically deliver<\/li>\n<li>Solutions:<ul>\n<li>Agree up front how to handle new opportunities<\/li>\n<li>Set up a regular roadmap reviews with the entire team<\/li>\n<li>Promote sharing knowledge between the Product Owner and the Development Team<\/li>\n<\/ul>\n<\/li>\n<li>Product assumptions:\n<br />\n<ul>\n  <li>\n  Too many assumptions can jeopardize the team’s success\n  <\/li>\n  <li>\n  Solutions: \n\n  - Document the assumptions and make them transparent\n  - Check assumptions agains unbiased user research\n  <\/li>\n  <\/ul>\n<\/li>\n<\/ul>\n<p>Unbiased user research<\/p>\n<ul>\n<li>Gathers information about what users really want<\/li>\n<li>Allows you to confirm or reject assumptions<\/li>\n<li>Helps you move forward with confidence<\/li>\n<\/ul>\n<h3 id=\"n12_2\">Incomplete implementation of Scrum<\/h3>\n<ul>\n<li>Loss of clear roles and responsibilities<\/li>\n<li>Tempted to skip some events or blend them to save time<\/li>\n<li>Not providing the team with the Scrum coaching they need<\/li>\n<li>Solutions:<\/li>\n<li>Implement Scrum completely<\/li>\n<li>Make sure roles are well defined and properly fulfilled<\/li>\n<\/ul>\n<h3 id=\"n12_3\">Lack of team stability<\/h3>\n<ul>\n<li>Changes in team composition<\/li>\n<li>Solutions:<\/li>\n<li>Have a quick onboarding process<\/li>\n<li>Use “pair programming”<\/li>\n<li>Have shorter Sprints<\/li>\n<\/ul>\n<h3 id=\"n12_4\">DevOps<\/h3>\n<p>An organizational and cultural movement that aims to increase software delivery velocity, improve service reliability, adn build shared ownership among software stakeholders<\/p>\n<p>\nDevOps is about growing and managing teams and organizations that can build and evolve large-scale systems at a rapid pace. These systems need to be both secure and reliable, so they can better deliver value to customers and organizations. \n<\/p>\n\n<h3 id=\"n12_5\">Business agility<\/h3>\n<p>Incorporating Agile principles into the wide sphere of management<\/p>\n<p>As an Agile project manager in a larger organization, you might find yourself using frameworks like Scrum of Scrums or Scaled Agile Framework, also known as SAFe.<\/p>\n<h3 id=\"n12_6\">Scaling Agile<\/h3>\n<p>\nwhat do you do if your team is larger than that? Or if the size of the product or solution is so large that multiple teams are required to do the work? \n<\/p>\n\n<p>five frameworks that scale the Agile approach to address the needs of large initiatives or solutions: <b>Scaled Agile Framework (SAFe), Scrum of Scrums<\/b>, <b>Large Scale Scrum (LeSS)<\/b>, <b>Disciplined Agile Delivery (DAD)<\/b>, and the <b>Spotify Model<\/b>.<\/p>\n<h3 id=\"n12_7\">Scaled Agile Framework (SAFe)<\/h3>\n<p>The most popular scaled framework. Is a Lean-Agile scaling framework that draws heavily on concepts from Kanban, Scrum, Extreme Programming (XP), DevOps, and Design Thinking methodologies. SAFe puts the goal of delivering value above all else—the first principle of SAFe is “take an economic view.” The framework organizes all work and teams into “Agile Release Trains” based on value streams<\/p>\n<p>is founded on a set of core values:<\/p>\n<ul>\n<li><b>Alignment<\/b>: Synchronize the planning and execution of SAFe activities at all levels of the organization.<\/li>\n<li><b>Built-in Quality<\/b>: Build quality into all stages of solution development.<\/li>\n<li><b>Transparency<\/b>: Make execution activities visible at all levels to build trust among teams and across the organization.<\/li>\n<li><b>Program Execution<\/b>: Focus on working systems and business outcomes.<\/li>\n<li><b>Leadership<\/b>: Model the values and principles of SAFe.<\/li>\n<\/ul>\n<h3 id=\"n12_8\">Scrum of Scrums<\/h3>\n<p>\n is a technique for integrating the work of multiple, smaller Scrum teams working on the same project or solution. Coordination among teams is critical to ensuring the deliverables from each team can be integrated into one larger, cohesive deliverable. \n<\/p>\n\n<p>involves the following elements:<\/p>\n<ul>\n<li>A group of at least 12 or more people divided into Scrum Teams of five to ten people each<\/li>\n<li>Scrum of Scrums meetings, which are held once a week, twice a week, or daily. These meetings follow the same format as a Daily Scrum meeting but focus on the Scrum team. In these meetings, you’ll discuss questions like: “What did the team do yesterday? What problems occurred, if any, that are negatively affecting your team? What does your team want to accomplish before we meet again? Is your team blocked from moving forward on any tasks?”<\/li>\n<li>A <b>Scrum Master<\/b> or designated “ambassador” for each team that participates in the Scrum of Scrums meetings and a <b>Scrum of Scrums Master<\/b> who focuses on the overall Scrum process across multiple teams<\/li>\n<li>Sprint Planning, Sprint Review, and Sprint Retrospective meetings<\/li>\n<\/ul>\n<h3 id=\"n12_9\">Large-Scale Scrum (LeSS)<\/h3>\n<p>is a framework that aims to maximize the Scrum team’s ability to deliver value and reduce waste in larger organizations<\/p>\n<p>The ten LeSS principles are:<\/p>\n<ol>\n<li><b>Large-scale Scrum is Scrum:<\/b> Apply the values and principles of Scrum to a larger team.<\/li>\n<li><b>Empirical process control:<\/b> Inspect, adapt, and learn from experience to improve processes.<\/li>\n<li><b>Transparency:<\/b> Ensure clarity and accessibility across a project.<\/li>\n<li><b>More with less:<\/b> Create only necessary processes, roles, artifacts, and waste when scaling.<\/li>\n<li><b>Whole-product focus:<\/b> Think holistically about the product, making sure that all the parts serve the whole.<\/li>\n<li><b>Customer-centric:<\/b> Keep the customer’s needs and values at the heart of your process.<\/li>\n<li><b>Continuous improvement towards perfection:<\/b> Improve the product—and your process—during every single Sprint.<\/li>\n<li><b>Systems thinking:<\/b> Think about the system as a whole; Don’t get lost in the details.<\/li>\n<li><b>Lean thinking:<\/b> Seek continuous improvement, aim for perfection, and respect people.<\/li>\n<li><b>Queuing theory:<\/b> Embrace the Lean principles of “flow,’ manage queue size,” and “minimize multitasking” to keep delivering value.<\/li>\n<\/ol>\n<h3 id=\"n12_10\">Disciplined Agile Delivery (DAD)<\/h3>\n<p>is a hybrid approach that combines the strategies from various Agile frameworks, including Kanban, LeSS, Lean Development, Extreme Programming, Agile Modeling, and more.<\/p>\n<p>\nhelps you develop a scaled Agile strategy based on context and desired outcomes. \n<\/p>\n\n<p>is organized into four “layers”:<\/p>\n<ol>\n<li><b>Foundations<\/b> discusses the principles, guidelines, Agile concepts, roles and team structure definitions, and Way of Working (WoW).<\/li>\n<li><b>Disciplined DevOps<\/b> ensures that solutions are delivered to customers effectively and safely, with data and security management always at the forefront.<\/li>\n<li><b>Value Streams<\/b> ensures that solutions are aligned with the organization's business strategy, connecting customers, sales, and portfolio management to the framework.<\/li>\n<li><b>Disciplined Agile Enterprise (DAE)<\/b> connects the industry marketplace with corporate governance and larger enterprise activities.<\/li>\n<\/ol>\n<p>No matter which framework you choose, it’s important to keep a few basic principles in mind:<\/p>\n<ul>\n<li>Treat scaling models like SAFe, Scrum of Scrums, LeSS, etc., as general frameworks, not instruction manuals.<\/li>\n<li>Different situations require different solutions. It’s okay to mix and match elements from multiple frameworks, as long as you apply the principles and values of the Agile Manifesto.<\/li>\n<li>Don’t try to scale without prior Agile experience. Going straight from Waterfall to scaled Agile can be risky without a knowledgeable guide.<\/li>\n<li>Finally, and most importantly, don’t scale if it isn’t necessary. The larger your team, the more complex and difficult your project becomes.<\/li>\n<\/ul>\n<p>\nAgile is more than just Scrum, Sprints, and Standups. Do they know it's also about founding values that include customer collaboration, value delivery, self-organizing teams? I'm also interested to know whether they make Waterfall out to be the worst solution, or do they know that all projects benefit from certain types of approaches, including Waterfall, like clear requirements, risk management, stakeholder awareness, and more. \n<\/p>\n\n<p>Agile or Scrum can help a project manager with specific challenges and what those challenges are.<\/p>\n<p>\nSome questions you should ask are, how supportive is the management here towards blending project management approaches? What's the first thing I should know about the culture here? And how often will I get to hear about the needs of our users or customers? And what would a typical day look like for me if I were to take on this position? \n<\/p>\n\n<p>\nHere are four things that helped me bring Agile to my teams. First, start small. You may be excited by everything you've learned here, but your team might like things how they are. So introduce Agile practices in bite-sized pieces. Start by using a Kanban board, just to keep track of one workstream, or set up a retrospective after a major milestone. \n<\/p>\n\n<p>\nSecond, listen to feedback. The most powerful tool a project manager has is the ability to listen to their team and meet them where they are. \n<\/p>\n\n<h3 id=\"n12_11\">How to introduce Agile to a team<\/h3>\n<ul>\n<li>Start small<\/li>\n<li>Listen to feedback<\/li>\n<li>Be strategic<\/li>\n<li>Find allies<\/li>\n<\/ul>\n","s":[["n12_1","Managing a unstable product roadmap"],["n12_2","Incomplete implementation of Scrum"],["n12_3","Lack of team stability"],["n12_4","DevOps"],["n12_5","Business agility"],["n12_6","Scaling Agile"],["n12_7","Scaled Agile Framework (SAFe)"],["n12_8","Scrum of Scrums"],["n12_9","Large-Scale Scrum (LeSS)"],["n12_10","Disciplined Agile Delivery (DAD)"],["n12_11","How to introduce Agile to a team"]],"w":false},{"g":"Product management","t":"Core competencies of product management","h":"\n<p>Is a complex and dynamic field that involves guiding a product from its initial concepto to its final launch. It requires a unique combination of skills, knowledge, and ability to navigate various industries, all while maintaining a strong focus on the user<\/p>\n<h3 id=\"n13_1\">The building blocks of product management<\/h3>\n<p>\n Four fundamental concepts form the basis of these competencies: \n<\/p>\n\n<ul>\n<li>\n<b><u>Product vision:<\/u><\/b> It provides a clear and inspiring view of the product's future, outlining the problem it aims to solve, the intended audience, and the value it will provide. A strong product vision motivates the team and attracts both customers and stakeholders. It serves as a long-term aspiration that informs decision-making throughout the product's life cycle. creating a compelling product vision can be challenging. It demands a deep understanding of the market, the target audience, and the company's capabilities. The vision must be both aspirational and realistic, inspiring yet achievable. Product managers can use techniques such as user research, market trend analysis, and stakeholder brainstorming to meet these challenges. A successful product vision is rooted in a deep understanding of the user's needs and pain points. The goal is to develop a vision that is both meaningful and actionable, serving as a guiding light throughout the product's development. \n<\/li>\n<li>\n<b><u>Product Strategy:<\/u><\/b>  outlines the path to achieve the product’s vision. It involves defining the target market, identifying key differentiators, and establishing a plan for market entry. This strategy is dynamic, adapting to market changes and customer feedback to ensure that product development efforts are focused and aligned with the overall business objectives. It requires a deep understanding of customer needs, pain points, and aspirations, along with a thorough analysis of the competitive landscape to identify opportunities for differentiation and sustainable advantage. It should also include a clear go-to-market plan, detailing the product's launch, marketing, and sales approach.  Should be driven by user research and continuous feedback, ensuring the product addresses real needs and evolves with growing customer needs over time, market feedback and learnings.\n<\/li>\n<li>\n<b><u>Product Roadmap:<\/u><\/b> translates the strategy into a tangible plan. It outlines the key features and releases, along with their timelines and priorities.  A well-maintained product roadmap provides visibility into the product's future and helps manage stakeholder expectations.\n<\/li>\n<li>\n<b><u>Measuring Product Succes:<\/u><\/b> Define key performance indicators (KPIs) to track the progress and success of the product against the vision and strategy. These metrics provide tangible evidence of whether the product is achieving its intended goals and delivering value to users and the business. Use data and analytics to inform roadmap adjustments and ensure alignment with strategic goals. By consistently monitoring and analyzing these KPIs, product managers can make data-driven decisions, optimize the product, and ensure it stays on track to fulfill the overarching vision.\n<\/li>\n<\/ul>\n\n","s":[["n13_1","The building blocks of product management"]],"w":false},{"g":"Product management","t":"How KPIs relate to vision, strategy and roadmap","h":"\n<ul>\n<li><b>Vision:<\/b> KPIs should reflect the long-term aspirations outlined in the product vision. For example, if the vision is to \"create a seamless and sustainable global supply chain for a better future,\" KPIs might include metrics related to reduced carbon footprint, increased efficiency, and global market penetration.<\/li>\n<li><b>Strategy: <\/b>KPIs should align with the specific goals and tactics defined in the product strategy. If the strategy focuses on acquiring a specific user segment, KPIs might track user acquisition rates within that segment. If the strategy emphasizes differentiation through a particular feature, KPIs might measure the usage and satisfaction levels of that feature.<\/li>\n<li><b>Roadmap: <\/b>KPIs help evaluate the effectiveness of the roadmap's execution. By tracking KPIs at each phase of the roadmap (e.g., MVP launch, user acquisition, monetization), product managers can determine whether each stage is achieving its intended outcomes and make necessary adjustments to future phases.<\/li>\n<\/ul>\n","s":[],"w":false},{"g":"Product management","t":"Product Manager KPIs to track success","h":"\n<p>Here are some key product manager KPIs to track success:<\/p>\n<ul>\n<li><b>User Acquisition Cost (UAC): <\/b>The cost of acquiring a new user.<\/li>\n<li><b>Customer Lifetime Value (CLV): <\/b>The predicted total revenue a customer will generate.<\/li>\n<li><b>Monthly/Daily Active Users (MAU/DAU):<\/b> The number of active users.<\/li>\n<li><b>Churn Rate: <\/b>The percentage of users who stop using the product.<\/li>\n<li><b>Net Promoter Score (NPS): <\/b>A measure of customer satisfaction and loyalty.<\/li>\n<li><b>Feature Usage:<\/b> The frequency and intensity of usage of specific features.<\/li>\n<li><b>Conversion Rate: <\/b>The percentage of users who complete a desired action.<\/li>\n<li><b>Time to Value: <\/b>How long it takes for a new user to experience the core value.<\/li>\n<li><b>Customer Satisfaction Score (CSAT):<\/b> A measure of customer satisfaction with an interaction.<\/li>\n<li><b>Revenue Growth: <\/b>The increase in revenue generated by the product.<\/li>\n<\/ul>","s":[],"w":false}];

const EXAM=ORD.filter(id=>MD[id].tag=='ex');
const TAG={ex:'For the exam',en:'For interviews'};
const KEY={ex:'For the exam',en:'For the interview'};
const v=document.getElementById('view');
let st={};
try{st=JSON.parse(localStorage.getItem('pspo-st')||'{}')}catch(e){st={}}
const old=['fund','team','po','eventos','artef','valor'];
old.forEach((id,i)=>{if(st['b'+i]!=null){st['m_'+id]=Math.max(st['m_'+id]||0,st['b'+i]);delete st['b'+i]}});
const save=()=>{try{localStorage.setItem('pspo-st',JSON.stringify(st))}catch(e){}};
save();
let cur={tab:'mod'};
const best=id=>st['m_'+id];
const passed=id=>(best(id)||0)>=80;

const shuf=a=>{const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
const prep=q=>({q:q.q,w:q.w,o:(q.o.length==2?q.o.map((t,i)=>({t,ok:i==q.a})):shuf(q.o.map((t,i)=>({t,ok:i==q.a}))))});
const top=()=>window.scrollTo(0,0);

const TTS={on:false,q:[],i:0,tok:0};
const syn=window.speechSynthesis;
const $=id=>document.getElementById(id);
function ttsVisible(){return cur.mode=='study'||cur.tab=='guia'||cur.tab=='notes'}
function ttsLang(){return cur.tab=='guia'&&(st.glang||'en')=='es'?'es':'en'}
function fillVoices(){
  if(!syn)return;
  const lang=ttsLang(),vs=syn.getVoices().filter(x=>x.lang.toLowerCase().startsWith(lang));
  const rank=x=>/natural|neural|premium|enhanced|google|samantha|daniel|karen|moira|serena|monica|paulina/i.test(x.name)?0:1;
  vs.sort((a,b)=>rank(a)-rank(b)||a.name.localeCompare(b.name));
  const sel=$('tts-voice'),want=st['voice_'+lang];
  sel.innerHTML=vs.map(x=>`<option value="${x.name}" ${x.name==want?'selected':''}>${x.name} (${x.lang})</option>`).join('')||'<option value="">Default voice</option>';
}
function ttsBar(){
  const show=ttsVisible()&&!!syn;
  $('tts').hidden=!show;document.body.classList.toggle('has-tts',show);
  if(show){fillVoices();$('tts-rate').value=String(st.rate||1);$('tts-auto').checked=!!st.auto;$('tts-msg').textContent=cur.mode=='study'?'Reads the card aloud.':'Starts from the first paragraph on screen.'}
}
function ttsQueue(){
  const sel=cur.mode=='study'?'.card h3, .card .body p, .card .body li, .card .key':'.book h2, .book h3, .book h4, .book p, .book li, .book td';
  let els=[...v.querySelectorAll(sel)].filter(e=>!e.closest('.sub')&&!e.classList.contains('imgph')&&!e.querySelector('p,li')&&e.textContent.trim());
  let start=0;
  if(cur.mode!='study'){start=els.findIndex(e=>e.getBoundingClientRect().bottom>90);if(start<0)start=0}
  const q=[];
  els.slice(start).forEach(e=>{
    const txt=e.textContent.replace(/\s+/g,' ').trim();
    const parts=txt.length>220?(txt.match(/[^.!?;:]+[.!?;:]*\s*/g)||[txt]):[txt];
    parts.forEach(p=>{if(p.trim())q.push({e,t:p.trim()})});
  });
  return q;
}
function ttsClear(){v.querySelectorAll('.reading').forEach(e=>e.classList.remove('reading'))}
function ttsStop(){TTS.on=false;TTS.tok++;if(syn)syn.cancel();ttsClear();if($('tts-play'))$('tts-play').textContent='Listen'}
function ttsPause(){TTS.on=false;TTS.tok++;if(syn)syn.cancel();$('tts-play').textContent='Resume'}
function ttsStart(fresh){
  if(!syn)return;
  if(fresh||!TTS.q.length||TTS.i>=TTS.q.length){TTS.q=ttsQueue();TTS.i=0}
  if(!TTS.q.length)return;
  TTS.on=true;$('tts-play').textContent='Pause';ttsNext();
}
function ttsNext(){
  const tok=++TTS.tok;
  if(TTS.i>=TTS.q.length){ttsDone();return}
  const it=TTS.q[TTS.i];
  ttsClear();it.e.classList.add('reading');
  const r=it.e.getBoundingClientRect();if(r.top<70||r.bottom>innerHeight-130)it.e.scrollIntoView({block:'center',behavior:'smooth'});
  const u=new SpeechSynthesisUtterance(it.t),lang=ttsLang();
  const vs=syn.getVoices(),name=$('tts-voice').value,vo=vs.find(x=>x.name==name);
  if(vo)u.voice=vo;u.lang=vo?vo.lang:(lang=='es'?'es-AR':'en-US');u.rate=+$('tts-rate').value||1;
  u.onend=()=>{if(tok!=TTS.tok||!TTS.on)return;TTS.i++;ttsNext()};
  u.onerror=()=>{if(tok!=TTS.tok)return;TTS.on=false;$('tts-play').textContent='Listen'};
  syn.speak(u);
}
function ttsDone(){
  TTS.on=false;ttsClear();$('tts-play').textContent='Listen';TTS.q=[];
  if(!$('tts-auto').checked)return;
  if(cur.mode=='study'){const m=MD[cur.id];if(cur.c<m.cards.length-1){study(cur.id,cur.c+1);top();setTimeout(()=>ttsStart(true),250)}}
  else if(cur.tab=='notes'&&cur.ni<NOTES.length-1){notes(cur.ni+1);setTimeout(()=>ttsStart(true),250)}
}
if(syn){syn.onvoiceschanged=()=>{if(ttsVisible())fillVoices()};
  $('tts-play').addEventListener('click',()=>{TTS.on?ttsPause():ttsStart(false)});
  $('tts-stop').addEventListener('click',()=>{ttsStop();TTS.q=[]});
  $('tts-rate').addEventListener('change',e=>{st.rate=+e.target.value;save();if(TTS.on){ttsPause();ttsStart(false)}});
  $('tts-voice').addEventListener('change',e=>{st['voice_'+ttsLang()]=e.target.value;save();if(TTS.on){ttsPause();ttsStart(false)}});
  $('tts-auto').addEventListener('change',e=>{st.auto=e.target.checked;save()});
}
