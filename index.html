plejo, más allá del desarrollo de productos de software donde Scrum tiene sus raíces. A medida que se extiende el uso de Scrum, los desarrolladores, investigadores, analistas, científicos y otros especialistas hacen el trabajo. Usamos la palabra \"desarrolladores\" en Scrum no para excluir, sino para simplificar. Si obtiene valor de Scrum, considérese incluido."},{"t":"p","x":"A medida que se utiliza Scrum, se pueden encontrar, aplicar y diseñar patrones, procesos y enfoques que se ajusten al marco de trabajo Scrum como se describe en este documento. Su descripción va más allá del propósito de la Guía Scrum porque son sensibles al contexto y difieren ampliamente entre los usos de Scrum. Tales tácticas para usar dentro del marco de trabajo Scrum varían ampliamente y se describen en otra parte."},{"t":"p","x":"Ken Schwaber y Jeff Sutherland, Noviembre de 2020"},{"t":"h2","x":"Definición de Scrum"},{"t":"p","x":"Scrum es un marco de trabajo liviano que ayuda a las personas, equipos y organizaciones a generar valor a través de soluciones adaptativas para problemas complejos."},{"t":"p","x":"En pocas palabras, Scrum requiere un Scrum Master para fomentar un entorno donde:"},{"t":"ol","x":"Un Product Owner ordena el trabajo de un problema complejo en un Product Backlog."},{"t":"ol","x":"El Scrum Team convierte una selección del trabajo en un Increment de valor durante un Sprint."},{"t":"ol","x":"El Scrum Team y sus interesados inspeccionan los resultados y se adaptan para el próximo Sprint."},{"t":"ol","x":"Repita"},{"t":"p","x":"Scrum es simple. Pruébelo como está y determine si su filosofía, teoría y estructura ayudan a lograr objetivos y crear valor. El marco de trabajo Scrum es incompleto de manera intencional, solo define las partes necesarias para implementar la teoría de Scrum. Scrum se basa en la inteligencia colectiva de las personas que lo utilizan. En lugar de proporcionar a las personas instrucciones detalladas, las reglas de Scrum guían sus relaciones e interacciones."},{"t":"p","x":"En este marco de trabajo pueden emplearse varios procesos, técnicas y métodos. Scrum envuelve las prácticas existentes o las hace innecesarias. Scrum hace visible la eficacia relativa de las técnicas actuales de gestión, entorno y trabajo, de modo que se puedan realizar mejoras."},{"t":"h2","x":"Teoría de Scrum"},{"t":"p","x":"Scrum se basa en el empirismo y el pensamiento Lean. El empirismo afirma que el conocimiento proviene de la experiencia y de la toma de decisiones con base en lo observado. El pensamiento Lean reduce el desperdicio y se enfoca en lo esencial."},{"t":"p","x":"Scrum emplea un enfoque iterativo e Incremental para optimizar la previsibilidad y controlar el riesgo. Scrum involucra a grupos de personas que colectivamente tienen todas las habilidades y experiencia para hacer el trabajo y compartir o adquirir dichas habilidades según sea necesario."},{"t":"p","x":"Scrum combina cuatro eventos formales para inspección y adaptación dentro de un evento contenedor, el Sprint. Estos eventos funcionan porque implementan los pilares empíricos de Scrum de transparencia, inspección y adaptación."},{"t":"h3","x":"Transparencia"},{"t":"p","x":"El proceso y el trabajo emergentes deben ser visibles tanto para quienes realizan el trabajo como para quienes lo reciben. Con Scrum, las decisiones importantes se basan en el estado percibido de sus tres artefactos formales. Los artefactos que tienen poca transparencia pueden llevar a decisiones que disminuyan el valor y aumenten el riesgo."},{"t":"p","x":"La transparencia permite la inspección. La inspección sin transparencia es engañosa y derrochadora."},{"t":"h3","x":"Inspección"},{"t":"p","x":"Los artefactos de Scrum y el progreso hacia los objetivos acordados deben inspeccionarse con frecuencia y con diligencia para detectar variaciones o problemas potencialmente indeseables. Para ayudar con la inspección, Scrum proporciona cadencia en forma de sus cinco eventos."},{"t":"p","x":"La inspección permite la adaptación. La inspección sin adaptación se considera inútil. Los eventos Scrum están diseñados para provocar cambios."},{"t":"h3","x":"Adaptación"},{"t":"p","x":"Si algún aspecto de un proceso se desvía fuera de los límites aceptables o si el producto resultante es inaceptable, el proceso que se aplica o los materiales que se producen deben ajustarse. El ajuste debe realizarse lo antes posible para minimizar una mayor desviación."},{"t":"p","x":"La adaptación se vuelve más difícil cuando las personas involucradas no están empoderadas ni se autogestionan. Se espera que un Scrum Team se adapte en el momento en que aprenda algo nuevo a través de la inspección."},{"t":"h2","x":"Valores de Scrum"},{"t":"p","x":"El uso exitoso de Scrum depende de que las personas se vuelvan más competentes en vivir cinco valores: Compromiso, Foco, Franqueza, Respeto y Coraje"},{"t":"p","x":"El Scrum Team se compromete a lograr sus objetivos y a apoyarse mutuamente. Su foco principal está en el trabajo del Sprint para lograr el mejor progreso posible hacia estos objetivos. El Scrum Team y sus interesados son francos sobre el trabajo y los desafíos. Los miembros del Scrum Team se respetan entre sí para ser personas capaces e independientes, y son respetados como tales por las personas con las que trabajan. Los miembros del Scrum Team tienen el coraje de hacer lo correcto, para trabajar en problemas difíciles."},{"t":"p","x":"Estos valores dan dirección al Scrum Team con respecto a su trabajo, acciones y comportamiento. Las decisiones que se tomen, los pasos que se den y la forma en que se use Scrum deben reforzar estos valores, no disminuirlos ni socavarlos. Los miembros del Scrum Team aprenden y exploran los valores mientras trabajan con los eventos y artefactos Scrum. Cuando el Scrum Team y las personas con las que trabajan incorporan estos valores, los pilares empíricos de Scrum de transparencia, inspección y adaptación cobran vida y generan confianza."},{"t":"h2","x":"Scrum Team"},{"t":"p","x":"La unidad fundamental de Scrum es un pequeño equipo de personas, un Scrum Team. El Scrum Team consta de un Scrum Master, un Product Owner y Developers. Dentro de un Scrum Team, no hay subequipos ni jerarquías. Es una unidad cohesionada de profesionales enfocados en un objetivo a la vez, el Objetivo del Producto."},{"t":"p","x":"Los Scrum Teams son multifuncionales, lo que significa que los miembros tienen todas las habilidades necesarias para crear valor en cada Sprint. También se autogestionan, lo que significa que deciden internamente quién hace qué, cuándo y cómo."},{"t":"p","x":"El Scrum Team es lo suficientemente pequeño como para seguir siendo ágil y lo suficientemente grande como para completar un trabajo significativo dentro de un Sprint, generalmente 10 personas o menos. En general, hemos descubierto que los equipos más pequeños se comunican mejor y son más productivos. Si los Scrum Teams se vuelven demasiado grandes, deberían considerar reorganizarse en múltiples Scrum Teams cohesivos, cada uno enfocado en el mismo producto. Por lo tanto, deben compartir el mismo Objetivo del Producto, el Product Backlog y el Product Owner."},{"t":"p","x":"El Scrum Team es responsable de todas las actividades relacionadas con el producto, desde la colaboración de los interesados, la verificación, el mantenimiento, la operación, la experimentación, la investigación y el desarrollo, y cualquier otra cosa que pueda ser necesaria. Están estructurados y empoderados por la organización para gestionar su propio trabajo. Trabajar en Sprints a un ritmo sostenible mejora el enfoque y la consistencia del Scrum Team."},{"t":"p","x":"Todo el Scrum Team es responsable de crear un Increment valioso y útil en cada Sprint. Scrum define tres responsabilidades específicas dentro del Scrum Team: los Developers, el Product Owner y el Scrum Master."},{"t":"h3","x":"Developers"},{"t":"p","x":"Las personas del Scrum Team que se comprometen a crear cualquier aspecto de un Increment utilizable en cada Sprint son Developers."},{"t":"p","x":"Las habilidades específicas que necesitan los Developers suelen ser amplias y variarán según el ámbito de trabajo. Sin embargo, los Developers siempre son responsables de:"},{"t":"li","x":"Crear un plan para el Sprint, el Sprint Backlog;"},{"t":"li","x":"Inculcar calidad al adherirse a una Definición de Terminado;"},{"t":"li","x":"Adaptar su plan cada día hacia el Objetivo del Sprint; y,"},{"t":"li","x":"Responsabilizarse mutuamente como profesionales."},{"t":"h3","x":"Product Owner"},{"t":"p","x":"El Product Owner es responsable de maximizar el valor del producto resultante del trabajo del Scrum Team. La forma en que esto se hace puede variar ampliamente entre organizaciones, Scrum Teams e individuos."},{"t":"p","x":"El Product Owner también es responsable de la gestión efectiva del Product Backlog, lo que incluye:"},{"t":"li","x":"Desarrollar y comunicar explícitamente el Objetivo del Producto;"},{"t":"li","x":"Crear y comunicar claramente los elementos del Product Backlog;"},{"t":"li","x":"Ordenar los elementos del Product Backlog; y,"},{"t":"li","x":"Asegurarse de que el Product Backlog sea transparente, visible y se entienda."},{"t":"p","x":"El Product Owner puede realizar el trabajo anterior o puede delegar la responsabilidad en otros. Independientemente de ello, el Product Owner sigue siendo el responsable de que el trabajo se realice."},{"t":"p","x":"Para que los Product Owners tengan éxito, toda la organización debe respetar sus decisiones. Estas decisiones son visibles en el contenido y el orden del Product Backlog, y a través del Increment inspeccionable en la Sprint Review."},{"t":"p","x":"El Product Owner es una persona, no un comité. El Product Owner puede representar las necesidades de muchos interesados en el Product Backlog. Aquellos que quieran cambiar el Product Backlog pueden hacerlo intentando convencer al Product Owner."},{"t":"h3","x":"Scrum Master"},{"t":"p","x":"El Scrum Master es responsable de establecer Scrum como se define en la Guía de Scrum. Lo hace ayudando a todos a comprender la teoría y la práctica de Scrum, tanto dentro del Scrum Team como de la organización."},{"t":"p","x":"El Scrum Master es responsable de lograr la efectividad del Scrum Team. Lo hace apoyando al Scrum Team en la mejora de sus prácticas, dentro del marco de trabajo de Scrum."},{"t":"p","x":"Los Scrum Masters son verdaderos líderes que sirven al Scrum Team y a la organización en general."},{"t":"p","x":"El Scrum Master sirve al Scrum Team de varias maneras, que incluyen:"},{"t":"li","x":"Guiar a los miembros del equipo en ser autogestionados y multifuncionales;"},{"t":"li","x":"Ayudar al Scrum Team a enfocarse en crear Increments de alto valor que cumplan con la Definición de Terminado;"},{"t":"li","x":"Procurar la eliminación de impedimentos para el progreso del Scrum Team; y,"},{"t":"li","x":"Asegurarse de que todos los eventos de Scrum se lleven a cabo y sean positivos, productivos y se mantengan dentro de los límites de tiempo recomendados en esta Guía."},{"t":"p","x":"El Scrum Master sirve al Product Owner de varias maneras, que incluyen:"},{"t":"li","x":"Ayudar a encontrar técnicas para una definición efectiva de Objetivos del Producto y la gestión del Product Backlog;"},{"t":"li","x":"Ayudar al Scrum Team a comprender la necesidad de tener elementos del Product Backlog claros y concisos;"},{"t":"li","x":"Ayudar a establecer una planificación empírica de productos para un entorno complejo; y,"},{"t":"li","x":"Facilitar la colaboración de los interesados según se solicite o necesite."},{"t":"p","x":"El Scrum Master sirve a la organización de varias maneras, que incluyen:"},{"t":"li","x":"Liderar, capacitar y guiar a la organización en su adopción de Scrum;"},{"t":"li","x":"Planificar y asesorar implementaciones de Scrum dentro de la organización;"},{"t":"li","x":"Ayudar a los empleados y los interesados a comprender y aplicar un enfoque empírico para el trabajo complejo; y,"},{"t":"li","x":"Eliminar las barreras entre los interesados y los Scrum Teams."},{"t":"h2","x":"Eventos de Scrum"},{"t":"p","x":"El Sprint es un contenedor para todos los demás eventos. Cada evento en Scrum es una oportunidad formal para inspeccionar y adaptar los artefactos Scrum. Estos eventos están diseñados específicamente para habilitar la transparencia requerida. No operar cualquier evento según lo prescrito resulta en la pérdida de oportunidades para inspeccionar y adaptarse. Los eventos se utilizan en Scrum para crear regularidad y minimizar la necesidad de reuniones no definidas en Scrum. Lo óptimo es que todos los eventos se celebren al mismo tiempo y en el mismo lugar para reducir la complejidad."},{"t":"h3","x":"El Sprint"},{"t":"p","x":"Los Sprints son el corazón de Scrum, donde las ideas se convierten en valor."},{"t":"p","x":"Son eventos de duración fija de un mes o menos para crear consistencia. Un nuevo Sprint comienza inmediatamente después de la conclusión del Sprint anterior."},{"t":"p","x":"Todo el trabajo necesario para lograr el Objetivo del Producto, incluido la Sprint Planning, Daily Scrums, Sprint Review y Sprint Retrospective, ocurre dentro de los Sprints."},{"t":"p","x":"Durante el Sprint:"},{"t":"li","x":"No se realizan cambios que pongan en peligro el Objetivo del Sprint;"},{"t":"li","x":"La calidad no disminuye;"},{"t":"li","x":"El Product Backlog se refina según sea necesario; y,"},{"t":"li","x":"El alcance se puede aclarar y renegociar con el Product Owner a medida que se aprende más."},{"t":"p","x":"Los Sprints permiten la previsibilidad al garantizar la inspección y adaptación del progreso hacia un Objetivo del Producto al menos cada mes calendario. Cuando el horizonte de un Sprint es demasiado largo, el Objetivo del Sprint puede volverse inválido, la complejidad puede crecer y el riesgo puede aumentar. Se pueden emplear Sprints más cortos para generar más ciclos de aprendizaje y limitar el riesgo de costo y esfuerzo a un período de tiempo menor. Cada Sprint puede considerarse un proyecto corto."},{"t":"p","x":"Existen varias prácticas para pronosticar el progreso, como el trabajo pendiente (burn‐downs), trabajo completado (burn‐ups) o flujos acumulativos (cumulative flows). Si bien han demostrado su utilidad, no reemplazan la importancia del empirismo. En entornos complejos, se desconoce lo que sucederá. Solo lo que ya ha sucedido se puede utilizar para la toma de decisiones con miras al futuro."},{"t":"p","x":"Un Sprint podría cancelarse si el Objetivo del Sprint se vuelve obsoleto. Solo el Product Owner tiene la autoridad para cancelar el Sprint."},{"t":"h3","x":"Sprint Planning"},{"t":"p","x":"La Sprint Planning inicia el Sprint al establecer el trabajo que se realizará para el Sprint. El Scrum Team crea este plan resultante mediante trabajo colaborativo."},{"t":"p","x":"El Product Owner se asegura de que los asistentes estén preparados para discutir los elementos más importantes del Product Backlog y cómo se relacionan con el Objetivo del Producto. El Scrum Team también puede invitar a otras personas a asistir a la Sprint Planning para brindar asesoramiento."},{"t":"p","x":"La Sprint Planning aborda los siguientes temas:"},{"t":"h4","x":"Tema uno: ¿Por qué es valioso este Sprint?"},{"t":"p","x":"El Product Owner propone cómo el producto podría Incrementar su valor y utilidad en el Sprint actual. Luego, todo el Scrum Team colabora para definir un Objetivo del Sprint que comunica por qué el Sprint es valioso para los interesados. El Objetivo del Sprint debe completarse antes de que termine la Sprint Planning."},{"t":"h4","x":"Tema dos: ¿Qué se puede hacer en este Sprint?"},{"t":"p","x":"A través de una conversación con el Product Owner, los Developers seleccionan elementos del Product Backlog para incluirlos en el Sprint actual. El Scrum Team puede refinar estos elementos durante este proceso, lo que aumenta la comprensión y la confianza."},{"t":"p","x":"Seleccionar cuánto se puede completar dentro de un Sprint puede ser un desafío. Sin embargo, cuanto más sepan los Developers sobre su desempeño pasado, su capacidad actual y su Definición de Terminado, más confiados estarán en sus pronósticos para el Sprint."},{"t":"h4","x":"Tema tres: ¿Cómo se realizará el trabajo elegido?"},{"t":"p","x":"Para cada elemento del Product Backlog seleccionado, los Developers planifican el trabajo necesario para crear un Increment que cumpla con la Definición de Terminado. A menudo, esto se hace descomponiendo los elementos del Product Backlog en elementos de trabajo más pequeños de un día o menos. La forma de hacerlo queda a criterio exclusivo de los Developers. Nadie más les dice cómo convertir los elementos del Product Backlog en Increments de valor."},{"t":"p","x":"El Objetivo del Sprint, los elementos del Product Backlog seleccionados para el Sprint, más el plan para entregarlos se denominan juntos Sprint Backlog."},{"t":"p","x":"La Sprint Planning tiene un límite de tiempo de máximo ocho horas para un Sprint de un mes. Para Sprints más cortos, el evento suele ser de menor duración."},{"t":"h3","x":"Daily Scrum"},{"t":"p","x":"El propósito de la Daily Scrum es inspeccionar el progreso hacia el Objetivo del Sprint y adaptar el Sprint Backlog según sea necesario, ajustando el trabajo planificado entrante."},{"t":"p","x":"La Daily Scrum es un evento de 15 minutos para los Developers del Scrum Team. Para reducir la complejidad, se lleva a cabo a la misma hora y en el mismo lugar todos los días hábiles del Sprint. Si el Product Owner o Scrum Master están trabajando activamente en elementos del Sprint Backlog, participan como Developers."},{"t":"p","x":"Los Developers pueden seleccionar la estructura y las técnicas que deseen, siempre que su Daily Scrum se centre en el progreso hacia el Objetivo del Sprint y produzca un plan viable para el siguiente día de trabajo. Esto crea enfoque y mejora la autogestión."},{"t":"p","x":"Las Daily Scrums mejoran la comunicación, identifican impedimentos, promueven la toma rápida de decisiones y, en consecuencia, eliminan la necesidad de otras reuniones."},{"t":"p","x":"La Daily Scrum no es el único momento en el que los Developers pueden ajustar su plan. A menudo se reúnen durante el día para discusiones más detalladas sobre cómo adaptar o volver a planificar el resto del trabajo del Sprint."},{"t":"h3","x":"Sprint Review"},{"t":"p","x":"El propósito de la Sprint Review es inspeccionar el resultado del Sprint y determinar futuras adaptaciones. El Scrum Team presenta los resultados de su trabajo a los interesados clave y se discute el progreso hacia el Objetivo del Producto."},{"t":"p","x":"Durante el evento, el Scrum Team y los interesados revisan lo que se logró en el Sprint y lo que ha cambiado en su entorno. Con base en esta información, los asistentes colaboran sobre qué hacer a continuación. El Product Backlog también se puede ajustar para satisfacer nuevas oportunidades. La Sprint Review es una sesión de trabajo y el Scrum Team debe evitar limitarla a una presentación."},{"t":"p","x":"La Sprint Review es el penúltimo evento del Sprint y tiene un límite de tiempo de máximo cuatro horas para un Sprint de un mes. Para Sprints más cortos, el evento suele ser de menor duración."},{"t":"h3","x":"Sprint Retrospective"},{"t":"p","x":"El propósito de la Sprint Retrospective es planificar formas de aumentar la calidad y la efectividad."},{"t":"p","x":"El Scrum Team inspecciona cómo fue el último Sprint con respecto a las personas, las interacciones, los procesos, las herramientas y su Definición de Terminado. Los elementos inspeccionados suelen variar según el ámbito del trabajo. Se identifican los supuestos que los llevaron por mal camino y se exploran sus orígenes. El Scrum Team analiza qué salió bien durante el Sprint, qué problemas encontró y cómo se resolvieron (o no) esos problemas."},{"t":"p","x":"El Scrum Team identifica los cambios más útiles para mejorar su efectividad. Las mejoras más impactantes se abordan lo antes posible. Incluso se pueden agregar al Sprint Backlog para el próximo Sprint."},{"t":"p","x":"La Sprint Retrospective concluye el Sprint. Tiene un tiempo limitado a máximo tres horas para un Sprint de un mes. Para Sprints más cortos, el evento suele ser de menor duración."},{"t":"h2","x":"Artefactos de Scrum"},{"t":"p","x":"Los artefactos de Scrum representan trabajo o valor. Están diseñados para maximizar la transparencia de la información clave. Por lo tanto, todas las personas que los inspeccionan tienen la misma base de adaptación."},{"t":"p","x":"Cada artefacto contiene un compromiso para garantizar que proporcione información que mejore la transparencia y el enfoque frente al cual se pueda medir el progreso:"},{"t":"li","x":"Para el Product Backlog, es el Objetivo del Producto."},{"t":"li","x":"Para el Sprint Backlog, es el Objetivo del Sprint."},{"t":"li","x":"Para el Increment es la Definición de Terminado."},{"t":"p","x":"Estos compromisos existen para reforzar el empirismo y los valores de Scrum para el Scrum Team y sus interesados."},{"t":"h3","x":"Product Backlog"},{"t":"p","x":"El Product Backlog es una lista emergente y ordenada de lo que se necesita para mejorar el producto. Es la única fuente del trabajo realizado por el Scrum Team."},{"t":"p","x":"Los elementos del Product Backlog que el Scrum Team puede dar por Terminados dentro de un Sprint se consideran preparados para ser seleccionados en un evento de Sprint Planning. Suelen adquirir este grado de transparencia tras las actividades de refinamiento. El refinamiento del Product Backlog es el acto de dividir y definir aún más los elementos del Product Backlog en elementos más pequeños y precisos. Esta es una actividad continua para agregar detalles, como una descripción, orden y tamaño. Los atributos suelen variar según el ámbito del trabajo."},{"t":"p","x":"Los Developers que realizarán el trabajo son responsables del dimensionamiento. El Product Owner puede influir en los Developers ayudándolos a entender y seleccionar sus mejores alternativas."},{"t":"h4","x":"Compromiso: Objetivo del Producto"},{"t":"p","x":"El Objetivo del Producto describe un estado futuro del producto que puede servir como un objetivo para que el Scrum Team planifique. El Objetivo del Producto está en el Product Backlog. El resto del Product Backlog emerge para definir \"qué\" cumplirá con el Objetivo del Producto."},{"t":"p","x":"Un producto es un vehículo para entregar valor. Tiene un límite claro, personas interesadas conocidas, usuarios o clientes bien definidos. Un producto puede ser un servicio, un producto físico o algo más abstracto."},{"t":"p","x":"El Objetivo del Producto es el objetivo a largo plazo del Scrum Team. Ellos deben cumplir (o abandonar) un objetivo antes de asumir el siguiente."},{"t":"h3","x":"Sprint Backlog"},{"t":"p","x":"El Sprint Backlog se compone del Objetivo del Sprint (por qué), el conjunto de elementos del Product Backlog seleccionados para el Sprint (qué), así como un plan de acción para entregar el Increment (cómo)."},{"t":"p","x":"El Sprint Backlog es un plan realizado por y para los Developers. Es una imagen muy visible y en tiempo real del trabajo que los Developers planean realizar durante el Sprint para lograr el Objetivo del Sprint. En consecuencia, el Sprint Backlog se actualiza a lo largo del Sprint a medida que se aprende más. Debe tener suficientes detalles para que puedan inspeccionar su progreso en la Daily Scrum."},{"t":"h4","x":"Compromiso: Objetivo del Sprint"},{"t":"p","x":"El Objetivo del Sprint es el único propósito del Sprint. Si bien el Objetivo del Sprint es un compromiso de los Developers, proporciona flexibilidad en términos del trabajo exacto necesario para lograrlo. El Objetivo del Sprint también crea coherencia y enfoque, lo que alienta al Scrum Team a trabajar en conjunto en lugar de en iniciativas separadas."},{"t":"p","x":"El Objetivo del Sprint se crea durante el evento Sprint Planning y se agrega al Sprint Backlog. Mientras los Developers trabajan durante el Sprint, tienen en mente el Objetivo del Sprint. Si el trabajo resulta ser diferente de lo que esperaban, colaboran con el Product Owner para negociar el alcance del Sprint Backlog dentro del Sprint sin afectar el Objetivo del Sprint."},{"t":"h3","x":"Increment"},{"t":"p","x":"Un Increment es un peldaño concreto hacia el Objetivo del Producto. Cada Increment se suma a todos los Increments anteriores y se verifica minuciosamente, lo que garantiza que todos los Increments funcionen juntos. Para proporcionar valor, el Increment debe ser utilizable."},{"t":"p","x":"Se pueden crear múltiples Increments dentro de un Sprint. La suma de los Increments se presenta en la Sprint Review apoyando así el empirismo. Sin embargo, se puede entregar un Increment a los interesados antes del final del Sprint. La Sprint Review nunca debe considerarse una puerta para liberar valor."},{"t":"p","x":"El trabajo no puede considerarse parte de un Increment a menos que cumpla con la Definición de Terminado."},{"t":"h4","x":"Compromiso: Definición de Terminado"},{"t":"p","x":"La Definición de Terminado es una descripción formal del estado del Increment cuando cumple con las medidas de calidad requeridas para el producto."},{"t":"p","x":"En el momento en que un elemento del Product Backlog cumple con la Definición de Terminado, nace un Increment."},{"t":"p","x":"La Definición de Terminado crea transparencia al brindar a todos un entendimiento compartido de qué trabajo se completó como parte del Increment. Si un elemento del Product Backlog no cumple con la Definición de Terminado, no se puede publicar ni presentar en la Sprint Review. En su lugar, vuelve al Product Backlog para su consideración futura."},{"t":"p","x":"Si la Definición de Terminado para un Increment es parte de los estándares de la organización, todos los Scrum Teams deben seguirla como mínimo. Si no es un estándar organizacional, el Scrum Team debe crear una Definición de Terminado apropiada para el producto."},{"t":"p","x":"Los Developers deben adherirse a la Definición de Terminado. Si hay varios Scrum Teams trabajando juntos en un producto, deben definir y cumplir mutuamente la misma Definición de Terminado."},{"t":"h2","x":"Nota final"},{"t":"p","x":"Scrum es gratuito y se ofrece en esta Guía. El marco de trabajo Scrum, como se describe aquí, es inmutable. Si bien es posible implementar solo partes de Scrum, el resultado no es Scrum. Scrum existe solo en su totalidad y funciona bien como un contenedor para otras técnicas, metodologías y prácticas."},{"t":"h3","x":"Agradecimientos"},{"t":"h4","x":"Personas"},{"t":"p","x":"De los miles de personas que han contribuido a Scrum, debemos destacar a las que fueron fundamentales al principio: Jeff Sutherland trabajó con Jeff McKenna y John Scumniotales, y Ken Schwaber trabajó con Mike Smith y Chris Martin, y todos ellos trabajaron juntos. Muchos otros contribuyeron en los años siguientes y sin su ayuda Scrum no estaría refinado como lo está hoy."},{"t":"h4","x":"Historia de la Guía de Scrum"},{"t":"p","x":"Ken Schwaber y Jeff Sutherland copresentaron Scrum por primera vez en la Conferencia OOPSLA en"},{"t":"ol","x":"Básicamente, documentó el aprendizaje que Ken y Jeff adquirieron en los años anteriores y publicó la primera definición formal de Scrum."},{"t":"p","x":"La Guía de Scrum documenta Scrum como se ha desarrollado, evolucionado y sostenido durante más de 30 años por Jeff Sutherland y Ken Schwaber. Otras fuentes proporcionan patrones, procesos y enfoques que complementan el marco de trabajo Scrum. Estos pueden aumentar la productividad, el valor, la creatividad y la satisfacción con los resultados."},{"t":"p","x":"La historia completa de Scrum se describe en otros lugares. Para honrar los primeros sitios donde se probó y comprobó, reconocemos a Individual Inc., Newspage, Fidelity Investments e IDX (ahora GE Medical)."},{"t":"h4","x":"Traducción"},{"t":"p","x":"Esta guía ha sido traducida de la versión original en inglés proporcionada por Ken Schwaber y Jeff Sutherland. Las personas que han contribuido en la traducción son: Marcelo López, Marcelo García, Jorge Abad, Fabian Schwartz y Lucho Salazar. Información de contacto: Nombre: Lucho Salazar Correo electrónico: lucho.salazar@gmail.com Sitio Web: http://www.gazafatonarioit.com LinkedIn: http://www.linkedin.com/in/luchosalazar"},{"t":"h2","x":"Cambios de la Guía Scrum 2017 a la Guía Scrum 2020"},{"t":"h3","x":"Aún menos prescriptiva"},{"t":"p","x":"A lo largo de los años, la Guía Scrum comenzó a ser un poco más prescriptiva. La versión 2020 tenía como objetivo que Scrum volviera a ser un marco de trabajo mínimamente suficiente al eliminar o suavizar el lenguaje prescriptivo. Por ejemplo, eliminó las preguntas de la Daily Scrum, suavizó el lenguaje sobre los atributos de los PBI, suavizó el lenguaje sobre los elementos retro en el Sprint Backlog, acortó la sección de cancelación de Sprint y más."},{"t":"h3","x":"Un equipo, enfocado en un producto"},{"t":"p","x":"El objetivo era eliminar el concepto de un equipo separado dentro de un equipo que ha llevado a un comportamiento de \"proxy\" o de \"nosotros y ellos\" entre el PO y el Equipo de Desarrollo. Ahora solo hay un Scrum Team enfocado en el mismo objetivo, con tres diferentes conjuntos de responsabilidades: PO, SM y Developers."},{"t":"h3","x":"Introducción del Objetivo del Producto"},{"t":"p","x":"La Guía Scrum 2020 introduce el concepto de Objetivo del Producto para proporcionar enfoque al Scrum Team hacia un objetivo valioso más grande. Cada Sprint debería acercar el producto al Objetivo del Producto general."},{"t":"p","x":"Un hogar para el Objetivo del Sprint, la Definición de Terminado y el Objetivo del Producto Las Guías Scrum anteriores describían el Objetivo del Sprint y la Definición de Terminado sin realmente darles una identidad. No eran del todo artefactos, pero estaban algo unidos a los artefactos. Con la incorporación del Objetivo del Producto, la versión 2020 proporciona más claridad al respecto. Cada uno de los tres artefactos ahora contiene \"compromisos\" con ellos. Para el Product Backlog es el Objetivo del Producto, el Sprint Backlog tiene el Objetivo del Sprint y el Increment tiene la Definición de Terminado (ahora sin las comillas). Existen para aportar transparencia y enfocarse en el progreso de cada artefacto."},{"t":"h3","x":"Autogestión sobre autoorganización"},{"t":"p","x":"Las Guías Scrum anteriores se referían a los Equipos de Desarrollo como autoorganizados, eligiendo quién y cómo hacer el trabajo. Con un enfoque más en el Scrum Team, la versión 2020 enfatiza un Scrum Team autogestionado, eligiendo quién, cómo y en qué trabajar."},{"t":"h3","x":"Tres temas de la Sprint Planning"},{"t":"p","x":"Además de los temas de la Sprint Planning de \"Qué\" y \"Cómo\", la Guía de Scrum 2020 pone énfasis en un tercer tema, \"Por qué\", en referencia al Objetivo del Sprint."},{"t":"h3","x":"Simplificación general del lenguaje para una audiencia más amplia"},{"t":"p","x":"La Guía Scrum 2020 ha hecho hincapié en eliminar declaraciones redundantes y complejas, así como en eliminar cualquier inferencia restante al trabajo de TI (por ejemplo, pruebas, sistema, diseño, requisito, etc.). La Guía Scrum ahora tiene menos de 13 páginas."}],"en":[{"t":"h2","x":"Purpose of the Scrum Guide"},{"t":"p","x":"We developed Scrum in the early 1990s. We wrote the first version of the Scrum Guide in 2010 to help people worldwide understand Scrum. We have evolved the Guide since then through small, functional updates. Together, we stand behind it."},{"t":"p","x":"The Scrum Guide contains the definition of Scrum. Each element of the framework serves a specific purpose that is essential to the overall value and results realized with Scrum. Changing the core design or ideas of Scrum, leaving out elements, or not following the rules of Scrum, covers up problems and limits the benefits of Scrum, potentially even rendering it useless."},{"t":"p","x":"We follow the growing use of Scrum within an ever-growing complex world. We are humbled to see Scrum being adopted in many domains holding essentially complex work, beyond software product development where Scrum has its roots. As Scrum’s use spreads, developers, researchers, analysts, scientists, and other specialists do the work. We use the word “developers” in Scrum not to exclude, but to simplify. If you get value from Scrum, consider yourself included."},{"t":"p","x":"As Scrum is being used, patterns, processes, and insights that fit the Scrum framework as described in this document, may be found, applied and devised. Their description is beyond the purpose of the Scrum Guide because they are context sensitive and differ widely between Scrum uses. Such tactics for using within the Scrum framework vary widely and are described elsewhere."},{"t":"p","x":"Ken Schwaber & Jeff Sutherland November 2020"},{"t":"h2","x":"Scrum Definition"},{"t":"p","x":"Scrum is a lightweight framework that helps people, teams and organizations generate value through adaptive solutions for complex problems."},{"t":"p","x":"In a nutshell, Scrum requires a Scrum Master to foster an environment where:"},{"t":"ol","x":"A Product Owner orders the work for a complex problem into a Product Backlog."},{"t":"ol","x":"The Scrum Team turns a selection of the work into an Increment of value during a Sprint."},{"t":"ol","x":"The Scrum Team and its stakeholders inspect the results and adjust for the next Sprint."},{"t":"ol","x":"Repeat"},{"t":"p","x":"Scrum is simple. Try it as is and determine if its philosophy, theory, and structure help to achieve goals and create value. The Scrum framework is purposefully incomplete, only defining the parts required to implement Scrum theory. Scrum is built upon by the collective intelligence of the people using it. Rather than provide people with detailed instructions, the rules of Scrum guide their relationships and interactions."},{"t":"p","x":"Various processes, techniques and methods can be employed within the framework. Scrum wraps around existing practices or renders them unnecessary. Scrum makes visible the relative efficacy of current management, environment, and work techniques, so that improvements can be made."},{"t":"h2","x":"Scrum Theory"},{"t":"p","x":"Scrum is founded on empiricism and lean thinking. Empiricism asserts that knowledge comes from experience and making decisions based on what is observed. Lean thinking reduces waste and focuses on the essentials."},{"t":"p","x":"Scrum employs an iterative, incremental approach to optimize predictability and to control risk. Scrum engages groups of people who collectively have all the skills and expertise to do the work and share or acquire such skills as needed."},{"t":"p","x":"Scrum combines four formal events for inspection and adaptation within a containing event, the Sprint. These events work because they implement the empirical Scrum pillars of transparency, inspection, and adaptation."},{"t":"h3","x":"Transparency"},{"t":"p","x":"The emergent process and work must be visible to those performing the work as well as those receiving the work. With Scrum, important decisions are based on the perceived state of its three formal artifacts. Artifacts that have low transparency can lead to decisions that diminish value and increase risk."},{"t":"p","x":"Transparency enables inspection. Inspection without transparency is misleading and wasteful."},{"t":"h3","x":"Inspection"},{"t":"p","x":"The Scrum artifacts and the progress toward agreed goals must be inspected frequently and diligently to detect potentially undesirable variances or problems. To help with inspection, Scrum provides cadence in the form of its five events."},{"t":"p","x":"Inspection enables adaptation. Inspection without adaptation is considered pointless. Scrum events are designed to provoke change."},{"t":"h3","x":"Adaptation"},{"t":"p","x":"If any aspects of a process deviate outside acceptable limits or if the resulting product is unacceptable, the process being applied or the materials being produced must be adjusted. The adjustment must be made as soon as possible to minimize further deviation."},{"t":"p","x":"Adaptation becomes more difficult when the people involved are not empowered or self-managing. A Scrum Team is expected to adapt the moment it learns anything new through inspection."},{"t":"h2","x":"Scrum Values"},{"t":"p","x":"Successful use of Scrum depends on people becoming more proficient in living five values: Commitment, Focus, Openness, Respect, and Courage"},{"t":"p","x":"The Scrum Team commits to achieving its goals and to supporting each other. Their primary focus is on the work of the Sprint to make the best possible progress toward these goals. The Scrum Team and its stakeholders are open about the work and the challenges. Scrum Team members respect each other to be capable, independent people, and are respected as such by the people with whom they work. The Scrum Team members have the courage to do the right thing, to work on tough problems."},{"t":"p","x":"These values give direction to the Scrum Team with regard to their work, actions, and behavior. The decisions that are made, the steps taken, and the way Scrum is used should reinforce these values, not diminish or undermine them. The Scrum Team members learn and explore the values as they work with the Scrum events and artifacts. When these values are embodied by the Scrum Team and the people they work with, the empirical Scrum pillars of transparency, inspection, and adaptation come to life building trust."},{"t":"h2","x":"Scrum Team"},{"t":"p","x":"The fundamental unit of Scrum is a small team of people, a Scrum Team. The Scrum Team consists of one Scrum Master, one Product Owner, and Developers. Within a Scrum Team, there are no sub-teams or hierarchies. It is a cohesive unit of professionals focused on one objective at a time, the Product Goal."},{"t":"p","x":"Scrum Teams are cross-functional, meaning the members have all the skills necessary to create value each Sprint. They are also self-managing, meaning they internally decide who does what, when, and how."},{"t":"p","x":"The Scrum Team is small enough to remain nimble and large enough to complete significant work within a Sprint, typically 10 or fewer people. In general, we have found that smaller teams communicate better and are more productive. If Scrum Teams become too large, they should consider reorganizing into multiple cohesive Scrum Teams, each focused on the same product. Therefore, they should share the same Product Goal, Product Backlog, and Product Owner."},{"t":"p","x":"The Scrum Team is responsible for all product-related activities from stakeholder collaboration, verification, maintenance, operation, experimentation, research and development, and anything else that might be required. They are structured and empowered by the organization to manage their own work. Working in Sprints at a sustainable pace improves the Scrum Team’s focus and consistency."},{"t":"p","x":"The entire Scrum Team is accountable for creating a valuable, useful Increment every Sprint. Scrum defines three specific accountabilities within the Scrum Team: the Developers, the Product Owner, and the Scrum Master."},{"t":"h3","x":"Developers"},{"t":"p","x":"Developers are the people in the Scrum Team that are committed to creating any aspect of a usable Increment each Sprint."},{"t":"p","x":"The specific skills needed by the Developers are often broad and will vary with the domain of work. However, the Developers are always accountable for:"},{"t":"li","x":"Creating a plan for the Sprint, the Sprint Backlog;"},{"t":"li","x":"Instilling quality by adhering to a Definition of Done;"},{"t":"li","x":"Adapting their plan each day toward the Sprint Goal; and,"},{"t":"li","x":"Holding each other accountable as professionals."},{"t":"h3","x":"Product Owner"},{"t":"p","x":"The Product Owner is accountable for maximizing the value of the product resulting from the work of the Scrum Team. How this is done may vary widely across organizations, Scrum Teams, and individuals."},{"t":"p","x":"The Product Owner is also accountable for effective Product Backlog management, which includes:"},{"t":"li","x":"Developing and explicitly communicating the Product Goal;"},{"t":"li","x":"Creating and clearly communicating Product Backlog items;"},{"t":"li","x":"Ordering Product Backlog items; and,"},{"t":"li","x":"Ensuring that the Product Backlog is transparent, visible and understood."},{"t":"p","x":"The Product Owner may do the above work or may delegate the responsibility to others. Regardless, the Product Owner remains accountable."},{"t":"p","x":"For Product Owners to succeed, the entire organization must respect their decisions. These decisions are visible in the content and ordering of the Product Backlog, and through the inspectable Increment at the Sprint Review."},{"t":"p","x":"The Product Owner is one person, not a committee. The Product Owner may represent the needs of many stakeholders in the Product Backlog. Those wanting to change the Product Backlog can do so by trying to convince the Product Owner."},{"t":"h3","x":"Scrum Master"},{"t":"p","x":"The Scrum Master is accountable for establishing Scrum as defined in the Scrum Guide. They do this by helping everyone understand Scrum theory and practice, both within the Scrum Team and the organization."},{"t":"p","x":"The Scrum Master is accountable for the Scrum Team’s effectiveness. They do this by enabling the Scrum Team to improve its practices, within the Scrum framework."},{"t":"p","x":"Scrum Masters are true leaders who serve the Scrum Team and the larger organization."},{"t":"p","x":"The Scrum Master serves the Scrum Team in several ways, including:"},{"t":"li","x":"Coaching the team members in self-management and cross-functionality;"},{"t":"li","x":"Helping the Scrum Team focus on creating high-value Increments that meet the Definition of Done;"},{"t":"li","x":"Causing the removal of impediments to the Scrum Team’s progress; and,"},{"t":"li","x":"Ensuring that all Scrum events take place and are positive, productive, and kept within the timebox."},{"t":"p","x":"The Scrum Master serves the Product Owner in several ways, including:"},{"t":"li","x":"Helping find techniques for effective Product Goal definition and Product Backlog management;"},{"t":"li","x":"Helping the Scrum Team understand the need for clear and concise Product Backlog items;"},{"t":"li","x":"Helping establish empirical product planning for a complex environment; and,"},{"t":"li","x":"Facilitating stakeholder collaboration as requested or needed."},{"t":"p","x":"The Scrum Master serves the organization in several ways, including:"},{"t":"li","x":"Leading, training, and coaching the organization in its Scrum adoption;"},{"t":"li","x":"Planning and advising Scrum implementations within the organization;"},{"t":"li","x":"Helping employees and stakeholders understand and enact an empirical approach for complex work; and,"},{"t":"li","x":"Removing barriers between stakeholders and Scrum Teams."},{"t":"h2","x":"Scrum Events"},{"t":"p","x":"The Sprint is a container for all other events. Each event in Scrum is a formal opportunity to inspect and adapt Scrum artifacts. These events are specifically designed to enable the transparency required. Failure to operate any events as prescribed results in lost opportunities to inspect and adapt. Events are used in Scrum to create regularity and to minimize the need for meetings not defined in Scrum. Optimally, all events are held at the same time and place to reduce complexity."},{"t":"h3","x":"The Sprint"},{"t":"p","x":"Sprints are the heartbeat of Scrum, where ideas are turned into value."},{"t":"p","x":"They are fixed length events of one month or less to create consistency. A new Sprint starts immediately after the conclusion of the previous Sprint."},{"t":"p","x":"All the work necessary to achieve the Product Goal, including Sprint Planning, Daily Scrums, Sprint Review, and Sprint Retrospective, happen within Sprints."},{"t":"p","x":"During the Sprint:"},{"t":"li","x":"No changes are made that would endanger the Sprint Goal;"},{"t":"li","x":"Quality does not decrease;"},{"t":"li","x":"The Product Backlog is refined as needed; and,"},{"t":"li","x":"Scope may be clarified and renegotiated with the Product Owner as more is learned."},{"t":"p","x":"Sprints enable predictability by ensuring inspection and adaptation of progress toward a Product Goal at least every calendar month. When a Sprint’s horizon is too long the Sprint Goal may become invalid, complexity may rise, and risk may increase. Shorter Sprints can be employed to generate more learning cycles and limit risk of cost and effort to a smaller time frame. Each Sprint may be considered a short project."},{"t":"p","x":"Various practices exist to forecast progress, like burn-downs, burn-ups, or cumulative flows. While proven useful, these do not replace the importance of empiricism. In complex environments, what will happen is unknown. Only what has already happened may be used for forward-looking decision making."},{"t":"p","x":"A Sprint could be cancelled if the Sprint Goal becomes obsolete. Only the Product Owner has the authority to cancel the Sprint."},{"t":"h3","x":"Sprint Planning"},{"t":"p","x":"Sprint Planning initiates the Sprint by laying out the work to be performed for the Sprint. This resulting plan is created by the collaborative work of the entire Scrum Team."},{"t":"p","x":"The Product Owner ensures that attendees are prepared to discuss the most important Product Backlog items and how they map to the Product Goal. The Scrum Team may also invite other people to attend Sprint Planning to provide advice."},{"t":"p","x":"Sprint Planning addresses the following topics:"},{"t":"h4","x":"Topic One: Why is this Sprint valuable?"},{"t":"p","x":"The Product Owner proposes how the product could increase its value and utility in the current Sprint. The whole Scrum Team then collaborates to define a Sprint Goal that communicates why the Sprint is valuable to stakeholders. The Sprint Goal must be finalized prior to the end of Sprint Planning."},{"t":"h4","x":"Topic Two: What can be Done this Sprint?"},{"t":"p","x":"Through discussion with the Product Owner, the Developers select items from the Product Backlog to include in the current Sprint. The Scrum Team may refine these items during this process, which increases understanding and confidence."},{"t":"p","x":"Selecting how much can be completed within a Sprint may be challenging. However, the more the Developers know about their past performance, their upcoming capacity, and their Definition of Done, the more confident they will be in their Sprint forecasts."},{"t":"h4","x":"Topic Three: How will the chosen work get done?"},{"t":"p","x":"For each selected Product Backlog item, the Developers plan the work necessary to create an Increment that meets the Definition of Done. This is often done by decomposing Product Backlog items into smaller work items of one day or less. How this is done is at the sole discretion of the Developers. No one else tells them how to turn Product Backlog items into Increments of value."},{"t":"p","x":"The Sprint Goal, the Product Backlog items selected for the Sprint, plus the plan for delivering them are together referred to as the Sprint Backlog."},{"t":"p","x":"Sprint Planning is timeboxed to a maximum of eight hours for a one-month Sprint. For shorter Sprints, the event is usually shorter."},{"t":"h3","x":"Daily Scrum"},{"t":"p","x":"The purpose of the Daily Scrum is to inspect progress toward the Sprint Goal and adapt the Sprint Backlog as necessary, adjusting the upcoming planned work."},{"t":"p","x":"The Daily Scrum is a 15-minute event for the Developers of the Scrum Team. To reduce complexity, it is held at the same time and place every working day of the Sprint. If the Product Owner or Scrum Master are actively working on items in the Sprint Backlog, they participate as Developers."},{"t":"p","x":"The Developers can select whatever structure and techniques they want, as long as their Daily Scrum focuses on progress toward the Sprint Goal and produces an actionable plan for the next day of work. This creates focus and improves self-management."},{"t":"p","x":"Daily Scrums improve communications, identify impediments, promote quick decision-making, and consequently eliminate the need for other meetings."},{"t":"p","x":"The Daily Scrum is not the only time Developers are allowed to adjust their plan. They often meet throughout the day for more detailed discussions about adapting or re-planning the rest of the Sprint’s work."},{"t":"h3","x":"Sprint Review"},{"t":"p","x":"The purpose of the Sprint Review is to inspect the outcome of the Sprint and determine future adaptations. The Scrum Team presents the results of their work to key stakeholders and progress toward the Product Goal is discussed."},{"t":"p","x":"During the event, the Scrum Team and stakeholders review what was accomplished in the Sprint and what has changed in their environment. Based on this information, attendees collaborate on what to do next. The Product Backlog may also be adjusted to meet new opportunities. The Sprint Review is a working session and the Scrum Team should avoid limiting it to a presentation."},{"t":"p","x":"The Sprint Review is the second to last event of the Sprint and is timeboxed to a maximum of four hours for a one-month Sprint. For shorter Sprints, the event is usually shorter."},{"t":"h3","x":"Sprint Retrospective"},{"t":"p","x":"The purpose of the Sprint Retrospective is to plan ways to increase quality and effectiveness."},{"t":"p","x":"The Scrum Team inspects how the last Sprint went with regards to individuals, interactions, processes, tools, and their Definition of Done. Inspected elements often vary with the domain of work. Assumptions that led them astray are identified and their origins explored. The Scrum Team discusses what went well during the Sprint, what problems it encountered, and how those problems were (or were not) solved."},{"t":"p","x":"The Scrum Team identifies the most helpful changes to improve its effectiveness. The most impactful improvements are addressed as soon as possible. They may even be added to the Sprint Backlog for the next Sprint."},{"t":"p","x":"The Sprint Retrospective concludes the Sprint. It is timeboxed to a maximum of three hours for a one- month Sprint. For shorter Sprints, the event is usually shorter."},{"t":"h2","x":"Scrum Artifacts"},{"t":"p","x":"Scrum’s artifacts represent work or value. They are designed to maximize transparency of key information. Thus, everyone inspecting them has the same basis for adaptation."},{"t":"p","x":"Each artifact contains a commitment to ensure it provides information that enhances transparency and focus against which progress can be measured:"},{"t":"li","x":"For the Product Backlog it is the Product Goal."},{"t":"li","x":"For the Sprint Backlog it is the Sprint Goal."},{"t":"li","x":"For the Increment it is the Definition of Done."},{"t":"p","x":"These commitments exist to reinforce empiricism and the Scrum values for the Scrum Team and their stakeholders."},{"t":"h3","x":"Product Backlog"},{"t":"p","x":"The Product Backlog is an emergent, ordered list of what is needed to improve the product. It is the single source of work undertaken by the Scrum Team."},{"t":"p","x":"Product Backlog items that can be Done by the Scrum Team within one Sprint are deemed ready for selection in a Sprint Planning event. They usually acquire this degree of transparency after refining activities. Product Backlog refinement is the act of breaking down and further defining Product Backlog items into smaller more precise items. This is an ongoing activity to add details, such as a description, order, and size. Attributes often vary with the domain of work."},{"t":"p","x":"The Developers who will be doing the work are responsible for the sizing. The Product Owner may influence the Developers by helping them understand and select trade-offs."},{"t":"h4","x":"Commitment: Product Goal"},{"t":"p","x":"The Product Goal describes a future state of the product which can serve as a target for the Scrum Team to plan against. The Product Goal is in the Product Backlog. The rest of the Product Backlog emerges to define “what” will fulfill the Product Goal."},{"t":"p","x":"A product is a vehicle to deliver value. It has a clear boundary, known stakeholders, well-defined users or customers. A product could be a service, a physical product, or something more abstract."},{"t":"p","x":"The Product Goal is the long-term objective for the Scrum Team. They must fulfill (or abandon) one objective before taking on the next."},{"t":"h3","x":"Sprint Backlog"},{"t":"p","x":"The Sprint Backlog is composed of the Sprint Goal (why), the set of Product Backlog items selected for the Sprint (what), as well as an actionable plan for delivering the Increment (how)."},{"t":"p","x":"The Sprint Backlog is a plan by and for the Developers. It is a highly visible, real-time picture of the work that the Developers plan to accomplish during the Sprint in order to achieve the Sprint Goal. Consequently, the Sprint Backlog is updated throughout the Sprint as more is learned. It should have enough detail that they can inspect their progress in the Daily Scrum."},{"t":"h4","x":"Commitment: Sprint Goal"},{"t":"p","x":"The Sprint Goal is the single objective for the Sprint. Although the Sprint Goal is a commitment by the Developers, it provides flexibility in terms of the exact work needed to achieve it. The Sprint Goal also creates coherence and focus, encouraging the Scrum Team to work together rather than on separate initiatives."},{"t":"p","x":"The Sprint Goal is created during the Sprint Planning event and then added to the Sprint Backlog. As the Developers work during the Sprint, they keep the Sprint Goal in mind. If the work turns out to be different than they expected, they collaborate with the Product Owner to negotiate the scope of the Sprint Backlog within the Sprint without affecting the Sprint Goal."},{"t":"h3","x":"Increment"},{"t":"p","x":"An Increment is a concrete stepping stone toward the Product Goal. Each Increment is additive to all prior Increments and thoroughly verified, ensuring that all Increments work together. In order to provide value, the Increment must be usable."},{"t":"p","x":"Multiple Increments may be created within a Sprint. The sum of the Increments is presented at the Sprint Review thus supporting empiricism. However, an Increment may be delivered to stakeholders prior to the end of the Sprint. The Sprint Review should never be considered a gate to releasing value."},{"t":"p","x":"Work cannot be considered part of an Increment unless it meets the Definition of Done."},{"t":"h4","x":"Commitment: Definition of Done"},{"t":"p","x":"The Definition of Done is a formal description of the state of the Increment when it meets the quality measures required for the product."},{"t":"p","x":"The moment a Product Backlog item meets the Definition of Done, an Increment is born."},{"t":"p","x":"The Definition of Done creates transparency by providing everyone a shared understanding of what work was completed as part of the Increment. If a Product Backlog item does not meet the Definition of Done, it cannot be released or even presented at the Sprint Review. Instead, it returns to the Product Backlog for future consideration."},{"t":"p","x":"If the Definition of Done for an increment is part of the standards of the organization, all Scrum Teams must follow it as a minimum. If it is not an organizational standard, the Scrum Team must create a Definition of Done appropriate for the product."},{"t":"p","x":"The Developers are required to conform to the Definition of Done. If there are multiple Scrum Teams working together on a product, they must mutually define and comply with the same Definition of Done."},{"t":"h2","x":"End Note"},{"t":"p","x":"Scrum is free and offered in this Guide. The Scrum framework, as outlined herein, is immutable. While implementing only parts of Scrum is possible, the result is not Scrum. Scrum exists only in its entirety and functions well as a container for other techniques, methodologies, and practices."},{"t":"h3","x":"Acknowledgements"},{"t":"h4","x":"People"},{"t":"p","x":"Of the thousands of people who have contributed to Scrum, we should single out those who were instrumental at the start: Jeff Sutherland worked with Jeff McKenna and John Scumniotales, and Ken Schwaber worked with Mike Smith and Chris Martin, and all of them worked together. Many others contributed in the ensuing years and without their help Scrum would not be refined as it is today."},{"t":"h4","x":"Scrum Guide History"},{"t":"p","x":"Ken Schwaber and Jeff Sutherland first co-presented Scrum at the OOPSLA Conference in 1995. It essentially documented the learning that Ken and Jeff gained over the previous few years and made public the first formal definition of Scrum."},{"t":"p","x":"The Scrum Guide documents Scrum as developed, evolved, and sustained for 30-plus years by Jeff Sutherland and Ken Schwaber. Other sources provide patterns, processes, and insights that complement the Scrum framework. These may increase productivity, value, creativity, and satisfaction with the results."},{"t":"p","x":"The complete history of Scrum is described elsewhere. To honor the first places where it was tried and proven, we recognize Individual Inc., Newspage, Fidelity Investments, and IDX (now GE Medical)."}]}};

const NOTES=[{"g":"Project management","t":"Course overview, initiation and planning","h":"<p>The aplication of knowledge, skills, tools and techniques to meet the project requirements and achieve the desired outcome<\/p>\n<p><b>Summary of the Course:<\/b><\/p>\n<p>1- <b><u>Project Management Fundamentals<\/u><\/b> - Learn the fundamentals of project management and how this program will prepare you for project management positions in numerous indistries. Explore the differente types of carres you could pursue, the essentials responsibilities and skills of a project manager, the importance of the project lifecycle, common project management methodologies, and how organizational structure and culture impact project management<\/p>\n<p>2- <b><u>Project initiation: Starting a Project Succesfully<\/u><\/b> - Learn how to lay the ground for a succesful project. Unferstand the stakeholders, their level of influence, and how to mobilize and mange them. Also address tasks to identify project scope, objectives, deliverables and success criteria<\/p>\n<p>3- <b><u>Project Planning<\/u><\/b> - Explore how to map out a project in the second phase of the project lifecycle: the project planning phase. Examine the key components of a project plan, how to make accurate time estimates, and how to set milestones<\/p>\n<p>4- <b><u>Project Execution: Project Execution<\/u><\/b> - Delve into the execution and closure phases of the project lifecycle. Learn which aspects of a project to track and how to track them, as well as how to affectively manage and communicate changes, dependencies, and risks.<\/p>\n<p>5- <b><u>Agile Project Management<\/u><\/b> - Explore the history, approach, and philosophy of Agile project management incluiding the Scrum Framework. Learn how to differentiate and combinme Aginle and other project management approaches. Learn more about Scrum, exploring its pilars and values, and comparing essentials Scrum team roles.<\/p>\n<p>6- <b><u>Capstone: Applying Project Management in the real world <\/u><\/b> - Develop a portfolio of project management artifacts that will demostrate the skills you have learned throughout the program, sucha as your ability to manage stakeholders and teams, organize plans, and communicate project details.<\/p>\n<p>7- <b><u>Accelerate Your Job Search with AI<\/u><\/b> - Gain practical job search strategies and learn how to leverage AI tools (Gemini, NotebookLM) to uncover your most valuable skills, create a job search plan, manage your applications, and practive interviews as you navigate your path to your next role<\/p>\n<p><u>Project:<\/u><\/p>\n<ul>\n<li>A unique endeavor and usually includes a set of unique deliverables<\/li>\n<li>A temporary pursuit, it has a defined beginning and end<\/li>\n<li>A series of task that need it to be completed to reach a desire outcome<\/li>\n<\/ul>\n<p>Project Management<\/p>\n<ul>\n<li>The application of knowledge, skills, tools and techniques to meet the project requirementes and achieve the desired outcome<\/li>\n<\/ul>\n<h3 id=\"n0_1\">\nWhat is and why is important to business? \n<\/h3>\n\n<p>Project management is valuable to businesses because it helps ensure that a project delivers the expected outcomes (on time and in budget)<\/p>\n<h3 id=\"n0_2\">What a project manage do on daily basis?<\/h3>\n<ul>\n<li>Planning and organizing<\/li>\n<li>Managing tasks<\/li>\n<li>Budgeting<\/li>\n<li>Controlling cost and other factors<\/li>\n<\/ul>\n<h3 id=\"n0_3\">Types of Job<\/h3>\n<p>The skills you learn in one industry can be apply in others industries<\/p>\n<p>\n\\*\\* <br />• <b>Operations Analyst:<\/b> Manages and coordinates research, investigates workflows, creates business procedures, and recommends changes to improve the project and company. \n<\/p>\n\n<p>En modulo<\/p>\n<p>**<\/p>\n<p>Networking is when yoou meet other people in a professional setting with the coal of learning, sharing knowledge, adn creating new business connections<\/p>\n<div class=\"tw\"><table>\n<colgroup>\n<col width=\"690\" />\n<\/colgroup>\n<tr>\n<td>\nOperations Associate\n<\/td>\n<\/tr>\n<tr>\n<td>\nPlan and organize team objectives and priorities\n<\/td>\n<\/tr>\n<tr>\n<td>\nDevelop and execute reporting and process design\n<\/td>\n<\/tr>\n<tr>\n<td>\nMonitor daily operations and enhance processes to maximize efficiency\n<\/td>\n<\/tr>\n<tr>\n<td>\nCoordinate training plans\n<\/td>\n<\/tr>\n<\/table><\/div>\n\n<p>Common project management buzzwords:<\/p>\n<ul>\n<li>\nAnalytical\n<\/li>\n<li>\nAssertive\n<\/li>\n<li>\nAssessing outcomes\n<\/li>\n<li>\nAssessing progress\n<\/li>\n<li>\nAttention to detail\n<\/li>\n<li>\nConflict resolution\n<\/li>\n<li>\nCollaborative\n<\/li>\n<li>\nCordination\n<\/li>\n<li>\nCommunication\n<\/li>\n<li>\nDevelopment\n<\/li>\n<li>\nEvaluation\n<\/li>\n<li>\nExecuting plans\n<\/li>\n<li>\nFinancial analysis\n<\/li>\n<li>\nImpact assessment\n<\/li>\n<li>\nLeadership engagement\n<\/li>\n<li>\nManaging meetings\n<\/li>\n<li>\nManaging client expectations\n<\/li>\n<li>\nManaging conflicts\n<\/li>\n<li>\nManaging relationships with stakeholders\n<\/li>\n<li>\nManaging vendors\n<\/li>\n<li>\nMeeting deadlines\n<\/li>\n<li>\nMonitoring\n<\/li>\n<li>\nMultitasking\n<\/li>\n<li>\nPlanning\n<\/li>\n<li>\nPrioritizing\n<\/li>\n<li>\nProblem-solving\n<\/li>\n<li>\nProcess development\n<\/li>\n<li>\nProcess improvement\n<\/li>\n<li>\nProject coordination\n<\/li>\n<li>\nProject implementation\n<\/li>\n<li>\nProject initialization\n<\/li>\n<li>\nProject planning\n<\/li>\n<li>\nProject reporting \n<\/li>\n<li>\nQuality control\n<\/li>\n<li>\nRisk assessment\n<\/li>\n<li>\nRisk management\n<\/li>\n<li>\nSolution development\n<\/li>\n<li>\nStrategic planning\n<\/li>\n<li>\nStrong interpersonal skills\n<\/li>\n<li>\nStrong verbal communication\n<\/li>\n<li>\nStrong weitten communication\n<\/li>\n<\/ul>\n\n<p>Buzzwords: Words or phrases that are popular for a period of time or in a particular industry<\/p>\n<p>many job descriptions list the specific skills they require candidates to have, eg<\/p>\n<p>\n<br />• <b>Coordination<\/b>, or getting people and teams to work together. You may see responsibilities in job descriptions such as “coordination of efforts to achieve project deliverable” or “coordinate internal resources to ensure successful project completion.” Being a project manager is essentially managing the coordination of resources to achieve your end goal. Coordination is one of the top skills a project manager should have, so searching for this term can lead you to appropriate positions. \n<\/p>\n\n<p><br />• <b>Organization<\/b>, or the ability to stay focused on different tasks. You may come across phrases like “solid organizational skills, including attention to detail and multitasking skills” or something as simple as “highly organized.” Organization is key to being a great project manager. We will discuss many ways to sharpen this skill in the upcoming lessons.<\/p>\n<p><br />• <b>Leadership<\/b>, or being able to lead a group of people. You may see phrases like “strong leadership qualities” or “ability to lead” in job descriptions. A project manager needs to display leadership in a number of ways, including effective planning, efficient task coordination, inspiring team members, and key decision-making. You are working on many of the skills needed to become a great leader in this program!<\/p>\n<p>Project Managers<\/p>\n<p>Sheperd projects from start to ginish and seve as guides for their team, using their impeccable organizational and interpersonal skills every step of the way<\/p>\n<p>They add value to their teams and organization by:<\/p>\n<ul>\n<li>Prioritization<\/li>\n<li>Delegation<\/li>\n<li>Effective communication<\/li>\n<\/ul>\n<h3 id=\"n0_4\">Prioritization:<\/h3>\n<p>Project managers add value to their teams and organizations through effective prioritization of tasks required to complete a project<\/p>\n<p>Stakeholders: People who are interested in and affected by the project´s completion and success<\/p>\n<h3 id=\"n0_5\">Delegation:<\/h3>\n<p>Project managers use delegation to add value to their teams and organizations by matching tasks to individuals who can best complete the work<\/p>\n<h3 id=\"n0_6\">Effective communication:<\/h3>\n<p>Project managers deliver value through effective communication, both with their team and with key stakeholders<\/p>\n<details>\n<summary>Focusing on the customer<\/summary>\n<p>Customers are always a key element to success in any business. In Project Management, the word  “customer” refers to a person or an organization that defines the requirements of the project and sets important guidelines, such as budget and deadlines<\/p>\n<p>Can be Internal or External. Internal customers are stakeholders within your organization (management), project team members, resources managers and other organizational departments.<\/p>\n<p>External customers are customers outside of your organization, sucha as clients, contractors, suppliers and customers.<\/p>\n<p>Su successfully deliver a project, it has to meet the customer´s standars.<\/p>\n<p>The PM should ask questions like:<\/p>\n<ul>\n<li>What is the problem you would like us to help solve?<\/li>\n<li>How is the problem impacting your organization?<\/li>\n<li>What prompted you to ask for help now?<\/li>\n<li>What is your hope for the outcome of this project?<\/li>\n<\/ul>\n<\/details>\n<details>\n<summary>Building a great team<\/summary>\n<p>The team is a project´s biggest asset. PM add value to the project by identifying the right team for the project and enabling the team to be successful and make decisions<\/p>\n<\/details>\n<details>\n<summary>Fostering relationships and communication<\/summary>\n<p>The PM can add value to the project by maintaining customer satisfaction and building a great team. Taking the time to check in daily with your team, see how they are doing, and ask if there is anything they need help with can go a long way towards making them feel valued and heard<\/p>\n<\/details>\n<details>\n<summary>Managing the project<\/summary>\n<p>Usually each person is assigned a specific project taks, once each task is done, the persone responsible for that task hands that part of the project over to the next person. Your team members don´t always see the whole picture and how they impact others in the project<\/p>\n<\/details>\n<details>\n<summary>Breaking down barriers<\/summary>\n<p>A PR adds value to a project when they break down barriers, allow their team to innovate new ways to do things, and empower them to share ideas.<\/p>\n<\/details>\n<p><b>Entry-level project management roles<\/b><\/p>\n<ul>\n<li><b>Junior Project Manager:<\/b> Performs all aspects of being a project manager alongside a more experienced professional.<\/li>\n<li><b>Project Administrator:<\/b> Assists the rest of the project team with administrative tasks.<\/li>\n<li><b>Project/Program Assistant<\/b>: Supports team members working on a project and offers administrative support. May perform research or create training documents along with other jobs as assigned by program leaders.<\/li>\n<li><b>Project/Program Coordinator:<\/b> Participates in hands-on project work and administrative tasks. Works under a project manager to make sure projects are completed on time and within budget.<\/li>\n<li><b>Project Support Specialist: <\/b>Works alongside a project manager and team members to oversee assigned projects. May also be responsible for training and developing employees to perform designated tasks.<\/li>\n<\/ul>\n<p><b>Traditional project management roles<\/b><\/p>\n<ul>\n<li><b>Project Manager:<\/b> Responsible for the initiating, planning, executing, monitoring, and closing of a project. Includes industry-specific titles like IT project manager, construction project manager, or engineering project manager, which utilize skills that are transferable among industries.<\/li>\n<li><b>Project Analyst:<\/b> Moves a project along by sharing information, providing support through data analysis, and contributing to strategy and performance.<\/li>\n<li><b>Project Leader/Director:<\/b> Drives core decision-making and sets the direction for the project. Usually knowledgeable about the product or deliverable.<\/li>\n<li><b>Project Controller:<\/b> Primarily responsible for project planning. You are likely to see this job title in industries like engineering and construction.<\/li>\n<li><b>Technical Project Manager:<\/b> Conducts project planning and management for identified goals within a company. Ensures that projects are completed to the requirements within a defined timeframe and budget.<\/li>\n<li><b>Project Management Office (PMO) Analyst: <\/b>Manages the progress of complex projects to ensure timely execution and completion.<\/li>\n<\/ul>\n<p><b>Program and portfolio management roles<\/b><\/p>\n<ul>\n<li><b>Program managers:<\/b> Manage a group of projects that are related or similar to one another and handle the coordination of these projects. They facilitate effective communication between individual project managers and provide support where necessary. They also help create and manage long-term goals for their organization.<\/li>\n<li><b>Portfolio managers<\/b>: Responsible for managing a group of related programs within the same organization. They coordinate various programs in order to ensure they are on track and that the organization is meeting its strategic initiatives. Portfolio managers look at all projects and programs within the organization and prioritize work as necessary.<\/li>\n<\/ul>\n<p>You may also come across positions in your search that do not include the title “Project Manager” or any of the job titles we previously discussed, but you shouldn’t rule these positions out<\/p>\n<p>“Operations Associate.” This position is a type of project manager. You will find that most project management-related job descriptions call for the <b>ability to plan<\/b>, <b>organize<\/b>,<b> monitor<\/b>, and<b> execute tasks<\/b>—all skills you will be able to do once you complete this certification.<\/p>\n<p>Buzzwords:<\/p>\n<details>\n<summary>Words<\/summary>\n<ul>\n<li>Analytical<\/li>\n<li>Assertive<\/li>\n<li>Assessing outcomes<\/li>\n<li>Assessing progress<\/li>\n<li>Attention to detail<\/li>\n<li>Conflict resolution<\/li>\n<li>Collaborative<\/li>\n<li>Coordination<\/li>\n<li>Communication<\/li>\n<li>Development<\/li>\n<li>Evaluation<\/li>\n<li>Executing plans<\/li>\n<li>Financial analysis<\/li>\n<li>Impact assessment<\/li>\n<li>Leadership engagement<\/li>\n<li>Managing meetings<\/li>\n<li>Managing client expectations<\/li>\n<li>Managing conflicts<\/li>\n<li>Managing relationships with stakeholders<\/li>\n<li>Managing vendors<\/li>\n<li>Meeting deadlines<\/li>\n<li>Monitoring<\/li>\n<li>Multitasking<\/li>\n<li>Planning<\/li>\n<li>Prioritizing<\/li>\n<li>Problem-solving<\/li>\n<li>Process development<\/li>\n<li>Process improvement<\/li>\n<li>Project coordination<\/li>\n<li>Project implementation<\/li>\n<li>Project initialization<\/li>\n<li>Project planning<\/li>\n<li>Project reporting<\/li>\n<li>Quality control<\/li>\n<li>Risk assessment<\/li>\n<li>Risk management<\/li>\n<li>Solution development<\/li>\n<li>Strategic planning<\/li>\n<li>Strong interpersonal skills<\/li>\n<li>Strong verbal communication<\/li>\n<li>Strong written communication<\/li>\n<\/ul>\n<\/details>\n<p>\nThe project manager is responsible for planning, organizing, managing tasks, budgeting, controlling costs, and other factors to help keep the project within budget and on time. \n<\/p>\n\n<p><b>Interpersonal skills<\/b> are the behaviors you use to interact with others, such as communication, active listening, and leadership.<\/p>\n<p class=\"imgph\">Screenshot in Notion: Screenshot 2025-09-07 at 12.29.38 PM.png<\/p>\n\n<p>Managing cross-functional teams effectively requires the project manager to:<\/p>\n<ul>\n<li>Clarify goals:\n<br />\n<p>\n  It is important to ensure that each member of the team undertands their role, how they support each other, and the common goals of the project. Its vital to set clear goals for the team and make sure that the team undestands those goals\n  <\/p>\n<\/li>\n<\/ul>\n<p>\n  Make sure to define key items such as budget, deadlines, quality requirementes or important resources\n  <\/p>\n\n<p>\n  Cross-functional teams may work in different departments, be in different physical locations, and have different leadership, but all team members work together with the project manager to support the current project\n  <\/p>\n\n<ul>\n<li>\n<p>Get team memebers with the right skills\n<br />\n<p>\n  You must help ensure that your team has the right people with the right skill sets needed for the project to succeed\n  <\/p>\n<\/p>\n<\/li>\n<li>\n<p>Measure progress\n<br />\n<p>\n  Showing your team how much they have accomplished helps keep them motivated. This helps everyone see the full picture and recognize their impact on the project.\n  <\/p>\n<\/p>\n<\/li>\n<\/ul>\n<p>\n  Make sure you communicate successes, delays or issues to the team so they know how the project is progressing. Its essential everyone is informed\n  <\/p>\n\n<ul>\n<li>Recognize efforts\n<br />\n<p>\n  As a project manager, it is your job to make sure that each member of your cross—functional team recognizes the value of their efforts each step of the way. Learning what makes your team members feel supported, giving and taking feedback, and being mindful of each individual´s background, personal identifiers, and work style can help mediate some of the differences among team members.\n  <\/p>\n<\/li>\n<\/ul>\n<h3 id=\"n0_7\">Core skills of a project manager<\/h3>\n<ul>\n<li>Enabling decision making<\/li>\n<li>Communicating and escalating<\/li>\n<li>Flexibility<\/li>\n<li>Strong organizational skills<\/li>\n<\/ul>\n<p><b>Enabling decision-making<\/b><\/p>\n<p>You can help team members feel empowered from the start of your project by making the decision-making process collaborative.<\/p>\n<p>State the goals of specific deliverables and elicit input from your team on how to achieve those goals.<\/p>\n<p>Empowering your team to express their opinions and make their own decisions allows you to focus on the overwatching management tasks and prioritize them in order of importance.<\/p>\n<p><b>Communicating and escalating<\/b><\/p>\n<p>PM requires clearly communicating project goals and expectations, team member roles and responsabilities, and constructive feedback.<\/p>\n<p>Knowing how to effectively communicate and when to escalate issues to management is key to keeping you, your team, and your organization on the path to success.<\/p>\n<p>When escalation is required, try to approach management with both the problem and the potential solution or suggestions.<\/p>\n<p><b>Stroing organizational skills<\/b><\/p>\n<p>If you show that it is important to you to stay organized trhough efficient tracking and communications, your team will follow suit.<\/p>\n<p>One way to do it is utilizing the abundance of organizational tools available, such as:<\/p>\n<ul>\n<li>Planning and scheduling softwares (templates, workflows, calendars)<\/li>\n<li>Collaboration tools (ermail, collaboration software, dashboards)<\/li>\n<li>Documentation (files, plans, spreadsheets)<\/li>\n<li>Quality assurance tools (evaluations, productivity trackers, reports)<\/li>\n<\/ul>\n<p><b>Flexibility<\/b><\/p>\n<p>All PM need the ability to adapt and overcome changes and challenges. Change is inevitable, the more flexible the more successful you will be throughout your career.<\/p>\n<p><b>Handling ambiguity<\/b><\/p>\n<p>Different ways to help your team deal with ambiguity:<\/p>\n<ul>\n<li>Keep calm<\/li>\n<li>Express empathy<\/li>\n<li>Communicate what you know clearly<\/li>\n<li>Make decisions and stick to them<\/li>\n<li>Trust the expertise of your team<\/li>\n<\/ul>\n<h3 id=\"n0_8\">Leadership and team dynamics<\/h3>\n<p>key interpersonal skills:<\/p>\n<ul>\n<li>Communication<\/li>\n<li>Negotiation<\/li>\n<li>Conflict Mediation<\/li>\n<li>UInderstanding motivations<\/li>\n<\/ul>\n<p>these are skills for Influencing without authority<\/p>\n<h3 id=\"n0_9\">Project life cycle<\/h3>\n<ul>\n<li>Initiate the project<\/li>\n<li>Make a plan<\/li>\n<li>Execute and complete tasks<\/li>\n<li>Close the project<\/li>\n<\/ul>\n<p>During each phase we need to accomplish different tasks<\/p>\n<ul>\n<li>\n<p>Initiate the project:\n<br />\n<ul>\n  <li>\n  Organize every information \n  <\/li>\n  <li>\n  Define project goals\n  <\/li>\n  <li>\n  Determine resources, people, and other project details\n  <\/li>\n  <li>\n  Get project approval\n  <\/li>\n  <\/ul><\/p>\n<\/li>\n<li>\n<p>Make a plan<\/p>\n<\/li>\n<li>Create a budget<\/li>\n<li>Set the schedule<\/li>\n<li>Establish your team<\/li>\n<li>Determine roles and responsibilities<\/li>\n<li>Plan for risk and change<\/li>\n<li>Establish communications<\/li>\n<li>Execute and complete tasks<\/li>\n<li>Manage the progress<\/li>\n<li>Communicate<\/li>\n<li>Make adjustments<\/li>\n<li>Close the project<\/li>\n<li>Ensure all tasks have been completed<\/li>\n<li>Confirm acceptance of the project outcome<\/li>\n<li>Reflect on lessons learned (a retrospective)<\/li>\n<li>Communicate with the stakeholders<\/li>\n<li>Celebrate the results<\/li>\n<\/ul>\n<p>The project life cycle<\/p>\n<p>Initiate the project:<\/p>\n<p>In this phase, ask questions to help set the fundation for the project such as:<\/p>\n<ul>\n<li>\nWho are the stakeholders?\n<\/li>\n<li>\nWhat are the client´s or customer´s goals?\n<\/li>\n<li>\nWhat is the purpose and mission of the project?\n<\/li>\n<li>\nWhat are the measurable objectives for the team?\n<\/li>\n<li>\nWhat is the project trying to improve?\n<\/li>\n<li>\nWhen does this project need to be completed?\n<\/li>\n<li>\nWhat skills and resources will the project require?\n<\/li>\n<li>\nWhat will the project cost? \n<\/li>\n<li>\nWhat are the benefits?\n<\/li>\n<\/ul>
